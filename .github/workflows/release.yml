# Builds a downloadable Pono for Windows, macOS and Linux and attaches them to a release.
#
# jpackage --type app-image is used rather than a native installer: it needs nothing installed on
# the runner beyond the JDK, produces the same layout on all three platforms, and bundles a Java
# runtime so nobody has to install one. The trade is that there is no installer and, on macOS, no
# signature - see the release notes step.
name: Release

on:
  push:
    tags:
      - 'v*'
  # Also runnable by hand, which is how this is tested without cutting a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            archive: zip
          - os: macos-latest
            platform: macos
            archive: zip
          - os: ubuntu-latest
            platform: linux
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Work out the version
        id: version
        shell: bash
        run: |
          # The tag is the version, so that what the About dialog reports and what the file is
          # called cannot drift apart. A hand-run build is named after the commit instead.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-$(git rev-parse --short=7 HEAD)"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          # jpackage takes a separate version of its own: Windows refuses anything but one to
          # three integers, and macOS additionally refuses a leading zero, which is what a
          # hand-run build's 0.0.0-<sha> reduces to.
          numeric="$(echo "${version}" | grep -oE '^[0-9]+(\.[0-9]+){0,2}' || true)"
          case "${numeric}" in
            ''|0|0.*) numeric=1.0.0 ;;
          esac
          echo "numeric=${numeric}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: mvn -B package -DskipTests

      - name: Stage the application
        shell: bash
        run: |
          mkdir -p stage
          cp target/openpnp-gui-*.jar stage/
          cp -r target/lib stage/lib
          # Read by the About dialog, from beside the jar.
          echo "${{ steps.version.outputs.version }}" > stage/VERSION.txt
          cp LICENSE.txt README.md CHANGES.md stage/

      - name: Package
        shell: bash
        run: |
          jpackage \
            --type app-image \
            --name Pono \
            --app-version "${{ steps.version.outputs.numeric }}" \
            --vendor "Pono contributors" \
            --input stage \
            --main-jar "$(cd stage && ls openpnp-gui-*.jar)" \
            --main-class org.openpnp.Main \
            --dest out \
            --java-options --add-opens=java.base/java.lang=ALL-UNNAMED \
            --java-options --add-opens=java.desktop/java.awt=ALL-UNNAMED \
            --java-options --add-opens=java.desktop/java.awt.color=ALL-UNNAMED \
            --java-options -Xmx4g

      - name: Archive
        id: archive
        shell: bash
        run: |
          name="pono-${{ steps.version.outputs.version }}-${{ matrix.platform }}"
          cd out
          if [ "${{ matrix.archive }}" = "zip" ]; then
            # 7z on Windows, zip elsewhere: the Windows runner has no zip.
            if command -v zip > /dev/null; then
              zip -qry "../${name}.zip" .
            else
              7z a -bso0 "../${name}.zip" . > /dev/null
            fi
          else
            tar -czf "../${name}.tar.gz" .
          fi
          cd ..
          echo "path=${name}.${{ matrix.archive }}" >> "$GITHUB_OUTPUT"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: pono-${{ matrix.platform }}
          path: ${{ steps.archive.outputs.path }}
          if-no-files-found: error

  release:
    needs: package
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            Unpack and run the `Pono` launcher inside. A Java runtime is included; nothing else
            needs installing.

            These builds are not signed. Windows SmartScreen will warn about an unknown publisher,
            and macOS will refuse to open the app until you clear the quarantine flag on it:

            ```
            xattr -dr com.apple.quarantine Pono.app
            ```
