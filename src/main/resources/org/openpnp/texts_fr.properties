Remove\ Gcode\ comments\ for\ superior\ communications\ speed.=Supprimez les commentaires du G-code pour une vitesse de communication supérieure.
Remove\ driver\ Maximum\ Feed\ Rate.=Supprimez la Vitesse d'avance max. du pilote.
Remove\ the\ command.=Supprimez la commande.
Replace\ with\ ContactProbeNozzle.=Remplacer par ContactProbeNozzle.
Replace\ with\ ReferenceNozzle.=Remplacer par ReferenceNozzle.
Retry\ the\ detection\ by\ connecting\ to\ the\ controller\ or\ assume\ a\ generic\ controller.=Réessayez la détection en vous connectant au contrôleur, ou partez du principe qu'il s'agit d'un contrôleur générique.
Rotation\ can\ be\ optimized\ by\ wrapping-around\ the\ shorter\ way.\ Best\ combined\ with\ Limit\ ±180°.=La rotation peut être optimisée par rebouclage, en passant par le chemin le plus court. À combiner de préférence avec Limiter à la plage (±180°).
Rotation\ cannot\ be\ wrapped-around\ on\ a\ limited\ articulation\ axis.=Le rebouclage de la rotation est impossible sur un axe à articulation limitée.
Rotation\ must\ be\ limited\ on\ a\ limited\ articulation\ axis.=La rotation doit être limitée sur un axe à articulation limitée.
Script\ execuction\ performance\ can\ be\ improved\ by\ enabling\ engine\ pooling.=Les performances d'exécution des scripts peuvent être améliorées en activant la mutualisation des moteurs.
Secondary\ calibration\ fiducial\ position.=Position du repère de calibration secondaire.
Select\ the\ feeder\ in\ the\ Feeders\ tab\ and\ make\ sure\ the\ feeder\ has\ an\ offset\ location\ from\ the\ slot=Sélectionnez le distributeur dans l'onglet Distributeurs et assurez-vous qu'il possède une position décalée par rapport à l'emplacement
Select\ the\ feeder\ in\ the\ Feeders\ tab\ and\ make\ sure\ the\ slot\ has\ a\ set\ location=Sélectionnez le distributeur dans l'onglet Distributeurs et assurez-vous que l'emplacement a une position définie
Set\ After\ Actuation\ machine\ coordination\ to\ WaitForUnconditionalCoordination.=Réglez la coordination machine Après actionnement sur WaitForUnconditionalCoordination.
Set\ a\ suitable\ camera\ settling\ method\ automatically.=Définir automatiquement une méthode de stabilisation de caméra adaptée.
Set\ an\ example\ expression=Définir un exemple d'expression
Set\ to\ 5\ FPS.=Régler sur 5 FPS.
Set\ to\ Rendering\ Quality\ to\ High\ (right\ click\ the\ Camera\ View\ to\ see\ other\ options).=Réglez la Qualité de rendu sur Qualité élevée (faites un clic droit sur la vue caméra pour voir les autres options).
The\ nozzle\ can\ be\ replaced\ with\ a\ ContactProbeNozzle\ to\ support\ various\ probing\ features.=La buse peut être remplacée par une ContactProbeNozzle afin de prendre en charge diverses fonctions de palpage.
The\ preview\ rendering\ quality\ can\ be\ improved.=La qualité de rendu de l'aperçu peut être améliorée.
To\ continue,\ the\ machine\ must\ be\ enabled\ and\ homed.=Pour continuer, la machine doit être activée et avoir pris son origine.
Use\ Axis\ Letter\ Variables\ for\ simpler\ use,\ automatic\ G-code\ setup,\ and\ other\ advanced\ features.=Utilisez les Variables par lettre pour un usage plus simple, la configuration automatique du G-code et d'autres fonctions avancées.
Use\ Keep-Alive\ only\ when\ necessary.\ It\ may\ cause\ hard\ to\ diagnose\ problems.=N'utilisez Keep-Alive (maintien de la connexion) qu'en cas de nécessité. Il peut provoquer des problèmes difficiles à diagnostiquer.
Use\ an\ adaptive\ camera\ settling\ method.=Utilisez une méthode de stabilisation de caméra adaptative.
Use\ continuous\ motion.\ OpenPnP\ will\ only\ wait\ for\ the\ machine\ when\ really\ needed.=Utilisez le mouvement continu. OpenPnP n'attendra la machine que lorsque c'est réellement nécessaire.
Use\ the\ GcodeAsyncDriver\ for\ advanced\ features.\ Accept\ or\ Dismiss\ to\ continue.=Utilisez le GcodeAsyncDriver pour les fonctions avancées. Acceptez ou ignorez pour continuer.
Use\ the\ GcodeDriver\ for\ simpler\ setup.\ Accept\ or\ Dismiss\ to\ continue.=Utilisez le GcodeDriver pour une configuration plus simple. Acceptez ou ignorez pour continuer.
Use\ the\ M584\ S0\ option\ in\ your\ config.g\ file.=Utilisez l'option M584 S0 dans votre fichier config.g.
On\ the\ camera's\ Device\ Settings\ tab\ select\ the\ correct\ Device\ and\ Format.\ Then\ click\ on\ the\ Capture\ FPS\ Test\ button.\ An\ image\ from\ the\ camera\ should\ appear\ in\ the\ camera's\ view\ pane.=Dans l'onglet des réglages du périphérique de la caméra, sélectionnez le périphérique et le format corrects. Lancez ensuite le test de cadence de capture (FPS). Une image de la caméra doit apparaître dans le volet de vue de la caméra.
