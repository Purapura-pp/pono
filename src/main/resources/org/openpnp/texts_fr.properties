Depending\ on\ the\ type\ of\ nozzle\ tip\ or\ shade,\ select\ the\ proper\ background\ calibration.=Selon le type d'embout de buse ou sa teinte, choisissez la calibration de l'arrière-plan appropriée.
Determine\ the\ camera\ head\ offsets.=Déterminer les décalages de la caméra sur la tête.
Disable\ Allow\ Letter\ Pre-Move\ Commands.=Désactivez l'option Autoriser les commandes de pré-déplacement par lettre.
Disable\ Compress\ G-code.=Désactivez l'option Compresser le G-code.
Disable\ Confirmation\ Flow\ Control\ for\ full\ asynchronous\ operation.=Désactivez l'option Contrôle de flux par confirmation pour un fonctionnement entièrement asynchrone.
Disable\ Confirmation\ Flow\ Control.=Désactivez l'option Contrôle de flux par confirmation.
Disable\ Connection\ Keep-Alive.=Désactivez Connection Keep-Alive (maintien de la connexion).
Disable\ G-code\ compression\ for\ trouble-free\ operation\ with\ incompatible\ controllers.=Désactivez la compression du G-code pour un fonctionnement sans souci avec les contrôleurs incompatibles.
Disable\ Location\ Confirmation=Désactivez l'option Confirmation de position
Disable\ Remove\ Comments.=Désactivez l'option Supprimer les commentaires.
Disable\ Wrap\ Around.=Désactivez l'option Rebouclage.
Disallow\ Pre-Move\ Commands\ for\ automatic\ G-code\ setup\ and\ other\ advanced\ features.\ Accept\ or\ Dismiss\ to\ continue.=Interdisez les commandes de pré-déplacement pour bénéficier de la configuration automatique du G-code et d'autres fonctions avancées. Acceptez ou ignorez pour continuer.
Enable\ Auto\ Camera\ View.=Activez l'option Vue caméra automatique.
Enable\ Auto\ tool\ select.=Activez l'option Sélection automatique de l'outil.
Enable\ Compress\ Gcode.=Activez l'option Compresser le G-code.
Enable\ Confirmation\ Flow\ Control.=Activez l'option Contrôle de flux par confirmation.
Enable\ Continuous\ Motion.=Activez l'option Autoriser le mouvement continu.
Enable\ Letter\ Variables.=Activez l'option Variables par lettre.
Enable\ Limit\ to\ Range.=Activez l'option Limiter à la plage.
Enable\ Location\ Confirmation=Activez l'option Confirmation de position
Enable\ Location\ Confirmation.=Activez l'option Confirmation de position.
Enable\ Pre-Rotate.=Activez l'option Pré-rotation.
Enable\ Remove\ Comments.=Activez l'option Supprimer les commentaires.
Enable\ Suspend\ during\ tasks.=Activez l'option Suspendre pendant les tâches.
Enable\ Visual\ Homing.=Activez la prise d'origine visuelle.
Enable\ Wrap\ Around.=Activez l'option Rebouclage.
