Pre-rotate\ bottom\ vision\ must\ be\ enabled,\ because\ the\ machine\ has\ a\ limited\ articulation\ nozzle.=La pré-rotation de la Bottom Vision doit être activée, car la machine possède une buse à articulation limitée.
Primary\ calibration\ fiducial\ position\ and\ initial\ camera\ calibration.=Position du repère de calibration principal et calibration initiale de la caméra.
