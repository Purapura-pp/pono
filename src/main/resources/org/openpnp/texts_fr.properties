Feeder\ has\ no\ configured\ offset=Le distributeur n'a pas de décalage configuré
Feeder\ slot\ has\ no\ configured\ location=L'emplacement de distributeur n'a pas de position configurée
For\ best\ results\ with\ color-keyed\ computer\ vision,\ it\ is\ recommended\ to\ use\ static\ white\ balance.=Pour de meilleurs résultats en vision par ordinateur à clé de couleur, il est recommandé d'utiliser une balance des blancs statique.
Get\ the\ new\ version\ through\ the\ linked\ web\ page.=Procurez-vous la nouvelle version via la page web liée.
Go\ to\ the\ nozzle(s)\ and\ enable\ the\ Compatible\ switches\ where\ appropriate.=Allez sur la ou les buses et activez les cases Compatible là où c'est pertinent.
Home\ the\ machine\ now.=Effectuez la prise d'origine de la machine maintenant.
In\ single\ camera\ preview\ OpenPnP\ can\ automatically\ switch\ the\ camera\ for\ you.=En aperçu à caméra unique, OpenPnP peut changer de caméra automatiquement pour vous.
It\ is\ OK\ to\ share\ rotation\ axes.\ If\ intentional,\ just\ dismiss\ this\ issue.\ Otherwise\ assign\ a\ different\ Rotation\ axis.=Partager des axes de rotation est acceptable. Si c'est intentionnel, ignorez simplement ce problème. Sinon, affectez un autre axe de rotation.
Keep\ G-code\ comments\ for\ better\ debugging.=Conservez les commentaires du G-code pour faciliter le débogage.
Link\ the\ Placements/Parts/Packages/Vision\ Settings/Feeders\ tables\ between\ tabs.=Lier entre les onglets les tables Placements, Composants, Boîtiers, Paramètres de vision et Distributeurs.
Location\ Confirmation\ recommended\ for\ extra\ features\ in\ homing,\ contact\ probing,\ etc.=La Confirmation de position est recommandée pour des fonctions supplémentaires lors de la prise d'origine, du palpage par contact, etc.
Location\ Confirmation\ usually\ not\ available\ when\ no\ axes\ present.=La Confirmation de position n'est généralement pas disponible en l'absence d'axes.
Marlin\ sends\ location-like\ responses\ to\ other\ commands\ so\ Location\ Confirmation\ is\ not\ reliable=Marlin renvoie pour d'autres commandes des réponses ressemblant à des positions ; la Confirmation de position n'est donc pas fiable
