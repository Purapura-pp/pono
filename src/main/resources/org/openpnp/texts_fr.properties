Move\ the\ camera\ over\ the\ secondary\ calibration\ fiducial\ and\ capture\ its\ position.=Amenez la caméra au-dessus du repère de calibration secondaire et capturez sa position.
Only\ the\ GcodeAsyncDriver\ currently\ supports\ it.\ Advanced\ milestone\ required.=Seul le GcodeAsyncDriver le prend actuellement en charge. L'étape Advanced est requise.
OpenPnP\ can\ often\ automatically\ select\ the\ right\ tool\ for\ you\ in\ Machine\ Controls.=OpenPnP peut souvent sélectionner automatiquement le bon outil pour vous dans Contrôle de la machine.
Please\ add\ the\ command\ manually.=Veuillez ajouter la commande manuellement.
Please\ assign\ a\ different\ Z\ axis.=Veuillez affecter un autre axe Z.
Please\ assign\ a\ proper\ Rotation\ axis.\ You\ might\ need\ to\ create\ one\ first.=Veuillez affecter un véritable axe de rotation. Vous devrez peut-être en créer un au préalable.
Please\ assign\ a\ proper\ Z\ axis.\ You\ might\ need\ to\ create\ one\ first.=Veuillez affecter un véritable axe Z. Vous devrez peut-être en créer un au préalable.
Please\ upgrade\ the\ firmware\ and/or\ axis\ configuration.\ See\ the\ info\ link.=Veuillez mettre à niveau le micrologiciel et/ou la configuration des axes. Voir le lien d'information.
