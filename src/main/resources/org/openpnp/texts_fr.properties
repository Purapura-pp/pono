A\ HTTPActuator\ with\ Read\ URL\ likely\ needs\ a\ regular\ Expression\ to\ parse\ the\ value.=Un HTTPActuator doté d'une URL de lecture a généralement aussi besoin d'une expression régulière pour analyser la valeur.
A\ high\ Preview\ FPS\ value\ might\ create\ undue\ CPU\ load.=Une valeur FPS de l'aperçu élevée peut créer une charge CPU inutile.
Accept\ to\ replace\ ACTUATOR_READ_COMMAND\ with\ ACTUATOR_READ_WITH_DOUBLE_COMMAND.\ Dismiss\ to\ remove\ read\ with\ double.=Accepter pour remplacer ACTUATOR_READ_COMMAND par ACTUATOR_READ_WITH_DOUBLE_COMMAND. Ignorer pour supprimer la lecture avec double.
Advanced\ Motion\ Planner\ not\ set.\ Accept\ or\ Dismiss\ to\ continue.=Le planificateur de mouvement avancé (ReferenceAdvancedMotionPlanner) n'est pas activé. Acceptez ou ignorez pour continuer.
Advanced\ motion\ planner\ set.\ Revert\ to\ a\ simpler,\ safer\ planner.=Le planificateur de mouvement avancé est activé. Revenez à un planificateur plus simple et plus sûr.
Assign\ a\ driver\ as\ described\ in\ the\ Wiki.=Affectez un pilote comme décrit dans le wiki.
Assign\ a\ driver.=Affectez un pilote.
Assign\ the\ unique\ axis\ letter\ where\ wrong,\ press\ Accept,\ then\ press\ Find\ Issues\ &\ Solutions\ again\ to\ clear\ the\ correct\ one.=Corrigez la lettre d'axe, qui doit être unique, là où elle est erronée, appuyez sur Accepter, puis relancez Rechercher les problèmes et solutions pour effacer celle qui est correcte.
Avoid\ axis\ letter\ E,\ if\ possible.\ Use\ proper\ rotation\ axes\ instead.=Évitez si possible la lettre d'axe E. Utilisez plutôt de véritables axes de rotation.
Axes\ should\ be\ configured\ as\ linear\ in\ feedrate\ calculations\ on\ the\ RepRapFirmware\ controller.\ See\ the\ linked\ web\ page.=Sur le contrôleur RepRapFirmware, les axes doivent être configurés comme linéaires dans les calculs de vitesse d'avance. Voir la page web liée.
Axis\ is\ not\ assigned\ to\ a\ driver.=Cet axe n'est affecté à aucun pilote.
Axis\ letter\ is\ missing.\ Assign\ the\ letter\ to\ continue.=La lettre d'axe est manquante. Affectez la lettre pour continuer.
Axis\ should\ be\ treated\ as\ a\ linear\ for\ detected\ firmware\ (all-primary\ axes\ mode).=Cet axe doit être traité comme linéaire pour le micrologiciel détecté (mode tous axes primaires).
Axis\ velocity\ limited\ by\ driver\ Maximum\ Feed\ Rate.\ =La vitesse de l'axe est limitée par la Vitesse d'avance max. du pilote. 
Change\ of\ serial\ port\ Flow\ Control\ recommended.=Il est recommandé de changer le contrôle de flux du port série.
Change\ to\ NullMotionPlanner=Passer au NullMotionPlanner
Change\ to\ ReferenceAdvancedMotionPlanner=Passer au ReferenceAdvancedMotionPlanner
Check\ axis\ letters\ and\ make\ sure\ the\ controller\ is\ capable\ to\ use\ extra\ axes\ (i.e.\ not\ extruders).=Vérifiez les lettres d'axe et assurez-vous que le contrôleur est capable d'utiliser des axes supplémentaires (c'est-à-dire pas des extrudeurs).
Check\ axis\ letters\ and\ make\ sure\ use\ a\ proper\ 6-axis\ configuration\ without\ extruders.=Vérifiez les lettres d'axe et veillez à utiliser une véritable configuration à 6 axes, sans extrudeurs.
Check\ out\ firmwares\ known\ to\ be\ well\ supported.\ See\ info\ link.=Consultez les micrologiciels réputés bien pris en charge. Voir le lien d'information.
Choose\ an\ advanced\ Motion\ Control\ Type\ for\ your\ controller\ type.=Choisissez un Type de contrôle du mouvement avancé, adapté à votre type de contrôleur.
Choose\ the\ right\ communications\ type\ and\ port/address\ settings.=Choisissez le bon type de communication ainsi que les bons réglages de port ou d'adresse.
Choose\ the\ simplest\ Motion\ Control\ Type\ for\ the\ first\ basic\ setup.=Choisissez le Type de contrôle du mouvement le plus simple pour la première configuration de base.
Compress\ Gcode\ for\ superior\ communications\ speed.=Compressez le G-code pour une vitesse de communication supérieure.
Connect\ the\ driver\ to\ your\ controller.=Connectez le pilote à votre contrôleur.
Contact\ probe\ actuator\ needs\ unconditional\ machine\ coordination\ after\ actuation.=L'actionneur de palpage par contact exige une coordination inconditionnelle de la machine après l'actionnement.
Convert\ to\ GcodeAsyncDriver.=Convertir en GcodeAsyncDriver.
Convert\ to\ GcodeDriver.=Convertir en GcodeDriver.
