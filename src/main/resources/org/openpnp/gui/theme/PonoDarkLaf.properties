Pono.err = #ff5d5d
Pono.errSoft = #ff5d5d29
Pono.info = #38bdf8
Pono.bg = #0d1015
Pono.surface = #141920
Pono.surface2 = #1a2028
Pono.surface3 = #212932
Pono.hover = #ffffff0d
Pono.border = #262e39
Pono.borderStrong = #35404d
Pono.text = #e6ebf2
Pono.text2 = #a9b3c2
Pono.muted = #6c7787
Pono.overlay = #0e1218c7
Pono.cameraBg = #06080b
Pono.onAccent = #ffffff
#
# The names the shell used before the stylesheet was the source.
Pono.textSecondary = #a9b3c2
Pono.textMuted = #6c7787
Pono.statusOk = #34c77b
