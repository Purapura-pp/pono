Pono.surface3 = #e9edf2
Pono.hover = #0000000a
Pono.border = #dde2e9
Pono.borderStrong = #c6cfda
Pono.text = #171c26
Pono.text2 = #48546a
Pono.muted = #7f8a9c
Pono.overlay = #ffffffd1
Pono.cameraBg = #0b0e12
Pono.onAccent = #ffffff
#
# The names the shell used before the stylesheet was the source.
