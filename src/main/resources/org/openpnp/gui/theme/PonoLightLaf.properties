#
# Pono light theme.
#
# Only the properties that differ from FlatLightLaf are listed. Everything else is
# inherited, and FlatLightLaf's derived colours (@disabledForeground, ScrollBar.thumb,
# TabbedPane.hoverColor, ...) recompute from the variables set below. Do not paste
# FlatLightLaf.properties in here; that makes FlatLaf upgrades error-prone.
#
# The colours, radii and the body font size come from design/mockups/mock.css and are
# generated into the block at the end of this file; change them there. What follows here is
# what the stylesheet has no variable for.
# Key reference: https://www.formdev.com/flatlaf/properties-files/
#

#---- shape -----------------------------------------------------------------

Component.focusWidth = 1

#---- density ---------------------------------------------------------------

# .tabs: underlined, the 2 pixel accent line 8 pixels in from either end of the tab, the
# selected tab's name in the text colour and the others' in text-2.
TabbedPane.tabType = underlined
TabbedPane.tabHeight = 36
TabbedPane.tabSelectionHeight = 2
TabbedPane.tabSelectionArc = 2
TabbedPane.tabSelectionInsets = 0,8,0,8
TabbedPane.underlineColor = @accentColor
TabbedPane.inactiveUnderlineColor = @accentColor
TabbedPane.foreground = $Pono.text2
TabbedPane.selectedForeground = $Pono.text
TabbedPane.hoverColor = $Pono.hover
TabbedPane.contentSeparatorHeight = 1
TabbedPane.showTabSeparators = false
Table.showHorizontalLines = true
TableHeader.height = 32
SplitPane.dividerSize = 6
SplitPaneDivider.gripDotCount = 0

#---- controls the stylesheet draws its own way -------------------------------

# .check: a strong border, 4 pixel corners, filled with the accent when ticked.
CheckBox.icon.style = filled
CheckBox.arc = 8
CheckBox.icon.borderColor = $Pono.borderStrong
CheckBox.icon[filled].selectedBackground = @accentColor
CheckBox.icon[filled].selectedBorderColor = @accentColor
CheckBox.icon[filled].checkmarkColor = #ffffff
CheckBox.icon[filled].hoverSelectedBackground = darken(@accentColor,5%)
CheckBox.icon[filled].pressedSelectedBackground = darken(@accentColor,10%)

# .slider: a 4 pixel surface-3 track, the accent up to the value, a white 14 pixel thumb in a
# 2 pixel accent ring.
Slider.trackWidth = 4
Slider.thumbSize = 14,14
Slider.thumbBorderWidth = 2
Slider.trackColor = $Pono.surface3
Slider.trackValueColor = @accentColor
Slider.thumbColor = #ffffff
Slider.hoverThumbColor = #ffffff
Slider.pressedThumbColor = #ffffff
Slider.thumbBorderColor = @accentColor
Slider.focusedThumbBorderColor = @accentColor

#---- Pono extensions -------------------------------------------------------
#
# Not FlatLaf keys, read with UIManager.get(...) by org.openpnp.gui.shell. Both Pono themes
# must define every key, otherwise a value leaks across a theme switch.
#

Pono.logoGradientEnd = #7c5cff
# The stylesheet's --shadow is a box-shadow; this is its colour.
Pono.shadow = #141e3224

# The DRO scales its monospaced font off the user's font size rather than pinning a
# point size, so the appearance dialog's font slider still means something. 1.5 gives
# the mockup's 20px readout at the default 13px body text.
# Do not name this key *.fontSize: FlatLaf parses any key ending in "size" as a
# Dimension and silently drops a bare number.
Pono.dro.fontScale = 1.5

#---- generated from design/mockups/mock.css by tools/design-tokens/generate.ps1: do not edit ----
#
# Panels are the surface; the window between the cards is Pono.bg, painted by the shell.
@background = #ffffff
@foreground = #171c26
@buttonBackground = #f5f7fa
@componentBackground = #f5f7fa
@menuBackground = #ffffff
@accentColor = #2f6fe0
Component.borderColor = #c6cfda
Component.disabledBorderColor = #dde2e9
Separator.foreground = #dde2e9
Table.gridColor = #dde2e9
TableHeader.background = #f5f7fa
TableHeader.separatorColor = #dde2e9
TableHeader.bottomSeparatorColor = #dde2e9
TableHeader.foreground = #7f8a9c
#
# FlatLaf's arc is a diameter; the stylesheet's radius is half of it.
Component.arc = 12
Button.arc = 12
TextComponent.arc = 12
defaultFont = 13
Table.rowHeight = 32
#
