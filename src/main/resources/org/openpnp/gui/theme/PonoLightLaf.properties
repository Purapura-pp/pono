#
# Pono light theme.
#
# Only the properties that differ from FlatLightLaf are listed. Everything else is
# inherited, and FlatLightLaf's derived colours (@disabledForeground, ScrollBar.thumb,
# TabbedPane.hoverColor, ...) recompute from the variables set below. Do not paste
# FlatLightLaf.properties in here; that makes FlatLaf upgrades error-prone.
#
# Colours come from the approved mockups: ui-mockups/src/mock.css.
# Key reference: https://www.formdev.com/flatlaf/properties-files/
#

#---- variables -------------------------------------------------------------

# In the light scheme the window sits on --bg and the panels are white, which is
# the reverse of the dark scheme; hence @background here is the greyish --bg.
@background = #eceff3
@foreground = #171c26

@buttonBackground = #ffffff
@componentBackground = #ffffff
@menuBackground = #ffffff

@accentColor = #2f6fe0

#---- borders and separators -----------------------------------------------

# --border-strong reads as a control outline; --border is for hairline dividers.
Component.borderColor = #c6cfda
Separator.foreground = #dde2e9
Table.gridColor = #dde2e9
TableHeader.background = #f5f7fa

#---- shape -----------------------------------------------------------------

Component.arc = 8
Button.arc = 8
TextComponent.arc = 6
Component.focusWidth = 1

#---- density ---------------------------------------------------------------

TabbedPane.tabType = card
TabbedPane.tabHeight = 36
Table.rowHeight = 30
Table.showHorizontalLines = true
TableHeader.height = 32
SplitPane.dividerSize = 6
SplitPaneDivider.gripDotCount = 0

#---- Pono extensions -------------------------------------------------------
#
# Not FlatLaf keys. These carry the parts of the design system that Swing has no
# slot for, and are read with UIManager.get(...) by org.openpnp.gui.shell and
# org.openpnp.gui.support. Both Pono themes must define every key here, otherwise
# a value leaks across a theme switch.
#

Pono.bg = #eceff3
Pono.surface2 = #f5f7fa
Pono.surface3 = #e9edf2
Pono.borderStrong = #c6cfda
Pono.textSecondary = #48546a
Pono.textMuted = #7f8a9c

Pono.statusOk = #34c77b
Pono.statusWarn = #f5b840
Pono.statusErr = #ff5d5d
Pono.statusRun = #38bdf8

# The camera image is dark in both schemes, so its backdrop stays dark.
Pono.cameraBackground = #0b0e12
# Semi-transparent so the camera image shows through the floating overlays.
Pono.overlayBackground = #ffffffd1

Pono.rail.background = #ffffff
Pono.rail.hoverBackground = #f5f7fa
Pono.rail.selectedBackground = #e9edf2
Pono.rail.selectedIndicator = #2f6fe0

# The DRO scales its monospaced font off the user's font size rather than pinning a
# point size, so the appearance dialog's font slider still means something. 1.5 gives
# the mockup's 20px readout at the default 13px body text.
# Do not name this key *.fontSize: FlatLaf parses any key ending in "size" as a
# Dimension and silently drops a bare number.
Pono.dro.fontScale = 1.5
