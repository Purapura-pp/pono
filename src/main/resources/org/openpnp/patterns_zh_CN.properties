# Simplified Chinese for the runtime-assembled Issues and Solutions wording.
#
# Use %1$s style indices whenever a sentence needs the values in a different order than English.
# See patterns.properties for what these templates are and how they are matched.

ActuatorSolutions.Missing=%1$s 缺少「%2$s」执行器。
ActuatorSolutions.Missing.Solution=请按 Wiki 的说明创建并指定一个「%s」执行器。
ActuatorSolutions.NoCommand=「%1$s」执行器 %2$s 尚未指定 %3$s。
ActuatorSolutions.NoDriver=「%1$s」执行器 %2$s 尚未指定驱动。
AxisSolutions.AlignNozzleRotation=让吸嘴 %s 的旋转与元件对齐。
CalibrationSolutions.AdvancedCamera=相机 %s 的高级标定。
CalibrationSolutions.AdvancedCamera.Extended=<html><p>你先前已完成初步的相机标定，现在该做<strong>高级相机标定</strong>了，它还会补偿镜头畸变和相机安装倾斜，并应用更深入、更精确的三维像素尺寸标定。</p><br/><p>更多说明见 Wiki（点击下方的蓝色信息按钮）。</p><br/><p>本次标定必须使用与初步标定相同的吸嘴头。请确认它已装上、其<strong>视觉直径</strong>仍然有效，并且相机 %1$s 的位置（含 Z）也仍然有效。</p><br/><p>若不满足，请先回到<strong>确定上视相机 %2$s 的位置</strong>那一步（勾选上方的<strong>包含已解决</strong>，即可看到可重做的方案）。</p><br/><p><strong color\="red">注意</strong>：吸嘴 %3$s 会在相机 %4$s 的整个视野范围内执行一段较长的标定运动。点击<strong>「接受」</strong>前，请务必确认吸嘴 %5$s 不会与任何东西碰撞！</p><br/></html>
CalibrationSolutions.AdvancedCamera.WithFiducials=用主、次校准基准点自动标定相机 %s。
CalibrationSolutions.AdvancedCamera.WithNozzle=用吸嘴 %2$s 自动标定相机 %1$s。
CalibrationSolutions.Backlash=校准 %s 轴的背隙补偿。
CalibrationSolutions.Backlash.Extended=<html><p>背隙补偿用于消除机器各轴机械连接中的松动或旷量带来的影响。更多说明见 Wiki（点击下方的蓝色信息按钮）。</p><br/><p>可接受的<strong>容差 ±</strong>请尽量设大，以便采用效率更高的背隙补偿方式，减少额外移动和换向。</p><br/><p><strong color\="red">注意 1</strong>：相机 %1$s 会移动到主基准点上方，然后执行一段标定运动，让 %2$s 轴走完整个软限位行程。</p><br/><p><strong color\="red">注意 2</strong>：新的背隙补偿方式确立后，机器还会执行一次视觉归零，用以重新校准可能受该方式影响的坐标系。</p><br/><p>准备好后，点击「接受」。</p></html>
CalibrationSolutions.Backlash.Solution=用主校准基准点自动校准 %s 轴的背隙补偿。
CalibrationSolutions.PreciseCameraToNozzle=精确校准相机 ↔ 吸嘴 %s 的偏移。
CalibrationSolutions.PreciseCameraToNozzle.Extended=<html><p>要标定相机 ↔ 吸嘴的精确偏移，我们让吸嘴取起一个小测试物体、旋转、再放下，然后用相机测量由此产生的偏移。</p><br/><p>合适的测试物体等说明请查阅 OpenPnP Wiki，点击下方的蓝色信息按钮打开。</p><br/><p>把校准测试物体放到校准主基准点上。</p><br/><p>把相机 %1$s 点动到测试物体上方，用十字标线对准。</p><br/><p>上下调节<strong>特征直径</strong>，看相机视图里能否正确识别：应当出现一个绿色圆圈和十字标线，紧贴测试物体轮廓。可用滚轮缩放相机画面。</p><br/><p><strong color\="red">注意</strong>：吸嘴 %2$s 会移动到测试物体处，执行标定用的取放动作。请确认已装上正确的吸嘴头，并让真空系统就绪。</p><br/><p>准备好后，点击「接受」。</p></html>
CalibrationSolutions.PreciseCameraToNozzle.Solution=用一个测试物体完成相机 ↔ 吸嘴 %s 的精确偏移校准。
CameraSolutions.Settling.Extended.CameraMoves=<html><p>机器视觉要精确，很重要的一点是相机移动过相机或被摄物之后，画面要先稳定下来。有些相机存在轻微延迟，画面里可能还残留着运动中的帧；运动也会引起振动，必须充分衰减之后才能做视觉识别。</p><br/><p>最简单的办法是固定等待一段时间，但如果本来就没有运动，这段等待就白费了。改用自适应稳定策略可以在这类情况下缩短等待，也就不必按最坏情况去设一个很长的稳定时间。</p><br/><p><strong color\="red">注意</strong>：相机 %s 会移动到主基准点上方，然后执行一段相机稳定测试。</p><br/><p>准备好后，点击「接受」。</p></html>
CameraSolutions.Settling.Extended.SubjectMoves=<html><p>机器视觉要精确，很重要的一点是相机移动过相机或被摄物之后，画面要先稳定下来。有些相机存在轻微延迟，画面里可能还残留着运动中的帧；运动也会引起振动，必须充分衰减之后才能做视觉识别。</p><br/><p>最简单的办法是固定等待一段时间，但如果本来就没有运动，这段等待就白费了。改用自适应稳定策略可以在这类情况下缩短等待，也就不必按最坏情况去设一个很长的稳定时间。</p><br/><p><strong color\="red">注意</strong>：%1$s 会移动到相机 %2$s 处，然后执行一段相机稳定测试。</p><br/><p>准备好后，点击「接受」。</p></html>
CameraSolutions.WhiteBalance=为相机 %s 校准静态白平衡。
CameraSolutions.WhiteBalance.Extended=<html><p>色键类机器视觉需要稳定而准确的颜色。无论是不稳定的自动白平衡，还是设备自带的手动白平衡（通常只是红蓝偏移），都不适用。为此 OpenPnP 提供了自己的一套精细的静态白平衡，现在可以自动校准它。</p><br/><p>请确认相机视野中有合适的白平衡校准物。推荐使用拉丝金属和纸张。相机应能看到各个亮度层次，也就是说，一堆带孔、倒角、阴影的金属件通常能提供良好的灰阶过渡。反之，请确保视野中没有彩色物体。光照条件要与实际作业时一致。<p><br/><p>此外，你也可以在相机 %s 的<strong>白平衡</strong>选项卡里手动做白平衡。</p><br><p>点击下方的蓝色信息按钮了解更多。</p><br><p>准备好后，点击「接受」。</p></html>
GcodeDriverSolutions.SetMotionControlType=设为 %s。
GcodeDriverSolutions.SetMotionControlType.Extended=<html><span color\="red">注意：</span>这是一个排障选项。只有当前的 %2$s 确实引起问题、你想换一个更简单的设置时，才应该选 %1$s。</html>
MachineDiagnostics.AccelerationCapped.Extended=主控在 %3$s 报告该轴的最大加速度为 %1$s %2$s/s²，而该轴被设定为按 %4$s %5$s/s² 做规划。每一次运动都会被主控限制在它自己的数值上，于是规划出的加减速段比实际的短，机器在规划认为已经到位时还在动。
MachineDiagnostics.AccelerationShortfall.Extended=%1$s 实测的运动时间拟合出的加速度是 %2$s %3$s/s²，而该轴按 %4$s %5$s/s² 做规划。运动规划按配置的数值决定从哪里开始减速，因此在真实机器上，走到那个位置时加速段还没结束。
MachineDiagnostics.BacklashOffset.Extended=%2$s 实测该轴的反向间隙最大到 %1$s mm（测量时补偿是关闭的），而 %3$s 被设定为在接近目标前先越过目标 %4$s mm。这个距离没有越过间隙，于是接近动作是从间隙内部开始的，每一次定位仍然带着反向间隙。这里给出的数值在实测的最大间隙之上留了余量。
MachineDiagnostics.FeedRateCapped.Extended=主控在 %3$s 报告该轴的最大进给速率为 %1$s %2$s/s，而该轴被设定为按 %4$s %5$s/s 做规划。主控会把每一次运动都限制在它自己的数值上，而且不会告知，于是运动规划算出的运动时间、以及据此缩放的速度系数，描述的都是一台并不存在的机器。
MachineDiagnostics.FeedRateShortfall.Extended=%1$s 实测的运动时间拟合出的巡航速度是 %2$s %3$s/s，而该轴按 %4$s %5$s/s 做规划。无论拖后腿的是主控、驱动还是机械结构，运动规划算出的运动时间都比实际更短。
MachineDiagnostics.FieldOfView.Extended=%1$s 把基准点扫过整个视场，它在 %3$s 方向上比像素尺寸(Units Per Pixel)所能解释的多走了 %2$s，扣掉这个比例误差之后还剩 %4$s mm rms 的畸变。像素尺寸会缩放机器做的每一次视觉修正，所以这个误差会带进整块板的贴装。这里不做修正：本列表中该相机的「高级标定」会把比例、相机倾斜和镜头畸变一起测出来，而这个残差说明后两者也存在。
MachineDiagnostics.HomingFiducial.Extended=视觉归位把它在归位基准点处找到的位置当作机器原点，而相机的各项标定是相对主标定基准点测量的。这两处相距 %s mm，因此每一个标定出来的偏移都带着这个差值。这里只报告、不修正，因为哪一处才是对的，机器无从判断。
MachineDiagnostics.HomingScatter.Extended=%2$s 归位 %1$s 次，每次归位后都测量同一个基准点，得到的原点彼此相差在 %3$s mm 之内。视觉归位是关闭的，所以这就是限位开关的重复性；它会让机器保存的每一个坐标——基准点、供料器、吸嘴偏移——在两次开机之间整体偏移这么多。视觉归位改用基准点来确定原点，也就是本列表中提供的那个方案。
MachineDiagnostics.Resolution.Extended=主控在 %2$s 报告该轴每单位 %1$s 步，也就是说它的最小步距是 %3$s %4$s，而该轴的分辨率被设为 %5$s %6$s。分辨率决定了一个坐标算不算一次运动，因此设成小于一个步距的值，就会把机器走不出来的运动发下去，并当作已完成上报。
MachineDiagnostics.RotationBacklash.Extended=%1$s 从两侧分别接近同一个角度，两者相差 %2$s 度，这是通过元件本身在底部相机上测得的，而当前没有设置任何补偿。对一个 5 mm 的元件，这个角度在角点上是 %3$s mm 的贴装误差，所以它总是先在大元件上暴露出来。接受本方案会启用沿运动方向的补偿，这种方法不额外增加运动。
MachineDiagnostics.RunOutFit.Extended=标定在 %1$s 个角度上测量，并允许 %2$s 次漏检，因此最少只用 %3$s 个点就会去拟合跳动模型。三个点无论测到什么都能拟合出一个圆，这样的拟合已经不能说明任何问题。接受本方案会调低容许的漏检次数，使标定必须拿到基本完整的一组角度。
MachineDiagnostics.SettleTooLong.Extended=%3$s 实测一次 %2$s mm 的运动之后，画面在 %1$s ms 时已经稳定，而这台相机在拍摄前要等 %4$s ms。这个差值花在机器的每一次拍摄上，一块有几千个贴装点的板子累计下来，都是在等一件已经发生完的事。
MachineDiagnostics.SettleTooShort.Extended=%3$s 实测一次 %2$s mm 的运动之后，画面在 %1$s ms 时仍在移动，而这台相机在拍摄前只等 %4$s ms。凡是通过这台相机去看的东西——各项标定、基准点定位、元件对中——测的都是一幅还在动的画面，事后再怎么标定也补不回来。
MachineDiagnostics.SuperSampling.Extended=该管线的 DetectCircularSymmetry 阶段把超采样设成了 %s，于是它报出的位置只能精确到整像素，凡是建立在它之上的标定都继承了这个下限。接受本方案会把它设为 %s，也就是视觉方案自身做检测时用的值。
NozzleTipSolutions.BackgroundCalibration=为 %s 设置背景校准方式。
NozzleTipSolutions.BackgroundCalibration.Extended=<html><p>请选择合适的背景校准方式。</p><br/><p><strong color\="red">注意</strong>：吸嘴 %1$s 会移动到相机 %2$s 上方，执行一次新的吸嘴头校准，其中包含已启用的背景校准。出现的问题会用紫色高亮标出。</p><br/><p>准备好后，点击「接受」。</p></html>
NozzleTipSolutions.MinPartDiameter=吸嘴头 %1$s 的【最小】元件直径 %2$s 无效。
NozzleTipSolutions.MinPartDiameter.Solution=请把【最小】元件直径设为至少等于吸嘴头气孔直径加上两倍的【最大】取料偏差（%s）。点击下方的蓝色信息按钮了解更多。
VisionSolutions.NozzleFiducialOffsets=吸嘴 %1$s 相对%2$s基准点的偏移。
VisionSolutions.NozzleFiducialOffsets.Solution=把吸嘴 %1$s 移到%2$s校准基准点上，采集它的偏移量。
VisionSolutions.NozzleHeadOffsets.Clause.CapturesZ=<p>这一步同时会采集校准%s基准点的 Z 坐标。</p><br/>
VisionSolutions.NozzleHeadOffsets.Clause.EqualisesZ=<p>这一步同时会把吸嘴 %1$s 的 Z 对齐到默认吸嘴 %2$s 的 Z。</p><br/>
VisionSolutions.NozzleHeadOffsets.Extended=<html><p>校准%1$s基准点的 X、Y 采集完成后，就可以用它来采集吸嘴的头部偏移（首次近似）。</p><br/>%2$s<p>把吸嘴 %3$s 点动到%4$s基准点上方，把吸嘴头降下来，直到接触基准点。</p><br/><p><strong style\="color\:red;">注意：</strong>这是一个非常重要的 Z 坐标，请仔细采集。</p><br/><p>然后点击「接受」采集吸嘴头部偏移。</p></html>
VisionSolutions.PrimaryFiducial.Extended=<html><p>相机标定可以自动完成：让相机按特定轨迹移动并观察基准点。本方案确定主基准点的 X、Y 位置，并完成初步的相机标定。</p><br/><p>主基准点如何制作和摆放，请查阅 OpenPnP Wiki，<strong>其中有一些非常重要的规则必须遵守！</strong>点击下方的蓝色信息按钮打开 Wiki。</p><br/><p>准备好校准主基准点之后，就可以采集它的 X、Y 位置了。</p><br/><p>把相机 %s 点动到主基准点上方，用十字标线大致对准。</p><br/><p>上下调节<strong>特征直径</strong>，看相机视图里能否正确识别：应当出现一个绿色圆圈和十字标线，紧贴基准点轮廓。可用滚轮缩放相机画面。</p><br/><p>然后点击「接受」采集位置。相机会执行一小段标定运动。</p></html>
VisionSolutions.SecondaryFiducial.Extended=<html><p>相机标定还需要观察位于不同 Z 高度的次基准点，这样标定算法才能获得所需的三维空间信息，从而确定镜头的真实焦距和相机在空间中的光学位置。</p><br/><p>次基准点如何制作和摆放，请查阅 OpenPnP Wiki，其中有一些非常重要的规则必须遵守，别漏看！点击下方的蓝色信息按钮打开 Wiki。</p><br/><p>准备好校准次基准点之后，就可以采集它的 X、Y 位置了。</p><br/><p>把相机 %s 点动到次基准点上方，用十字标线大致对准。</p><br/><p>上下调节<strong>特征直径</strong>，看相机视图里能否正确识别：应当出现一个绿色圆圈和十字标线，紧贴基准点轮廓。可用滚轮缩放相机画面。</p><br/><p>然后点击「接受」采集位置。</p></html>
VisionSolutions.UpLookingCamera.Extended=<html><p>上视相机的标定可以自动完成：让吸嘴按特定轨迹移动，相机观察吸嘴头。本方案确定相机的 X、Y 位置，并完成初步的相机标定。</p><br/><p>给吸嘴 %1$s 装上你能可靠识别的最小吸嘴头（可能需要试几次）。</p><br/><p>把吸嘴 %2$s 点动到相机 %3$s 上方，用十字标线对准。</p><br/><p>在 Z 方向把吸嘴头点动到合焦位置，这个高度大致应与 PCB 表面齐平；如果不是，可以考虑调整相机对焦使其如此。</p><br/><p>若已启用自动对焦，将用它来确定精确的 Z 位置。</p><br/><p>上下调节<strong>特征直径</strong>，看相机视图里能否正确识别：应当出现一个绿色圆圈和十字标线，紧贴目标轮廓。可用滚轮缩放相机画面。</p><br/><p>务必选一个从侧面看也能稳定识别的圆形边缘，也就是棱角比较分明的边。通常取气孔的轮廓。</p><br/><p>然后点击「接受」采集相机位置。</p></html>
VisionSolutions.UpLookingCameraPosition=确定上视相机 %s 的位置并做初始标定。
VisionSolutions.UpLookingCameraPosition.Solution=把吸嘴 %1$s 移到上视相机 %2$s 上方，采集该位置。
VisionSolutions.VisualHoming.Extended=<html><p>在机台上固定一个永久基准点。安装点要与机台上最关键的部分有牢固的机械耦合，并且确保今后几乎不会需要更换这个新的参考基准。基准点必须与 PCB 表面处于同一 Z 高度。更多说明见在线文档，请点击下方的蓝色信息按钮。</p><br/><p>用主控或手动方式让机器归零。此时主控必须工作在你想要的坐标系下。</p><br/><p>把相机 %s 点动到基准点上方，用十字标线大致对准。</p><br/><p>上下调节<strong>特征直径</strong>，看相机视图里能否正确识别：应当出现一个绿色圆圈和十字标线，紧贴基准点轮廓。可用滚轮缩放相机画面。</p><br/><p>然后点击「接受」，系统会精确检测基准点位置并将其设为视觉归零的依据。</p><br/><p>注意：这不会改变你现有的机器坐标系，而是把它锚定到该基准点上。日后机械结构若有轻微变化（例如归零限位开关略有移动），归零基准点仍能精确保持 X、Y 的参考基准。</p></html>
Word.BlowOff=吹气
Word.CameraLight=相机灯光
Word.CameraSwitcher=相机切换器
Word.Primary=主
Word.PumpControl=气泵控制
Word.Secondary=次
Word.VacuumSensing=真空检测
Word.VacuumValve=真空阀
Word.ZProbe=Z 探针
MachineDiagnostics.VisionNoise.Extended=%1$s 机器静止不动，%3$s 的 %2$s 帧把基准点定在彼此相差 %4$s px（%5$s mm，标准差）的位置上，最大 %6$s px。机器的每一个位置都是通过这台相机测的，所以它测到的任何东西——间隙、重复性、归位散布——都不可能比这个值更精确；作业里的每一次视觉修正也把同样的散布带进贴装。照明良好、对焦清楚的基准点，开启亚像素检测后能稳定在十分之一像素以内。
MachineDiagnostics.CameraLatency.Extended=%3$s 实测 %1$s 的帧晚到 %2$s ms（从控制器报告移动完成之后仍显示在动的帧量得），而相机拍照前只等 %4$s ms。因此移动之后拍到的都是移动结束前的画面，机器后来稳定成什么样都无关。提供的等待时间带余量地覆盖了延迟；相机稳定测试在此之上再量机械稳定时间。
MachineDiagnostics.LostSteps.Extended=%3$s 轴 %4$s 以进给速度的 %2$s 倍跑了 %1$s mm 之后，回到起点时偏了 %5$s mm，而控制器的位置计数对此一无所知。以 %6$s 倍跑时它能回到起点。提供的进给速度就是测试时速度的这个比例；如果丢步来自加速度而非速度，改降加速度就能保住进给速度。
