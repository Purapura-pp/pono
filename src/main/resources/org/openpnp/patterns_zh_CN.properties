MachineDiagnostics.VisionNoise.Extended=在 %1$s 的测量中，机器保持静止，相机 %3$s 拍摄的 %2$s 帧中基准点位置的标准差为 %4$s px（%5$s mm），最大相差 %6$s px。机器测量的每个位置都经由该相机读取，因此其测得的任何量（反向间隙、重复性、归位散布）都无法比此值更精确。任务中的每一次视觉修正也会将同样的散布带入贴装。照明良好、对焦准确的基准点在启用亚像素检测后，可稳定在十分之一像素以内。
MachineDiagnostics.CameraLatency.Extended=在 %3$s 的测量中，相机 %1$s 的帧延迟 %2$s ms（依据控制器报告移动完成后仍显示运动的帧测得），而该相机拍摄前仅等待 %4$s ms。因此移动后拍摄的都是移动结束前的画面，与机器此后是否已稳定无关。建议的等待时间覆盖该延迟并留有余量。相机稳定测试会在此之上另行测量机械稳定时间。
MachineDiagnostics.LostSteps.Extended=在 %3$s 的测量中，轴 %4$s 以进给速率的 %2$s 倍运行 %1$s mm 后，返回时距起点 %5$s mm，而控制器的位置计数未反映这一偏差。以进给速率的 %6$s 倍运行时，该轴能回到起点。建议的进给速率即测试所用进给速率按此比例折算的结果。如果丢步由加速度而非速度引起，改为降低加速度即可保持原进给速率。
MachineDiagnostics.ZBacklash.Extended=在 %2$s 的测量中（上、下方向各扫描 %3$s 次），吸嘴头在底部相机中的合焦高度因 Z 轴从上方或下方到达而相差 %1$s mm。轴 %4$s 当前的补偿方式为 %5$s，偏移 %6$s mm。每个贴装高度都会因 Z 轴最后一次运动的方向而向上或向下偏差该距离。接受本方案将按实测间隙设置沿运动方向的补偿。
