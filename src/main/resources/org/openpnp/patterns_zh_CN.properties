# Simplified Chinese for the runtime-assembled Issues and Solutions wording.
#
# Use %1$s style indices whenever a sentence needs the values in a different order than English.
# See patterns.properties for what these templates are and how they are matched.

ActuatorSolutions.Missing=%1$s 缺少“%2$s”执行器。
ActuatorSolutions.Missing.Solution=请按 Wiki 的说明创建并指定一个“%s”执行器。
ActuatorSolutions.NoCommand=“%1$s”执行器 %2$s 尚未指定 %3$s。
ActuatorSolutions.NoDriver=“%1$s”执行器 %2$s 尚未指定驱动。
AxisSolutions.AlignNozzleRotation=使吸嘴 %s 的旋转与元件对齐。
CalibrationSolutions.AdvancedCamera=相机 %s 的高级标定。
CalibrationSolutions.AdvancedCamera.Extended=<html><p>初步相机标定已完成，接下来执行<strong>高级相机标定</strong>。高级相机标定包括镜头畸变和相机安装倾斜的补偿，同时应用更全面、更精确的三维像素尺寸标定。</p><br/><p>更多说明见 Wiki（点击下方的蓝色信息按钮）。</p><br/><p>本次标定必须使用与初步标定相同的吸嘴头。请确认该吸嘴头已安装，且其<strong>特征直径</strong>仍然有效。此外，相机 %1$s 的位置（含 Z）也必须仍然有效。</p><br/><p>如不满足上述条件，请先重新执行<strong>确定上视相机 %2$s 的位置</strong>步骤（在校准页选择<strong>“全部”</strong>视图，可查看可重新执行的方案）。</p><br/><p><strong color\="red">注意</strong>：吸嘴 %3$s 将在相机 %4$s 的整个视野范围内执行较长时间的标定运动。点击<strong>“接受”</strong>前，请务必确认吸嘴 %5$s 不会与任何物体碰撞！</p><br/></html>
CalibrationSolutions.AdvancedCamera.WithFiducials=用主、副标定基准点自动标定相机 %s。
CalibrationSolutions.AdvancedCamera.WithNozzle=用吸嘴 %2$s 自动标定相机 %1$s。
CalibrationSolutions.Backlash=标定 %s 轴的反向间隙补偿。
CalibrationSolutions.Backlash.Extended=<html><p>反向间隙补偿用于消除机器各轴机械连接中的松动或旷量造成的影响。更多说明见 Wiki（点击下方的蓝色信息按钮）。</p><br/><p>应在可接受范围内将<strong>容差(Tolerance ±)</strong>尽量设大，以便采用效率更高的反向间隙补偿方式，减少额外移动和换向。</p><br/><p><strong color\="red">注意 1</strong>：相机 %1$s 将移动到主基准点上方，然后执行标定运动，使 %2$s 轴在整个软限位范围内运动。</p><br/><p><strong color\="red">注意 2</strong>：新的反向间隙补偿方式确定后，机器还将执行一次视觉归位，以重新标定可能受新方式影响的坐标系。</p><br/><p>准备就绪后，点击“接受”。</p></html>
CalibrationSolutions.Backlash.Solution=用主标定基准点自动标定 %s 轴的反向间隙补偿。
CalibrationSolutions.PreciseCameraToNozzle=精确标定相机 ↔ 吸嘴 %s 的偏移。
CalibrationSolutions.PreciseCameraToNozzle.Extended=<html><p>标定相机 ↔ 吸嘴的精确偏移时，吸嘴吸取一个小测试件，旋转后放下，然后由相机测量由此产生的偏移。</p><br/><p>合适的测试件等说明请查阅 OpenPnP Wiki。点击下方的蓝色信息按钮可打开 Wiki。</p><br/><p>将标定测试件放到主标定基准点上。</p><br/><p>将相机 %1$s 点动到测试件上方，用十字线对准。</p><br/><p>上下调节<strong>特征直径(Feature diameter)</strong>，检查相机画面中能否正确识别：应出现绿色圆圈和十字线，并紧贴测试件轮廓。可使用鼠标滚轮缩放相机画面。</p><br/><p><strong color\="red">注意</strong>：吸嘴 %2$s 将移动到测试件处，执行标定用的取放动作。请确认已安装正确的吸嘴头，且真空系统已就绪。</p><br/><p>准备就绪后，点击“接受”。</p></html>
CalibrationSolutions.PreciseCameraToNozzle.Solution=使用测试件完成相机 ↔ 吸嘴 %s 的精确偏移标定。
CameraSolutions.Settling.Extended.CameraMoves=<html><p>要保证机器视觉的精度，机器移动相机或被摄物之后，必须等待相机画面稳定。部分相机存在轻微延迟，获取的帧可能仍显示相机处于运动中。运动还可能引起振动，必须等振动充分衰减后再执行视觉识别。</p><br/><p>最简单的方法是固定等待一段时间。但如果实际并未发生运动，这段等待并无必要。采用自适应稳定策略可在此类情况下缩短等待时间，无需按最坏情况设置较长的稳定等待时间。</p><br/><p><strong color\="red">注意</strong>：相机 %s 将移动到主基准点上方，然后执行相机稳定测试。</p><br/><p>准备就绪后，点击“接受”。</p></html>
CameraSolutions.Settling.Extended.SubjectMoves=<html><p>要保证机器视觉的精度，机器移动相机或被摄物之后，必须等待相机画面稳定。部分相机存在轻微延迟，获取的帧可能仍显示相机处于运动中。运动还可能引起振动，必须等振动充分衰减后再执行视觉识别。</p><br/><p>最简单的方法是固定等待一段时间。但如果实际并未发生运动，这段等待并无必要。采用自适应稳定策略可在此类情况下缩短等待时间，无需按最坏情况设置较长的稳定等待时间。</p><br/><p><strong color\="red">注意</strong>：%1$s 将移动到相机 %2$s 处，然后执行相机稳定测试。</p><br/><p>准备就绪后，点击“接受”。</p></html>
CameraSolutions.WhiteBalance=为相机 %s 校准静态白平衡。
CameraSolutions.WhiteBalance.Extended=<html><p>色键类机器视觉需要稳定、准确的颜色。不稳定的自动白平衡和设备自带的手动白平衡（通常仅为红蓝偏移）均不适用。因此 OpenPnP 提供了一套精细的静态白平衡，现在可以对其自动校准。</p><br/><p>请确认相机视野中有合适的白平衡校准物，推荐使用拉丝金属和纸张。相机画面应包含所有亮度层次，例如一组带孔、倒角和阴影的金属件通常能提供良好的亮度渐变。反之，请确保视野中无彩色物体。光照条件必须与实际作业时一致。<p><br/><p>也可以在相机 %s 的<strong>白平衡</strong>设置中执行白平衡。</p><br><p>点击下方的蓝色信息按钮了解更多。</p><br><p>准备就绪后，点击“接受”。</p></html>
GcodeDriverSolutions.SetMotionControlType=设为 %s。
GcodeDriverSolutions.SetMotionControlType.Extended=<html><span color\="red">注意：</span>此为故障排查选项。仅在当前的 %2$s 确实引起问题、需要尝试更简单的设置时，才应选择 %1$s。</html>
MachineDiagnostics.AccelerationCapped.Extended=控制器在 %3$s 报告该轴的最大加速度为 %1$s %2$s/s²，而该轴的规划加速度设为 %4$s %5$s/s²。每次运动都被限制在控制器上报的数值以内，因此规划的加减速段比实际更短，运动规划判定已到位时，机器仍在运动。
MachineDiagnostics.AccelerationShortfall.Extended=根据 %1$s 实测的运动时间拟合出的加速度为 %2$s %3$s/s²，而该轴的规划加速度为 %4$s %5$s/s²。运动规划按配置值确定减速起点，因此实际机器运动到该点时，加速段尚未结束。
MachineDiagnostics.BacklashOffset.Extended=%2$s 实测该轴的反向间隙最大为 %1$s mm（测量时补偿已关闭），而 %3$s 设定为在接近目标前先越过目标 %4$s mm。该距离不足以消除间隙，因此接近动作从间隙内部开始，每次定位仍包含反向间隙。建议值在实测最大反向间隙的基础上留有余量。
MachineDiagnostics.FeedRateCapped.Extended=控制器在 %3$s 报告该轴的最大进给速率为 %1$s %2$s/s，而该轴的规划进给速率设为 %4$s %5$s/s。控制器会将每次运动限制在其自身的数值以内，且不报告这一限制。因此，运动规划计算的运动时间以及据此缩放的速度系数，均基于与实际不符的机器参数。
MachineDiagnostics.FeedRateShortfall.Extended=根据 %1$s 实测的运动时间拟合出的巡航速度为 %2$s %3$s/s，而该轴的规划进给速率为 %4$s %5$s/s。无论速度受限于控制器、驱动还是机械结构，运动规划计算的运动时间都短于实际运动时间。
MachineDiagnostics.FieldOfView.Extended=在 %1$s 的测量中，基准点扫过整个视场，其在 %3$s 方向上的位移比按像素尺寸(Units Per Pixel)推算的多出 %2$s。扣除该比例误差后，仍有 %4$s mm rms 的畸变。机器的每一次视觉修正都按像素尺寸换算，因此该误差会带入整块单板的贴装。此处不做修正：本列表中该相机的“高级标定”会同时测量比例、相机倾斜和镜头畸变，而残差表明后两者同样存在。
MachineDiagnostics.HomingFiducial.Extended=视觉归位以其在归位基准点处检测到的位置作为机器原点，而相机的各项标定以主标定基准点为参照测量。两处相距 %s mm，因此每个标定得到的偏移都包含这一差值。此处仅报告、不修正，因为机器无法判断两处位置中哪一处正确。
MachineDiagnostics.HomingScatter.Extended=在 %2$s 的测量中，机器归位 %1$s 次，每次归位后测量同一个基准点，所得原点之间相差不超过 %3$s mm。当前未启用视觉归位，因此该值即限位开关的重复性。两次开机之间，机器保存的所有坐标（基准点、飞达、吸嘴偏移）都会整体偏移同样的量。视觉归位改由基准点确定原点，本列表中提供了该方案。
MachineDiagnostics.Resolution.Extended=控制器在 %2$s 报告该轴每单位 %1$s 步，即最小步距为 %3$s %4$s，而该轴的分辨率设为 %5$s %6$s。分辨率决定坐标变化是否被视为一次运动。分辨率小于一个步距时，会向机器发送其无法执行的运动，并将这些运动报告为已完成。
MachineDiagnostics.RotationBacklash.Extended=在 %1$s 的测量中，从两侧分别接近同一角度，两次结果相差 %2$s 度。该值由底部相机通过元件本身测得，且当前未设置补偿。对于 5 mm 的元件，该角度在元件角点处造成 %3$s mm 的贴装误差，因此该误差首先在大元件上显现。接受本方案将设置沿运动方向的补偿，该方法不增加额外运动。
MachineDiagnostics.RunOutFit.Extended=吸嘴头跳动校准在 %1$s 个角度上测量，并容许 %2$s 次漏检，因此最少仅用 %3$s 个点即会拟合跳动模型。无论测量结果如何，三个点总能拟合出一个圆，此时拟合结果不能作为任何依据。接受本方案将重新设置容许的漏检次数，使校准必须获得基本完整的一组角度。
MachineDiagnostics.SettleTooLong.Extended=%3$s 实测 %2$s mm 移动后，画面在 %1$s ms 时已稳定，而该相机每次拍摄前等待 %4$s ms。两者之差计入每一次拍摄；在包含数千个贴片位的任务中，累计的无效等待相当可观。
MachineDiagnostics.SettleTooShort.Extended=%3$s 实测 %2$s mm 移动后，画面在 %1$s ms 时仍在移动，而该相机每次拍摄前仅等待 %4$s ms。因此，所有依赖该相机的测量（各项标定、基准点定位、元件对位）测得的都是运动中的画面，事后的任何标定都无法弥补这一误差。
MachineDiagnostics.SuperSampling.Extended=该管线中 DetectCircularSymmetry 阶段的超采样设为 %s，因此其输出的位置仅精确到整像素，基于该阶段的所有标定均以此为精度下限。接受本方案将其设为 %s，即视觉方案自身检测时使用的值。
NozzleTipSolutions.BackgroundCalibration=为 %s 设置背景校准方式。
NozzleTipSolutions.BackgroundCalibration.Extended=<html><p>请选择合适的背景校准方式。</p><br/><p><strong color\="red">注意</strong>：吸嘴 %1$s 将移动到相机 %2$s 上方，执行新的吸嘴头校准，其中包含已启用的背景校准。发现的问题将以紫色高亮标出。</p><br/><p>准备就绪后，点击“接受”。</p></html>
NozzleTipSolutions.MinPartDiameter=吸嘴头 %1$s 的最小元件直径 %2$s 无效。
NozzleTipSolutions.MinPartDiameter.Solution=请将最小元件直径设为不小于吸嘴头气孔直径与两倍取料容差（%s）之和。点击下方的蓝色信息按钮了解更多。
VisionSolutions.NozzleFiducialOffsets=吸嘴 %1$s 相对%2$s基准点的偏移。
VisionSolutions.NozzleFiducialOffsets.Solution=将吸嘴 %1$s 移到%2$s标定基准点上，并采集其偏移。
VisionSolutions.NozzleHeadOffsets.Clause.CapturesZ=<p>此操作还将采集%s标定基准点的 Z 坐标。</p><br/>
VisionSolutions.NozzleHeadOffsets.Clause.EqualisesZ=<p>此操作还将使吸嘴 %1$s 的 Z 与默认吸嘴 %2$s 的 Z 一致。</p><br/>
VisionSolutions.NozzleHeadOffsets.Extended=<html><p>%1$s标定基准点的 X、Y 坐标采集完成后，即可用其采集吸嘴相对贴装头的偏移（初步近似值）。</p><br/>%2$s<p>将吸嘴 %3$s 点动到%4$s基准点上方，下降吸嘴头，直至接触基准点。</p><br/><p><strong style\="color\:red;">注意：</strong>此 Z 坐标非常重要，请仔细采集。</p><br/><p>然后点击“接受”，采集吸嘴相对贴装头的偏移。</p></html>
VisionSolutions.PrimaryFiducial.Extended=<html><p>相机标定可自动完成：相机按特定轨迹移动，同时观察基准点。本方案确定主基准点的 X、Y 位置，并完成初步相机标定。</p><br/><p>主基准点的制作和摆放方法请查阅 OpenPnP Wiki，<strong>其中有非常重要的规则必须遵守！</strong>点击下方的蓝色信息按钮打开 Wiki。</p><br/><p>主标定基准点准备就绪后，即可采集其 X、Y 位置。</p><br/><p>将相机 %s 点动到主基准点上方，用十字线大致对准。</p><br/><p>上下调节<strong>特征直径(Feature diameter)</strong>，检查相机画面中能否正确识别：应出现绿色圆圈和十字线，并紧贴基准点轮廓。可使用鼠标滚轮缩放相机画面。</p><br/><p>然后点击“接受”采集位置。相机将执行一小段标定运动。</p></html>
VisionSolutions.SecondaryFiducial.Extended=<html><p>相机标定还需要观察位于不同 Z 高度的副基准点。标定算法据此获得所需的三维空间信息，从而确定镜头的真实焦距和相机在空间中的光学位置。</p><br/><p>副基准点的制作和摆放方法请查阅 OpenPnP Wiki。其中有非常重要的规则必须遵守，请勿遗漏。点击下方的蓝色信息按钮打开 Wiki。</p><br/><p>副标定基准点准备就绪后，即可采集其 X、Y 位置。</p><br/><p>将相机 %s 点动到副基准点上方，用十字线大致对准。</p><br/><p>上下调节<strong>特征直径(Feature diameter)</strong>，检查相机画面中能否正确识别：应出现绿色圆圈和十字线，并紧贴基准点轮廓。可使用鼠标滚轮缩放相机画面。</p><br/><p>然后点击“接受”采集位置。</p></html>
VisionSolutions.UpLookingCamera.Extended=<html><p>上视相机标定可自动完成：吸嘴按特定轨迹移动，同时由相机观察吸嘴头。本方案确定相机的 X、Y 位置，并完成初步相机标定。</p><br/><p>为吸嘴 %1$s 安装能够可靠识别的最小吸嘴头（可能需要多次尝试）。</p><br/><p>将吸嘴 %2$s 点动到相机 %3$s 上方，用十字线对准。</p><br/><p>沿 Z 方向向下点动吸嘴头，使其合焦。该高度应大致与 PCB 表面齐平。如不齐平，可考虑调整相机对焦以达到此要求。</p><br/><p>如已启用自动对焦，将使用自动对焦确定精确的 Z 位置。</p><br/><p>上下调节<strong>特征直径(Feature diameter)</strong>，检查相机画面中能否正确识别：应出现绿色圆圈和十字线，并紧贴目标轮廓。可使用鼠标滚轮缩放相机画面。</p><br/><p>务必选择从侧面观察时也能稳定识别的圆形边缘，即棱角较分明的边缘。通常选择气孔轮廓。</p><br/><p>然后点击“接受”采集相机位置。</p></html>
VisionSolutions.UpLookingCameraPosition=确定上视相机 %s 的位置并完成初始标定。
VisionSolutions.UpLookingCameraPosition.Solution=把吸嘴 %1$s 移到上视相机 %2$s 上方，采集该位置。
VisionSolutions.VisualHoming.Extended=<html><p>在机台上安装一个永久基准点。安装位置应与机台最关键的部件有可靠的机械连接，并确保今后几乎无需更改这一新的参考基准。基准点必须与 PCB 表面处于同一 Z 高度。更多说明见在线文档，请点击下方的蓝色信息按钮。</p><br/><p>通过控制器或手动方式使机器归位。此时控制器必须工作在所需的坐标系下。</p><br/><p>将相机 %s 点动到基准点上方，用十字线大致对准。</p><br/><p>上下调节<strong>特征直径(Feature diameter)</strong>，检查相机画面中能否正确识别：应出现绿色圆圈和十字线，并紧贴基准点轮廓。可使用鼠标滚轮缩放相机画面。</p><br/><p>然后点击“接受”，精确检测基准点位置，并将其设为视觉归位的基准。</p><br/><p>注意：此操作不会改变现有的机器坐标系，而是将其固定到该基准点上。日后机械结构如有轻微变化（例如归位限位开关略有移动），归位基准点仍能在 X、Y 方向上精确保持参考基准。</p></html>
Word.BlowOff=吹气
Word.CameraLight=相机灯光
Word.CameraSwitcher=相机切换器
Word.Primary=主
Word.PumpControl=气泵控制
Word.Secondary=次
Word.VacuumSensing=真空检测
