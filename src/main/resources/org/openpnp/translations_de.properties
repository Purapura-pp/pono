HeadSolutions.Issue.CreateNozzles=Saugdüsen für diesen Kopf erstellen.
HeadSolutions.Issue.CreateNozzles.Confirm=<html><p>Das Annehmen dieser Lösung kann Ihre Maschinenkonfiguration grundlegend verändern.<br/>Folgendes wird geschehen\:<p/><ol><li>Die aktuelle Maschinenkonfiguration wird gespeichert (wie Datei/Konfiguration speichern).</li><li>Die neue Lösung überschreibt Ihre bestehende Saugdüsen- und Achskonfiguration.</li><li>Solange Saugdüsen und Achsen in Typ und Anzahl gleich bleiben, wird ihre Detailkonfiguration erhalten.</li><li>Eine Saugdüsen-Lösung kann mehrfach angewendet werden, Sie können sie erneut aufrufen und erweitern.</li><li><span color\="red">Achtung\:</span> Erneutes Öffnen stellt die vorherige Konfiguration nicht wieder her, es ermöglicht nur eine neue Auswahl.<br/>Wenn Sie die vorherige Konfiguration wiederherstellen möchten, müssen Sie die gespeicherte Konfiguration manuell wiederherstellen.</li></ol><br/>Sind Sie sicher?</html>
HeadSolutions.Solution.CreateNozzles=Anzahl und Typ der Saugdüsen auswählen.
HeadSolutions.Solution.CreateNozzles.Choice.0=<html><h3>Einzelne Saugdüse</h3><p>Eine Saugdüse hat ihren eigenen Z-Achsmotor</p></html>
HeadSolutions.Solution.CreateNozzles.Choice.1=<html><h3>Saugdüsenpaar, gemeinsame Z-Achse, gegenläufig</h3><p>Ein Saugdüsenpaar teilt sich einen Z-Achsmotor. Wenn die erste Saugdüse nach oben fährt, fährt die zweite gleich weit nach unten. Die Saugdüsen sind über Zahnstange oder Riemen gegenläufig gekoppelt.</p></html>
HeadSolutions.Solution.CreateNozzles.Choice.2=<html><h3>Saugdüsenpaar, gemeinsame Z-Achse, Nocken</h3><p>Ein Saugdüsenpaar teilt sich einen Z-Achsmotor. Die beiden Saugdüsen werden von einem Drehnocken nach unten gedrückt und von einer Feder nach oben gezogen.</p></html>
