ReferenceCameraPositionConfigurationWizard.LocationPanel.LocationLabel.text=Position
ReferenceCameraPositionConfigurationWizard.LocationPanel.RoamingRadiusLabel.text=Bewegungsradius
ReferenceCameraPositionConfigurationWizard.LocationPanel.RoamingRadiusLabel.toolTipText=<html>\r\n<p>Der maximale <em>nominale</em> Roaming-Radius über der Kamera,<br/>\r\nder auch die größte unterstützte Bauteildiagonale<br/>\r\nangibt.</p>\r\n<br/>\r\n<p>Bei Null wird die Mehrfachaufnahme-Bildverarbeitung abgeschaltet<br/> \r\n(siehe Gehäuse-<strong>Vision Compositing</strong>).</p> \r\n<br/>\r\n<p>Während der Bottom Vision wird die Saugdüsenbewegung <br/>\r\neingeschränkt, wobei Folgendes berücksichtigt wird\:</p>\r\n<ul>\r\n<li>Der Abstand der Saugdüse von der <br/>\r\nKameramitte.</li>\r\n<li>Wie weit der Bauteil-Footprint von dort <br/>\r\nübersteht (angenähert durch eine achteckige Hülle).</li>\r\n</ul>\r\n<p>Innerhalb des Roaming-Radius wird die Saugdüse außerdem <br/>\r\nfrei auf Kamera-Z bewegt, also ohne auf Safe Z zu fahren.</p> \r\n<p>Beachten Sie\: Dies ist der <em>nominale</em> Radius, d. h. es muss<br/>\r\nzusätzlicher Platz für Aufnahmeversätze und andere <br/>\r\nAbweichungen vorhanden sein.</p>\r\n<br/>\r\n<p><strong color\="red">Achtung\:</strong> Der Roaming-Radius wird beim \r\nmanuellen Verfahren nicht erzwungen.</p>\r\n</html>
