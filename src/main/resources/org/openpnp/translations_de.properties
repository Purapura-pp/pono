ReferenceHeadConfigurationWizard.LocationsPanel.WarningChangingLabel.text=<html><p>\n<strong>Wichtiger Hinweis</strong>\: Die Referenz-Passermarke sollte früh im Aufbauprozess montiert \nund konfiguriert werden, bevor Sie beginnen, eine große Anzahl von\nPositionen für die Maschineneinrichtung zu erfassen (Düsenspitzenwechsler, Feeder usw.) \n</p>\n<p style\="color\:red">Jedes Mal, wenn die obigen Einstellungen geändert werden oder die Passermarke physisch verschoben wird, werden alle bereits erfassten Positionen in der Maschineneinrichtung unbrauchbar. </p></html>
ReferenceHeadConfigurationWizard.PumpPanel.Border.title=Pumpe
