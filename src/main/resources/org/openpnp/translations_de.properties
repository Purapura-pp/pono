ReferenceNozzleTipCalibrationWizard.CalibrationPanel.CalibrationZOffsetLabel.toolTipText=<html>\n<p>\nWenn das per Bildverarbeitung erkannte Merkmal einer Saugdüse weiter oben an der Düsenspitze liegt, <br />\nempfiehlt es sich, die Fokusebene mit dem "Z-Versatz" zu verschieben.\n</p>\n<p>Wenn eine Düsenspitze den Namen "unloaded" hat, wird sie als Platzhalter für die Kalibrierung<br />\ndes leeren Düsenspitzenhalters verwendet. Auch hier kann der "Z-Versatz" verwendet werden, um in der <br />\nrichtigen Fokusebene zu kalibrieren. \n</p>\n</html>
