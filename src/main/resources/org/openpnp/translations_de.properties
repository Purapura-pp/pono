ReferenceNozzleTipToolChangerWizard.Action.ReferenceZ=Z aller Berührpositionen auf die Vorlage kalibrieren
ReferenceNozzleTipToolChangerWizard.Action.ReferenceZ.Description=<html>Das Z der Berührposition aller Düsenspitzen auf die <strong>Vorlage</strong>-Referenz kalibrieren.<br/>Dabei wird die Vorlagen-Düsenspitze auf die Standard-Antastdüse geladen, das Z ihrer<br/>Berührposition neu kalibriert und anschließend werden alle anderen darauf angetastet und referenziert.<br/>Beachten Sie\: Anders als beim Klonen sind hier auch als <strong>Gesperrt</strong> markierte Düsenspitzen einbezogen.</html>
