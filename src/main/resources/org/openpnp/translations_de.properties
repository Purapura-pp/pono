ReferencePushPullFeederConfigurationWizard.lblPrecisionWanted.toolTipText=Gewünschte Genauigkeit, d. h. der tolerierbare Versatz der Aufnahmeposition
ReferencePushPullFeederConfigurationWizard.lblRotation.text=Drehung im Gurt
ReferencePushPullFeederConfigurationWizard.lblRotation.toolTipText=<html>Drehung des Bauteils im Gurt, betrachtet mit den Transportlöchern <br/>\r\noben. Ihre E-CAD-Bauteilorientierung ist die Referenz.<br/>\r\nSiehe auch\: \r\n<ul>\r\n<li>EIA-481</li>\r\n<li>Component Zero Orientations for CAD Libraries</li>\r\n</ul>\r\n</html>
