ReferenceNozzleTipConfigurationWizard.PushAndDragPanel.PushAndDragAllowedLabel.toolTipText=<html>\n<p>\nLegt fest, ob die Düsenspitze zum Schieben und Ziehen <br/>\nverwendet werden darf. \n</p><p>\nSollte nur für Düsenspitzen aktiviert werden, die <br/>\nrobust genug sind, um die Seitenkräfte einschließlich <br/>\ngelegentlichen Hängenbleibens aufzunehmen. </p>\n</html>
