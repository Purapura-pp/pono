ReferenceCameraCalibrationWizard.CameraCalibrationPanel.CautionLabel.text=<html><p width\="500" style\="color\:Black;background-color\:Yellow;">Achtung - Die Düsenspitze wird während der Kalibriersequenz auf diese Z-Koordinaten abgesenkt und über das <b>gesamte Sichtfeld</b> der Kamera bewegt. Stellen Sie vor dem Start der Kalibrierung sicher, dass ausreichend Freiraum zu Hindernissen in der Nähe der Kamera besteht, sonst kann die Maschine beschädigt werden.</p></html>
