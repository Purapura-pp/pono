ReferenceHeadConfigurationWizard.PumpPanel.VacuumPumpControlLabel.toolTipText=<html>\r\n<p>Legt fest, wie der Ein/Aus-Zustand der Pumpe gesteuert wird\:</p>\r\n<ul>\r\n<li><strong>None</strong>\: Die Pumpe wird manuell oder außerhalb von Pono gesteuert.<br/>\r\nVerwenden Sie dies zum Beispiel für eine controllerseitige Hysterese-Regelung.</li>\r\n<li><strong>PartOn</strong>\: Die Pumpe wird eingeschaltet, wenn ein Bauteil aufgenommen <br/>\r\nwerden soll, und ausgeschaltet, wenn sich kein Bauteil mehr an einer Saugdüse befindet.</li>\r\n<li><strong>TaskDuration</strong>\: Die Pumpe wird eingeschaltet, wenn ein Bauteil<br/>\r\naufgenommen werden soll, und erst ausgeschaltet, wenn die eingereihten Aufgaben (z. B. <br/>\r\nder laufende Auftrag) beendet sind, sofern sich kein Bauteil an einer Saugdüse befindet.</li>\r\n<li><strong>KeepRunning</strong>\: Die Pumpe wird eingeschaltet, wenn ein Bauteil<br/>\r\naufgenommen werden soll, und läuft weiter, bis sie ausdrücklich abgeschaltet wird, <br/>\r\noder bis die Maschine deaktiviert wird.</li>\r\n</ul>\r\n</html>
