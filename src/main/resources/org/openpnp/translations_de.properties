GcodeDriverSettings.lblCompressExcludes.text=Von der Komprimierung ausgeschlossene Zeichen
GcodeDriverSettings.lblCompressExcludes.toolTipText=<html>\r\n<p>\r\nDie Komprimierung von G-Code folgt den Regeln der Norm NIST RS274NGC<br/>\r\nfür einfache G- und M-Befehlszeilen.<br/>\r\nEs gibt jedoch einige standardisierte und herstellerspezifische Erweiterungen der Syntax,<br/>\r\nbei denen Komprimierung und Entfernen von Kommentaren unzulässig sind. Um diese<br/>\r\nErweiterungen zu unterstützen, können Sie eine Liste von Zeichen angeben, die als <em>Klammern</em> oder<br/>\r\n<em>Anführungszeichen</em> um diese Teile der Befehlszeilen dienen. \r\n</p>\r\n<p>\r\nTypische Beispiele sind\:<br/>\r\n<code>&quot; &\#x27; &lt;&gt; {} [] ()</code><br/>\r\n</p>\r\n<p>\r\nWegen möglicher syntaktischer Mehrdeutigkeiten (Escaping, Verschachtelung) wird alles zwischen<br/>\r\ndem äußerst linken und dem äußerst rechten Ausschlusszeichen vorsorglich von der<br/>\r\nKomprimierung und dem Entfernen von Kommentaren ausgenommen. Wird nur ein einzelnes Ausschlusszeichen gefunden,<br/>\r\nwird der Rest der Zeile ausgenommen.<br/>\r\n</p>\r\n<p>\r\nHinweise\: Verwenden Sie die Zeichen <code>[]</code>, um NIST RS274NGC Abschnitt<br/>\r\n3.3.2.3 <em>expressions</em> zu unterstützen. Fügen Sie die Zeichen <code>()</code> hinzu, wenn Sie<br/>\r\nKommentare in runden Klammern beim Entfernen von Kommentaren erhalten möchten. Kommentare am Zeilenende<br/>\r\nmit Semikolon werden dennoch entfernt.\r\n</p>\r\n</html>
