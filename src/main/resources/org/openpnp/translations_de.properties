ReferenceNozzleTipPartDetectionWizard.PartOffVacuumSensingPanel.ValveOpenCloseLabel.toolTipText=<html>\n<p>Das Ventil wird geöffnet und geschlossen, um einen kleinen Unterdruckimpuls zu erzeugen. </p>\n<p>Die Öffnungszeit sollte recht kurz sein; es ist nicht sinnvoll, den vollen Aufnahmesog zu erzeugen.</p>\n<p>Mit der Schließzeit kann darauf gewartet werden, dass das System auf den Impuls reagiert,<br/>\neinschließlich Verzögerungen bei Weiterleitung und Auslesen des Sensorsignals.</p>\n</html>
