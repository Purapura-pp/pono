ReferencePushPullFeederConfigurationWizard.lblDiscoverOnJobStart.toolTipText=<html>Beim Auftragsstart prüfen, ob in Feedern mit aktiviertem OCR die richtigen Bauteile an ihren Positionen ausgewählt sind. <br/>\r\nAndernfalls wird der Auftrag angehalten.<br/>\r\nDabei werden auch die Positionen der Feeder per Bildverarbeitung kalibriert, falls die Kalibrierung aktiviert ist.</html>
