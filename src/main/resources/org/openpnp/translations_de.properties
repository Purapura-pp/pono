ReferencePushPullFeederConfigurationWizard.lblHole1Location.toolTipText=<html>Wählen Sie Loch 1 näher an der Gurtrolle.<br/>\r\nWählen Sie, wenn möglich, zwei Löcher, die die aufzunehmenden Bauteile einschließen.\r\n</html>
ReferencePushPullFeederConfigurationWizard.lblHole2Location.text=Position Loch 2
ReferencePushPullFeederConfigurationWizard.lblHole2Location.toolTipText=<html>Wählen Sie Loch 2 weiter entfernt von der Gurtrolle.<br/>\r\nWählen Sie, wenn möglich, zwei Löcher, die die aufzunehmenden Bauteile einschließen.\r\n</html>
ReferencePushPullFeederConfigurationWizard.lblMultiplier.text=Multiplikator
ReferencePushPullFeederConfigurationWizard.lblMultiplier.toolTipText=Zur Steigerung der Effizienz können Sie den Feeder mehrfach betätigen, um pro Vorschubzyklus mehr Bauteile zuzuführen.
ReferencePushPullFeederConfigurationWizard.lblNormalizePickLocation.text=Normalisieren?
ReferencePushPullFeederConfigurationWizard.lblNormalizePickLocation.toolTipText=Die Aufnahmeposition relativ zu den Transportlöchern gemäß der Norm EIA-481 normalisieren.
ReferencePushPullFeederConfigurationWizard.lblOcrFontName.text=OCR-Schriftname
ReferencePushPullFeederConfigurationWizard.lblOcrFontName.toolTipText=<html>Name der zu erkennenden OCR-Schriftart oder [Barcode].<br/>\r\nSchriftarten mit fester Zeichenbreite funktionieren deutlich besser, erlauben eine geringere Auflösung und damit einen schnelleren <br/>\r\nBetrieb. Verwenden Sie eine Schriftart, bei der alle verwendeten Zeichen gut unterscheidbar sind.<br/>\r\nSchriftarten mit klarer Trennung zwischen den Glyphen sind deutlich zu bevorzugen.</html>
ReferencePushPullFeederConfigurationWizard.lblOcrWrongPart.text=OCR-Aktion bei falschem Bauteil
ReferencePushPullFeederConfigurationWizard.lblOcrWrongPart.toolTipText=<html>Legt fest, welche Maßnahme ergriffen werden soll, wenn OCR die falsche Bauteil-ID im Feeder erkennt.<br/> \r\n<ul>\r\n<li>\r\n<strong>None</strong>\: Verwenden Sie diese Einstellung, wenn Sie OCR nicht nutzen möchten.</li>\r\n<li>\r\n<strong>SwapFeeders</strong>\: Wenn ein falsches Bauteil erkannt wird, das richtige Bauteil aber<br/>\r\nin einem anderen ReferencePushPullFeeder ausgewählt ist, werden die Positionen der beiden Feeder getauscht. Der<br/>\r\neingetauschte Feeder wird aktiviert. Das passiert, wenn Sie Ihre Feeder an der Maschine<br/>\r\nentnehmen/wieder einsetzen/umordnen.</li>\r\n<li>\r\n<strong>SwapOrCreate</strong>\: Funktioniert wie <strong>SwapFeeders</strong>, aber wenn kein<br/>\r\nanderer Feeder mit dem richtigen Bauteil gefunden wird, wird ein neuer erzeugt und an der<br/>\r\nPosition des aktuellen Feeders eingetauscht. Der aktuelle Feeder wird dann seinerseits deaktiviert (beide sitzen nun an<br/>\r\nderselben Position und nur einer darf aktiviert sein).</li>\r\n<li>\r\n<strong>ChangePart</strong>\: Das Bauteil im aktuellen Feeder wird geändert. Das funktioniert nur<br/>\r\nrichtig, wenn die Gurteinstellungen usw. zwischen den Bauteilen gleich bleiben, d. h. wenn Sie<br/>\r\njedes Umbestücken/Umordnen auf Gruppen von Feedern mit denselben Einstellungen beschränken.</li>\r\n<li>\r\n<strong>ChangePartAndClone</strong>\: Das Bauteil im aktuellen Feeder wird geändert, die<br/>\r\nEinstellungen werden jedoch von einem Vorlagen-Feeder geklont.</li>\r\n</ul>\r\n</html>\r\n
ReferencePushPullFeederConfigurationWizard.lblPartPitch.text=Bauteilteilung
ReferencePushPullFeederConfigurationWizard.lblPartPitch.toolTipText=Teilung der Bauteile im Gurt (2 mm, 4 mm, 8 mm, 12 mm usw.)
ReferencePushPullFeederConfigurationWizard.lblPickLocation.text=Aufnahmeposition
ReferencePushPullFeederConfigurationWizard.lblPickLocation.toolTipText=<html>Aufnahmeposition des Bauteils. Wenn ein Vorschubvorgang mehrere erzeugt,<br/>\r\nmuss dies das zuletzt aufgenommene sein, also das der Gurtrolle am nächsten liegende.</html>
ReferencePushPullFeederConfigurationWizard.lblPrecisionAverage.text=Mittlere Genauigkeit
ReferencePushPullFeederConfigurationWizard.lblPrecisionAverage.toolTipText=Erreichte mittlere Genauigkeit, d. h. der von der Kalibrierung erkannte Versatz der Aufnahmeposition
