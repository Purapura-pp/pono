ReferenceNozzleTipCalibrationWizard.TopPanel.RecalibrationLabel.toolTipText=<html>\n<p>Legt fest, wann automatisch eine Neukalibrierung ausgeführt wird\:</p>\n<p><ul><li>Bei jedem Düsenspitzenwechsel.</li>\n<li>Bei jedem Düsenspitzenwechsel, aber nur in Aufträgen.</li>\n<li>Bei der Referenzfahrt der Maschine und beim ersten Laden. </li></ul></p>\n<p>Manuell mit gespeicherter Kalibrierung (nur für Maschinen mit <br /> \nC-Achsen-Referenzfahrt empfohlen).</p>\n</html>
