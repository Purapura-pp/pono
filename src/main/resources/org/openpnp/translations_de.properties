PackageCompositingWizard.ComputeCompositing.ShortDescription=Berechnet die Bildzusammensetzung neu.
PackageCompositingWizard.Error.text=Fehler\: 
PackageCompositingWizard.ExtraShotsLabel.text=Zusätzliche Aufnahmen
PackageCompositingWizard.ExtraShotsLabel.toolTipText=<html>\n<p>Das Vision-Compositing bestimmt die optimale minimale Menge der erforderlichen Aufnahmen, um<br/>\nPosition und Winkel des Bauteils zu bestimmen. Darüber hinaus schlägt es zusätzliche Aufnahmen vor, mit denen sich <br/>\ndie Genauigkeit von Position und Winkel verbessern lässt. </p>\n<br/>\n<p>Beispiel\: Ein quadratisches Bauteil lässt sich mit zwei diagonalen Eckaufnahmen bestimmen. Die beiden gegenüberliegenden<br/>\nEcken des Quadrats werden als zusätzliche Aufnahmen vorgeschlagen.</p>\n<br/>\n<p><strong>Zusätzliche Aufnahmen</strong> gibt an, wie viele dieser zusätzlichen Aufnahmen verwendet werden sollen. \n</html>
PackageCompositingWizard.MaxPickToleranceLabel.text=Max. Aufnahmetoleranz
PackageCompositingWizard.MaxPickToleranceLabel.toolTipText=<html>\n<p>Bei Null wird die <strong>Max. Aufnahmetoleranz</strong> der Düsenspitze verwendet.</p>\n<br/>\n<p>Bei einem Wert ungleich Null überschreibt diese <strong>Max. Aufnahmetoleranz</strong> sie für dieses Gehäuse.</p>\n<br/>\n<p>In beiden Fällen muss die <strong>Max. Aufnahmetoleranz</strong> die linearen <br/>\nVersätze des aufgenommenen Bauteils an der Saugdüse abdecken sowie Eckversätze <br/>\ndurch Drehversätze und auch Kombinationen aus beidem.</p>\n</html>
PackageCompositingWizard.MethodLabel.text=Methode
PackageCompositingWizard.MethodLabel.toolTipText=<html>\n<p>Compositing-Methode\:</p>\n<ul>\n<li><strong>None\:</strong> Es wird kein Compositing durchgeführt.</li>\n<li><strong>Restricted\:</strong> Compositing wird nur durchgeführt, wenn der <br/>\nFootprint zu groß oder unsymmetrisch ist.</li>\n<li><strong>Automatic\:</strong> Compositing wird immer durchgeführt. Es kann dennoch <br/>\nzu einer Lösung mit einer einzigen Aufnahme führen, wenn alle Ecken konvex <br/>\nund symmetrisch sind.</li>\n<li><strong>SingleCorner\:</strong> Compositing wird immer durchgeführt. Jede <br/>\nEcke wird einzeln aufgenommen. Verringert Parallaxenfehler, da <br/>\njede Ecke in der Kamera zentriert wird.</li>\n</ul>\n</html>\n\n
PackageCompositingWizard.MinAngleLeverageLabel.text=Min. Winkelhebel
PackageCompositingWizard.MinAngleLeverageLabel.toolTipText=<html>\n<p>Minimale Hebelwirkung, die erforderlich ist, um Winkelinformationen aus zwei Ecken abzuleiten.</p>\n<br/>\n<p><strong>Min. Winkel-Hebelwirkung</strong> wird <em>relativ</em> zu Breite und Höhe des Footprints angegeben<br/>\n(die kleinere der beiden).</p>\n<br/>\n<p>Beispiel\: Bei 0.5 müssen zwei Ecken mindestens die halbe Bauteilabmessung aufspannen,<br/>\num Winkelinformationen zu liefern.</p>\n</html>
