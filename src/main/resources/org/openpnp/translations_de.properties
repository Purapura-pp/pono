ReferenceNozzleTipCalibrationWizard.BackgroundCalibrationPanel.MinDetailSizeLabel.toolTipText=<html>\n<p>Geben Sie die Größe der kleinsten Details im Bild an, die als<br/>\nbedeutsamer Teil der zu erkennenden Form gelten, etwa die kleinsten Kontakte usw.<br/>\nKleinere Flecken und Artefakte wie Bildrauschen, Texturen, Markierungen oder Schmutz auf<br/>\nObjekten gelten als für die Bildverarbeitung irrelevant, das heißt, es können<br/>\nFilter angewendet werden, um sie im Bild zu unterdrücken. </p> \n<p><strong>Hinweis\:</strong> Die <strong>Minimale Detailgröße</strong> kann auch\ndie Rechenkosten einiger<br/>\nPipelines/Stufen beeinflussen. Kleine Details verursachen hohe Rechenkosten.</p>\n</html>
