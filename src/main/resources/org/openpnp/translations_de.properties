FiducialVisionSettingsConfigurationWizard.lblParallaxAngle.text=Parallaxenwinkel
FiducialVisionSettingsConfigurationWizard.lblParallaxAngle.toolTipText=<html>\n<p>\nWinkel, um den die beiden Parallaxen-Blickpunkte der Kamera voneinander entfernt sind.<br/>\nWählen Sie einen Winkel, der die schnellere Achse Ihrer Maschine bevorzugt\: 0° bevorzugt X, 90° bevorzugt Y.<br/>\nAndere Winkel können verwendet werden, um die Genauigkeit zu verbessern oder Reflexionen des LED-Rings auszugleichen.\n</p>\n</html> \n\n
FiducialVisionSettingsConfigurationWizard.lblParallaxDiameter.text=Parallaxendurchmesser
FiducialVisionSettingsConfigurationWizard.lblParallaxDiameter.toolTipText=<html>\n<p>\nWenn der <strong>Parallaxendurchmesser</strong> angegeben ist, führt die Passermarken-Suche ihre Erkennung von zwei<br/>\nParallaxen-Blickpunkten beiderseits der erwarteten Position der Passermarke aus. Der Abstand<br/> zwischen beiden wird durch den Parallaxendurchmesser festgelegt.</p>\n<p>\nDer typische Anwendungsfall sind stark reflektierende Passermarken, etwa auf Leiterplatten mit HASL-Oberfläche<br/>\n(Hot Air Solder Leveling). Diese spiegeln die durch den Diffusor blickende Kamera, daher<br/> \nkann die Passermarke (teilweise) dunkel und/oder für die Erkennung schlecht ausgeformt erscheinen.\n</p>\n<p>\nBei der Erkennung von einem Parallaxen-Blickpunkt erscheint die Passermarke schräg und spiegelt den<br/>\nhellen Diffusor des Kameralichts. Wird dies von gegenüberliegenden, symmetrischen Blickpunkten gemacht, kann der<br/>\nMittelpunkt genommen werden, um Parallaxenfehler auszugleichen.\n</p>\n</html>
