AbstractActuatorConfigurationWizard.GeneralPanel.ValueTypeLabel.toolTipText=<html>\n<p>\nBestimmt den primären Datentyp der Schreibwerte des Aktuators. \n</p>\n<ul>\n<li><strong>Boolean\:</strong><br/>Aktuator zum Ein-/Ausschalten.</li>\n<li><strong>Double\:</strong><br/>Numerischer Aktuator zur Ausgabe skalarer Werte.</li>\n<li><strong>String\:</strong><br/>Textueller Aktuator zur Ausgabe beliebiger Codes und Werte.</li>\n<li><strong>Profile\:</strong><br/>Aktuator mit Mehrfachauswahl, der mehrere benannte Profile definieren<br/>\nund andere Aktuatoren ansteuern kann.<br/>\nDrücken Sie Anwenden, um den Konfigurationsassistenten für Profile zu aktivieren.</li>\n</ul>\n<strong>Hinweis\:</strong> Der primäre Datentyp wird im Betrieb des Aktuators nicht erzwungen.<br/>\nEine gemischte Verwendung von Typen ist weiterhin möglich (aus Gründen der Rückwärtskompatibilität). \n</html>
