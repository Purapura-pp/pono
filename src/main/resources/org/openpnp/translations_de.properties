ReferenceMachineConfigurationWizard.PanelGeneral.UnsafeZRoamingLabel.toolTipText=<html>Maximal zulässige Roaming-Distanz bei unsicherem Z.<br/><br/>\r\nVirtuelle Z-Achsen (typischerweise bei Kameras) sind unsichtbar, daher kann leicht übersehen werden,<br/>\r\ndass Sie sich bei unsicherem Z befinden. Wenn Sie später die Schaltfläche <strong>Werkzeug zur Kameraposition fahren</strong><br/>\r\ndrücken, folgt eine unerwartete Z-Abwärtsbewegung, die das Werkzeug beschädigen kann.<br/>\r\nDie maximal zulässige Roaming-Distanz bei unsicherem Z begrenzt daher den Bereich des manuellen Verfahrens,<br/>\r\ninnerhalb dessen ein unsicheres virtuelles Z beibehalten wird; er sollte ausreichen, um eine erfasste<br/>\r\nPosition feinzujustieren. Weiteres Verfahren darüber hinaus bewegt die virtuelle Achse automatisch auf Safe Z.\r\n</html>
