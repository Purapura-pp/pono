GcodeDriverSettings.SettingsPanel.CommandWaitTimeLabel.toolTipText=<html>\n<p>Wenn ein Befehl mit einem <strong>$ </strong>-Zeichen beginnt, diese Wartezeit einfügen, bevor<br/>\nder nächste Befehl gesendet wird. Der TinyG-Controller benötigt bekanntlich diese<br/>\nPause, damit er Einstellungen ununterbrochen in das EEPROM schreiben kann. </p>\n<br/>\n<p>Hinweis\: In einem GcodeAsyncDriver ohne Bestätigungs-Flusssteuerung <br/>\nfunktioniert das nur garantiert, wenn die $-Befehle an einen im Leerlauf befindlichen  <br/>\nController gesendet werden. Das ist der Fall, wenn die $-Befehle als Erstes im <br/>\n<strong>CONNECT_COMMAND</strong> gesendet werden.</p> \n</html>
GcodeDriverSettings.SettingsPanel.CompressGCodeLabel.text=G-code komprimieren?
GcodeDriverSettings.SettingsPanel.CompressGCodeLabel.toolTipText=<html>\r\n<p>Entfernt unnötige Leerzeichen und nachfolgende Dezimalstellen aus dem G-Code,<br/>\r\num die Übertragung an den Controller zu beschleunigen.</p>\r\n<p>Hinweis\: Das funktioniert nur mit regulärer G-Code-Syntax.</p>\r\n<p>Beispiel\:</p>\r\n<p><code style\="background-color\:\#DDDDDD">G1&nbsp;&nbsp;X100.0000     Y20.1000&nbsp;&nbsp;&nbsp;&nbsp;</code></p>\r\n<p>wird komprimiert zu\:</p>\r\n<p><code style\="background-color\:\#DDDDDD">G1X100Y20.1</code></p>\r\n</html>
