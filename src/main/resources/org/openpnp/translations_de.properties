CameraConfigurationWizard.basicCalibrationInstructions=<html><ol><li>Legen Sie ein Objekt mit bekannter Breite und Länge auf den Tisch. Millimeterpapier ist dafür eine gute, einfache Wahl.<li>Geben Sie Breite und Länge des Objekts in die Felder X und Y der Objektabmessungen ein.<li>Obere Kamera\: Verfahren Sie die Kamera so, dass sie über dem Objekt zentriert und scharf gestellt ist.<li>Untere Kamera\: Legen Sie das Objekt flach über die Kamera, sodass es scharf abgebildet wird.<li>Drücken Sie Messen und messen Sie das Objekt mit dem Auswahlrechteck der Kamera. <li>Drücken Sie nach Abschluss Bestätigen.<li>Die berechneten Werte für Einheiten pro Pixel werden in die Felder X und Y eingetragen.</ol></html>
CameraConfigurationWizard.downLookingCalibrationInstructions=<html>Die Kalibrierung der Einheiten pro Pixel auf zwei verschiedenen Z-Ebenen erlaubt Pono, Objektgrößen korrekt in 3D zu interpretieren, d. h. in beliebigem Abstand von der Kamera. Wenn Sie bereits in 2D kalibriert haben, benötigen Sie dennoch zwei neue 3D-Messungen. Für die 3D-Kalibrierung müssen Saugdüsen- und Kamerapositionen, Versätze, Safe Z und die grundlegende Maschinenbewegung eingerichtet sein. <ol><li>Wählen Sie ein rechteckiges Objekt mit bekannter Breite und Länge, das in das Sichtfeld der Kamera passt. Millimeterpapier ist dafür eine gute, einfache Wahl. Geben Sie Breite und Länge des Objekts in die Felder X und Y der Objektabmessungen ein.<li>Legen Sie das Objekt auf den Tisch. Beachten Sie, dass die primären Einheiten pro Pixel etwa auf derselben Z-Höhe wie die Oberseite der zu bestückenden Leiterplatte(n) kalibriert werden sollten und die sekundären so hoch wie möglich, wobei das Objekt noch einigermaßen scharf abgebildet wird. Das Objekt sollte auf beiden Höhen bequem in das Sichtfeld passen.<li>Verfahren Sie die Saugdüse über die Mitte des Objekts und dann so weit nach unten, dass sie die Oberfläche gerade berührt. <li>Wenn Sie die primären Einheiten pro Pixel kalibrieren, können Sie nun die Schaltfläche zum Erfassen der Saugdüsen-Z-Position drücken, um die Standard-Arbeitshöhe (Leiterplattenoberfläche) zu erfassen.<li>Drücken Sie Messen, um die Kamera automatisch über dem Objekt zu positionieren, und messen Sie das Objekt mit dem Auswahlrechteck der Kameraansicht. Ist das Objekt nicht perfekt scharf, verwenden Sie für die Messung die Mitte der unscharfen Kanten. Drücken Sie nach Abschluss Bestätigen.<li>Die berechneten Werte für Einheiten pro Pixel werden in die Felder X und Y eingetragen. Die Z-Koordinaten von Messobjekt und Kamera werden aufgezeichnet.<li>Legen Sie für die sekundäre Messung einen Abstandshalter unter das Objekt, oder verfahren Sie bei Maschinen, welche die obere Kamera physisch in Z bewegen können, die Kamera so hoch wie möglich, wobei das Objekt noch einigermaßen scharf abgebildet wird. <li>Wiederholen Sie die Schritte 3 bis 6 für die sekundären Einheiten pro Pixel. </ol></html>
CameraConfigurationWizard.upLookingCalibrationInstructions=<html>Die Kalibrierung der Einheiten pro Pixel auf zwei verschiedenen Z-Ebenen erlaubt Pono, Objektgrößen korrekt in 3D zu interpretieren, d. h. in beliebigem Abstand von der Kamera. Wenn Sie bereits in 2D kalibriert haben, benötigen Sie dennoch zwei neue 3D-Messungen. Für die 3D-Kalibrierung müssen Saugdüsen- und Kamerapositionen, Versätze, Safe Z und die grundlegende Maschinenbewegung eingerichtet sein. <ol><li>Wählen Sie ein Objekt mit bekannter Breite, Länge und Dicke, das in das Sichtfeld der Kamera passt. Geben Sie Breite, Länge und Dicke des Objekts in die Felder X, Y und Z der Objektabmessungen oben ein.<li>Legen Sie das Objekt gerade ausgerichtet auf den Tisch und nehmen Sie es mit einer Saugdüse auf.<li>Beachten Sie, dass die primären Einheiten pro Pixel an der Position der nach oben blickenden Kamera kalibriert werden, während die sekundären an einer höheren Position kalibriert werden sollten.<li>WARNUNG - wenn die Saugdüse nicht bereits über der Position der nach oben blickenden Kamera steht, wird sie im nächsten Schritt automatisch dorthin gefahren.<li>Drücken Sie Messen und messen Sie das Objekt mit dem Auswahlrechteck der Kamera.  Drehen Sie die Saugdüse bei Bedarf über das Verfahr-Panel, sodass das Objekt gerade zum Auswahlrechteck ausgerichtet ist.  Ist das Objekt nicht perfekt scharf, verwenden Sie für die Messung die Mitte der unscharfen Kanten.  Drücken Sie nach Abschluss Bestätigen.<li>Die berechneten Werte für Einheiten pro Pixel werden in die Felder X und Y eingetragen. Die Z-Koordinaten von Messobjekt und Kamera werden aufgezeichnet.<li>Verfahren Sie die Saugdüse so hoch wie möglich nach oben, wobei das Objekt noch einigermaßen scharf abgebildet wird. <li>Wiederholen Sie die Schritte 5 bis 6 für die sekundären Einheiten pro Pixel.</ol></html>
