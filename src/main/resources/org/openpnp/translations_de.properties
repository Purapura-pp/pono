ReferenceNozzleVacuumWizard.ContentPanel.ClosesVacuumActuatorLabel.text=Schließt den Vakuum-Aktuator?
ReferenceNozzleVacuumWizard.ContentPanel.ClosesVacuumActuatorLabel.toolTipText=<html>\r\nDas Betätigen des Abblas-Aktuators betätigt <em>implizit</em> auch den Vakuum-Aktuator aus.<br/>\r\nWenn dies aktiviert ist, wird die <em>explizite</em> Aus-Betätigung des Vakuum-Aktuators weggelassen.\r\n</html>
