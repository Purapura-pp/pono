ReferenceControllerAxisConfigurationWizard.ControllerSettingsPanel.ResolutionLabel.text=Auflösung [Treibereinheiten]
ReferenceControllerAxisConfigurationWizard.ControllerSettingsPanel.ResolutionLabel.toolTipText=<html><strong>Auflösung</strong> dieser Achse. Koordinaten werden beim Vergleich auf das nächste Vielfache<br/>\r\ngerundet, d. h. eine Bewegung wird nur ausgeführt, wenn sie sich nach dem Runden unterscheiden.<br/>\r\nIdealerweise wird dies auf die physikalische Mikroschritt-Auflösung (oder Ähnliches) der Achse oder ein praktikables ganzzahliges<br/>\r\nVielfaches davon gesetzt. Die <strong>Auflösung</strong> ist der Reziprokwert der <strong>Schritte / Einheit</strong>, die häufig in<br/>\r\nControllern konfiguriert werden.<br/>\r\n<br/>\r\nStellen Sie beim GcodeDriver sicher, dass die Auflösung mit dem Format im <br/>\r\n<code>MOVE_TO_COMMAND</code> darstellbar ist. Standard ist 0.0001, was dem Format %.4f (vier Dezimalstellen)<br/>\r\nim <code>MOVE_TO_COMMAND</code> entspricht.<br/>\r\n<br/>\r\nBeachten Sie\: Die <strong>Auflösung</strong> wird in Treiber- (nicht System-)Einheiten angegeben.\r\n</html>
ReferenceControllerAxisConfigurationWizard.ControllerSettingsPanel.Steps.text=Schritte
ReferenceControllerAxisConfigurationWizard.ControllerSettingsPanel.StepsUnitLabel.text=Schritte / Einheit
ReferenceControllerAxisConfigurationWizard.ControllerSettingsPanel.StepsUnitLabel.toolTipText=<html><strong>Schritte pro Einheit</strong> sind der Reziprokwert der <strong>Auflösung</strong>.<br/>\r\nSie finden sich häufig in der Controller-Konfiguration, daher können Sie sie hier eingeben, um<br/>\r\ndie <strong>Auflösung</strong> automatisch zu berechnen.</html>
ReferenceControllerAxisConfigurationWizard.ControllerSettingsPanel.SwitchLinearRotationalLabel.text=Linear ↔ rotatorisch umschalten?
ReferenceControllerAxisConfigurationWizard.ControllerSettingsPanel.SwitchLinearRotationalLabel.toolTipText=<html>Es ist wichtig, dass Pono versteht, ob eine Achse im Controller linear oder <br/>\r\nrotatorisch ist. <br/>\r\n<br/>\r\nMeist ist dies bereits durch den Achsentyp bestimmt, d. h. X, Y, Z sind linear <br/>\r\nund Rotation ist rotatorisch. Manchmal gehen Ihnen jedoch die passenden Achsen am <br/>\r\nController aus und Sie müssen eine lineare Controller-Achse für eine rotatorische Pono-Achse <br/>\r\nverwenden oder umgekehrt.<br/>\r\n<br/>\r\nWenn Sie Ihren Controller nicht so konfigurieren können, dass er diese Bedeutung wechselt, ist es wichtig, <br/>\r\ndas Kontrollfeld Linear ↔ rotatorisch umschalten zu aktivieren.<br/>\r\n<br/>\r\nDies ist relevant für die Berechnung korrekter Grenzwerte für Vorschubgeschwindigkeit, Beschleunigung und Ruck bei gemischten<br/>\r\nAchsbewegungen, da im Standard-G-Code nur die Bewegung linearer Achsen für die Grenzwerte <br/>\r\nberücksichtigt wird.<br/>\r\n</html>
ReferenceControllerAxisConfigurationWizard.ControllerSettingsPanel.WrapAroundLabel.text=Umlauf
ReferenceControllerAxisConfigurationWizard.ControllerSettingsPanel.WrapAroundLabel.toolTipText=<html>Die Achse immer auf dem kürzeren Weg drehen. Z. B. wenn sie bei 270° steht und der Befehl <br/>\r\nkommt, auf 0° zu fahren, fährt sie stattdessen auf 360°.<br/>\r\nWird dies mit Auf ±180° begrenzen kombiniert, wird die Achse mit einem Global-Offset-Befehl des Treibers <br/>\r\nauf ihre Wrap-Around-Koordinate zurückgesetzt. Beim GcodeDriver müssen Sie den<br/> <code>SET_GLOBAL_OFFSETS_COMMAND</code> konfigurieren, sonst funktioniert dies nicht.\r\n</html>
