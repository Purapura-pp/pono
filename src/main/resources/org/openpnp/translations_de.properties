BoardsPanel.BoardPlacements.Placements.Rank.toolTip=<html><body style\='width\: 400'><strong>Rang</strong> steuert die Reihenfolge, in der Bestückungspositionen während eines Auftrags bearbeitet werden. Bestückt wird von niedrigem zu hohem Rang. Es gilt eine <strong>strikte Reihenfolge</strong>, wenn der Unterschied zwischen den Rängen 10 oder mehr beträgt. Alle Bestückungspositionen im Rang R müssen abgeschlossen und korrekt sein, bevor Rang R+10 für die Bestückung berücksichtigt wird. Es gilt <strong>keine Reihenfolge</strong>, wenn der Unterschied zwischen den Rängen kleiner als 10 ist. Bestückungspositionen im Rang R können je nach anderen Optimierungsprioritäten des Auftrags irgendwo zwischen R-9 und R+9 bestückt werden.</body></html>
