PlacementsHolderLocationViewer.ViewingOption.Placements=Bestückungspositionen
PlacementsHolderLocationViewer.ViewingOption.Placements.ToolTip=<Html><body style\='width\: 400'>Legt an der Position jeder sichtbaren Bestückungsposition ein Quadrat von 1 mm darüber. Das Quadrat ist weiß, wenn die Bestückungsposition aktiviert ist, und grau, wenn sie deaktiviert ist. Zusätzlich markiert ein kleines Pluszeichen die Mitte der Bestückungsposition, wobei die positive Y-Richtung durch den <span style\='background-color\: black; color\: \#00FFFF'><b>cyanfarbenen</span> Schenkel angezeigt wird, ähnlich dem Fadenkreuz der Kameraansicht. Dies zeigt die Position, zu der die Kamera fahren würde, wenn sie zur Position der Bestückungsposition geschickt wird.</html>
