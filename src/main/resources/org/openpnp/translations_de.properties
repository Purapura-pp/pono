BlindsFeederArrayConfigurationWizard.lblOcrFontName.toolTipText=<html>Name der zu erkennenden OCR-Schriftart oder [Barcode].<br/>\r\nSchriftarten mit fester Laufweite funktionieren viel besser, erlauben eine geringere Auflösung und damit schnelleren <br/>\r\nBetrieb. Verwenden Sie eine Schriftart, bei der alle verwendeten Zeichen gut unterscheidbar sind.<br/>\r\nSchriftarten mit klarer Trennung zwischen den Glyphen sind deutlich zu bevorzugen.</html>
