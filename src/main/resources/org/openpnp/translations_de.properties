PlacementsHolderLocationViewer.ViewingOption.Locations.ToolTip=<Html><body style\='width\: 400'>Legt an der Position jeder sichtbaren Leiterplatte und/oder jedes Nutzens ein Pluszeichen darüber. Die positive Y-Richtung wird durch den <span style\='background-color\: black; color\: \#00FFFF'><b>cyanfarbenen</span> Schenkel angezeigt, ähnlich dem Fadenkreuz der Kameraansicht. Dies zeigt die Position, zu der die Kamera fahren würde, wenn sie zur Position der Leiterplatte oder des Nutzens geschickt wird.</html>
