ReferenceNozzleTipConfigurationWizard.PartDimensionsPanel.MaxPickToleranceLabel.text=Max. Aufnahmetoleranz
ReferenceNozzleTipConfigurationWizard.PartDimensionsPanel.MaxPickToleranceLabel.toolTipText=<html>\nMaximal angenommene Aufnahmetoleranz, die mit dieser Düsenspitze zulässig ist.<br/>\nSie legt fest, wie weit entfernt von der nominalen Position eine erkannte <br/>\nBottom-Vision-Ausrichtungsposition akzeptiert wird. Außerdem verkürzt sie die <br/>\nRechenzeit einiger Bildverarbeitungsoperationen, indem der Suchbereich begrenzt wird.\n</html>\n\n
ReferenceNozzleTipConfigurationWizard.PartDimensionsPanel.MinPartDiameterLabel.text=Min. Bauteildurchmesser
ReferenceNozzleTipConfigurationWizard.PartDimensionsPanel.MinPartDiameterLabel.toolTipText=<html>\nMinimaler Bauteildurchmesser, der mit dieser Düsenspitze aufgenommen werden soll.<br/>\nBeachten Sie\: Der <strong>Minimale Bauteildurchmesser</strong> minus zweimal die <strong>Aufnahmetoleranz</strong><br/>\nbestimmt den minimalen <em>inneren</em> Durchmesser der Düsenspitze, der<br/>\nimmer als vom Bauteil verdeckt gilt. Dieser innere Durchmesser wird<br/>\nbei der Schlüsselfarbenanalyse und -diagnose der Hintergrundkalibrierung ignoriert.\n</html>
