BlindsFeederArrayConfigurationWizard.lblNormalize.toolTipText=<html>\r\nDie Passermarkenabstände und die Scherung auf die theoretisch korrekten <br />\r\nWerte normalisieren (Quadratraster in ganzen Millimetern). Das bedeutet, dass Sie der Mechanik  <br />\r\nIhrer Maschine und Ihres 3D-Druckers mehr vertrauen als den per Bildverarbeitung ermittelten Passermarken.  <br />\r\nDie absolute Gesamtposition und der Winkel werden weiterhin per Bildverarbeitung bestimmt. \r\n</html>
