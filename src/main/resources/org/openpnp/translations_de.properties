ReferenceCameraCalibrationWizard.CameraCalibrationPanel.DescriptionLabel.text=<html><p width\="500">Die Einstellungen auf diesem Tab sollen langfristig alle Einstellungen für Einheiten pro Pixel auf dem Tab der allgemeinen Konfiguration, alles auf dem Tab der Objektivkalibrierung und alles auf dem Tab der Bildtransformationen ersetzen. Sie ersetzen außerdem die Schaltfläche zum Kalibrieren von Kameraposition und -drehung auf dem Tab der Düsenspitzen-Kalibrierung.</p><p> </p><p width\="500"><b>Voraussetzungen\:</b> Die X-, Y- und Z-Achse der Maschine, die Umkehrspiel-Kompensation und die Korrektur der Nicht-Rechtwinkligkeit müssen alle korrekt kalibriert sein. Außerdem sollten alle Probleme mit mechanischer Nicht-Wiederholbarkeit (verlorene Schritte, lose Riemenscheiben/Zahnräder, rutschende Riemen usw.) behoben sein, bevor die Kamerakalibrierung versucht wird. Zusätzlich müssen bei unteren Kameras die Drehachse und die Saugdüsen-Versätze korrekt kalibriert sein; und die visuelle Referenzfahrt muss, falls sie verwendet werden soll, eingerichtet und funktionsfähig sein.</p></html>
