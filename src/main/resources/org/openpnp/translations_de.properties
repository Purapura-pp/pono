BottomVisionSettingsConfigurationWizard.lblAllowVisionOffsets.toolTipText=<html>\r\nAktivieren, wenn das Bauteil/Gehäuse konstruktiv unsymmetrisch ist, d. h. wenn die Kontakte gegenüber<br/>\r\ndem konstruktiven Mittelpunkt des Bauteils/Gehäuses versetzt sind, an dem das Bauteil auch aufgenommen wird.<br/>\r\nSobald ein Bauteil/Gehäuse als unsymmetrisch markiert ist, können Bildverarbeitungs-Versätze eingegeben/erkannt werden,<br/>\r\num sie in der Bottom-Vision zu kompensieren.<br/>\r\nHinweis\: Dies sollte nur für Asymmetrien verwendet werden, die <em>konstruktiv bedingt</em> sind, nicht um<br/>\r\nwiederholbare Bestückungsfehler-Versätze auszugleichen. Wenn Sie wiederholbare Bestückungsfehler-Versätze haben,<br/>\r\nprüfen Sie, ob das E-CAD-Gehäuse korrekt zentriert ist, wiederholen Sie die Kalibrierung der Kamera- und Saugdüsen-Versätze<br/>\r\nund/oder untersuchen Sie die Passermarkenprüfungen der Leiterplatte.\r\n</html>
