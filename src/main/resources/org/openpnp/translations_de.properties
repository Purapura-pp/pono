Solutions.Issue.CompleteMilestone.Choice.0=<html><h3>Weiter zu %s</h3><p>Bestätigen Sie, dass Sie den Meilenstein <strong>%s</strong> abgeschlossen und getestet haben\:</p><br/><blockquote>%s</blockquote><br/><p>Hinweis\: Alle Probleme dieses Meilensteins sollten behoben oder verworfen sein, bevor Sie fortfahren.</p><br/><p>Ja? <em>Herzlichen Glückwunsch\!</em></p><br/><p>Sie können nun zum nächsten Meilenstein <strong>%s</strong> weitergehen\:</p><br/><blockquote>%s</blockquote><br/><p>Es werden weitere Probleme & Lösungen angezeigt, die für das Erreichen des nächsten Meilensteins bearbeitet werden müssen.</p></html>
Solutions.Issue.CompleteMilestone.Choice.1=<html><h3>Zurück zu %s</h3><p>Um den Umfang von Probleme & Lösungen zu begrenzen, können Sie zum vorherigen Meilenstein <strong>%s</strong> zurückgehen\:</p><br/><blockquote>%s</blockquote><br/><p>Hinweis\: Die meisten Probleme & Lösungen früherer Meilensteine werden auch bei späteren Meilensteinen gemeldet. In früheren Ziel-Meilensteinen sind einige vorgeschlagene Lösungen jedoch einfacher und konservativer. Zur Fehlersuche kann es daher hilfreich sein, zurückzugehen und es dort zum Funktionieren zu bringen.</p></html>
Solutions.Issue.CompleteMilestone.Confirm=<html><p>Für den Meilenstein <strong>%s</strong> sind noch Probleme offen\:</p> %s <p color\="red">Es wird nicht empfohlen, zum nächsten Ziel-Meilenstein zu wechseln, bevor diese behoben oder verworfen sind\!</p><p><br/>Sind Sie sicher, dass Sie dennoch fortfahren möchten?</p></html>
