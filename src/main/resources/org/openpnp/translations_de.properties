ReferenceAdvancedMotionPlannerConfigurationWizard.MotionPlannerPanel.AllowContinousMotionLabel.text=Durchgehende Bewegung erlauben?
ReferenceAdvancedMotionPlannerConfigurationWizard.MotionPlannerPanel.AllowContinousMotionLabel.toolTipText=<html>\r\n<p>Häufig veranlasst Pono den/die Controller, eine Bewegung auszuführen, die aus mehreren<br/>\r\nAbschnitten besteht. Betrachten Sie beispielsweise eine Fahrt auf Safe Z, gefolgt von einer Fahrt über die Zielposition<br/>\r\nund anschließend einer Fahrt, um die Saugdüse zum Aufnehmen oder Bestücken abzusenken. </p> \r\n<p>Wenn die Bewegungsplanung und/oder der Bewegungscontroller diese Befehle als eine<br/>\r\nSequenz erhalten, können sie bestimmte Optimierungen darauf anwenden. Außerdem entstehen keine Verzögerungen<br/>\r\ndurch Hin- und Herkommunikation. Zudem kann die Planung parallel weiterlaufen, <br/>\r\nwährend der Controller noch die letzten Befehle ausführt.</p>\r\n<p>Indem Sie kontinuierliche Bewegung erlauben, aktivieren Sie diese Optimierungen. Die <br/>\r\nMaschinenkonfiguration, also Gcode, eigene Skripte usw., muss jedoch im Bewusstsein konfiguriert werden, dass die <br/>\r\nPlanung nicht mehr jedes Mal auf den Abschluss der Bewegung wartet, sofern das nicht ausdrücklich verlangt wird. </p>\r\n</html>
ReferenceAdvancedMotionPlannerConfigurationWizard.MotionPlannerPanel.AllowUncoordinatedLabel.text=Unkoordinierte Bewegung erlauben?
ReferenceAdvancedMotionPlannerConfigurationWizard.MotionPlannerPanel.AllowUncoordinatedLabel.toolTipText=<html>\r\nWenn unkoordinierte Bewegung erlaubt wird, kann die Planung erweiterte Funktionen<br/>\r\nwie Überschwingen, Bewegungsüberblendung usw. nutzen. Das erfordert einen Treiber, der<br/>\r\nsimulierte oder echte Bewegungsregelung 3. Ordnung unterstützt (mit diesen Funktionen im Controller).\r\n</html>
ReferenceAdvancedMotionPlannerConfigurationWizard.MotionPlannerPanel.Border.title=Bewegungsplaner
ReferenceAdvancedMotionPlannerConfigurationWizard.MotionPlannerPanel.FuseBacklashFinalApproachLabel.text=Rückschlag-Anfahrt verschmelzen?
ReferenceAdvancedMotionPlannerConfigurationWizard.MotionPlannerPanel.FuseBacklashFinalApproachLabel.toolTipText=<html>\r\n<p>Die zweistufige Rückschlagkompensation - einseitiges Positionieren oder Anschleichen -<br/>\r\nfährt über das Ziel hinaus und nähert sich ihm dann in einer zweiten, eigenen Bewegung.<br/>\r\nDiese zweite Bewegung kostet jedes Mal einen Stillstand und eine eigene G-Code-Zeile.</p>\r\n<p>Ist dies aktiviert, verschmilzt die Planung diese Anfahrt mit der folgenden Bewegung,<br/>\r\nsolange jene die kompensierten Achsen nicht bewegt - typischerweise die Z-Absenkung auf<br/>\r\nein Bauteil. Die Achse erreicht das Ziel weiterhin von derselben Seite und sanfter als<br/>\r\nzuvor, da sie ihren Bruchteil eines Millimeters nun über die ganze Absenkung verteilt.</p>\r\n<p>Erfordert erlaubte kontinuierliche Bewegung, denn sonst gibt es nichts, womit<br/>\r\nverschmolzen werden könnte. Die verschmolzene Bewegung führt den Ausgleichsweg während<br/>\r\nder Absenkung mit. Also abschalten, wenn eine Düse in eine Wechslerposition oder eine<br/>\r\nandere Stelle absenken muss, die für den Rückschlag-Offset zu eng ist.</p>\r\n</html>
ReferenceAdvancedMotionPlannerConfigurationWizard.MotionPlannerPanel.InterpolationRetimingLabel.text=Interpolation zeitlich neu berechnen?
ReferenceAdvancedMotionPlannerConfigurationWizard.MotionPlannerPanel.InterpolationRetimingLabel.toolTipText=<html>\r\nDie Interpolation kann die echten Bewegungsprofile 3. Ordnung nur annähern,<br/>\r\neinige Abweichungen sind zu erwarten. Die Neu-Zeitgebung streckt die Bewegung,<br/>\r\num der ursprünglichen Zeitgebung 3. Ordnung zu entsprechen. Das verringert jedoch geringfügig<br/>\r\ndie Spitzen-Vorschubgeschwindigkeit. Wenn Sie dies abschalten, erhalten Sie die geplante Spitzengeschwindigkeit, aber eine etwas kürzere<br/>\r\nBewegungsdauer.\r\n</html>
ReferenceAdvancedMotionPlannerConfigurationWizard.MotionPlannerPanel.MinimumSpeedLabel.text=Mindestgeschwindigkeit
ReferenceAdvancedMotionPlannerConfigurationWizard.MotionPlannerPanel.MinimumSpeedLabel.toolTipText=<html>\r\n<p>\r\nMinimale Geschwindigkeit, die von der Bewegungsplanung unterstützt wird.\r\n</p><p>\r\nÜbermäßig niedrige Mindestgeschwindigkeiten führen zu einer übermäßig hohen erforderlichen Genauigkeit bei<br/>\r\nVorschubgeschwindigkeiten, Beschleunigungen (und Ruck). Wenn die Mindestgeschwindigkeiten über<br/>\r\nvernünftigen Werten gehalten werden (z. B. 5%), können einige Berechnungen (etwa die Interpolation)<br/>\r\noptimiert werden.<br/>\r\n</p><p>\r\nBei Treibern, die über ein Textprotokoll kommunizieren (GcodeDriver), sind weniger Dezimalstellen<br/>\r\nerforderlich, was die Befehlslatenz senkt.<br/>\r\n</p>\r\n</html>
