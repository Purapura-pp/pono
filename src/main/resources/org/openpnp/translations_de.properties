ReferencePushPullFeederConfigurationWizard.lblUsedAsTemplate.text=Diesen als Vorlage verwenden?
ReferencePushPullFeederConfigurationWizard.lblUsedAsTemplate.toolTipText=<html>Diesen Feeder als Vorlage verwenden, um Einstellungen auf andere Feeder zu klonen. <br/>\r\nDie Vorlagen werden anhand der Gurtspezifikation oder des Gehäuses der in den Feedern <br/>\r\ngeladenen Bauteile zugeordnet. <br/>\r\nWenn formal keine Vorlage passt, wird der Feeder \nmit den größten Ähnlichkeiten <br/>\r\nherangezogen (Vorschubschritt, Gurtbreite, Nähe usw.).</html>
ReferencePushPullFeederConfigurationWizard.lblVisionType.text=Art der Bildverarbeitung
ReferencePushPullFeederConfigurationWizard.lblVisionType.toolTipText=<html>\r\n<p>Wählen Sie den Bildverarbeitungstyp und drücken Sie dann <strong>Pipeline zurücksetzen</strong>, um die<br/>\r\nStandard-Pipeline dieses Typs zuzuweisen. Transportlöcher werden folgendermaßen erkannt\:</p>\r\n<ul>\r\n<li><strong>ColorKeyed</strong>\: Der Hintergrund unter den Löchern muss eine kräftige Farbe haben<br/>\r\n(standardmäßig grün).</li>\r\n<li><strong>CircularSymmetry</strong>\: Die Form der Löcher muss kreisförmig sein, ihr<br/>\r\nInneres/Äußeres muss einfarbig sein.</li>\r\n</ul>\r\n<p>Beide Pipeline-Typen bewerten erkannte Löcher zusätzlich nach Größe, Ausrichtung, Teilung<br/>\r\nund erwarteter Entfernung.</p>\r\n</html>
