ReferenceNozzleTipToolChangerWizard.ChangerPanel.FirstLocationLabel.toolTipText=<html>Erste Position in einer Bewegungssequenz zum Laden der Düsenspitze.<br/>\nDies ist der erste Wegpunkt beim Laden der Düsenspitze und der<br/>\nletzte Wegpunkt beim Entladen.\n</html>
