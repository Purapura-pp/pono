BoardsPanel.BoardPlacements.Importer.OptionsBox.Question=<Html><body style\='width\: 400'><p>Was möchten Sie tun?</p><p> </p><p>Wählen Sie <b>Zusammenführen</b>, um die vorhandenen Bestückungspositionen zu aktualisieren, deren IDs mit denen im importierten Satz übereinstimmen, vorhandene Bestückungspositionen unverändert zu lassen, deren IDs mit keiner im importierten Satz übereinstimmen, und die importierten Bestückungspositionen hinzuzufügen, deren IDs mit keiner der vorhandenen übereinstimmen.</p><p> </p><p>Wählen Sie <b>Ersetzen</b>, um alle vorhandenen Bestückungspositionen zu löschen und dann alle importierten hinzuzufügen.</p></html>
