ReferenceNozzleTipToolChangerWizard.ChangerPanel.ZCalibrateLabel.text=Automatische Z-Kalibrierung
ReferenceNozzleTipToolChangerWizard.ChangerPanel.ZCalibrateLabel.toolTipText=<html>\nDas Z der Saugdüse/Düsenspitze durch Antasten an der Fläche der <strong>Berührposition</strong> kalibrieren.<br/>\nDie Z-Kalibrierung kann manuell mit der Schaltfläche <strong>Jetzt kalibrieren</strong> ausgelöst werden oder automatisch\:<br/>\n<ul>\n<li><strong>Manual\:</strong> Es wird keine automatische Z-Kalibrierung durchgeführt. Die manuelle Kalibrierung wird dauerhaft<br/>\nin der Konfiguration gespeichert und bleibt über die Referenzfahrt der Maschine hinaus gültig.</li>\n<li><strong>MachineHome\:</strong> Die automatische Z-Kalibrierung wird bei der Referenzfahrt der Maschine durchgeführt.<br/>\nDie Z-Kalibrierung der Saugdüse wird weiterverwendet, wenn eine andere Düsenspitze geladen wird.</li>\n<li><strong>NozzleTipChange\:</strong> Die automatische Z-Kalibrierung wird immer dann durchgeführt, wenn diese Düsenspitze<br/>\ngewechselt wird oder wenn die Maschine referenziert wird und diese Düsenspitze gerade geladen ist.</li>\n</ul>\nBeachten Sie\: Sie können eine Platzhalter-Düsenspitze mit dem Namen "unloaded" verwenden, um die Z-Kalibrierung der nackten Saugdüse durchzuführen. \n</html>
ReferenceNozzleTipToolChangerWizard.CloningSettingsPanel.BehaviorLabel.text=Verhalten
ReferenceNozzleTipToolChangerWizard.CloningSettingsPanel.BehaviorLabel.toolTipText=<html>\nEine Düsenspitze kann zur <strong>Vorlage</strong> werden, von der andere geklont werden.<br/>\nPono verschiebt Positionen automatisch relativ zur ersten Position.<br/>\nWenn einzelne Düsenspitzen besonders sind, markieren Sie sie als <strong>Gesperrt</strong>, um das Klonen zu verhindern.\n</html>
