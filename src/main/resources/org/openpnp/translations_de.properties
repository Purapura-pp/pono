ReferenceNozzleTipToolChangerWizard.UnnamedPanel.VisionCalibrationLabel.text=Bildverarbeitungs-Kalibrierung?
ReferenceNozzleTipToolChangerWizard.UnnamedPanel.ZCalibrationLabel.text=Z-Kalibrierung?
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.AdjustZLabel.text=Z anpassen
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.AdjustZLabel.toolTipText=<html>\nDie Z-Koordinate der Position für die Bildverarbeitung um diesen Versatz anpassen. Setzen Sie ihn auf den Z-Abstand zwischen <br/>\ndem Vorlagenobjekt, das Sie mit der Bildverarbeitungs-Kalibrierung erkennen, z. B. der sichtbaren Oberfläche des <br/>\nWechslerplatzes, und der (gedachten) Unterseite der Düsenspitze an dieser Position. Positive <br/>\nAnpassung, wenn die Düsenspitze unterhalb liegt, negative, wenn sie oberhalb dieser Fläche liegt.<br/> \nDie Einstellung kann Skalierungsfehler in der Kameraansicht ausgleichen, besonders wenn Dinge viel <br/>\nnäher an der Kamera sind als üblich.<br/>\n<strong>3D-Einheiten pro Pixel müssen an der Kamera konfiguriert sein.</strong> \n</html>
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.Border.title=Bildverarbeitungs-Kalibrierung
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.CalibrationTriggerLabel.text=Kalibrierungsauslöser
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.LastScoreLabel.text=Letzte Bewertung
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.MaxPassesLabel.text=Max. Durchläufe
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.MinScoreLabel.text=Mindestbewertung
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.MinScoreLabel.toolTipText=<html>\nWenn die Vorlagenbilder mit dem Kamerabild abgeglichen werden, wird eine Bewertung berechnet,<br/>\ndie die Qualität der Übereinstimmung angibt. Ist die erreichte Bewertung kleiner als die hier<br/>\nangegebene Mindestbewertung, schlägt die Kalibrierung fehl. Das soll die Maschine daran hindern, einen Düsenspitzenwechsel <br/>\nzu versuchen, wenn die Position falsch ist. \n</html>
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.TemplateEmptyLabel.text=Vorlage leer
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.TemplateHeightLabel.text=Vorlagenhöhe
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.TemplateHeightLabel.toolTipText=<html>\nHöhe des Vorlagenbilds (Y). Die Vorlage ist um die gewählte Position für die Bildverarbeitung zentriert.<br/>\nWählen Sie die Abmessungen so klein wie möglich, aber die Vorlagen sollten aussagekräftige waagerechte und senkrechte<br/>\nKanten enthalten. Außerdem sollte die Düsenspitze sichtbar sein, wenn sie den Wechslerplatz belegt.\n</html>
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.TemplateOccupiedLabel.text=Vorlage belegt
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.TemplateWidthLabel.text=Vorlagenbreite
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.TemplateWidthLabel.toolTipText=<html>\nBreite des Vorlagenbilds (X). Die Vorlage ist um die gewählte Position für die Bildverarbeitung zentriert.<br/>\nWählen Sie die Abmessungen so klein wie möglich, aber die Vorlagen sollten aussagekräftige waagerechte und senkrechte<br/>\nKanten enthalten. Außerdem sollte die Düsenspitze sichtbar sein, wenn sie den Wechslerplatz belegt.\n</html>
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.ToleranceLabel.text=Toleranz
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.ToleranceLabel.toolTipText=Maximale Kalibriertoleranz, d. h. wie weit die kalibrierte Position von der Nennposition abweichen darf.
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.VisionCalibrationHelpLabel.text=<html>\nErfassen Sie zwei Vorlagenbilder Ihres Düsenspitzenwechsler-Platzes,<br/>\njeweils im leeren und im belegten Zustand.<br/>\nMithilfe der Vorlagen kalibriert die Bildverarbeitungs-Kalibrierung dann die<br/>\nWechslerpositionen in X/Y und stellt außerdem sicher, dass der Platz wie erwartet<br/>\nleer oder belegt ist.\n</html>
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.VisionLocationLabel.text=Position für die Bildverarbeitung
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.VisionLocationLabel.toolTipText=<html>Position für die Bildverarbeitungs-Kalibrierung, oder None für keine Kalibrierung.<br/>\nWählen Sie eine Position, an der die Düsenspitze im Platz sichtbar ist. \n</html>
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.WantedPrecisionLabel.text=Gewünschte Genauigkeit
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.WantedPrecisionLabel.toolTipText=<html>Wenn die erkannte Vorlagenbild-Übereinstimmung weiter entfernt liegt als die <strong>Gewünschte Genauigkeit</strong>,<br/>\nwird die Kamera neu zentriert und ein weiterer Bildverarbeitungsdurchlauf ausgeführt.</html>
ReferenceNozzleToolChangerWizard.ChangerPanel.Border.title=Düsenspitzenwechsler
ReferenceNozzleToolChangerWizard.ChangerPanel.ChangeOnManualLabel.text=Bei manuellem Aufnehmen wechseln?
ReferenceNozzleToolChangerWizard.ChangerPanel.ChangerEnabledLabel.text=Automatischen Werkzeugwechsler aktivieren?
ReferenceNozzleToolChangerWizard.ChangerPanel.ManualChangeLocationLabel.text=Position für den manuellen Wechsel
