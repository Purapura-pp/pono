ReferenceNozzleVacuumWizard.ContentPanel.VacuumActuatorLabel.text=Vakuum-Aktuator
ReferencePnpJobProcessorConfigurationWizard.lblOptimizeMultipleNozzles.text=Mehrere Saugdüsen optimieren
ReferencePnpJobProcessorConfigurationWizard.lblOptimizeMultipleNozzles.toolTipText=Optimiert bei Maschinen mit mehreren Saugdüsen den Weg der Schritte Aufnehmen, Ausrichten und Bestücken, indem die Reihenfolge der bearbeiteten Saugdüsen geändert wird.
ReferencePnpJobProcessorConfigurationWizard.lblPreRotateAllNozzles.text=Alle Saugdüsen vorab drehen
ReferencePnpJobProcessorConfigurationWizard.lblPreRotateAllNozzles.toolTipText=<html>Alle Saugdüsen bereits bei der Fahrt zur ersten Vorschub- oder Aufnahmeposition, zur unteren Kamera und zur ersten Bestückungsposition vordrehen.<br/>Unter der Annahme, dass diese Fahrten länger dauern als das Bewegen der nächsten Saugdüse zu ihrer Aufnahmeposition, zur unteren Kamera<br/>oder zur Bestückungsposition, kann dies die Leistung steigern und verringert das Risiko, dass Bauteile auf ihren Düsenspitzen verrutschen.</html>
ReferencePnpJobProcessorConfigurationWizard.lblStepsMotion.text=Nächste Bewegung schrittweise
ReferencePnpJobProcessorConfigurationWizard.lblStepsMotion.toolTipText=Die Schrittausführung hält nur beim nächsten Schritt mit Bewegung an
