BacklashCompensationConfigurationWizard.Action.Calibrate.Description=<html>\r\n<p>Die Einstellungen der Umkehrspiel-Kompensation der Achse mithilfe der Kalibrier-Passermarke kalibrieren.</p>\r\n<p>Stellen Sie sicher, dass die Kalibriervorrichtung eingerichtet und vorhanden ist.</p><p>Erwägen Sie, diese Funktion aus Probleme & Lösungen aufzurufen, dort erhalten Sie eine Schritt-für-Schritt-Anleitung<br/>\r\nfür die nötigen Vorbereitungen und die Kalibrierung in der richtigen Reihenfolge. Außerdem erhalten Sie ausführliche Wiki-Links.</p>\r\n</html>
BacklashCompensationConfigurationWizard.BacklashDiagnosticsPanel.BacklashOffsetLabel.text=Umkehrspiel-Versatz
BacklashCompensationConfigurationWizard.BacklashDiagnosticsPanel.Border.title=Umkehrspielkompensation und Kalibrierung
BacklashCompensationConfigurationWizard.BacklashDiagnosticsPanel.CompensationMethodLabel.text=Kompensationsverfahren
BacklashCompensationConfigurationWizard.BacklashDiagnosticsPanel.CompensationMethodLabel.toolTipText=<html>\n<p>Die Umkehrspiel-Kompensation dient dazu, die Auswirkungen von Lockerheit oder Spiel in den <br/>\nmechanischen Verbindungen der jeweiligen Achse zu vermeiden. Wenn der Antrieb die Fahrtrichtung umkehrt, <br/>\ngibt es oft einen Moment, in dem nichts geschieht, weil der Durchhang eines Riemens oder das Spiel <br/>\neiner Schraube, eines Zahnstangenantriebs usw. überbrückt werden muss, bevor wieder mechanische Kraft <br/>\nübertragen werden kann.</p>\n\n<ul>\n<li>\n<strong>None\:</strong>\nEs wird keine Umkehrspiel-Kompensation durchgeführt. </li>\n<li>\n<strong>OneSidedPositioning\:</strong><br/>\nDie Kompensation erfolgt, indem die Endposition immer von einer Seite angefahren wird.<br/>\nDer Umkehrspiel-Versatz muss nicht sehr genau sein, d. h. er kann größer als das tatsächliche<br/> \nUmkehrspiel sein, und die Maschine erreicht dennoch die korrekte, genaue Position.<br/>\nDie Maschine muss immer eine zusätzliche Bewegung ausführen, und sie erzwingt einen vollständigen<br/>\n Stillstand zwischen den Bewegungsabschnitten.</li>\n<li>\n<strong>OneSidedOptimizedPositioning\:</strong><br/>\nFunktioniert wie OneSidedPositioning, führt die zusätzliche Bewegung aber nur aus, wenn <br/>\nvon der falschen Seite angefahren wird. Es ist nur die Hälfte der Zusatzbewegungen nötig.</li>\n<li>\n<strong>DirectionalCompensation (experimentell\!)\:</strong><br/>\nDie Kompensation wird in Fahrtrichtung angewendet. Der Versatz wird zur <br/>\ntatsächlichen Zielkoordinate addiert, wenn in Richtung des Versatzes gefahren wird (der positiv <br/>\noder negativ sein kann); wird gegen den Versatz gefahren, wird kein Versatz addiert.<br/>\nEs sind keine Zusatzbewegungen nötig. Die Maschine kann außerdem flüssiger fahren, da kein <br/>\nRichtungswechsel erforderlich ist.<br/>\nAllerdings\: Der Versatz muss genau dem physischen Umkehrspiel entsprechen.</li>\n</ul>\n</html>
BacklashCompensationConfigurationWizard.BacklashDiagnosticsPanel.DistanceTestLabel.text=<html>\n<body style\="text-align\:right">\n<p>\nUmkehrspiel <span style\="color\:\#005BD9">&mdash;&mdash;</span>\n</p>\n<p>\nHüllkurve <span style\="color\:\#000077">&mdash;&mdash;</span>\n</p>\n<p>\nÜberschwingen <span style\="color\:\#FF0000">&mdash;&mdash;</span>\n</p>\n<p>\nZufällig <span style\="color\:\#BB7700">&mdash;&mdash;</span>\n</p>\n<br/>\n<p>\nBewegungszeit <span style\="color\:\#00AA00">&mdash;&mdash;</span>\n</p>\n<br/>\n<br/>\n<p>\nvorwärts/ <span style\="color\:\#777777">rückwärts</span><br/>\nbei Bewegungsdistanz.\n<p/>\n</body>\n</html>
