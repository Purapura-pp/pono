ReferenceStripFeederConfigurationWizard.RotationInTapeLabel.text=Drehung im Gurt
ReferenceStripFeederConfigurationWizard.RotationInTapeLabel.toolTipText=<html>\n<p>Die Einstellung <strong>Drehung im Gurt</strong> ist relativ zur Ausrichtung des Gurts zu verstehen, <br/>\nunabhängig davon, wie Feeder bzw. Gurt auf der Maschine ausgerichtet sind. </p>\n<ol>\n<li>\n<p>Betrachten Sie die <strong>neutrale</strong> aufrechte Ausrichtung des Bauteilgehäuses/Footprints <br/>\nso, wie sie in Ihrer E-CAD-<strong>Bibliothek</strong> gezeichnet ist.</p>\n</li>\n<li>\n<p>Beachten Sie, wie Pin 1, Polarität, Kathode usw. ausgerichtet sind.  <br/>\nDas ist Ihre 0°-Lage für das Bauteil.</p>\n</li>\n<li>\n<p>Betrachten Sie den Gurt so, dass die Transportlöcher oben sind. <br/>\nDas ist Ihre 0°-Gurtausrichtung (gemäß Industrienorm EIA-481).</p>\n</li>\n<li>\n<p>Ermitteln Sie, wie das Bauteil in der Gurttasche gedreht ist, <em>relativ</em> zu  <br/>\nseiner aufrechten Ausrichtung aus (1).  Positive Drehung erfolgt gegen den Uhrzeigersinn.<br/>\nDas ist Ihre <strong>Drehung im Gurt</strong>.</p>\n</li>\n</ol>\n</html>
