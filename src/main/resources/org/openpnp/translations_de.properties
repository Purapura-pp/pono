GcodeDriverSettings.SettingsPanel.MaxFeedRate.toolTipText=<html><p>Maximale Vorschubgeschwindigkeit der Werkzeugbahn in Treibereinheiten pro Minute. </p>\n<p>Auf 0 setzen, um sie zu deaktivieren und nur die Vorschubgrenzen der Achsen zu verwenden. Diagonale Bewegungen sind dann schneller. </p>\n</html>
GcodeDriverSettings.SettingsPanel.MotionControlTypeLabel.text=Art der Bewegungssteuerung
GcodeDriverSettings.SettingsPanel.MotionControlTypeLabel.toolTipText=<html>\n<p>Bestimmt, wie der MotionPlanner von Pono die Bewegung plant und wie er mit <br/>\ndem Controller kommuniziert\:</p>\n<ul>\n\n<li><strong>ToolpathFeedRate\:</strong><br/>\nWendet die nominale Vorschubgrenze des Treibers multipliziert mit dem Geschwindigkeitsfaktor auf die Werkzeugbahn an.<br/>\nDie Vorschubgeschwindigkeit des Treibers muss angegeben werden. Es erfolgt keine Beschleunigungsregelung.</li>\n\n<li><strong>EuclideanAxisLimits\:</strong><br/>\nWendet Achsgrenzen für Vorschub, Beschleunigung und Ruck multipliziert mit den passenden Geschwindigkeitsfaktoren an. <br/>\nDie euklidische Metrik wird berechnet, damit die Maschine diagonal schneller fahren kann.<br/>\nPono legt nur das Maximum des Geschwindigkeitsfaktors fest, das Hoch- und Herunterfahren der Geschwindigkeit <br/>\nbleibt vollständig dem Controller überlassen. </li>  \n\n<li><strong>ConstantAcceleration\:</strong><br/>\nPlant die Bewegung unter der Annahme eines Controllers mit konstanter Beschleunigungsregelung. </li>\n\n<li><strong>ModeratedConstantAcceleration\:</strong><br/>\nPlant die Bewegung unter der Annahme eines Controllers mit konstanter Beschleunigungsregelung, moderiert aber<br/>\nBeschleunigung und Geschwindigkeit so, dass sie denen einer Regelung 3. Ordnung ähneln, was zu<br/>\neiner Bewegung führt, die genauso lange dauert und eine ähnliche mittlere Beschleunigung hat. <br/>\nDas verringert Vibrationen bereits etwas.</li>\n\n<li><strong>SimpleSCurve\:</strong><br/>\nPlant die Bewegung unter der Annahme eines Controllers mit vereinfachter S-Kurven-Regelung. <br/>\nVereinfachte S-Kurven haben keine Phase konstanter Beschleunigung, nur Ruckphasen (z. B. TinyG, Marlin).</li>\n\n<li><strong>Simulated3rdOrderControl\:</strong><br/>\nPlant die Bewegung unter der Annahme eines Controllers mit konstanter Beschleunigungsregelung, simuliert aber<br/>\neine Regelung 3. Ordnung mittels Zeitschritt-Interpolation. </li> \n\n<li><strong>Full3rdOrderControl\:</strong><br/>\nPlant die Bewegung unter der Annahme eines Controllers mit vollständiger Regelung 3. Ordnung.</li> \n\n</ul></html>
GcodeDriverSettings.SettingsPanel.RemoveCommentsLabel.text=Kommentare entfernen?
GcodeDriverSettings.SettingsPanel.RemoveCommentsLabel.toolTipText=<html>\n<p>Entfernt Kommentare aus dem G-Code, um die Übertragung <br/>\nan den Controller zu beschleunigen.</p>\n<p>Hinweis\: Das funktioniert nur mit G-Code-Syntax.</p>\n<p>Beispiel\:</p>\n<p><code style\="background-color\:\#DDDDDD">G1 <span style\="color\:\#007700">(move to)</span> X100 Y20 <span style\="color\:\#007700">; move to the given X, Y</span><br/></code></p>\n<p>wird gesendet als\:</p>\n<p><code style\="background-color\:\#DDDDDD">G1 X100 Y20 </code></p>\n</html>
