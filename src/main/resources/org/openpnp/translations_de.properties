ReferenceCameraCalibrationWizard.CameraCalibrationPanel.MovableDefaultZTextFiled.toolTipText=<html><p width\="500">Dies ist die angenommene Z-Koordinate von Objekten, die die Kamera betrachtet, wenn ihre wahre Z-Koordinate unbekannt ist. Typischerweise wird sie auf die Z-Koordinate der Arbeitsfläche der zu bestückenden Leiterplatte(n) gesetzt.</p></html>
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.MovablePrimCalZTextField.toolTipText=<html><p width\="500">Dies ist die Z-Koordinate der primären Kalibrier-Passermarke.</p></html>
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.MovableSecondaryCalZTextField.toolTipText=<html><p width\="500">Dies ist die Z-Koordinate der sekundären Kalibrier-Passermarke.</p></html>
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.NotMovableDefaultZTextFiled.toolTipText=<html><p width\="500">Dies ist die Z-Koordinate, auf die die Unterseite der von der Saugdüse getragenen Bauteile zur visuellen Ausrichtung abgesenkt wird.</p></html>
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.NotMovablePrimCalZTextField.toolTipText=<html><p width\="500">Dies ist die Z-Koordinate, bei der Objekte für diese Kamera am besten scharf abgebildet werden.</p></html>
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.NotMovableSecondaryCalZTextField.toolTipText=<html><p width\="500">Diesen Wert so weit wie möglich größer (höher) als das primäre Kalibrier-Z setzen, jedoch so, dass die Düsenspitze noch einigermaßen scharf abgebildet wird.</p></html>
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.NumberOfRadialLinesTextField.toolTipText=<html><p width\="500">Dies ist die gewünschte Anzahl der radialen Linien, entlang derer bei jeder Kalibrier-Z-Koordinate Kalibrierpunkte erfasst werden. Die tatsächliche Anzahl wird auf das nächste Vielfache von 4 aufgerundet. Eine Verringerung dieser Zahl verkürzt die Erfassungszeit, kann aber zu geringerer Qualität oder gar zu einer fehlgeschlagenen Kalibrierung führen. Eine Erhöhung kann eine höhere Kalibrierqualität ergeben, die Erfassung dauert dann jedoch länger.</p></html>
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.PhysicalFieldOfViewLabel.text=Physisches Sichtfeld [Grad]
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.PrimaryCalibrationZLabel.text=Primäres Kalibrier-Z
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.RadialLinesPerCalZLabel.text=Radiale Linien je Kalibrier-Z
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.ResidualError.text=Restfehler
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.ResidualErrorMapDescriptionLabel.text=<html><p width\="500">Dieses Diagramm zeigt die Größe des verbleibenden Positionsfehlers als Funktion der erwarteten Position des Pixels im Bild. Dunkelblaue Bereiche haben sehr geringe Fehler, dunkelrote Bereiche die größten Fehler. Beachten Sie, dass der Farbbereich immer so skaliert wird, dass der Fehler Null dem dunkelsten Blau und der maximale Fehler dem dunkelsten Rot entspricht. Daher kann dieses Diagramm nicht zur Beurteilung der Fehlergröße, sondern nur zur Beurteilung ihrer Verteilung über das Bild verwendet werden. Diese Verteilung sollte mehr oder weniger zufällig ohne erkennbare Muster aussehen. Wenn Muster wie Ringe oder Streifen deutlich sichtbar sind und die in den anderen Diagrammen beobachteten Restfehler groß sind, passt das mathematische Modell der Kamera nicht gut zur Physik der Kamera; das kann darauf hindeuten, dass mit der Kamera und/oder dem Objektiv etwas nicht stimmt.</p></html>
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.ResidualErrorMapLabel.text=Karte der Restfehler
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.ResidualErrorXYScatterPlotLabel.text=X-Y-Streudiagramm der Restfehler
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.ResidualErrorsInCollectionOrderLabel.text=Restfehler in Erfassungsreihenfolge
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.ResidualErrorsLegendDescriptionLabel.text=<html><p width\="500">Dieses Diagramm zeigt den verbleibenden Positionsfehler (also den nach Anwendung der Kalibrierung übrigen Fehler) jedes Kalibrierpunkts in der Reihenfolge seiner Erfassung. Die Restfehler sollten den Mittelwert Null haben und wie zufälliges Rauschen erscheinen. Wenn es deutliche Sprünge im Mittelwert oder Trends in den Fehlern gibt, kann je nach ihrer Größe ein Problem mit der Kalibrierung vorliegen. Mögliche Ursachen sind\: Bewegung/Verrutschen der Kalibriervorrichtung während der Erfassung; Kamera oder Objektiv, die sich in ihrer Halterung bewegen; Motoren, die Schritte verlieren; Riemen-/Zahnradschlupf; Wärmedehnung/-schrumpfung; usw.</p>%s</html>
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.ResidualErrorsXYDescriptionLabel.text=<html><p width\="500">Dieses Diagramm zeigt den verbleibenden Positionsfehler jedes während der Kalibrierung erfassten Punkts. Der grüne Kreis markiert die ungefähre Grenze, ab der Punkte als Ausreißer gelten und nicht zur Bestimmung der Kamerakalibrierparameter verwendet werden. Die Restfehler sollten eine einzige kreisförmige Punktwolke um (0, 0) bilden und zufällig verteilt erscheinen. Wenn zwei oder mehr getrennte Punktwolken vorhanden sind oder die Punktwolke deutlich nicht kreisförmig ist, kann je nach Größe der Fehler ein Problem mit der Kalibrierung vorliegen. Mögliche Ursachen sind\: schlechte Bilderkennung der Kalibrier-Passermarke, Bewegung/Verrutschen der Kalibriervorrichtung während der Erfassung; Kamera oder Objektiv, die sich in ihrer Halterung bewegen; zu geringe oder zu starke Umkehrspiel-Kompensation; Motoren, die Schritte verlieren; Riemen-/Zahnradschlupf; usw.</p></html>
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.RmsErrorTextField.toolTipText=<html><p width\="500">Dies ist eine Schätzung der Genauigkeit von Objektpositionen, die bei Standard-Z mit dieser Kamera gemessen werden können. Bei einer großen Anzahl von Messungen an zufälligen Positionen über das gesamte Bild ist zu erwarten, dass 63% der gemessenen Positionen innerhalb dieses Abstands von ihrer wahren Position liegen und 98% innerhalb des doppelten Abstands. Weitere Einzelheiten finden Sie in den Diagrammen unten.</p></html>
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.SecondaryCalibrationZLabel.text=Sekundäres Kalibrier-Z
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.SelectedCalZForPlottingLabel.text=Ausgewähltes Kalibrier-Z für die Darstellung
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.SetZeroForNoCropped1Label.text=(Null bedeutet kein Zuschnitt)
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.SetZeroForNoCropped2Label.text=(Null bedeutet kein Zuschnitt)
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.ShowOutliersChkBox.text=Ausreißer anzeigen
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.ShowValidPixelsLabel.text=Alle gültigen Pixel anzeigen
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.SliderLabel.text=<html><p width\="500">Der Schieberegler unten steuert, wie die Bildränder behandelt werden. Ein Wert von 0 schneidet alle ungültigen Pixel am Bildrand ab, riskiert aber, dass einige gültige Pixel am Bildrand verloren gehen. Ein Wert von 100 erzwingt, dass alle gültigen Pixel im Bild sichtbar sind, riskiert aber, dass einige ungültige (meist schwarze) Pixel an den Bildrändern sichtbar sind. Für die beste Bildverarbeitung wird empfohlen, nach Abschluss der Kalibrierung alle ungültigen Pixel abzuschneiden (Schieberegler auf Null).</p></html>
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.StartCameraCalibrationButton.text=Kalibrierung starten
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.UnitsPerPixelLabel.text=Units Per Pixel
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.UnitsPerPixelTextField.toolTipText=<html><p width\="500">Dies ist der berechnete Wert für Einheiten pro Pixel beim Standard-Z dieser Kamera. Beachten Sie, dass der Wert für Einheiten pro Pixel in X- und Y-Richtung gleich ist.</p></html>
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.UseSavedDateChkBox.text=Neue Erfassung überspringen und vorherige Erfassung erneut verarbeiten
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.UseSavedDateChkBox.toolTipText=Aktivieren, um die Erfassung neuer Kalibrierdaten zu überspringen und nur zuvor erfasste Kalibrierdaten neu zu verarbeiten - nur zum Debuggen des Codes nützlich
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.WidthLabel.text=Breite
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.XAxisLabel.text=X-Achse
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.XRotationErrorTextField.toolTipText=<html><p width\="500">Der geschätzte Montagefehler der Kamera nach der Rechte-Hand-Regel um die X-Achse der Maschine. Wenn das Fadenkreuz der Kamera zu weit (nach oben oder unten) von der Bildmitte versetzt erscheint, korrigieren Sie diesen mechanischen Montagefehler und kalibrieren Sie die Kamera erneut. Beachten Sie, dass dieser Fehler die Genauigkeit der Maschine nicht beeinträchtigt, sondern nur die maximale Größe der Objekte verringert, die auf dem Fadenkreuz zentriert und dennoch vollständig im Bild sichtbar sein können.</p></html>
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.YAxisLabel.text=Y-Achse
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.YRotationErrorTextField.toolTipText=<html><p width\="500">Der geschätzte Montagefehler der Kamera nach der Rechte-Hand-Regel um die Y-Achse der Maschine. Wenn das Fadenkreuz der Kamera zu weit (nach links oder rechts) von der Bildmitte versetzt erscheint, korrigieren Sie diesen mechanischen Montagefehler und kalibrieren Sie die Kamera erneut. Beachten Sie, dass dieser Fehler die Genauigkeit der Maschine nicht beeinträchtigt, sondern nur die maximale Größe der Objekte verringert, die auf dem Fadenkreuz zentriert und dennoch vollständig im Bild sichtbar sein können.</p></html>
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.ZAxisLabel.text=Z-Achse
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.ZRotationErrorTextField.toolTipText=<html><p width\="500">Der geschätzte Montagefehler der Kamera nach der Rechte-Hand-Regel um die Z-Achse der Maschine. Wenn das Kamerabild zu stark verdreht erscheint, korrigieren Sie diesen mechanischen Montagefehler und kalibrieren Sie die Kamera erneut. Beachten Sie, dass dieser Fehler die Genauigkeit der Maschine nicht beeinträchtigt, sondern hauptsächlich ästhetischer Natur ist.</p></html>
