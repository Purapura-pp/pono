BambooFeederAutoVisionConfigurationWizard.lblVisionType.toolTipText=<html>\r\n<p>Die Art der Bildverarbeitung wählen und dann <strong>Pipeline zurücksetzen</strong> drücken, um die<br/>\r\nStandard-Pipeline dieser Art zuzuweisen. Transportlöcher werden wie folgt erkannt\:</p>\r\n<ul>\r\n<li><strong>ColorKeyed</strong>\: Der Hintergrund unter den Löchern muss eine kräftige Farbe haben<br/>\r\n(standardmäßig grün).</li>\r\n<li><strong>CircularSymmetry</strong>\: Die Form der Löcher muss kreisförmig sein, ihr<br/>\r\nInneres/Äußeres muss einfarbig sein.</li>\r\n</ul>\r\n<p>Beide Pipeline-Arten bewerten erkannte Löcher zusätzlich nach Größe, Ausrichtung, Teilung<br/>\r\nund erwartetem Abstand.</p>\r\n</html>
