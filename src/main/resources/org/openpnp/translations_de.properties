GcodeAsyncDriverSettings.InterpolationPanel.MaximumNumberofJerkStepsLabel.text=Maximale Anzahl Ruckschritte
GcodeAsyncDriverSettings.InterpolationPanel.MaximumNumberofJerkStepsLabel.toolTipText=<html>\r\nMaximale Anzahl der Interpolationsschritte zur Simulation der Ruckregelung.<br/>\r\nDas bedeutet, dass die Beschleunigung in so vielen Schritten hoch- oder heruntergefahren wird, <br/>\r\nbezogen auf die maximale Beschleunigung.\r\n</html>
GcodeAsyncDriverSettings.InterpolationPanel.MaximumNumberofStepsLabel.text=Maximale Anzahl Schritte
GcodeAsyncDriverSettings.InterpolationPanel.MaximumNumberofStepsLabel.toolTipText=<html>\r\nMaximale Anzahl der Schritte, die für die Interpolation einer Bewegung verwendet werden können.<br>\r\nVerwenden Sie einen Teil der maximalen Warteschlangentiefe Ihres Controllers. <br/>\r\nWird die Anzahl überschritten, greift die Bewegungsplanung auf eine einzelne moderierte Bewegung zurück. \r\n</html>
GcodeAsyncDriverSettings.InterpolationPanel.MinimumAxisResolutionTicksLabel.text=Minimale Achsauflösung in Ticks
GcodeAsyncDriverSettings.InterpolationPanel.MinimumAxisResolutionTicksLabel.toolTipText=<html>\r\n<p>Minimale Achsschrittweite, die zur Interpolation erweiterter Bewegungsbahnen verwendet wird.</p>\r\n<p>Sie wird in Auflösungsschritten der Achsen angegeben.</p>\r\n</html>
GcodeAsyncDriverSettings.InterpolationPanel.MinimumStepTimeLabel.text=Minimale Schrittzeit [s]
GcodeAsyncDriverSettings.InterpolationPanel.MinimumStepTimeLabel.toolTipText=<html>\r\n<p>Der minimale Zeitschritt, der zur Interpolation erweiterter Bewegungsbahnen verwendet wird. Angabe in Sekunden.</p>\r\n</html>
GcodeAsyncDriverSettings.SettingsPanel.Border.title=Einstellungen
GcodeAsyncDriverSettings.SettingsPanel.ConfirmationFlowControlLabel.text=Bestätigungs-Flusssteuerung?
GcodeAsyncDriverSettings.SettingsPanel.ConfirmationFlowControlLabel.toolTipText=<html>\r\n<p>Die Kommunikation mit dem Controller wird flussgesteuert, indem auf das "ok" gewartet wird,<br/>\r\nbevor der nächste Befehl gesendet wird. </p>\r\n<p>Das ist langsamer als andere Arten der Flusssteuerung wie RTS/CTS an einer seriellen Verbindung, daher <br/>\r\nsollten Letztere bevorzugt werden.</p>\r\n</html>
GcodeAsyncDriverSettings.SettingsPanel.LocationConfirmationLabel.text=Positionsbestätigung?
GcodeAsyncDriverSettings.SettingsPanel.LocationConfirmationLabel.toolTipText=<html>Den Controller auffordern, die Position nach Abschluss einer Bewegung zu melden.<br/>\r\nHat sie sich geändert, wird die interne Position in Pono aktualisiert. Die Positionsmeldung wird <br/>\r\naußerdem zur Synchronisation von Pono verwendet, wenn die Bestätigungs-Flusssteuerung deaktiviert ist.<br/>\r\nMindestens eine der beiden Optionen muss aktiviert sein. Die Positionsbestätigung erlaubt<br/>\r\neinen weitergehenden asynchronen Betrieb. \r\n</html>
