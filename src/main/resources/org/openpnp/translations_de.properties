OpenPnpCaptureCameraConfigurationWizard.DevicePanel.CaptureFPSLabel.toolTipText=<html>\r\n<p>Der Test nimmt Bilder so schnell wie möglich auf und berechnet die erreichte mittlere Bildrate.</p>\r\n<p>Die Bilder werden aus dem Kamerapuffer kopiert und in Java-Bilder umgewandelt, <br/>\r\naber es erfolgt keine weitere Verarbeitung (keine Objektivkalibrierung, keine Transformationen usw.)</p>\r\n<p>Für möglichst genaue Ergebnisse die Vorschau-Bildrate auf 0 setzen.</p>\r\n</html>
