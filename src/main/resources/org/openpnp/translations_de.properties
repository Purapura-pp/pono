ReferenceStripFeederConfigurationWizard.PanelVision.lblParallaxAngle.toolTipText=<html>\n<p>\nWinkel des Parallaxen-Blickpunkts der Kamera relativ zum Transportloch.<br/>\nWählen Sie einen Winkel, um Reflexionen des LED-Rings auszugleichen.\n</p>\n</html> \n\n
ReferenceStripFeederConfigurationWizard.PanelVision.lblParallaxDiameter.text=Parallaxendurchmesser
ReferenceStripFeederConfigurationWizard.PanelVision.lblParallaxDiameter.toolTipText=<html>\n<p>\nWenn der <strong>Parallaxen-Durchmesser</strong> angegeben ist, führt die Transportloch-Bildverarbeitung ihre Erkennung von einem<br/>\nseitlich der erwarteten Position des Transportlochs liegenden Parallaxen-Blickpunkt der Kamera aus durch. Der Abstand<br/> von der Kamera zum Loch ist die Hälfte des Parallaxen-Durchmessers.</p>\n<p>\nDie typische Anwendung sind transparente Gurte, die bei direkter Betrachtung schwer zu erkennen sind, deren<br>\nspiegelnde Oberfläche jedoch den hellen Diffusor der Kamerabeleuchtung reflektiert.</p>\n</html>
