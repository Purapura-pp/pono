ReferenceNozzleConfigurationWizard.OffsetsPanel.AlignwithPartLabel.toolTipText=<html>\n<p>Nach der Bauteilausrichtung durch Bottom Vision den Versatz des Saugdüsen-Rotationsmodus<br/>\nan der Bauteildrehung ausrichten.</p>\n<br/>\n<p>Damit wird sichergestellt, dass die im Fadenkreuz, in der Positionsanzeige usw.<br/>\nangezeigten Saugdüsenkoordinaten der erkannten Drehung des Bauteils entsprechen.</p>\n<br/>\n<p>Nach dem Bestücken/Verwerfen des Bauteils springt die Saugdüse zur Anzeige der ursprünglichen <br/>\nAchsdrehung zurück.</p>\n</html>
