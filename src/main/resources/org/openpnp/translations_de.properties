PackageCompositingWizard.AllowInsideCornerLabel.toolTipText=<html>\n<p>Erlaubt die Einbeziehung von Ecken, die nach innen zur Mitte des Bauteils zeigen. <br/>\nDamit können Bauteile ausgerichtet werden, die immer noch zu groß sind, d. h. bei denen der <strong>Roaming-Radius</strong><br/>\nder Kamera zu klein ist. Typischerweise sind dafür große, weit auseinanderliegende Pads nötig.</p>\n<br/>\n<p>Beispiel\: SMD-Leistungsgleichrichter.</p>\n</html>
PackageCompositingWizard.Border.title=Bildzusammensetzung
