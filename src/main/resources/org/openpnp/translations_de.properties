ReferencePushPullFeederConfigurationWizard.checkBoxUsedAsTemplate.toolTipText=<html>Diesen Feeder als Vorlage verwenden, um Einstellungen auf andere Feeder zu klonen. <br/>\r\nDie Vorlagen werden anhand der Gurtspezifikation oder des Gehäuses der in den Feedern <br/>\r\ngeladenen Bauteile zugeordnet. <br/>\r\nWenn formal keine Vorlage passt, wird der Feeder \nmit den größten Ähnlichkeiten <br/>\r\nherangezogen (Vorschubschritt, Gurtbreite, Nähe usw.).</html>
