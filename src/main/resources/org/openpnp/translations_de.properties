# Terminologie der deutschen Übersetzung
#
# Grundsatz: So viel Deutsch wie möglich, so viel Englisch wie nötig. Englisch bleibt genau dort
# stehen, wo ein deutsches Wort den Bezug zum Wiki, zu Screenshots aus der Community oder zu
# einem Klassennamen in der Konfiguration kaputt machen würde. Wo ein englischer Begriff stehen
# bleibt, wird er beim ersten Auftreten in einem Dialog nach Möglichkeit in Klammern erläutert,
# z. B. "Ruck (Jerk)" oder "Bildpunktgröße (Units Per Pixel)".
#
# Festgelegte Übersetzungen:
#   board          Leiterplatte        job             Auftrag
#   part           Bauteil             package         Gehäuse
#   placement      Bestückungsposition panel           Nutzen
#   nozzle         Saugdüse            nozzle tip      Düsenspitze
#   actuator       Aktuator            head            Kopf
#   axis           Achse               driver          Treiber
#   controller     Steuerung           firmware        Firmware
#   camera         Kamera              fiducial        Passermarke
#   pick           Aufnehmen           place           Bestücken
#   discard        Verwerfen           jog             Verfahren
#   jog increment  Verfahrinkrement    home / homing   Referenzfahrt, referenzieren
#   feed rate      Vorschubgeschwindigkeit             backlash    Umkehrspiel
#   settling       Beruhigung          alignment       Ausrichtung
#   offset         Versatz             rotation        Drehung
#   enabled        Aktiviert           disabled        Deaktiviert
#   toggle         Umschalten          apply           Anwenden
#   wizard         Assistent           tab             Reiter
#   pipeline       Pipeline (siehe unten)
#
# Bewusst englisch belassen (bitte nicht ohne Absprache ändern):
#   Safe Z, Camera Z   Koordinatenbegriffe, die überall in der Oberfläche und in der
#                      Dokumentation vorkommen; eine Übersetzung wäre nirgends wiederzufinden.
#   Feeder             In der deutschen SMT-Praxis der übliche Ausdruck, und er steckt in den
#                      Implementierungsnamen (BlindsFeeder, ReferenceStripFeeder).
#   Pipeline           Name eines Konfigurationsobjekts (CvPipeline), das der Anwender direkt
#                      bearbeitet; "Verarbeitungskette" fände niemand im Wiki wieder.
#   Bottom Vision      Feature-Name, so auch in Menü, Wiki und Maschinenkonfiguration.
#   Units Per Pixel    Name einer Einstellung, wird bei Bedarf als "Bildpunktgröße" glossiert.
#   G-code, Gcode      Technischer Begriff.
#   TCP                Protokollname bzw. Tool Center Point, je nach Zusammenhang.
#   Klassen- und Implementierungsnamen (GcodeDriver, ReferenceNozzle, ContactProbeNozzle, ...),
#   Eigenschaftsnamen, reguläre Ausdrücke und Befehlsbytes bleiben unverändert.
#
# Bewusst gleichlautend (i18n.py collisions meldet das; geprüft und so gewollt):
#   Gehäuse            Package und Packages; der deutsche Plural ist formgleich.
#   Position           Location und Position. "Location" heißt in der ganzen Datei "Position";
#                      eine Sonderform allein für den Kamera-Reiter würde diese Einheitlichkeit
#                      aufgeben, ohne dass ein Bedienelement falsch beschriftet wäre.
#   Verwerfen          Discard (Bauteil an der Saugdüse) und Dismiss (Lösungsvorschlag). Im
#                      Deutschen dasselbe Verb, und daran hängt die ganze Wortfamilie der
#                      Lösungsseite ("Verworfene einbeziehen?").
#   Abwurfposition     Discard Location (Maschine) und Drop Location (HeapFeeder); zwei
#                      verschiedene Assistenten, in beiden die zutreffende Bezeichnung.
#   Erkennungsdurchmesser  Detection Diameter und Vision Diameter; laut Tooltip dieselbe Größe.
#   Aussehen ändern    Menüpunkt und Titel des Dialogs, den er öffnet.
#   Bildzusammensetzung  Reiter "Vision Compositing" und der Rahmen "Compositing" darin.
#   Gewünschte Genauigkeit, Klon-Einstellungen, Lineare Transformation, Nach dem Aufnehmen,
#                      Vor dem Aufnehmen: hier sagt das Englische zweimal dasselbe mit
#                      verschiedenen Worten (Precision wanted/Wanted Precision, Clone/Cloning
#                      Settings, Linear Transform/Transformation, After/Post Pick, Before/Pre
#                      Pick). Die deutsche Zusammenführung ist Absicht.
#
# Bewusst uneinheitlich (i18n.py consistency meldet das; bitte nicht "korrigieren"):
#   Search             Als Rahmentitel "Suche", als Beschriftung und Schaltfläche "Suchen". Im
#                      selben Rahmen stehen beide: der Kasten heißt "Suche", die Schaltfläche
#                      darin "Suchen". Alle Rahmentitel dieser Datei sind Substantive.
#   Value              "Wert", außer im HSV-Farbmodell der Hintergrundkalibrierung: dort ist V
#                      der Hellwert, und "Hellwert" benennt das genauer als das englische Wort.
#
# Ablauf, Prüfungen und Stapelverarbeitung: siehe TRANSLATIONS.md und tools/i18n/README.md.

