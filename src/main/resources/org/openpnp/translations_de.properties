PlacementsHolderLocationViewer.ViewingOption.Fiducials.ToolTip=<Html><body style\='width\: 400'>Legt an jeder Passermarkenposition einen Kreis mit 1 mm Durchmesser darüber, gefüllt mit einer <span style\='background-color\: black; color\: \#E89961'><b>Kupferfarbe</span>. Ein Pluszeichen kennzeichnet die Mitte der Passermarke.</html>
