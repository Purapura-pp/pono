PackageCompositingWizard.AllowInsideCornerLabel.text=Autoriser les coins rentrants ?
PackageCompositingWizard.AllowInsideCornerLabel.toolTipText=<html>\n<p>Autorise la prise en compte des coins tournés vers l'intérieur, vers le centre du composant. <br/>\nCela permet d'aligner des composants encore trop grands, c'est-à-dire lorsque le <strong>rayon de déplacement</strong><br/>\nde la caméra est trop petit. Cela demande en général des pastilles grandes et bien espacées.</p>\n<br/>\n<p>Exemple \: redresseurs de puissance CMS.</p>\n</html>
PackageCompositingWizard.Border.title=Composition
PackageCompositingWizard.ComputeCompositing.Name=Calculer
PackageCompositingWizard.ComputeCompositing.ShortDescription=Recalculer la composition de vision.
PackageCompositingWizard.Error.text=Erreur \: 
PackageCompositingWizard.ExtraShotsLabel.text=Prises de vue supplémentaires
PackageCompositingWizard.ExtraShotsLabel.toolTipText=<html>\n<p>La composition de vision détermine l'ensemble minimal optimal de prises de vue nécessaires pour établir<br/>\nla position et l'angle du composant. Elle propose en plus des prises supplémentaires, utilisables pour <br/>\naméliorer la précision en position et en angle. </p>\n<br/>\n<p>Exemple \: un composant carré peut être déterminé par deux prises de coins diagonaux. Les deux coins<br/>\nopposés du carré sont proposés comme prises supplémentaires.</p>\n<br/>\n<p><strong>Prises de vue supplémentaires</strong> indique combien de ces prises doivent être utilisées. \n</html>
PackageCompositingWizard.MaxPickToleranceLabel.text=Tolérance de prise max.
PackageCompositingWizard.MaxPickToleranceLabel.toolTipText=<html>\n<p>Si la valeur est zéro, c'est la <strong>Tolérance de prise max.</strong> de l'embout de buse qui est utilisée.</p>\n<br/>\n<p>Si elle est non nulle, cette <strong>Tolérance de prise max.</strong> la remplace pour ce boîtier.</p>\n<br/>\n<p>Dans les deux cas, la <strong>Tolérance de prise max.</strong> doit couvrir les décalages <br/>\nlinéaires du composant pris sur la buse, les décalages aux coins <br/>\ndus aux décalages angulaires, ainsi que leurs combinaisons.</p>\n</html>
PackageCompositingWizard.MethodLabel.text=Méthode
PackageCompositingWizard.MethodLabel.toolTipText=<html>\n<p>Méthode de composition \:</p>\n<ul>\n<li><strong>None \:</strong> aucune composition n'est effectuée.</li>\n<li><strong>Restricted \:</strong> la composition n'est effectuée que lorsque <br/>\nl'empreinte est trop grande ou qu'elle est asymétrique.</li>\n<li><strong>Automatic \:</strong> la composition est toujours effectuée. Elle peut tout de même <br/>\naboutir à une solution en une seule prise si les coins sont tous convexes <br/>\net symétriques.</li>\n<li><strong>SingleCorner \:</strong> la composition est toujours effectuée. Chaque <br/>\ncoin fait l'objet d'une prise individuelle. Réduit les erreurs de parallaxe, car <br/>\nchaque coin est centré dans la caméra.</li>\n</ul>\n</html>\n\n
PackageCompositingWizard.MinAngleLeverageLabel.text=Levier angulaire min.
PackageCompositingWizard.MinAngleLeverageLabel.toolTipText=<html>\n<p>Levier minimal requis pour déduire l'information angulaire à partir de deux coins.</p>\n<br/>\n<p>Le <strong>Levier angulaire min.</strong> est exprimé <em>relativement</em> à la largeur et à la hauteur de l'empreinte<br/>\n(la plus petite des deux).</p>\n<br/>\n<p>Exemple \: avec 0.5, deux coins doivent couvrir au moins la moitié de la dimension du composant<br/>\npour fournir une information angulaire.</p>\n</html>
