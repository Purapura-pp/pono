BottomVisionSettingsConfigurationWizard.lblAllowVisionOffsets.text=Asymétrique ?
BottomVisionSettingsConfigurationWizard.lblAllowVisionOffsets.toolTipText=<html>\r\nÀ activer si le composant ou le boîtier est asymétrique par conception, c'est-à-dire si les contacts sont décalés<br/>\r\npar rapport au centre de conception du composant ou du boîtier, là où le composant est aussi pris.<br/>\r\nUne fois un composant ou un boîtier marqué comme asymétrique, des décalages de vision peuvent être saisis ou détectés<br/>\r\nafin d'être compensés par la Bottom Vision.<br/>\r\nRemarque \: cela ne doit servir que pour les asymétries <em>voulues par la conception</em>, pas pour compenser<br/>\r\ndes erreurs de pose reproductibles. Si vous constatez des erreurs de pose reproductibles,<br/>\r\nvérifiez que le boîtier E-CAD est correctement centré, refaites la calibration des décalages de caméra et de buse,<br/>\r\net/ou examinez les vérifications de repères de la carte.\r\n</html>
