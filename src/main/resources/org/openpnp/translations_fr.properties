ReferencePushPullFeederConfigurationWizard.lblPrecisionWanted.toolTipText=Précision souhaitée, c'est-à-dire le décalage tolérable de la position de prise
ReferencePushPullFeederConfigurationWizard.lblRotation.text=Rotation dans la bande
ReferencePushPullFeederConfigurationWizard.lblRotation.toolTipText=<html>Rotation du composant dans la bande, vue lorsque les perforations d'entraînement <br/>\r\nsont en haut. L'orientation du composant dans votre E-CAD sert de référence.<br/>\r\nVoir aussi \: \r\n<ul>\r\n<li>EIA-481</li>\r\n<li>Component Zero Orientations for CAD Libraries</li>\r\n</ul>\r\n</html>
ReferencePushPullFeederConfigurationWizard.lblSnapToAxis.text=Aligner sur l'axe ?
ReferencePushPullFeederConfigurationWizard.lblSnapToAxis.toolTipText=Aligner les rangées de perforations d'entraînement parallèlement à l'axe.
ReferencePushPullFeederConfigurationWizard.lblStopAfterWrong.text=Arrêter après un mauvais composant ?
ReferencePushPullFeederConfigurationWizard.lblTemplate.text=Modèle \:
ReferencePushPullFeederConfigurationWizard.lblUsedAsTemplate.text=Utiliser celui-ci comme modèle ?
ReferencePushPullFeederConfigurationWizard.lblUsedAsTemplate.toolTipText=<html>Utiliser ce distributeur comme modèle pour cloner les réglages vers d'autres distributeurs. <br/>\r\nLes modèles sont appariés d'après la spécification de bande et bobine ou le boîtier des composants <br/>\r\nchargés dans les distributeurs. <br/>\r\nQuand aucun modèle ne correspond formellement, on retient le distributeur \nprésentant le plus de similitudes <br/>\r\n(pas d'avance, largeur de bande, proximité, etc.).</html>
ReferencePushPullFeederConfigurationWizard.lblVisionType.text=Type de vision
ReferencePushPullFeederConfigurationWizard.lblVisionType.toolTipText=<html>\r\n<p>Choisissez le type de vision, puis appuyez sur <strong>Réinitialiser le pipeline</strong> pour affecter le<br/>\r\npipeline par défaut de ce type. Les perforations d'entraînement sont détectées comme suit \:</p>\r\n<ul>\r\n<li><strong>ColorKeyed</strong> \: le fond sous les perforations doit être d'une couleur vive<br/>\r\n(vert par défaut).</li>\r\n<li><strong>CircularSymmetry</strong> \: la forme des perforations doit être circulaire, leur<br/>\r\nintérieur et leur extérieur doivent être unis.</li>\r\n</ul>\r\n<p>Les deux types de pipeline évaluent ensuite les perforations détectées selon leur taille, leur alignement, leur pas<br/>\r\net la distance attendue.</p>\r\n</html>
