GcodeDriverSettings.SettingsPanel.LogGCodeLabel.text=Journaliser le G-code ?
GcodeDriverSettings.SettingsPanel.LogGCodeLabel.toolTipText=Enregistrer le Gcode généré dans un fichier distinct, dans le sous-dossier driver de .openpnp2.
GcodeDriverSettings.SettingsPanel.MaxFeedRate.text=Vitesse d'avance max. [/min]
GcodeDriverSettings.SettingsPanel.MaxFeedRate.toolTipText=<html><p>Vitesse d'avance maximale de la trajectoire outil, en unités du pilote par minute. </p>\n<p>Mettre 0 pour désactiver et n'utiliser que les limites de vitesse d'avance des axes. Les déplacements en diagonale seront alors plus rapides. </p>\n</html>
GcodeDriverSettings.SettingsPanel.MotionControlTypeLabel.text=Type de contrôle du mouvement
GcodeDriverSettings.SettingsPanel.MotionControlTypeLabel.toolTipText=<html>\n<p>Détermine la façon dont le MotionPlanner d'Pono planifie le mouvement et dialogue <br/>\navec le contrôleur \:</p>\n<ul>\n\n<li><strong>ToolpathFeedRate \:</strong><br/>\nAppliquer à la trajectoire outil la limite de vitesse d'avance nominale du pilote multipliée par le facteur de vitesse.<br/>\nLa vitesse d'avance du pilote doit être renseignée. Aucun contrôle d'accélération n'est appliqué.</li>\n\n<li><strong>EuclideanAxisLimits \:</strong><br/>\nAppliquer les limites de vitesse d'avance, d'accélération et de jerk des axes, multipliées par les facteurs de vitesse adéquats. <br/>\nLa métrique euclidienne est calculée pour permettre à la machine d'aller plus vite en diagonale.<br/>\nPono ne fixe que le facteur de vitesse maximal ; la montée et la descente en vitesse sont <br/>\nentièrement laissées au contrôleur. </li>  \n\n<li><strong>ConstantAcceleration \:</strong><br/>\nPlanifier le mouvement en supposant un contrôleur à accélération constante. </li>\n\n<li><strong>ModeratedConstantAcceleration \:</strong><br/>\nPlanifier le mouvement en supposant un contrôleur à accélération constante, mais en<br/>\nmodérant l'accélération et la vitesse pour se rapprocher d'un contrôle du 3e ordre, ce qui donne<br/>\nun mouvement de même durée et d'accélération moyenne comparable. <br/>\nCela réduit déjà un peu les vibrations.</li>\n\n<li><strong>SimpleSCurve \:</strong><br/>\nPlanifier le mouvement en supposant un contrôleur à courbes en S simplifiées. <br/>\nLes courbes en S simplifiées n'ont pas de phase d'accélération constante, seulement des phases de jerk (p. ex. TinyG, Marlin).</li>\n\n<li><strong>Simulated3rdOrderControl \:</strong><br/>\nPlanifier le mouvement en supposant un contrôleur à accélération constante, mais en<br/>\nsimulant un contrôle du 3e ordre par interpolation temporelle. </li> \n\n<li><strong>Full3rdOrderControl \:</strong><br/>\nPlanifier le mouvement en supposant un contrôleur à contrôle complet du 3e ordre.</li> \n\n</ul></html>
GcodeDriverSettings.SettingsPanel.RemoveCommentsLabel.text=Supprimer les commentaires ?
GcodeDriverSettings.SettingsPanel.RemoveCommentsLabel.toolTipText=<html>\n<p>Supprimer les commentaires du G-code afin d'accélérer les transmissions <br/>\nvers le contrôleur.</p>\n<p>Remarque \: cela ne fonctionne qu'avec la syntaxe G-code.</p>\n<p>Exemple \:</p>\n<p><code style\="background-color\:\#DDDDDD">G1 <span style\="color\:\#007700">(move to)</span> X100 Y20 <span style\="color\:\#007700">; move to the given X, Y</span><br/></code></p>\n<p>est envoyé sous la forme \:</p>\n<p><code style\="background-color\:\#DDDDDD">G1 X100 Y20 </code></p>\n</html>
