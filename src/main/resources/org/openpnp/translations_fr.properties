ReferenceNozzleTipCalibrationWizard.BackgroundCalibrationPanel.MinDetailSizeLabel.toolTipText=<html>\n<p>Indiquez la taille des plus petits détails de l'image considérés comme une<br/>\npartie significative de la forme à détecter, comme les plus petits contacts, etc.<br/>\nLes taches et artefacts plus petits, tels que le bruit d'image, les textures, les marquages ou les salissures<br/>\nsur les objets, sont jugés sans importance pour le traitement d'image, ce qui signifie que<br/>\ndes filtres peuvent être appliqués pour les atténuer dans l'image. </p> \n<p><strong>Remarque \:</strong> la <strong>Taille minimale de détail</strong> peut aussi\ninfluer sur le coût de calcul de certains<br/>\npipelines ou étapes. Les petits détails entraînent un coût de calcul élevé.</p>\n</html>
