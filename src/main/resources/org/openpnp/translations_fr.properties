ReferenceStripFeederConfigurationWizard.PanelVision.lblParallaxAngle.toolTipText=<html>\n<p>\nAngle du point de vue en parallaxe de la caméra par rapport à la perforation d'entraînement.<br/>\nChoisissez un angle permettant d'uniformiser les reflets de l'anneau de LED.\n</p>\n</html> \n\n
ReferenceStripFeederConfigurationWizard.PanelVision.lblParallaxDiameter.text=Diamètre de parallaxe
ReferenceStripFeederConfigurationWizard.PanelVision.lblParallaxDiameter.toolTipText=<html>\n<p>\nLorsqu'un <strong>diamètre de parallaxe</strong> est indiqué, la vision des perforations d'entraînement effectue sa détection depuis un<br/>\npoint de vue en parallaxe, décalé sur le côté de la position attendue de la perforation. La distance<br/> de la caméra au trou vaut la moitié du diamètre de parallaxe.</p>\n<p>\nL'application typique concerne les bandes transparentes, difficiles à voir en vision directe, mais dont la<br>\nsurface réfléchissante renvoie l'image du diffuseur lumineux de l'éclairage de la caméra.</p>\n</html>
