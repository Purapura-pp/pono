Solutions.Issue.CompleteMilestone.Choice.0=<html><h3>Passer à %s</h3><p>Confirmez que vous avez terminé et testé l'étape <strong>%s</strong> \:</p><br/><blockquote>%s</blockquote><br/><p>Remarque \: tous les problèmes de cette étape devraient être résolus ou écartés avant de continuer.</p><br/><p>Oui ? <em>Félicitations \!</em></p><br/><p>Vous pouvez passer à l'étape suivante <strong>%s</strong> \:</p><br/><blockquote>%s</blockquote><br/><p>D'autres problèmes et solutions à traiter pour atteindre l'étape suivante vous seront présentés.</p></html>
Solutions.Issue.CompleteMilestone.Choice.1=<html><h3>Revenir à %s</h3><p>Pour limiter la portée des problèmes et solutions, vous pouvez revenir à l'étape précédente <strong>%s</strong> \:</p><br/><blockquote>%s</blockquote><br/><p>Remarque \: la plupart des problèmes et solutions des étapes précédentes sont également signalés lors des étapes suivantes. Mais aux étapes visées plus précoces, certaines solutions proposées sont plus simples et plus prudentes. Pour le dépannage, il peut donc être utile de revenir en arrière et d'essayer d'y faire fonctionner les choses.</p></html>
Solutions.Issue.CompleteMilestone.Confirm=<html><p>Des problèmes de l'étape <strong>%s</strong> sont encore ouverts \:</p> %s <p color\="red">Il est déconseillé de passer à l'étape visée suivante avant de les avoir résolus ou écartés \!</p><p><br/>Voulez-vous vraiment continuer malgré tout ?</p></html>
