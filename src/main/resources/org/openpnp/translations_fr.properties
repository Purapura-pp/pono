ReferenceCameraCalibrationWizard.CameraCalibrationPanel.RadialLinesPerCalZLabel.text=Lignes radiales par Z de calibration
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.ResidualError.text=Erreur résiduelle
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.ResidualErrorMapDescriptionLabel.text=<html><p width\="500">Ce graphique affiche l'amplitude de l'erreur de position résiduelle en fonction de la position attendue du pixel dans l'image. Les zones bleu foncé présentent des erreurs très faibles, tandis que les zones rouge foncé présentent les erreurs les plus élevées.  Notez que la plage de couleurs est toujours mise à l'échelle de sorte qu'une erreur nulle corresponde au bleu le plus foncé et l'erreur d'amplitude maximale au rouge le plus foncé. Ce graphique ne permet donc pas de juger de l'amplitude de l'erreur, mais seulement de sa répartition sur l'image. Cette répartition doit paraître plus ou moins aléatoire, sans motif discernable. Si des motifs tels que des anneaux ou des rayures sont nettement visibles et que les erreurs résiduelles observées sur les autres graphiques sont importantes, le modèle mathématique de la caméra ne correspond pas bien à la physique de la caméra, ce qui peut indiquer un problème de caméra et/ou d'objectif.</p></html>
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.ResidualErrorMapLabel.text=Carte des erreurs résiduelles
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.ResidualErrorXYScatterPlotLabel.text=Nuage de points X-Y des erreurs résiduelles
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.ResidualErrorsInCollectionOrderLabel.text=Erreurs résiduelles dans l'ordre d'acquisition
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.ResidualErrorsLegendDescriptionLabel.text=<html><p width\="500">Ce graphique affiche l'erreur de position résiduelle (c'est-à-dire l'erreur restante après application de la calibration) de chaque point de calibration, dans l'ordre où il a été relevé. Les erreurs résiduelles doivent avoir une moyenne nulle et ressembler à un bruit aléatoire. En présence de marches significatives du niveau moyen ou de tendances dans les erreurs, la calibration peut poser problème selon leur amplitude. Causes possibles \: déplacement ou glissement du montage de calibration pendant la collecte ; caméra ou objectif bougeant dans son support ; moteurs perdant des pas ; glissement de courroie ou de pignon ; dilatation ou contraction thermique ; etc.</p>%s</html>
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.ResidualErrorsXYDescriptionLabel.text=<html><p width\="500">Ce graphique affiche l'erreur de position résiduelle de chaque point relevé pendant le processus de calibration. Le cercle vert marque la limite approximative au-delà de laquelle les points sont considérés comme aberrants et ne servent pas à déterminer les paramètres de calibration de la caméra. Les erreurs résiduelles doivent former un seul amas circulaire centré sur (0, 0) et paraître réparties aléatoirement. Si deux amas distincts ou plus sont présents, ou si l'amas est nettement non circulaire, la calibration peut poser problème selon l'amplitude des erreurs. Causes possibles \: mauvaise détection visuelle du repère de calibration ; déplacement ou glissement du montage de calibration pendant la collecte ; caméra ou objectif bougeant dans son support ; jeu sous-compensé ou surcompensé ; moteurs perdant des pas ; glissement de courroie ou de pignon ; etc.</p></html>
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.RmsErrorTextField.toolTipText=<html><p width\="500">Il s'agit d'une estimation de la précision des positions d'objets mesurées au Z par défaut que l'on peut obtenir avec cette caméra. Sur un grand nombre de mesures effectuées à des endroits aléatoires de l'image, on peut s'attendre à ce que 63% des positions mesurées se situent à moins de cette distance de leur position réelle, et 98% à moins du double de cette distance. Voir les graphiques ci-dessous pour plus de détails.</p></html>
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.SecondaryCalibrationZLabel.text=Z de calibration secondaire
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.SelectedCalZForPlottingLabel.text=Z de calibration sélectionné pour le tracé
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.SetZeroForNoCropped1Label.text=(Mettre à zéro pour ne pas rogner)
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.SetZeroForNoCropped2Label.text=(Mettre à zéro pour ne pas rogner)
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.ShowOutliersChkBox.text=Afficher les points aberrants
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.ShowValidPixelsLabel.text=Afficher tous les pixels valides
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.SliderLabel.text=<html><p width\="500">Le curseur ci-dessous détermine la manière dont les bords de l'image sont traités. La valeur 0 recadre tous les pixels non valides sur le bord de l'image, au risque de perdre quelques pixels valides en bordure. La valeur 100 force tous les pixels valides à être visibles dans l'image, au risque de laisser apparaître des pixels non valides (généralement noirs) sur les bords de l'image. Pour un traitement de vision par ordinateur optimal, il est recommandé de recadrer tous les pixels non valides (curseur à zéro) une fois la calibration terminée.</p></html>
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.StartCameraCalibrationButton.text=Démarrer la calibration
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.UnitsPerPixelLabel.text=Unités par pixel
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.UnitsPerPixelTextField.toolTipText=<html><p width\="500">Il s'agit des unités par pixel calculées au Z par défaut de cette caméra. Notez que les unités par pixel sont identiques dans les directions X et Y.</p></html>
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.UseSavedDateChkBox.text=Ignorer une nouvelle collecte et retraiter la collecte précédente
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.UseSavedDateChkBox.toolTipText=Activez cette option pour ne pas collecter de nouvelles données de calibration et simplement retraiter les données déjà collectées - utile uniquement pour le débogage du code
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.WidthLabel.text=Largeur
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.XAxisLabel.text=Axe X
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.XRotationErrorTextField.toolTipText=<html><p width\="500">Erreur estimée de montage de la caméra, selon la règle de la main droite autour de l'axe X de la machine. Si le réticule de la caméra paraît trop décalé (vers le haut ou vers le bas) par rapport au centre de l'image, corrigez cette erreur de montage physique et recalibrez la caméra. Notez que cette erreur n'affecte pas la précision de la machine ; elle réduit seulement la taille maximale des objets pouvant être centrés sur le réticule tout en restant entièrement visibles dans l'image.</p></html>
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.YAxisLabel.text=Axe Y
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.YRotationErrorTextField.toolTipText=<html><p width\="500">Erreur estimée de montage de la caméra, selon la règle de la main droite autour de l'axe Y de la machine. Si le réticule de la caméra paraît trop décalé (vers la gauche ou vers la droite) par rapport au centre de l'image, corrigez cette erreur de montage physique et recalibrez la caméra. Notez que cette erreur n'affecte pas la précision de la machine ; elle réduit seulement la taille maximale des objets pouvant être centrés sur le réticule tout en restant entièrement visibles dans l'image.</p></html>
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.ZAxisLabel.text=Axe Z
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.ZRotationErrorTextField.toolTipText=<html><p width\="500">Erreur estimée de montage de la caméra, selon la règle de la main droite autour de l'axe Z de la machine. Si l'image de la caméra paraît trop pivotée, corrigez cette erreur de montage physique et recalibrez la caméra. Notez que cette erreur n'affecte pas la précision de la machine ; elle est surtout esthétique.</p></html>
