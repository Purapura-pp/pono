BoardsPanel.BoardPlacements.Importer.OptionsBox.Question=<Html><body style\='width\: 400'><p>Que voulez-vous faire ?</p><p> </p><p>Choisissez <b>Fusionner</b> pour mettre à jour les placements existants dont l'ID correspond à un ID de l'ensemble importé, laisser inchangés les placements existants dont l'ID ne correspond à aucun ID importé, et ajouter les placements importés dont l'ID ne correspond à aucun placement existant.</p><p> </p><p>Choisissez <b>Remplacer</b> pour supprimer tous les placements existants puis ajouter tous les placements importés.</p></html>
