BlindsFeederArrayConfigurationWizard.lblOcrFontName.toolTipText=<html>Nom de la police OCR à reconnaître, ou [Barcode].<br/>\r\nLes polices à chasse fixe fonctionnent bien mieux, autorisent une résolution plus faible et donc un <br/>\r\nfonctionnement plus rapide. Utilisez une police dont tous les caractères employés sont facilement distinguables.<br/>\r\nLes polices présentant une séparation nette entre les glyphes sont nettement préférables.</html>
