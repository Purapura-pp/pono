ReferencePushPullFeederConfigurationWizard.CloneToAll.Confirm=<html>Cela écrasera les réglages sélectionnés dans tous les distributeurs cibles \:<br/><br/>%s<br/><br/>   Êtes-vous sûr ?</html>
ReferencePushPullFeederConfigurationWizard.btnDiscardParts.toolTipText=<html>Mettre au rebut les composants restants dans le cycle d'avance (multi-composants).<br/>\r\nRepart sur un nouveau cycle d'avance, calibration par vision comprise (si elle est activée). \r\n</html>
