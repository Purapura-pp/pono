CameraConfigurationWizard.basicCalibrationInstructions=<html><ol><li>Placez sur la table un objet de largeur et de longueur connues. Du papier millimétré est un choix simple et pratique.<li>Saisissez la largeur et la longueur de l'objet dans les champs X et Y des dimensions de l'objet.<li>Caméra supérieure \: amenez la caméra centrée au-dessus de l'objet et faites la mise au point.<li>Caméra inférieure \: posez l'objet à plat au-dessus de la caméra de façon qu'il soit net.<li>Appuyez sur Mesurer et utilisez le rectangle de sélection de la caméra pour mesurer l'objet. <li>Appuyez sur Confirmer une fois terminé.<li>Les valeurs d'unités par pixel calculées seront insérées dans les champs X et Y.</ol></html>
CameraConfigurationWizard.downLookingCalibrationInstructions=<html>Calibrer les unités par pixel à deux niveaux Z différents permet à Pono d'interpréter correctement la taille des objets en 3D, c'est-à-dire à une distance quelconque de la caméra. Si vous avez déjà calibré en 2D, deux nouvelles mesures 3D restent nécessaires. La calibration 3D suppose que les positions de la buse et de la caméra, les décalages, le Safe Z et les mouvements de base de la machine soient configurés. <ol><li>Choisissez un objet rectangulaire de largeur et de longueur connues qui tienne dans le champ de vision de la caméra. Du papier millimétré est un choix simple et pratique. Saisissez la largeur et la longueur de l'objet dans les champs X et Y des dimensions de l'objet.<li>Posez l'objet sur la table. Notez que les unités par pixel primaires doivent être calibrées à peu près à la même hauteur Z que la face supérieure des cartes à équiper, et les secondaires aussi haut que possible tant que l'objet reste raisonnablement net. L'objet doit tenir aisément dans le champ de vision aux deux hauteurs.<li>Amenez la buse au-dessus du centre de l'objet, puis descendez-la jusqu'à ce qu'elle touche tout juste la surface. <li>Si vous calibrez les unités par pixel primaires, vous pouvez maintenant appuyer sur le bouton de capture du Z de la buse pour enregistrer la hauteur de travail par défaut (surface de la carte).<li>Appuyez sur Mesurer pour positionner automatiquement la caméra au-dessus de l'objet, puis utilisez le rectangle de sélection de la vue caméra pour mesurer l'objet. Si l'objet n'est pas parfaitement net, prenez le milieu des bords flous pour la mesure. Appuyez sur Confirmer une fois terminé.<li>Les valeurs d'unités par pixel calculées seront insérées dans les champs X et Y. Les coordonnées Z de l'objet et de la caméra lors de la mesure sont enregistrées.<li>Placez une cale sous l'objet pour la mesure secondaire ou, sur les machines pouvant déplacer physiquement la caméra supérieure en Z, remontez la caméra aussi haut que possible tant que l'objet reste raisonnablement net. <li>Répétez les étapes 3 à 6 pour les unités par pixel secondaires. </ol></html>
CameraConfigurationWizard.upLookingCalibrationInstructions=<html>Calibrer les unités par pixel à deux niveaux Z différents permet à Pono d'interpréter correctement la taille des objets en 3D, c'est-à-dire à une distance quelconque de la caméra. Si vous avez déjà calibré en 2D, deux nouvelles mesures 3D restent nécessaires. La calibration 3D suppose que les positions de la buse et de la caméra, les décalages, le Safe Z et les mouvements de base de la machine soient configurés. <ol><li>Choisissez un objet de largeur, de longueur et d'épaisseur connues qui tienne dans le champ de vision de la caméra. Saisissez sa largeur, sa longueur et son épaisseur dans les champs X, Y et Z des dimensions de l'objet ci-dessus.<li>Posez l'objet bien droit sur la table et prenez-le avec une buse.<li>Notez que les unités par pixel primaires se calibrent à la position de la caméra inférieure, tandis que les secondaires doivent être calibrées à une position plus haute.<li>AVERTISSEMENT \: si la buse ne se trouve pas déjà au-dessus de la caméra inférieure, l'étape suivante l'y amènera automatiquement.<li>Appuyez sur Mesurer et utilisez le rectangle de sélection de la caméra pour mesurer l'objet.  Si nécessaire, utilisez le panneau de déplacement pour faire tourner la buse afin que l'objet soit aligné avec le rectangle de sélection.  Si l'objet n'est pas parfaitement net, prenez le milieu des bords flous pour la mesure.  Appuyez sur Confirmer une fois terminé.<li>Les valeurs d'unités par pixel calculées seront insérées dans les champs X et Y. Les coordonnées Z de l'objet et de la caméra lors de la mesure sont enregistrées.<li>Remontez la buse  aussi haut que possible tant que l'objet reste raisonnablement net. <li>Répétez les étapes 5 et 6 pour les unités par pixel secondaires.</ol></html>
