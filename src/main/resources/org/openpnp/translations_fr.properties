ReferenceCameraPositionConfigurationWizard.LocationPanel.RoamingRadiusLabel.toolTipText=<html>\r\n<p>Rayon de déplacement <em>nominal</em> maximal au-dessus de la caméra,<br/>\r\nqui indique aussi la plus grande diagonale de composant<br/>\r\nprise en charge.</p>\r\n<br/>\r\n<p>Réglé à zéro, il désactive la vision en plusieurs prises<br/> \r\n(voir la <strong>composition de vision</strong> du boîtier).</p> \r\n<br/>\r\n<p>Pendant la Bottom Vision, le mouvement de la buse sera <br/>\r\nrestreint, en tenant compte des éléments suivants \:</p>\r\n<ul>\r\n<li>La distance de la buse par rapport au centre <br/>\r\nde la caméra.</li>\r\n<li>La mesure dans laquelle l'empreinte du composant dépasse <br/>\r\nde ce point (approximée par une enveloppe octogonale).</li>\r\n</ul>\r\n<p>À l'intérieur du rayon de déplacement, la buse peut aussi être <br/>\r\ndéplacée librement au Z de la caméra, c'est-à-dire sans passer par Safe Z.</p> \r\n<p>Notez qu'il s'agit du rayon <em>nominal</em> \: il doit rester<br/>\r\nde la place supplémentaire pour les décalages de prise et autres <br/>\r\nécarts.</p>\r\n<br/>\r\n<p><strong color\="red">Attention \:</strong> le rayon de déplacement n'est pas appliqué \r\nlors du déplacement manuel.</p>\r\n</html>
