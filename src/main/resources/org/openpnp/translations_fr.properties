ReferenceAdvancedMotionPlannerConfigurationWizard.MotionPlannerPanel.AllowContinousMotionLabel.text=Autoriser le mouvement continu ?
ReferenceAdvancedMotionPlannerConfigurationWizard.MotionPlannerPanel.AllowContinousMotionLabel.toolTipText=<html>\r\n<p>Pono demande souvent aux contrôleurs d'exécuter un mouvement composé de plusieurs<br/>\r\nsegments. Prenons par exemple un déplacement jusqu'au Safe Z, suivi d'un déplacement au-dessus de la position <br/>\r\nvisée, puis d'une descente de la buse pour prendre ou poser un composant. </p> \r\n<p>Si le planificateur de mouvement et/ou le contrôleur reçoivent ces commandes en une seule<br/>\r\nséquence, ils peuvent leur appliquer certaines optimisations. Aucun délai n'est non plus<br/>\r\nintroduit par les échanges aller-retour. De plus, la planification peut se poursuivre <br/>\r\nen parallèle pendant que le contrôleur exécute encore les dernières commandes.</p>\r\n<p>En autorisant le mouvement continu, vous activez ces optimisations. Cependant, la <br/>\r\nconfiguration de la machine, c'est-à-dire le Gcode, les scripts personnalisés, etc., doit tenir compte du fait que le <br/>\r\nplanificateur n'attend plus la fin de chaque mouvement, sauf demande explicite. </p>\r\n</html>
ReferenceAdvancedMotionPlannerConfigurationWizard.MotionPlannerPanel.AllowUncoordinatedLabel.text=Autoriser les mouvements non coordonnés ?
ReferenceAdvancedMotionPlannerConfigurationWizard.MotionPlannerPanel.AllowUncoordinatedLabel.toolTipText=<html>\r\nAutoriser le mouvement non coordonné permet au planificateur d'utiliser des fonctions avancées<br/>\r\ncomme le dépassement, le mélange de mouvements, etc. Cela suppose un pilote prenant en charge<br/>\r\nun contrôle de mouvement du 3e ordre, simulé ou réel (avec ces fonctions sur le contrôleur).\r\n</html>
ReferenceAdvancedMotionPlannerConfigurationWizard.MotionPlannerPanel.Border.title=Planificateur de mouvement
ReferenceAdvancedMotionPlannerConfigurationWizard.MotionPlannerPanel.FuseBacklashFinalApproachLabel.text=Fusionner l'approche de rattrapage de jeu ?
ReferenceAdvancedMotionPlannerConfigurationWizard.MotionPlannerPanel.FuseBacklashFinalApproachLabel.toolTipText=<html>\r\n<p>La compensation de jeu en deux temps - positionnement unilatéral ou approche lente -<br/>\r\ndépasse la cible puis s'en approche par un second déplacement distinct. Ce second<br/>\r\ndéplacement coûte un arrêt complet et une ligne de G-code, à chaque fois.</p>\r\n<p>Avec cette option, le planificateur fusionne cette approche avec le déplacement<br/>\r\nsuivant, tant que celui-ci ne touche pas les axes compensés - en pratique la descente<br/>\r\nen Z sur un composant. L'axe arrive toujours du même côté, et plus doucement qu'avant,<br/>\r\npuisqu'il parcourt désormais sa fraction de millimètre pendant toute la descente.</p>\r\n<p>Nécessite le mouvement continu, sans lequel il n'y a rien à fusionner. Le déplacement<br/>\r\nfusionné emporte la course de compensation pendant la descente. À désactiver donc si une<br/>\r\nbuse doit descendre dans un logement du changeur ou tout autre endroit trop étroit pour<br/>\r\nle décalage de jeu.</p>\r\n</html>
ReferenceAdvancedMotionPlannerConfigurationWizard.MotionPlannerPanel.InterpolationRetimingLabel.text=Recalage temporel de l'interpolation ?
ReferenceAdvancedMotionPlannerConfigurationWizard.MotionPlannerPanel.InterpolationRetimingLabel.toolTipText=<html>\r\nL'interpolation ne peut qu'approcher les véritables profils de mouvement du 3e ordre \:<br/>\r\ndes écarts sont attendus. Le recalage temporel étire le mouvement<br/>\r\npour retrouver la durée d'origine du 3e ordre. Cela réduit toutefois légèrement<br/>\r\nla vitesse d'avance de crête. En le désactivant, vous obtenez la vitesse d'avance de crête prévue, mais une durée<br/>\r\nde déplacement légèrement plus courte.\r\n</html>
ReferenceAdvancedMotionPlannerConfigurationWizard.MotionPlannerPanel.MinimumSpeedLabel.text=Vitesse minimale
ReferenceAdvancedMotionPlannerConfigurationWizard.MotionPlannerPanel.MinimumSpeedLabel.toolTipText=<html>\r\n<p>\r\nVitesse minimale prise en charge par le planificateur de mouvement.\r\n</p><p>\r\nDes vitesses minimales trop faibles imposent une précision excessive pour les<br/>\r\nvitesses d'avance, les accélérations (et les jerks). En gardant les vitesses minimales au-dessus<br/>\r\nde niveaux raisonnables (p. ex. 5%), certains calculs (comme l'interpolation) peuvent être<br/>\r\noptimisés.<br/>\r\n</p><p>\r\nPour les pilotes communiquant par protocole texte (GcodeDriver), moins de décimales<br/>\r\nsont nécessaires, ce qui réduit la latence des commandes.<br/>\r\n</p>\r\n</html>
