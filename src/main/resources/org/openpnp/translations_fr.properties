ReferencePushPullFeederConfigurationWizard.lblDiscoverOnJobStart.toolTipText=<html>Au démarrage de la tâche, vérifier que les bons composants sont sélectionnés dans les distributeurs à OCR activé, à leurs positions. <br/>\r\nSinon la tâche est arrêtée.<br/>\r\nCela calibrera aussi par vision les positions des distributeurs, si la calibration est activée.</html>
