GcodeAsyncDriverSettings.InterpolationPanel.MaximumNumberofJerkStepsLabel.text=Nombre maximal de paliers de jerk
GcodeAsyncDriverSettings.InterpolationPanel.MaximumNumberofJerkStepsLabel.toolTipText=<html>\r\nNombre maximal de pas d'interpolation utilisés pour simuler le contrôle du jerk.<br/>\r\nCela signifie que l'accélération sera augmentée ou diminuée en autant de paliers <br/>\r\nrapportés à l'accélération maximale.\r\n</html>
GcodeAsyncDriverSettings.InterpolationPanel.MaximumNumberofStepsLabel.text=Nombre maximal de paliers
GcodeAsyncDriverSettings.InterpolationPanel.MaximumNumberofStepsLabel.toolTipText=<html>\r\nNombre maximal de pas utilisables pour l'interpolation d'un seul mouvement.<br>\r\nUtilisez une fraction de la profondeur de file d'attente maximale de votre contrôleur. <br/>\r\nSi ce nombre est dépassé, le planificateur de mouvement se rabattra sur un unique mouvement modéré. \r\n</html>
GcodeAsyncDriverSettings.InterpolationPanel.MinimumAxisResolutionTicksLabel.text=Pas minimal de résolution d'axe
GcodeAsyncDriverSettings.InterpolationPanel.MinimumAxisResolutionTicksLabel.toolTipText=<html>\r\n<p>Distance de pas minimale de l'axe utilisée pour interpoler les trajectoires de mouvement avancées.</p>\r\n<p>Elle est exprimée en pas de résolution des axes.</p>\r\n</html>
GcodeAsyncDriverSettings.InterpolationPanel.MinimumStepTimeLabel.text=Durée minimale de palier [s]
GcodeAsyncDriverSettings.InterpolationPanel.MinimumStepTimeLabel.toolTipText=<html>\r\n<p>Pas de temps minimal utilisé pour interpoler les trajectoires de mouvement avancées. Exprimé en secondes.</p>\r\n</html>
GcodeAsyncDriverSettings.SettingsPanel.Border.title=Paramètres
GcodeAsyncDriverSettings.SettingsPanel.ConfirmationFlowControlLabel.text=Contrôle de flux par confirmation ?
GcodeAsyncDriverSettings.SettingsPanel.ConfirmationFlowControlLabel.toolTipText=<html>\r\n<p>La communication avec le contrôleur est régulée en attendant le "ok"<br/>\r\navant d'envoyer la commande suivante. </p>\r\n<p>C'est plus lent que d'autres types de contrôle de flux, comme RTS/CTS sur une liaison série ; <br/>\r\nces derniers sont donc à préférer.</p>\r\n</html>
GcodeAsyncDriverSettings.SettingsPanel.LocationConfirmationLabel.text=Confirmation de position ?
GcodeAsyncDriverSettings.SettingsPanel.LocationConfirmationLabel.toolTipText=<html>Demander au contrôleur de rapporter la position une fois le mouvement terminé.<br/>\r\nSi elle a changé, la position interne d'Pono est mise à jour. Le rapport de position sert <br/>\r\naussi à synchroniser Pono lorsque le contrôle de flux par confirmation est désactivé.<br/>\r\nAu moins une des deux options doit être activée. La confirmation de position permet<br/>\r\nun fonctionnement asynchrone plus poussé. \r\n</html>
