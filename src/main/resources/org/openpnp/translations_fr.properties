ReferenceHeadConfigurationWizard.PumpPanel.VacuumPumpControlLabel.toolTipText=<html>\r\n<p>Détermine la façon dont l'état marche/arrêt de la pompe est commandé \:</p>\r\n<ul>\r\n<li><strong>None</strong> \: la pompe est commandée manuellement ou en dehors d'Pono.<br/>\r\nÀ utiliser par exemple pour une régulation à hystérésis côté contrôleur.</li>\r\n<li><strong>PartOn</strong> \: la pompe est mise en marche juste avant la prise <br/>\r\nd'un composant et arrêtée lorsqu'aucun composant n'est sur une buse.</li>\r\n<li><strong>TaskDuration</strong> \: la pompe est mise en marche juste avant<br/>\r\nla prise d'un composant et n'est arrêtée que lorsque les tâches en file d'attente (p. ex. <br/>\r\nla tâche en cours) sont terminées, à condition qu'aucun composant ne soit sur une buse.</li>\r\n<li><strong>KeepRunning</strong> \: la pompe est mise en marche juste avant<br/>\r\nla prise d'un composant et continue de tourner jusqu'à un arrêt explicite, <br/>\r\nou jusqu'à la désactivation de la machine.</li>\r\n</ul>\r\n</html>
