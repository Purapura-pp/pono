ReferenceMachineConfigurationWizard.PanelGeneral.UnsafeZRoamingLabel.toolTipText=<html>Distance de déplacement maximale autorisée à un Z non sûr.<br/><br/>\r\nLes axes Z virtuels (généralement sur les caméras) sont invisibles ; on peut donc facilement oublier<br/>\r\nque l'on se trouve à un Z non sûr. Lorsque vous appuierez ensuite sur le bouton <strong>Amener l'outil à la position de la caméra</strong>,<br/>\r\nun mouvement de descente en Z inattendu se produira, risquant de faire percuter l'outil.<br/>\r\nLa distance de déplacement maximale autorisée à un Z non sûr limite donc la zone de déplacement manuel<br/>\r\ndans laquelle un Z virtuel non sûr est conservé ; elle doit suffire pour ajuster finement une position<br/>\r\ncapturée. Un déplacement manuel plus lointain amènera automatiquement l'axe virtuel au Safe Z.\r\n</html>
