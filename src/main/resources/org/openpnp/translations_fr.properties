ReferenceControllerAxisConfigurationWizard.ControllerSettingsPanel.ResolutionLabel.toolTipText=<html><strong>Résolution</strong> de cet axe. Les coordonnées seront arrondies au multiple le plus proche lors de<br/>\r\nleur comparaison, c'est-à-dire qu'un mouvement n'est exécuté que si elles diffèrent après arrondi.<br/>\r\nIdéalement, on la règle sur la résolution physique du micro-pas (ou équivalent) de l'axe, ou sur un multiple  entier<br/>\r\npratique de celle-ci. La <strong>Résolution</strong> est l'inverse des <strong>Pas / unité</strong>, souvent configurés<br/>\r\ndans les contrôleurs.<br/>\r\n<br/>\r\nPour le GcodeDriver, assurez-vous que la résolution peut être exprimée avec le format de la <br/>\r\n<code>MOVE_TO_COMMAND</code>. La valeur par défaut est 0.0001, ce qui correspond au format %.4f (quatre décimales)<br/>\r\nde la <code>MOVE_TO_COMMAND</code>.<br/>\r\n<br/>\r\nNotez que la <strong>Résolution</strong> est exprimée en unités du pilote (et non du système).\r\n</html>
ReferenceControllerAxisConfigurationWizard.ControllerSettingsPanel.Steps.text=Pas
ReferenceControllerAxisConfigurationWizard.ControllerSettingsPanel.StepsUnitLabel.text=Pas / unité
ReferenceControllerAxisConfigurationWizard.ControllerSettingsPanel.StepsUnitLabel.toolTipText=<html>Les <strong>Pas par unité</strong> sont l'inverse de la <strong>Résolution</strong>.<br/>\r\nOn les trouve souvent dans la configuration du contrôleur ; vous pouvez donc les saisir ici pour<br/>\r\ncalculer automatiquement la <strong>Résolution</strong>.</html>
ReferenceControllerAxisConfigurationWizard.ControllerSettingsPanel.SwitchLinearRotationalLabel.text=Basculer linéaire ↔ rotatif ?
ReferenceControllerAxisConfigurationWizard.ControllerSettingsPanel.SwitchLinearRotationalLabel.toolTipText=<html>Il est important qu'Pono sache si un axe est linéaire ou rotatif dans <br/>\r\nle contrôleur. <br/>\r\n<br/>\r\nLa plupart du temps, cela découle déjà du type d'axe \: X, Y et Z sont linéaires <br/>\r\net Rotation est rotatif. Mais il arrive que vous manquiez d'axes appropriés sur le <br/>\r\ncontrôleur et deviez alors utiliser un axe linéaire du contrôleur pour un axe rotatif d'Pono <br/>\r\nou l'inverse.<br/>\r\n<br/>\r\nSi vous ne pouvez pas configurer votre contrôleur pour changer cette signification, il est important de cocher <br/>\r\nla case Permuter linéaire ↔ rotatif.<br/>\r\n<br/>\r\nCela intervient dans le calcul des limites correctes de vitesse d'avance, d'accélération et de jerk pour les mouvements<br/>\r\nà axes mixtes, car seul le mouvement des axes linéaires est pris en compte pour les limites en <br/>\r\nG-Code standard.<br/>\r\n</html>
ReferenceControllerAxisConfigurationWizard.ControllerSettingsPanel.WrapAroundLabel.text=Rebouclage
ReferenceControllerAxisConfigurationWizard.ControllerSettingsPanel.WrapAroundLabel.toolTipText=<html>Toujours faire tourner l'axe par le chemin le plus court. Par exemple, s'il est à 270° et qu'on lui demande <br/>\r\nd'aller à 0°, il ira plutôt à 360°.<br/>\r\nEn combinaison avec Limiter à ±180°, l'axe est ramené à sa coordonnée après enroulement <br/>\r\nà l'aide d'une commande de décalage global du pilote. Avec le GcodeDriver, vous devez configurer la<br/> <code>SET_GLOBAL_OFFSETS_COMMAND</code>, sans quoi cela ne fonctionnera pas.\r\n</html>
