BambooFeederAutoVisionConfigurationWizard.lblVisionType.toolTipText=<html>\r\n<p>Choisissez le type de vision, puis appuyez sur <strong>Réinitialiser le pipeline</strong> pour affecter le<br/>\r\npipeline par défaut de ce type. Les perforations d'entraînement sont détectées comme suit \:</p>\r\n<ul>\r\n<li><strong>ColorKeyed</strong> \: le fond sous les trous doit être d'une couleur vive<br/>\r\n(vert par défaut).</li>\r\n<li><strong>CircularSymmetry</strong> \: la forme des trous doit être circulaire, leur<br/>\r\nintérieur et leur extérieur doivent être unis.</li>\r\n</ul>\r\n<p>Les deux types de pipeline évaluent ensuite les trous détectés selon leur taille, leur alignement, leur pas<br/>\r\net la distance attendue.</p>\r\n</html>
