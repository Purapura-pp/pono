ReferenceNozzleTipCalibrationWizard.CalibrationPanel.CalibrationZOffsetLabel.toolTipText=<html>\n<p>\nLorsque l'élément d'une buse détecté par la vision se situe plus haut sur l'embout de buse, <br />\nil est recommandé de décaler le plan de mise au point à l'aide du « Décalage Z ».\n</p>\n<p>Si un embout de buse est nommé "unloaded", il sert de substitut pour la calibration<br />\ndu porte-embout nu. Là encore, le « Décalage Z » permet de calibrer au <br />\nbon plan focal. \n</p>\n</html>
