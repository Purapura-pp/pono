ReferenceNozzleTipPartDetectionWizard.PartOffVacuumSensingPanel.ValveOpenCloseLabel.toolTipText=<html>\n<p>La vanne est ouverte puis fermée pour créer une brève impulsion de dépression. </p>\n<p>La durée d'ouverture doit être assez courte \: il est inutile de créer une aspiration de prise complète.</p>\n<p>La durée de fermeture permet d'attendre que le système réagisse à l'impulsion,<br/>\ny compris les délais de propagation et de lecture du signal du capteur.</p>\n</html>
