ReferencePushPullFeederConfigurationWizard.textFieldRotationInTape.toolTipText=<html>\n<p>Le réglage <strong>Rotation dans la bande</strong> doit s'interpréter par rapport à l'orientation de la bande, <br/>\nquelle que soit l'orientation du distributeur ou de la bande sur la machine. </p>\n<ol>\n<li>\n<p>Regardez l'orientation droite <strong>neutre</strong> du boîtier ou de l'empreinte du composant <br/>\ntelle qu'elle est dessinée dans votre <strong>bibliothèque</strong> E-CAD.</p>\n</li>\n<li>\n<p>Notez l'orientation de la broche 1, de la polarité, de la cathode, etc.  <br/>\nC'est le 0° du composant.</p>\n</li>\n<li>\n<p>Regardez la bande de façon que les perforations d'entraînement soient en haut. <br/>\nC'est l'orientation 0° de la bande (selon la norme industrielle EIA-481).</p>\n</li>\n<li>\n<p>Déterminez la rotation du composant dans l'alvéole de la bande, <em>relativement</em> à  <br/>\nson orientation droite du point (1).  Une rotation positive va dans le sens antihoraire.<br/>\nC'est votre <strong>Rotation dans la bande</strong>.</p>\n</li>\n</ol>\n</html>
ReferencePushPullMotionConfigurationWizard.additiveRotation.text=Additif
ReferencePushPullMotionConfigurationWizard.additiveRotation.toolTipText=<html>Avant l'exécution de l'avance, la coordonnée actuelle de l'axe de rotation est relevée.<br/>\nLes rotations indiquées ci-dessous sont ensuite ajoutées à cet angle de base.<br/>\nCela sert typiquement aux axes de pelage, pour enrouler en continu le film de couverture sur une bobine.\n</html>
