ReferenceNozzleTipToolChangerWizard.Action.CloneToAllNozzleTip=Cloner les paramètres du changeur d'outil vers tous les embouts de buse
ReferenceNozzleTipToolChangerWizard.Action.CloneToAllNozzleTip.Description=<html>Cloner les réglages du changeur d'outil de cet embout de buse <strong>modèle</strong><br/>vers tous les autres. Les positions sont transposées par rapport aux premières positions.</html>
ReferenceNozzleTipToolChangerWizard.Action.ReferenceZ=Calibrer le Z de toutes les positions de contact sur le modèle
ReferenceNozzleTipToolChangerWizard.Action.ReferenceZ.Description=<html>Caler le Z de la position de contact de tous les embouts de buse sur la référence <strong>modèle</strong>.<br/>Cette action charge l'embout de buse modèle sur la buse de palpage par défaut, recalibre<br/>le Z de la position de contact du modèle, puis palpe et référence tous les autres par rapport à lui.<br/>Notez que, contrairement au clonage, cela inclut les embouts de buse marqués comme <strong>verrouillés</strong>.</html>
