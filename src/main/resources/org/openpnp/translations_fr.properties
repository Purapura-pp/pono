ReferenceNozzleCameraOffsetWizard.InstructionPanel.Step10Label.text=10. Vérifiez les nouveaux réglages en basculant entre les boutons de positionnement caméra / buse du panneau de déplacement.
ReferenceNozzleCameraOffsetWizard.InstructionPanel.Step1Label.text=1. Sélectionnez la caméra de tête que vous utiliserez pour définir le décalage.
ReferenceNozzleCameraOffsetWizard.InstructionPanel.Step2Label.text=2. Placez sur la table un objet sur lequel l'embout de buse peut laisser une marque. Du mastic, de la farine ou du papier carbone conviennent bien.
ReferenceNozzleCameraOffsetWizard.InstructionPanel.Step3Label.text=3. Amenez l'embout de buse au-dessus de l'objet.
ReferenceNozzleCameraOffsetWizard.InstructionPanel.Step4Label.text=4. Abaissez l'embout de buse (panneau de déplacement) jusqu'à ce qu'il laisse une marque sur l'objet.
ReferenceNozzleCameraOffsetWizard.InstructionPanel.Step5Label.text=5. Pour exclure le faux-rond de l'embout de la mesure, faites tourner la buse d'environ 360°.
ReferenceNozzleCameraOffsetWizard.InstructionPanel.Step6Label.text=6. Si vous souhaitez un décalage en Z, cochez la case « Inclure Z ? ».
ReferenceNozzleCameraOffsetWizard.InstructionPanel.Step7Label.text=7. Cliquez sur « Enregistrer la position de la marque de la buse ».
ReferenceNozzleCameraOffsetWizard.InstructionPanel.Step8Label.text=8. Amenez la caméra au-dessus du centre de la marque. Appuyez ensuite sur « Calculer le décalage de la buse ».
ReferenceNozzleCameraOffsetWizard.InstructionPanel.Step9Label.text=9. Appliquez les nouveaux décalages de buse en appuyant sur le bouton « Appliquer »
