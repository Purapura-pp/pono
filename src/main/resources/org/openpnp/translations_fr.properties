ReferencePushPullFeederConfigurationWizard.lblPrecisionAverage.text=Précision moyenne
ReferencePushPullFeederConfigurationWizard.lblPrecisionAverage.toolTipText=Précision moyenne obtenue, c'est-à-dire le décalage de la position de prise détecté par la calibration
