GcodeDriverSettings.SettingsPanel.CommandTimeout.text=Délai maximal de commande [ms]
GcodeDriverSettings.SettingsPanel.CommandWaitTimeLabel.text=Temps d'attente des commandes $ [ms]
GcodeDriverSettings.SettingsPanel.CommandWaitTimeLabel.toolTipText=<html>\n<p>Chaque fois qu'une commande commence par le signe <strong>$ </strong>, ajouter ce temps d'attente avant<br/>\nd'envoyer la commande suivante. Le contrôleur TinyG est connu pour exiger cette<br/>\npause, afin d'écrire ses réglages dans l'EEPROM sans interruption. </p>\n<br/>\n<p>Remarque \: dans un GcodeAsyncDriver sans contrôle de flux par confirmation, <br/>\ncela n'est garanti que si les commandes $ sont envoyées à un contrôleur  <br/>\nau repos. C'est le cas si les commandes $ sont envoyées en tout premier dans <br/>\nla <strong>CONNECT_COMMAND</strong>.</p> \n</html>
GcodeDriverSettings.SettingsPanel.CompressGCodeLabel.text=Compresser le G-code ?
GcodeDriverSettings.SettingsPanel.CompressGCodeLabel.toolTipText=<html>\r\n<p>Supprimer du G-code les espaces inutiles et les décimales finales<br/>\r\nafin d'accélérer les transmissions vers le contrôleur.</p>\r\n<p>Remarque \: cela ne fonctionne qu'avec la syntaxe G-code classique.</p>\r\n<p>Exemple \:</p>\r\n<p><code style\="background-color\:\#DDDDDD">G1&nbsp;&nbsp;X100.0000     Y20.1000&nbsp;&nbsp;&nbsp;&nbsp;</code></p>\r\n<p>est compressé en \:</p>\r\n<p><code style\="background-color\:\#DDDDDD">G1X100Y20.1</code></p>\r\n</html>
GcodeDriverSettings.SettingsPanel.ConnectWaitTimeoutLabel.text=Temps d'attente de connexion [ms]
