BoardsPanel.BoardPlacements.Placements.Rank.toolTip=<html><body style\='width\: 400'><strong>Rang</strong> détermine l'ordre dans lequel les placements sont traités pendant une tâche. Les composants sont posés du rang le plus faible au rang le plus élevé. L'ordre est <strong>strict</strong> lorsque l'écart entre les rangs est de 10 ou plus. Tous les placements du rang R doivent être terminés et corrects avant que le rang R+10 ne soit envisagé. <strong>Aucun ordre</strong> n'est imposé lorsque l'écart entre les rangs est inférieur à 10. Les placements de rang R peuvent être posés n'importe où entre R-9 et R+9, selon les autres priorités d'optimisation de la tâche.</body></html>
