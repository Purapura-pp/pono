ReferenceHeadConfigurationWizard.LocationsPanel.WarningChangingLabel.text=<html><p>\n<strong>Avis important</strong> \: le repère de prise d'origine doit être monté \net configuré tôt dans la construction, avant de commencer à capturer un grand nombre de\npositions pour la configuration de la machine (changeur d'embouts de buse, distributeurs, etc.) \n</p>\n<p style\="color\:red">Chaque fois que les réglages ci-dessus sont modifiés ou que le repère est déplacé physiquement, toutes les positions déjà capturées dans la configuration de la machine deviennent invalides. </p></html>
