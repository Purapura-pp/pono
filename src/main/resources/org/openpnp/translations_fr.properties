ReferenceNozzleTipCalibrationWizard.TopPanel.RecalibrationLabel.toolTipText=<html>\n<p>Détermine quand une recalibration est exécutée automatiquement \:</p>\n<p><ul><li>À chaque changement d'embout de buse.</li>\n<li>À chaque changement d'embout de buse, mais uniquement dans les tâches.</li>\n<li>À la prise d'origine de la machine et au premier chargement. </li></ul></p>\n<p>Manuelle avec calibration enregistrée (recommandé uniquement pour les machines <br /> \navec prise d'origine de l'axe C).</p>\n</html>
