ReferenceCameraCalibrationWizard.CameraCalibrationPanel.DeInterlaceLabel.toolTipText=Supprime l'entrelacement des images empilées
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.DefaultWorkingPlaneZLabel.text=Z du plan de travail par défaut
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.DescriptionLabel.text=<html><p width\="500">Les réglages de cet onglet sont destinés à remplacer à terme tous les réglages d'unités par pixel de l'onglet Configuration générale, tout le contenu de l'onglet Calibration d'objectif et tout le contenu de l'onglet Transformations d'image. Ils remplaceront également le bouton Calibrer la position et la rotation de la caméra de l'onglet Calibration des embouts de buse.</p><p> </p><p width\="500"><b>Prérequis \:</b> les axes X, Y et Z de la machine, la compensation de jeu et la correction de non-perpendicularité doivent tous être correctement calibrés. Tout problème de non-répétabilité mécanique (pas perdus, poulies ou pignons desserrés, courroies qui patinent, etc.) doit également être résolu avant de tenter la calibration de la caméra. De plus, pour les caméras de dessous, l'axe de rotation et les décalages de buse doivent être correctement calibrés ; et la prise d'origine visuelle, si elle doit être utilisée, doit être configurée et fonctionner correctement.</p></html>
