ReferenceNozzleTipToolChangerWizard.ChangerPanel.FirstLocationLabel.text=Première position
ReferenceNozzleTipToolChangerWizard.ChangerPanel.FirstLocationLabel.toolTipText=<html>Première position de la séquence de mouvement de chargement d'un embout de buse.<br/>\nC'est le premier point de passage lors du chargement de l'embout de buse et le<br/>\ndernier lors de son déchargement.\n</html>
ReferenceNozzleTipToolChangerWizard.ChangerPanel.LastLocationLabel.text=Dernière position
ReferenceNozzleTipToolChangerWizard.ChangerPanel.Post1ActuatorLabel.text=Actionneur après l'étape 1
ReferenceNozzleTipToolChangerWizard.ChangerPanel.Post2ActuatorLabel.text=Actionneur après l'étape 2
ReferenceNozzleTipToolChangerWizard.ChangerPanel.Post3ActuatorLabel.text=Actionneur après l'étape 3
ReferenceNozzleTipToolChangerWizard.ChangerPanel.SecondLocationLabel.text=Deuxième position
ReferenceNozzleTipToolChangerWizard.ChangerPanel.SpeedLabel.text=Vitesse
ReferenceNozzleTipToolChangerWizard.ChangerPanel.ThirdLocationLabel.text=Troisième position
ReferenceNozzleTipToolChangerWizard.ChangerPanel.TouchLocationLabel.text=Position de contact
ReferenceNozzleTipToolChangerWizard.ChangerPanel.ZCalibrateLabel.text=Calibration Z automatique
ReferenceNozzleTipToolChangerWizard.ChangerPanel.ZCalibrateLabel.toolTipText=<html>\nCalibrer le Z de la buse et de l'embout de buse par palpage sur la surface de la <strong>position de contact</strong>.<br/>\nLa calibration en Z peut être déclenchée manuellement avec le bouton <strong>Calibrer maintenant</strong> ou automatiquement \:<br/>\n<ul>\n<li><strong>Manual \:</strong> aucune calibration Z automatique. La calibration manuelle est conservée<br/>\ndurablement dans la configuration et reste valable après une prise d'origine de la machine.</li>\n<li><strong>MachineHome \:</strong> la calibration Z automatique est effectuée à la prise d'origine de la machine.<br/>\nLa calibration Z de la buse est réutilisée lorsqu'un autre embout de buse est chargé.</li>\n<li><strong>NozzleTipChange \:</strong> la calibration Z automatique est effectuée à chaque changement de cet embout<br/>\nde buse, ou à la prise d'origine de la machine si cet embout de buse est alors chargé.</li>\n</ul>\nNotez que vous pouvez utiliser un embout de buse fictif nommé "unloaded" pour calibrer le Z de la buse nue. \n</html>
ReferenceNozzleTipToolChangerWizard.CloningSettingsPanel.BehaviorLabel.text=Comportement
ReferenceNozzleTipToolChangerWizard.CloningSettingsPanel.BehaviorLabel.toolTipText=<html>\nUn embout de buse peut servir de <strong>modèle</strong> pour le clonage des autres.<br/>\nPono transposera automatiquement les positions par rapport à la première position.<br/>\nSi certains embouts de buse sont particuliers, marquez-les comme <strong>verrouillés</strong>pour empêcher le clonage.\n</html>
ReferenceNozzleTipToolChangerWizard.CloningSettingsPanel.Border.title=Paramètres de clonage
ReferenceNozzleTipToolChangerWizard.CloningSettingsPanel.TemplateRadioButton.text=Modèle
ReferenceNozzleTipToolChangerWizard.CloningSettingsPanel.TemplateRadioButton.toolTipText=Marquer cet embout de buse comme le modèle pouvant être cloné vers et depuis les autres embouts de buse.
ReferenceNozzleTipToolChangerWizard.UnnamedPanel.ClonesFromTemplateRadioButton.text=Clones du modèle
ReferenceNozzleTipToolChangerWizard.UnnamedPanel.ClonesFromTemplateRadioButton.toolTipText=Cet embout de buse peut cloner ses paramètres depuis l'embout de buse marqué comme <strong>Modèle</strong>.
ReferenceNozzleTipToolChangerWizard.UnnamedPanel.LocationsLabel.text=Positions ?
ReferenceNozzleTipToolChangerWizard.UnnamedPanel.LockedRadioButton.text=Verrouillé
ReferenceNozzleTipToolChangerWizard.UnnamedPanel.LockedRadioButton.toolTipText=<html>Cet embout de buse est verrouillé contre le clonage.<br/>Notez que le Z de sa position de contact peut tout de même être calé sur la référence de l'embout de buse modèle. </html>
ReferenceNozzleTipToolChangerWizard.UnnamedPanel.VisionCalibrationLabel.text=Calibration par vision ?
ReferenceNozzleTipToolChangerWizard.UnnamedPanel.ZCalibrationLabel.text=Calibration Z ?
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.AdjustZLabel.text=Ajuster Z
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.AdjustZLabel.toolTipText=<html>\nAjuste la coordonnée Z de la position de vision de ce décalage. Réglez-le sur la distance en Z entre <br/>\nle sujet modèle que vous détectez par la calibration par vision, p. ex. la surface visible de <br/>\nl'emplacement du changeur, et la face inférieure (imaginaire) de l'embout de buse lorsqu'il est à cette position. Ajustement <br/>\npositif lorsque l'embout de buse est en dessous de cette surface, négatif lorsqu'il est au-dessus.<br/> \nCe réglage permet de compenser les erreurs d'échelle dans la vue de la caméra, en particulier lorsque les objets sont bien <br/>\nplus proches de la caméra que d'habitude.<br/>\n<strong>Les unités par pixel 3D doivent être configurées sur la caméra.</strong> \n</html>
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.Border.title=Calibration par vision
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.CalibrationTriggerLabel.text=Déclencheur de calibration
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.LastScoreLabel.text=Dernier score
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.MaxPassesLabel.text=Passes max.
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.MinScoreLabel.text=Score minimal
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.MinScoreLabel.toolTipText=<html>\nLorsque les images modèles sont comparées à l'image de la caméra, un score est calculé<br/>\npour indiquer la qualité de la correspondance. Si le score obtenu est inférieur au score minimal<br/>\nindiqué ici, la calibration échoue. Cela doit empêcher la machine de tenter un changement <br/>\nd'embout de buse alors que la position est incorrecte. \n</html>
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.TemplateEmptyLabel.text=Modèle « vide »
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.TemplateHeightLabel.text=Hauteur du modèle
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.TemplateHeightLabel.toolTipText=<html>\nHauteur de l'image modèle (Y). Le modèle est centré sur la position de vision choisie.<br/>\nChoisissez des dimensions aussi petites que possible, mais les modèles doivent contenir des bords horizontaux et verticaux<br/>\ncaractéristiques. De plus, l'embout de buse doit être visible lorsqu'il occupe l'emplacement du changeur.\n</html>
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.TemplateOccupiedLabel.text=Modèle « occupé »
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.TemplateWidthLabel.text=Largeur du modèle
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.TemplateWidthLabel.toolTipText=<html>\nLargeur de l'image modèle (X). Le modèle est centré sur la position de vision choisie.<br/>\nChoisissez des dimensions aussi petites que possible, mais les modèles doivent contenir des bords horizontaux et verticaux<br/>\ncaractéristiques. De plus, l'embout de buse doit être visible lorsqu'il occupe l'emplacement du changeur.\n</html>
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.ToleranceLabel.text=Tolérance
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.ToleranceLabel.toolTipText=Tolérance de calibration maximale, c'est-à-dire l'écart admissible entre la position calibrée et la position nominale.
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.VisionCalibrationHelpLabel.text=<html>\nCapturez deux images modèles de l'emplacement de votre changeur d'embouts de buse,<br/>\nl'une à vide et l'autre occupé.<br/>\nÀ l'aide de ces modèles, la calibration par vision calibrera ensuite les<br/>\npositions du changeur en X/Y et vérifiera aussi que l'emplacement est vide<br/>\nou occupé comme attendu.\n</html>
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.VisionLocationLabel.text=Position de vision
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.VisionLocationLabel.toolTipText=<html>Position pour la calibration par vision, ou None pour aucune calibration.<br/>\nChoisissez une position où l'embout de buse présent dans l'emplacement est visible. \n</html>
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.WantedPrecisionLabel.text=Précision souhaitée
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.WantedPrecisionLabel.toolTipText=<html>Si la correspondance détectée avec l'image modèle est plus éloignée que la <strong>précision souhaitée</strong>,<br/>\nla caméra est recentrée et une nouvelle passe de vision est effectuée.</html>
ReferenceNozzleToolChangerWizard.ChangerPanel.Border.title=Changeur d'embout de buse
ReferenceNozzleToolChangerWizard.ChangerPanel.ChangeOnManualLabel.text=Changer lors d'une prise manuelle ?
ReferenceNozzleToolChangerWizard.ChangerPanel.ChangerEnabledLabel.text=Changeur d'outil automatique activé ?
ReferenceNozzleToolChangerWizard.ChangerPanel.ManualChangeLocationLabel.text=Position de changement manuel
ReferenceNozzleVacuumWizard.ContentPanel.BlowOffActuatorLabel.text=Actionneur de soufflage
ReferenceNozzleVacuumWizard.ContentPanel.ClosesVacuumActuatorLabel.text=Ferme l'actionneur de vide ?
ReferenceNozzleVacuumWizard.ContentPanel.ClosesVacuumActuatorLabel.toolTipText=<html>\r\nL'actionnement de l'actionneur de soufflage désactive aussi <em>implicitement</em> l'actionneur de vide.<br/>\r\nSi cette option est activée, la désactivation <em>explicite</em> de l'actionneur de vide est omise.\r\n</html>
