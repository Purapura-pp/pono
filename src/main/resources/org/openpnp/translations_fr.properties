HeadSolutions.Issue.CreateNozzles=Créer des buses pour cette tête.
HeadSolutions.Issue.CreateNozzles.Confirm=<html><p>Accepter cette solution peut modifier en profondeur la configuration de votre machine.<br/>Voici ce qui va se passer \:<p/><ol><li>La configuration actuelle de la machine est enregistrée (comme avec Fichier/Enregistrer la configuration).</li><li>La nouvelle solution écrase votre configuration existante de buses et d'axes.</li><li>Tant que les buses et les axes conservent le même type et le même nombre, leur configuration détaillée est préservée.</li><li>Une solution de buses peut être appliquée plusieurs fois \: vous pouvez y revenir et l'étendre.</li><li><span color\="red">Attention \:</span> rouvrir ne restaurera pas la configuration précédente, cela permettra seulement de faire un nouveau choix.<br/>Si vous souhaitez restaurer la configuration précédente, vous devez restaurer manuellement la configuration enregistrée.</li></ol><br/>Êtes-vous sûr ?</html>
HeadSolutions.Solution.CreateNozzles=Choisissez le nombre et le type de vos buses.
HeadSolutions.Solution.CreateNozzles.Choice.0=<html><h3>Buse indépendante</h3><p>Chaque buse possède son propre moteur d'axe Z</p></html>
HeadSolutions.Solution.CreateNozzles.Choice.1=<html><h3>Paire de buses, axe Z partagé, mouvements opposés</h3><p>Une paire de buses partage un moteur d'axe Z. Lorsque la première buse monte, la seconde descend d'autant. Les buses sont couplées en opposition par crémaillère ou par courroie.</p></html>
HeadSolutions.Solution.CreateNozzles.Choice.2=<html><h3>Paire de buses, axe Z partagé, came</h3><p>Une paire de buses partage un moteur d'axe Z. Les deux buses sont poussées vers le bas par une came rotative et rappelées vers le haut par un ressort.</p></html>
