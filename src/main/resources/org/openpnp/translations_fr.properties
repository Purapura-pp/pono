ReferenceCameraCalibrationWizard.CameraCalibrationPanel.CautionLabel.text=<html><p width\="500" style\="color\:Black;background-color\:Yellow;">Attention \: l'embout de buse sera abaissé à ces coordonnées Z et déplacé sur <b>tout le champ de vision</b> de la caméra pendant la séquence de calibration. Assurez-vous qu'il existe un dégagement suffisant vis-à-vis des obstacles proches de la caméra avant de lancer la calibration, sous peine d'endommager la machine.</p></html>
