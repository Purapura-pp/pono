ReferencePnpJobProcessorConfigurationWizard.lblOptimizeMultipleNozzles.text=Optimiser l'usage de plusieurs buses
ReferencePnpJobProcessorConfigurationWizard.lblOptimizeMultipleNozzles.toolTipText=Optimiser le trajet des étapes de prise, d'alignement et de pose sur les machines à plusieurs buses en modifiant l'ordre de traitement des buses.
ReferencePnpJobProcessorConfigurationWizard.lblPreRotateAllNozzles.text=Pré-orienter toutes les buses
ReferencePnpJobProcessorConfigurationWizard.lblPreRotateAllNozzles.toolTipText=<html>Pré-orienter toutes les buses pendant le déplacement vers la première position d'avance ou de prise, vers la caméra inférieure et vers la première position de pose.<br/>En supposant que ces déplacements durent plus longtemps que l'amenée de la buse suivante à sa position de prise, à la caméra inférieure<br/>ou à la position de pose, cela peut améliorer les performances et réduira le risque de glissement des composants sur leur embout de buse.</html>
ReferencePnpJobProcessorConfigurationWizard.lblStepsMotion.text=Exécuter le mouvement suivant pas à pas
ReferencePnpJobProcessorConfigurationWizard.lblStepsMotion.toolTipText=Le pas à pas ne s'arrêtera qu'à la prochaine étape comportant un mouvement
