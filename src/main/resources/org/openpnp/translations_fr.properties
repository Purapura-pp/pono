ReferenceNozzleTipConfigurationWizard.PartDimensionsPanel.MaxPickToleranceLabel.toolTipText=<html>\nTolérance de prise maximale supposée admise avec cet embout de buse.<br/>\nElle détermine jusqu'à quelle distance de la position nominale une position <br/>\nd'alignement Bottom Vision détectée est acceptée. Elle réduit également le <br/>\ntemps de calcul de certaines opérations de vision en limitant la plage de recherche.\n</html>\n\n
ReferenceNozzleTipConfigurationWizard.PartDimensionsPanel.MinPartDiameterLabel.text=Diamètre min. du composant
ReferenceNozzleTipConfigurationWizard.PartDimensionsPanel.MinPartDiameterLabel.toolTipText=<html>\nDiamètre minimal des composants pouvant être pris avec cet embout de buse.<br/>\nNotez que le <strong>Diamètre minimal de composant</strong> moins deux fois la <strong>Tolérance de prise</strong><br/>\ndétermine le diamètre <em>intérieur</em> minimal de l'embout de buse qui<br/>\nest toujours considéré comme couvert par le composant. Ce diamètre intérieur est ignoré<br/>\ndans l'analyse et le diagnostic de couleur clé de la calibration de l'arrière-plan.\n</html>
