BacklashCompensationConfigurationWizard.Action.Calibrate.Description=<html>\r\n<p>Calibrer les paramètres de compensation du jeu de l'axe à l'aide du repère de calibration.</p>\r\n<p>Assurez-vous que le montage de calibration est en place.</p><p>Envisagez d'utiliser cette fonction depuis Problèmes et solutions, où vous obtiendrez des instructions pas à pas<br/>\r\npour les étapes préparatoires nécessaires et pour la calibration dans le bon ordre. Vous y trouverez aussi de nombreux liens vers le wiki.</p>\r\n</html>
BacklashCompensationConfigurationWizard.BacklashDiagnosticsPanel.BacklashOffsetLabel.text=Décalage de jeu
BacklashCompensationConfigurationWizard.BacklashDiagnosticsPanel.Border.title=Compensation et calibration du jeu
BacklashCompensationConfigurationWizard.BacklashDiagnosticsPanel.CompensationMethodLabel.text=Méthode de compensation
BacklashCompensationConfigurationWizard.BacklashDiagnosticsPanel.CompensationMethodLabel.toolTipText=<html>\n<p>La compensation du jeu sert à éviter les effets du jeu ou du flottement dans les <br/>\nliaisons mécaniques de l'axe considéré.  Lorsque l'actionneur inverse le sens de déplacement, <br/>\nil y a souvent un instant où rien ne se passe, car le mou d'une courroie ou le jeu <br/>\nd'une vis, d'une crémaillère, etc. doit être rattrapé avant que l'effort mécanique puisse à nouveau <br/>\nêtre transmis.</p>\n\n<ul>\n<li>\n<strong>None \:</strong>\nAucune compensation du jeu n'est effectuée. </li>\n<li>\n<strong>OneSidedPositioning \:</strong><br/>\nLa compensation est appliquée en atteignant toujours la position finale par le même côté.<br/>\nLe décalage de jeu n'a pas besoin d'être très précis \: il peut être plus grand que le jeu<br/> \nréel, la machine arrivera tout de même à la position exacte.<br/>\nLa machine doit toujours effectuer un mouvement supplémentaire, ce qui impose un arrêt complet<br/>\n entre les segments de mouvement.</li>\n<li>\n<strong>OneSidedOptimizedPositioning \:</strong><br/>\nFonctionne comme OneSidedPositioning, sauf qu'un mouvement supplémentaire n'est effectué que <br/>\nlorsque l'on arrive du mauvais côté. Seule la moitié des mouvements supplémentaires est nécessaire.</li>\n<li>\n<strong>DirectionalCompensation (expérimental \!) \:</strong><br/>\nLa compensation est appliquée dans le sens du déplacement. Le décalage est ajouté à la <br/>\ncoordonnée cible réelle si le déplacement se fait dans le sens du décalage (qui peut être positif <br/>\nou négatif) ; aucun décalage n'est ajouté si le déplacement se fait en sens inverse.<br/>\nAucun mouvement supplémentaire n'est nécessaire. La machine se déplace aussi plus fluidement, puisqu'aucun <br/>\nchangement de sens n'est requis.<br/>\nEn revanche, le décalage doit correspondre précisément au jeu physique.</li>\n</ul>\n</html>
BacklashCompensationConfigurationWizard.BacklashDiagnosticsPanel.DistanceTestLabel.text=<html>\n<body style\="text-align\:right">\n<p>\nJeu <span style\="color\:\#005BD9">&mdash;&mdash;</span>\n</p>\n<p>\nEnveloppe <span style\="color\:\#000077">&mdash;&mdash;</span>\n</p>\n<p>\nDépassement <span style\="color\:\#FF0000">&mdash;&mdash;</span>\n</p>\n<p>\nAléatoire <span style\="color\:\#BB7700">&mdash;&mdash;</span>\n</p>\n<br/>\n<p>\nTemps de déplacement <span style\="color\:\#00AA00">&mdash;&mdash;</span>\n</p>\n<br/>\n<br/>\n<p>\naller/ <span style\="color\:\#777777">retour</span><br/>\nselon la distance de déplacement.\n<p/>\n</body>\n</html>
