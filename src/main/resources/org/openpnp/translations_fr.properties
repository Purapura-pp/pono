ReferenceNozzleConfigurationWizard.OffsetsPanel.AlignwithPartLabel.toolTipText=<html>\n<p>Après l'alignement du composant par la Bottom Vision, faire correspondre le décalage du mode de rotation<br/>\nde la buse avec la rotation du composant.</p>\n<br/>\n<p>Cela garantit que les coordonnées de la buse indiquées dans le réticule,<br/>\ndans le DRO, etc., correspondent à la rotation détectée du composant.</p>\n<br/>\n<p>Après la pose ou la mise au rebut du composant, la buse revient à l'indication de la rotation <br/>\nd'axe d'origine.</p>\n</html>
