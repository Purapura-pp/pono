GcodeDriverSettings.SettingsPanel.BackslashEscapedCharactersLabel.toolTipText=Permet d'insérer des caractères Unicode dans les chaînes de Gcode sous la forme \\uxxxx, où xxxx représente quatre caractères hexadécimaux.  Autorise aussi \\t pour la tabulation, \\b pour le retour arrière, \\n pour le saut de ligne, \\r pour le retour chariot et \\f pour le saut de page.
