FiducialVisionSettingsConfigurationWizard.lblParallaxAngle.text=Angle de parallaxe
FiducialVisionSettingsConfigurationWizard.lblParallaxAngle.toolTipText=<html>\n<p>\nAngle selon lequel les deux points de vue de parallaxe de la caméra sont écartés l'un de l'autre.<br/>\nChoisissez un angle qui privilégie l'axe le plus rapide de votre machine \: 0° privilégie X, 90° privilégie Y.<br/>\nD'autres angles peuvent servir à améliorer la précision ou à égaliser les reflets de l'anneau de LED.\n</p>\n</html> \n\n
FiducialVisionSettingsConfigurationWizard.lblParallaxDiameter.text=Diamètre de parallaxe
FiducialVisionSettingsConfigurationWizard.lblParallaxDiameter.toolTipText=<html>\n<p>\nLorsqu'un <strong>diamètre de parallaxe</strong> est indiqué, le localisateur de repères effectue sa détection depuis deux<br/>\npoints de vue de parallaxe situés de part et d'autre de la position attendue du repère. La distance<br/> entre les deux est définie par le diamètre de parallaxe.</p>\n<p>\nL'application typique concerne les repères très réfléchissants, comme sur les circuits imprimés<br/>\nà finition HASL (Hot Air Solder Leveling). Ceux-ci renvoient l'image de la caméra qui regarde à travers le diffuseur ;<br/> \nle repère peut donc apparaître (partiellement) sombre et/ou mal formé pour la détection.\n</p>\n<p>\nEn détectant depuis un point de vue de parallaxe, le repère est vu de biais et renvoie le<br/>\ndiffuseur lumineux de l'éclairage de la caméra. En procédant depuis deux points de vue opposés et symétriques, le<br/>\npoint milieu permet d'annuler les erreurs de parallaxe.\n</p>\n</html>
