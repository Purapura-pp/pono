ReferencePushPullFeederConfigurationWizard.checkBoxUsedAsTemplate.toolTipText=<html>Utiliser ce distributeur comme modèle pour cloner les réglages vers d'autres distributeurs. <br/>\r\nLes modèles sont appariés d'après la spécification de bande et bobine ou le boîtier des composants <br/>\r\nchargés dans les distributeurs. <br/>\r\nQuand aucun modèle ne correspond formellement, on retient le distributeur \nprésentant le plus de similitudes <br/>\r\n(pas d'avance, largeur de bande, proximité, etc.).</html>
