ReferenceCameraCalibrationWizard.CameraCalibrationPanel.MovableDefaultZTextFiled.toolTipText=<html><p width\="500">Il s'agit de la coordonnée Z supposée des objets vus par la caméra lorsque leur véritable coordonnée Z est inconnue. Elle est généralement réglée sur la coordonnée Z de la surface de travail de la ou des cartes à équiper.</p></html>
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.MovablePrimCalZTextField.toolTipText=<html><p width\="500">Il s'agit de la coordonnée Z du repère de calibration principal.</p></html>
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.MovableSecondaryCalZTextField.toolTipText=<html><p width\="500">Il s'agit de la coordonnée Z du repère de calibration secondaire.</p></html>
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.NotMovableDefaultZTextFiled.toolTipText=<html><p width\="500">Il s'agit de la coordonnée Z à laquelle la face inférieure des composants portés par la buse sera abaissée pour l'alignement visuel.</p></html>
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.NotMovablePrimCalZTextField.toolTipText=<html><p width\="500">Il s'agit de la coordonnée Z à laquelle les objets sont le mieux mis au point pour cette caméra.</p></html>
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.NotMovableSecondaryCalZTextField.toolTipText=<html><p width\="500">Réglez-la aussi grande (haute) que possible au-dessus du Z de calibration principal, tout en gardant l'embout de buse raisonnablement net.</p></html>
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.NumberOfRadialLinesTextField.toolTipText=<html><p width\="500">Il s'agit du nombre souhaité de lignes radiales le long desquelles les points de calibration seront relevés à chaque coordonnée Z de calibration. Le nombre réel sera arrondi au multiple de 4 supérieur. Diminuer ce nombre raccourcit la durée de collecte, mais peut donner une calibration de moindre qualité, voire un échec. L'augmenter peut améliorer la qualité de la calibration, mais la collecte sera plus longue.</p></html>
