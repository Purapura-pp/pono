BlindsFeederArrayConfigurationWizard.lblNormalize.toolTipText=<html>\r\nNormaliser les distances entre repères et le cisaillement aux valeurs <br />\r\nthéoriquement correctes (grille carrée en millimètres entiers). Cela signifie que vous faites davantage confiance à la mécanique  <br />\r\nde votre machine et de votre imprimante 3D qu'aux relevés de repères par vision.  <br />\r\nLa position et l'angle absolus d'ensemble restent déterminés par la vision. \r\n</html>
