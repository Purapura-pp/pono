ReferencePushPullFeederConfigurationWizard.lblNormalizePickLocation.text=Normaliser ?
ReferencePushPullFeederConfigurationWizard.lblNormalizePickLocation.toolTipText=Normaliser la position de prise par rapport aux perforations d'entraînement selon la norme EIA-481.
ReferencePushPullFeederConfigurationWizard.lblOcrFontName.text=Nom de la police OCR
ReferencePushPullFeederConfigurationWizard.lblOcrFontName.toolTipText=<html>Nom de la police OCR à reconnaître, ou [Barcode].<br/>\r\nLes polices à chasse fixe fonctionnent bien mieux, autorisent une résolution plus basse et donc un fonctionnement <br/>\r\nplus rapide. Utilisez une police dont tous les caractères employés se distinguent facilement.<br/>\r\nLes polices à glyphes bien séparés sont nettement préférables.</html>
ReferencePushPullFeederConfigurationWizard.lblOcrWrongPart.text=Action OCR en cas de mauvais composant
ReferencePushPullFeederConfigurationWizard.lblOcrWrongPart.toolTipText=<html>Détermine l'action à effectuer lorsque l'OCR détecte un mauvais identifiant de composant dans le distributeur.<br/> \r\n<ul>\r\n<li>\r\n<strong>None</strong> \: utilisez ce réglage si vous ne souhaitez pas utiliser l'OCR.</li>\r\n<li>\r\n<strong>SwapFeeders</strong> \: si un mauvais composant est détecté alors que le bon composant est sélectionné<br/>\r\ndans un autre ReferencePushPullFeeder, les positions des deux distributeurs sont échangées. Le<br/>\r\ndistributeur ainsi mis en place sera activé. Cela se produit lorsque vous retirez, remettez ou réorganisez vos<br/>\r\ndistributeurs sur la machine.</li>\r\n<li>\r\n<strong>SwapOrCreate</strong> \: fonctionne comme <strong>SwapFeeders</strong>, mais si aucun<br/>\r\nautre distributeur avec le bon composant n'est trouvé, un nouveau est créé et mis en place à la<br/>\r\nposition du distributeur actuel. Le distributeur actuel est alors désactivé à son tour (ils se trouvent désormais à<br/>\r\nla même position et un seul doit être activé).</li>\r\n<li>\r\n<strong>ChangePart</strong> \: le composant du distributeur actuel est changé. Cela ne fonctionne<br/>\r\ncorrectement que si les réglages de bande, etc., restent identiques d'un composant à l'autre, c'est-à-dire si vous limitez<br/>\r\ntout rechargement ou réagencement à des groupes de distributeurs ayant les mêmes réglages.</li>\r\n<li>\r\n<strong>ChangePartAndClone</strong> \: le composant du distributeur actuel est changé, mais<br/>\r\nles réglages sont clonés depuis un distributeur modèle.</li>\r\n</ul>\r\n</html>\r\n
ReferencePushPullFeederConfigurationWizard.lblPartPitch.text=Pas des composants
ReferencePushPullFeederConfigurationWizard.lblPartPitch.toolTipText=Pas des composants dans la bande (2 mm, 4 mm, 8 mm, 12 mm, etc.)
