GcodeDriverSettings.SettingsPanel.UnitsLabel.text=Unités
GcodeDriverSettings.lblCompressExcludes.text=Caractères exclus de la compression
GcodeDriverSettings.lblCompressExcludes.toolTipText=<html>\r\n<p>\r\nLa compression du G-code suit les règles de la norme NIST RS274NGC<br/>\r\npour les lignes de commandes G et M simples.<br/>\r\nIl existe toutefois des extensions standard et propriétaires de la syntaxe<br/>\r\npour lesquelles la compression et la suppression des commentaires sont inadmissibles. Pour prendre en charge ces<br/>\r\nextensions, vous pouvez indiquer une liste de caractères servant de <em>délimiteurs</em> ou de<br/>\r\n<em>guillemets</em> autour de ces parties des lignes de commande. \r\n</p>\r\n<p>\r\nVoici des exemples typiques \:<br/>\r\n<code>&quot; &\#x27; &lt;&gt; {} [] ()</code><br/>\r\n</p>\r\n<p>\r\nEn raison des ambiguïtés possibles de la syntaxe (échappement, imbrication), tout ce qui se trouve entre<br/>\r\nle caractère d'exclusion le plus à gauche et celui le plus à droite est prudemment exclu de la<br/>\r\ncompression et de la suppression des commentaires. Si un seul caractère d'exclusion est trouvé,<br/>\r\nle reste de la ligne est exclu.<br/>\r\n</p>\r\n<p>\r\nRemarques \: utilisez les caractères <code>[]</code> pour prendre en charge les <em>expressions</em> de la<br/>\r\nsection 3.3.2.3 de la norme NIST RS274NGC. Ajoutez les caractères <code>()</code> si vous souhaitez conserver<br/>\r\nles commentaires entre parenthèses lorsque la suppression des commentaires est active. Les commentaires<br/>\r\nde fin de ligne introduits par un point-virgule seront tout de même supprimés.\r\n</p>\r\n</html>
