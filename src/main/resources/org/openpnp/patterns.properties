# Templates for the Issues and Solutions wording the sources assemble at runtime.
#
# The other mechanism, texts_<lang>.properties, is keyed by the whole English string, so it can
# only ever match prose the source carries as one constant. A description built as
# "Nozzle "+name+" offsets" is a different string on every machine and no whole-string key can
# reach it. A template here is matched against the assembled English, the variable parts are
# lifted out, and the translation is filled in around them.
#
# The English side must read exactly as the source assembles it, %s where a value goes. Reword the
# source and the template stops matching, silently, which is what i18n.py patterns reports on.
#
# Keys under Word. are not templates: they are the English words a template may lift out, for the
# roles the source names in English rather than the names a user chose.

ActuatorSolutions.Missing=%s is missing a %s actuator.
ActuatorSolutions.Missing.Solution=Create and assign a %s actuator as described in the Wiki.
ActuatorSolutions.NoCommand=The %s actuator %s has no %s assigned.
ActuatorSolutions.NoDriver=The %s actuator %s has no driver assigned.
AxisSolutions.AlignNozzleRotation=Align nozzle %s rotation with part.
CalibrationSolutions.AdvancedCamera=Advanced camera %s calibration.
CalibrationSolutions.AdvancedCamera.Extended=<html><p>You already performed the preliminary camera calibration earlier, now it is time for the <strong>Advanced Camera Calibration</strong> that includes compensating lens distortion and camera mounting tilt. A more profound and precise 3D Units per Pixel calibration is also applied.</p><br/><p>More information can be found in the Wiki (press the blue Info button below).</p><br/><p>The calibration must be performed with the same nozzle tip, that you used for the preliminary calibration. Make sure it is loaded and its <strong>Vision Diameter</strong> is still valid. Furthermore the camera %s position (including Z) must still be valid.</p><br/><p>If not, please revisit the <strong>Determine up-looking camera %s position</strong> step first (Enable the <strong>Include Solved?</strong> checkbox above, to see revisitable solutions).</p><br/><p><strong color\="red">CAUTION</strong>\: The nozzle %s will perform a lengthy calibration motion pattern all over the view area of the camera %s. Before pressing <strong>Accept</strong>, you need to be sure nozzle %s will not collide with anything\!</p><br/></html>
CalibrationSolutions.AdvancedCamera.WithFiducials=Automatically calibrates the camera %s using the primary and secondary calibration fiducials.
CalibrationSolutions.AdvancedCamera.WithNozzle=Automatically calibrates the camera %s using the nozzle %s.
CalibrationSolutions.Backlash=Calibrate backlash compensation for axis %s.
CalibrationSolutions.Backlash.Extended=<html><p>Backlash compensation is used to avoid the effects of any looseness or play in the mechanical linkages of machine axes. More information can be found in the Wiki (press the blue Info button below).</p><br/><p>Set the acceptable <strong>Tolerance ±</strong> as high as possible to allow for a more efficient backlash compensation method, avoiding extra moves and direction changes.</p><br/><p><strong color\="red">CAUTION 1</strong>\: The camera %s will move over the primary fiducial and then perform a calibration motion pattern, moving the axis %s over its full soft-limit range.</p><br/><p><strong color\="red">CAUTION 2</strong>\: The machine will also perform a visual homing cycle, once the new backlash compensation method is established. This is done to recalibrate the coordinate system that might be affected by the new method.</p><br/><p>When ready, press Accept.</p></html>
CalibrationSolutions.Backlash.Solution=Automatically calibrates the backlash compensation for %s using the primary calibration fiducial.
CalibrationSolutions.PreciseCameraToNozzle=Calibrate precise camera ↔ nozzle %s offsets.
CalibrationSolutions.PreciseCameraToNozzle.Extended=<html><p>To calibrate precision camera ↔ nozzle offsets, we let the nozzle pick, rotate and place a small test object and then measure the resulting offsets using the camera.</p><br/><p>Instructions about suitable test objects etc. must be obtained in the OpenPnP Wiki. Press the blue Info button (below) to open the Wiki.</p><br/><p>Place the calibration test object onto the calibration primary fiducial.</p><br/><p>Jog camera %s over the test object. Target it with the cross-hairs.</p><br/><p>Adjust the <strong>Feature diameter</strong> up and down and see if it is detected right in the camera view. A green circle and cross-hairs should appear and hug the test object contour. Zoom the camera using the scroll-wheel.</p><br/><p><strong color\="red">CAUTION</strong> The nozzle %s will move to the test object and perform the calibration pick & place pattern. Make sure to load the right nozzle tip and ready the vacuum system.</p><br/><p>When ready, press Accept.</p></html>
CalibrationSolutions.PreciseCameraToNozzle.Solution=Use a test object to perform the precision camera ↔ nozzle %s offsets calibration.
CameraSolutions.Settling.Extended.CameraMoves=<html><p>For precision in computer vision it is very important that the camera image has settled down after the machine has moved the camera or the subject. Some cameras exhibit a slight lag, where the frames might still show the camera in motion. Motion might also cause vibration that must abate sufficently before computer vision is performed.</p><br/><p>The simple solution is just to wait for a fixed amount of time. However, this is wasteful if there was no motion in the first place. Using an adaptive settling method can reduce the wait time in these cases, i.e. one does not need to set a large worst case settle wait time.</p><br/><p><strong color\="red">CAUTION</strong>\: The camera %s will move over the primary fiducial and then perform a camera settling test pattern.</p><br/><p>When ready, press Accept.</p></html>
CameraSolutions.Settling.Extended.SubjectMoves=<html><p>For precision in computer vision it is very important that the camera image has settled down after the machine has moved the camera or the subject. Some cameras exhibit a slight lag, where the frames might still show the camera in motion. Motion might also cause vibration that must abate sufficently before computer vision is performed.</p><br/><p>The simple solution is just to wait for a fixed amount of time. However, this is wasteful if there was no motion in the first place. Using an adaptive settling method can reduce the wait time in these cases, i.e. one does not need to set a large worst case settle wait time.</p><br/><p><strong color\="red">CAUTION</strong>\: The %s will move to the camera %s and then perform a camera settling test pattern.</p><br/><p>When ready, press Accept.</p></html>
CameraSolutions.WhiteBalance=Calibrate static white balance for camera %s.
CameraSolutions.WhiteBalance.Extended=<html><p>Color-keyed computer vision needs stable, and accurate colors. Neither the unstable Auto white balance, nor the device manual white balance is suitable (typically merely a red-blue-shift).Therefore OpenPnP offers its own elaborate and static white balance. You can automatically calibrate it now.</p><br/><p>Make sure a suitable white balance calibration object is visible in the camera view. Brushed metal and paper are recommended. The camera should see all brightness levels, i.e., an assortment of metal objects with holes, bevels, shadows etc. usually provides good gradients.Conversely, make sure there are no colored objects visible. Lighting conditions must be as in operation.<p><br/><p>Alternatively, you can perform white balance on camera %s's <strong>White Balance</strong> tab.</p><br><p>Press the blue info button (below) for more information.</p><br><p>When ready, press Accept.</p></html>
GcodeDriverSolutions.SetMotionControlType=Set to %s.
GcodeDriverSolutions.SetMotionControlType.Extended=<html><span color\="red">CAUTION\:</span> This is a troubleshooting option, you should only choose %s if the current %s causes problems and you want to try a simpler setting.</html>
MachineDiagnostics.AccelerationCapped.Extended=The controller reported a maximum acceleration of %s %s/s² for this axis on %s, and the axis is set to be planned at %s %s/s². Every move is capped at the controller's figure, so the planned ramps are shorter than the real ones and the machine is still moving when the plan says it has arrived.
MachineDiagnostics.AccelerationShortfall.Extended=Move times measured on %s fit an acceleration of %s %s/s², against the %s %s/s² the axis is planned with. The planner puts the start of the deceleration where the configured figure says it should be, so on the real machine the ramp is still running there.
MachineDiagnostics.BacklashOffset.Extended=The axis measured up to %s mm of backlash on %s, with compensation switched off, and %s is set to drive %s mm past the target before approaching it. That does not clear the slack, so the approach begins inside it and every position still carries the backlash. The offered value keeps a margin over the largest backlash measured.
MachineDiagnostics.FeedRateCapped.Extended=The controller reported a maximum feed rate of %s %s/s for this axis on %s, and the axis is set to be planned at %s %s/s. The controller caps every move at its own figure without reporting that it did, so the planner's move times, and the speed factors it scales against them, are computed for a machine that is not there.
MachineDiagnostics.FeedRateShortfall.Extended=Move times measured on %s fit a cruise velocity of %s %s/s, against the %s %s/s the axis is planned with. Whatever is holding it back - the controller, the driver, the mechanics - the planner is timing moves that take longer than it thinks.
MachineDiagnostics.FieldOfView.Extended=A fiducial swept across the field of view on %s moved %s further in %s than Units per Pixel accounts for, leaving %s mm rms of distortion under the scale error. Units per Pixel scales every vision correction the machine makes, so the error is carried into placement over the whole board. This is not corrected here\: the advanced camera calibration in this list measures the scale together with the camera's tilt and the lens distortion, which is what the residual says is also present.
MachineDiagnostics.HomingFiducial.Extended=Visual homing takes the position it finds at the homing fiducial as the machine origin, and the camera calibrations were measured against the primary calibration fiducial. These two are %s mm apart, so every calibrated offset carries that difference. This is reported rather than corrected, because which of the two positions is the right one is not something the machine can know.
MachineDiagnostics.HomingScatter.Extended=Homing %s times on %s and measuring the same fiducial after each one put the origin within %s mm of itself. Visual homing is off, so that is the repeatability of the endstops, and it shifts every coordinate the machine holds - fiducials, feeders, nozzle offsets - by that much between one power-up and the next. Visual homing takes the origin from a fiducial instead, which is the solution offered in this list.
MachineDiagnostics.Resolution.Extended=The controller reported %s steps per unit for this axis on %s, so its smallest step is %s %s, while the axis resolution is set to %s %s. Resolution is what decides whether a coordinate counts as a move at all, so a value below one step sends moves the machine cannot make and reports them as done.
MachineDiagnostics.RotationBacklash.Extended=Approaching the same angle from either side on %s left %s degrees between the two, measured on the bottom camera through the part itself, and no compensation is set. At the corner of a 5 mm part that angle is %s mm of placement error, which is why it shows up first on the large parts. Accepting sets compensation in the direction of travel, which is the method that costs no extra move.
MachineDiagnostics.RunOutFit.Extended=The calibration measures at %s angles and tolerates %s misdetections, so it will fit the run-out model to as few as %s points. Three points always yield a circle, whatever the measurements were, so the fit stops being evidence of anything. Accepting sets the tolerance so that a substantially complete set of angles is required.
MachineDiagnostics.SettleTooLong.Extended=The image settled %s ms after a %s mm move on %s, and the camera waits %s ms before it captures. The difference is spent on every capture the machine makes, which over a job of thousands of placements is time spent waiting for something that has already happened.
MachineDiagnostics.SettleTooShort.Extended=The image was still moving %s ms after a %s mm move on %s, and the camera waits %s ms before it captures. Everything that looks through this camera - the calibrations, fiducial location, part alignment - is therefore measuring a moving image, and no amount of calibration afterwards can recover that.
MachineDiagnostics.SuperSampling.Extended=The pipeline's DetectCircularSymmetry stage has super sampling set to %s, so it reports a position to the nearest whole pixel and every calibration built on it inherits that as its floor. Accepting sets it to %s, which is what the vision solutions use for their own detection.
MachineDiagnostics.VisionNoise.Extended=With the machine standing still on %s, %s frames of %s put the fiducial %s px (%s mm) apart, sd, and up to %s px. Every position the machine is measured at goes through this camera, so nothing it measures - backlash, repeatability, homing scatter - can be read closer than this, and every vision correction in a job carries the same scatter into placement. A well lit fiducial in focus holds a tenth of a pixel with sub-pixel detection enabled.
NozzleTipSolutions.BackgroundCalibration=Set background calibration method for %s.
NozzleTipSolutions.BackgroundCalibration.Extended=<html><p>Select the proper background calibration.</p><br/><p><strong color\="red">CAUTION</strong>\: Nozzle %s will move over camera %s and perform a new nozzle tip calibration calibration, including the enabled background calibration. Any problems will be indicated with purple highlights.</p><br/><p>When ready, press Accept.</p></html>
NozzleTipSolutions.MinPartDiameter=Nozzle tip %s has an invalid Min. Part Diameter of %s.
NozzleTipSolutions.MinPartDiameter.Solution=Make the Min. Part Diameter at least as big as the nozzle tip air bore plus two times the Max. Pick Tolerance of %s. Press the blue info button (below) for more information.
VisionSolutions.NozzleFiducialOffsets=Nozzle %s offsets for the %s fiducial.
VisionSolutions.NozzleFiducialOffsets.Solution=Move the nozzle %s to the %s calibration fiducial and capture its offsets.
VisionSolutions.NozzleHeadOffsets.Clause.CapturesZ=<p>This will also capture the calibration %s fiducial Z coordinate.</p><br/>
VisionSolutions.NozzleHeadOffsets.Clause.EqualisesZ=<p>This will also equalize Z of nozzle %s to Z of the default nozzle %s.</p><br/>
VisionSolutions.NozzleHeadOffsets.Extended=<html><p>Once the calibration %s fiducial is captured in X, Y you can use it to capture the nozzle head offsets (first approximation).</p><br/>%s<p>Jog nozzle %s over the %s fiducial. Lower the nozzle tip down until it touches the fiducial.</p><br/><p><strong style\="color\:red;">CAUTION\:</strong> this is a very important Z coordinate, please capture it with care.</p><br/><p>Then press Accept to capture the nozzle head offsets.</p></html>
VisionSolutions.PrimaryFiducial.Extended=<html><p>Camera calibration can be performed automatically by looking at fiducials while moving the camera around in a certain pattern. This solution determines the X, Y position of the primary fiducial and it performs preliminary camera calibration.</p><br/><p>Instructions for how to create and position the primary fiducial must be obtained in the OpenPnP Wiki. <strong>There are very important rules that must be observed\!</strong> Press the blue Info button (below) to open the Wiki.</p><br/><p>Once you have prepared the calibration primary fiducial you can capture its position in X, Y.</p><br/><p>Jog camera %s over the privary fiducial. Target it roughly with the cross-hairs.</p><br/><p>Adjust the <strong>Feature diameter</strong> up and down and see if it is detected right in the camera view. A green circle and cross-hairs should appear and hug the fiducial contour. Zoom the camera using the scroll-wheel.</p><br/><p>Then press Accept to capture the position. The camera will perform a small calibration movement pattern</p></html>
VisionSolutions.SecondaryFiducial.Extended=<html><p>Camera calibration also requires looking at a secondary fiducial at different Z level. This will provide the calibration algorithm with the needed 3D/spacial information to determine the true focal length of the lens and the optical position of the camera in space.</p><br/><p>Instructions for how to create and position the secondary fiducial must be obtained in the OpenPnP Wiki. There are very important rules that must be observed, so don't miss it\! Press the blue Info button (below) to open the Wiki.</p><br/><p>Once you have prepared the calibration secondary fiducial you can capture its position in X, Y.</p><br/><p>Jog camera %s over the secondary fiducial. Target it roughly with the cross-hairs.</p><br/><p>Adjust the <strong>Feature diameter</strong> up and down and see if it is detected right in the camera view. A green circle and cross-hairs should appear and hug the fiducial contour. Zoom the camera using the scroll-wheel.</p><br/><p>Then press Accept to capture the position.</p></html>
VisionSolutions.UpLookingCamera.Extended=<html><p>Up-looking camera calibration can be performed automatically by looking at a nozzle tip while moving the nozzle around in a certain pattern. This solution determines the X, Y position of the camera and it performs preliminary camera calibration.</p><br/><p>Load nozzle %s with the smallest nozzle tip that you can reliably detect (it may take some trial and error).</p><br/><p>Jog nozzle %s over the camera %s. Target it with the cross-hairs.</p><br/><p>Jog the nozzle tip point down in Z so it is in focus. This should be more or less on the same Z level as the PCB surface. If not, consider adjusting the camera focus to make it so.</p><br/><p>If enabled, auto-focus will be used to detect the precise Z location.</p><br/><p>Adjust the <strong>Feature diameter</strong> up and down and see if it is detected right in the camera view. A green circle and cross-hairs should appear and hug the wanted contour. Zoom the camera using the scroll-wheel.</p><br/><p>Make sure to target a circular edge that can be detected consistently even when seen from the side. This means it has to be a rather sharp-angled edge. Typically, the air bore contour is targeted.</p><br/><p>Then press Accept to capture the camera position.</p></html>
VisionSolutions.UpLookingCameraPosition=Determine the up-looking camera %s position and initial calibration.
VisionSolutions.UpLookingCameraPosition.Solution=Move the nozzle %s over the up-looking camera %s and capture the position.
VisionSolutions.VisualHoming.Extended=<html><p>Mount a permanent fiducial to your machine table. Choose a mounting point that is mechanically coupled to the most important parts of your machine table. Make sure it is very unlikely you will ever need to change this new frame of reference. The fiducial must be at the same Z level as the PCB surface. More information is avaible online, please press the blue Info button (below).</p><br/><p>Home the machine by means of your controller/manually. The controller must presently work in the wanted coordinate system.</p><br/><p>Jog camera %s over the fiducial. Target it roughly with the cross-hairs.</p><br/><p>Adjust the <strong>Feature diameter</strong> up and down and see if it is detected right in the camera view. A green circle and cross-hairs should appear and hug the fiducial contour. Zoom the camera using the scroll-wheel.</p><br/><p>Then press Accept to detect the precise position of the fiducial and set it up for visual homing.</p><br/><p>Note\: This will not change your present machine coordinate system, but rather pin it down to the fiducial. If the mechanics were to change slightly in the future (e.g. a homing end-switch slightly moved), the homing fiducial will still be able to precisely preserve the frame of reference in X and Y.</p></html>
