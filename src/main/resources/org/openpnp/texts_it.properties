A\ HTTPActuator\ with\ Read\ URL\ likely\ needs\ a\ regular\ Expression\ to\ parse\ the\ value.=Un HTTPActuator con URL di lettura richiede probabilmente un'espressione regolare per interpretare il valore.
A\ high\ Preview\ FPS\ value\ might\ create\ undue\ CPU\ load.=Un valore elevato di FPS di anteprima può creare un carico eccessivo sulla CPU.
Accept\ to\ replace\ ACTUATOR_READ_COMMAND\ with\ ACTUATOR_READ_WITH_DOUBLE_COMMAND.\ Dismiss\ to\ remove\ read\ with\ double.=Accetta per sostituire ACTUATOR_READ_COMMAND con ACTUATOR_READ_WITH_DOUBLE_COMMAND. Ignora per rimuovere la lettura con double.
Advanced\ Motion\ Planner\ not\ set.\ Accept\ or\ Dismiss\ to\ continue.=Il pianificatore di movimento avanzato non è impostato. Accetta o ignora per continuare.
Advanced\ motion\ planner\ set.\ Revert\ to\ a\ simpler,\ safer\ planner.=Pianificatore di movimento avanzato impostato. Torna a un pianificatore più semplice e sicuro.
Assign\ a\ driver\ as\ described\ in\ the\ Wiki.=Assegna un driver come descritto nel Wiki.
Assign\ a\ driver.=Assegna un driver.
Assign\ the\ unique\ axis\ letter\ where\ wrong,\ press\ Accept,\ then\ press\ Find\ Issues\ &\ Solutions\ again\ to\ clear\ the\ correct\ one.=Assegna la lettera d'asse univoca dove è errata, premi Accetta, poi premi di nuovo Trova problemi e soluzioni per risolvere quella corretta.
Avoid\ axis\ letter\ E,\ if\ possible.\ Use\ proper\ rotation\ axes\ instead.=Se possibile evita la lettera d'asse E. Usa invece veri assi di rotazione.
Axes\ should\ be\ configured\ as\ linear\ in\ feedrate\ calculations\ on\ the\ RepRapFirmware\ controller.\ See\ the\ linked\ web\ page.=Sul controller RepRapFirmware gli assi dovrebbero essere configurati come lineari nel calcolo della velocità di avanzamento. Vedi la pagina web collegata.
Axis\ is\ not\ assigned\ to\ a\ driver.=L'asse non è assegnato a un driver.
Axis\ letter\ is\ missing.\ Assign\ the\ letter\ to\ continue.=Manca la lettera d'asse. Assegna la lettera per continuare.
Axis\ should\ be\ treated\ as\ a\ linear\ for\ detected\ firmware\ (all-primary\ axes\ mode).=Per il firmware rilevato l'asse dovrebbe essere trattato come lineare (modalità con tutti gli assi primari).
Axis\ velocity\ limited\ by\ driver\ Maximum\ Feed\ Rate.\ =Velocità dell'asse limitata dalla velocità di avanzamento massima del driver. 
Change\ of\ serial\ port\ Flow\ Control\ recommended.=Si consiglia di modificare il controllo di flusso della porta seriale.
Change\ to\ NullMotionPlanner=Passa a NullMotionPlanner
Change\ to\ ReferenceAdvancedMotionPlanner=Passa a ReferenceAdvancedMotionPlanner
Check\ axis\ letters\ and\ make\ sure\ the\ controller\ is\ capable\ to\ use\ extra\ axes\ (i.e.\ not\ extruders).=Controlla le lettere degli assi e assicurati che il controller sia in grado di usare assi aggiuntivi (cioè non estrusori).
Check\ axis\ letters\ and\ make\ sure\ use\ a\ proper\ 6-axis\ configuration\ without\ extruders.=Controlla le lettere degli assi e assicurati di usare una vera configurazione a 6 assi senza estrusori.
Check\ out\ firmwares\ known\ to\ be\ well\ supported.\ See\ info\ link.=Valuta i firmware noti per essere ben supportati. Vedi il link informativo.
Choose\ an\ advanced\ Motion\ Control\ Type\ for\ your\ controller\ type.=Scegli un tipo di controllo del movimento avanzato adatto al tuo tipo di controller.
Choose\ the\ right\ communications\ type\ and\ port/address\ settings.=Scegli il tipo di comunicazione corretto e le impostazioni di porta/indirizzo.
Choose\ the\ simplest\ Motion\ Control\ Type\ for\ the\ first\ basic\ setup.=Scegli il tipo di controllo del movimento più semplice per la prima configurazione di base.
Compress\ Gcode\ for\ superior\ communications\ speed.=Comprimi il G-code per una velocità di comunicazione superiore.
Connect\ the\ driver\ to\ your\ controller.=Collega il driver al tuo controller.
Contact\ probe\ actuator\ needs\ unconditional\ machine\ coordination\ after\ actuation.=L'attuatore della tastatura a contatto richiede il coordinamento incondizionato con la macchina dopo l'azionamento.
Convert\ to\ GcodeAsyncDriver.=Converti in GcodeAsyncDriver.
Convert\ to\ GcodeDriver.=Converti in GcodeDriver.
Converting\ the\ ContactProbeNozzle\ back\ to\ a\ plain\ ReferenceNozzle\ may\ simplify\ the\ machine\ setup.=Riconvertire il ContactProbeNozzle in un semplice ReferenceNozzle può semplificare la configurazione della macchina.
Depending\ on\ the\ type\ of\ nozzle\ tip\ or\ shade,\ select\ the\ proper\ background\ calibration.=A seconda del tipo di puntale o della sua tonalità, seleziona la calibrazione dello sfondo adeguata.
Determine\ the\ camera\ head\ offsets.=Determina gli offset della telecamera sulla testa.
Disable\ Allow\ Letter\ Pre-Move\ Commands.=Disabilita i comandi pre-movimento a lettera.
Disable\ Compress\ G-code.=Disabilita la compressione del G-code.
Disable\ Confirmation\ Flow\ Control\ for\ full\ asynchronous\ operation.=Disabilita il controllo di flusso con conferma per un funzionamento completamente asincrono.
Disable\ Confirmation\ Flow\ Control.=Disabilita il controllo di flusso con conferma.
Disable\ Connection\ Keep-Alive.=Disabilita il Keep Alive della connessione.
Disable\ G-code\ compression\ for\ trouble-free\ operation\ with\ incompatible\ controllers.=Disabilita la compressione del G-code per un funzionamento senza problemi con controller non compatibili.
Disable\ Location\ Confirmation=Disabilita la conferma della posizione
Disable\ Remove\ Comments.=Disabilita la rimozione dei commenti.
Disable\ Wrap\ Around.=Disabilita il percorso più breve.
Disallow\ Pre-Move\ Commands\ for\ automatic\ G-code\ setup\ and\ other\ advanced\ features.\ Accept\ or\ Dismiss\ to\ continue.=Non consentire i comandi pre-movimento per abilitare la configurazione automatica del G-code e altre funzioni avanzate. Accetta o ignora per continuare.
Enable\ Auto\ Camera\ View.=Abilita la vista telecamera automatica.
Enable\ Auto\ tool\ select.=Abilita la selezione automatica dell'utensile.
Enable\ Compress\ Gcode.=Abilita la compressione del G-code.
Enable\ Confirmation\ Flow\ Control.=Abilita il controllo di flusso con conferma.
Enable\ Continuous\ Motion.=Abilita il movimento continuo.
Enable\ Letter\ Variables.=Abilita le variabili a lettera.
Enable\ Limit\ to\ Range.=Abilita Limita all'intervallo.
Enable\ Location\ Confirmation=Abilita la conferma della posizione
Enable\ Location\ Confirmation.=Abilita la conferma della posizione.
Enable\ Pre-Rotate.=Abilita la pre-rotazione.
Enable\ Remove\ Comments.=Abilita la rimozione dei commenti.
Enable\ Suspend\ during\ tasks.=Abilita la sospensione durante le operazioni.
Enable\ Visual\ Homing.=Abilita l'Home visivo.
Enable\ Wrap\ Around.=Abilita il percorso più breve.
Enable\ script\ engine\ pooling.=Abilita il pool di motori di scripting.
Feed-rate,\ acceleration,\ jerk\ etc.\ can\ now\ be\ set\ individually\ per\ axis.=Velocità di avanzamento, accelerazione, jerk ecc. possono ora essere impostati singolarmente per ogni asse.
Feeder\ has\ no\ configured\ offset=L'alimentatore non ha un offset configurato
Feeder\ slot\ has\ no\ configured\ location=Lo slot dell'alimentatore non ha una posizione configurata
For\ best\ results\ with\ color-keyed\ computer\ vision,\ it\ is\ recommended\ to\ use\ static\ white\ balance.=Per i migliori risultati con la visione artificiale basata sul colore si consiglia di usare il bilanciamento del bianco statico.
Get\ the\ new\ version\ through\ the\ linked\ web\ page.=Scarica la nuova versione dalla pagina web collegata.
Go\ to\ the\ nozzle(s)\ and\ enable\ the\ Compatible\ switches\ where\ appropriate.=Vai agli ugelli e abilita gli interruttori di compatibilità dove opportuno.
Home\ the\ machine\ now.=Esegui ora l'Home della macchina.
In\ single\ camera\ preview\ OpenPnP\ can\ automatically\ switch\ the\ camera\ for\ you.=Nell'anteprima a telecamera singola OpenPnP può cambiare telecamera automaticamente al posto tuo.
It\ is\ OK\ to\ share\ rotation\ axes.\ If\ intentional,\ just\ dismiss\ this\ issue.\ Otherwise\ assign\ a\ different\ Rotation\ axis.=Condividere gli assi di rotazione è accettabile. Se è voluto, ignora semplicemente questo problema. Altrimenti assegna un asse di rotazione diverso.
Keep\ G-code\ comments\ for\ better\ debugging.=Mantieni i commenti del G-code per un debug più agevole.
Link\ the\ Placements/Parts/Packages/Vision\ Settings/Feeders\ tables\ between\ tabs.=Collega tra le schede le tabelle Posizionamenti/Componenti/Package/Impostazioni di visione/Alimentatori.
Location\ Confirmation\ recommended\ for\ extra\ features\ in\ homing,\ contact\ probing,\ etc.=La conferma della posizione è consigliata per funzioni aggiuntive nell'Home, nella tastatura a contatto ecc.
Location\ Confirmation\ usually\ not\ available\ when\ no\ axes\ present.=La conferma della posizione di solito non è disponibile quando non è presente alcun asse.
Marlin\ sends\ location-like\ responses\ to\ other\ commands\ so\ Location\ Confirmation\ is\ not\ reliable=Marlin invia risposte simili a quelle di posizione anche per altri comandi, quindi la conferma della posizione non è affidabile
Mount\ a\ permanent\ fiducial\ to\ your\ machine\ and\ use\ it\ for\ repeatable\ precision\ X/Y\ homing.=Monta un fiducial permanente sulla macchina e usalo per un Home X/Y preciso e ripetibile.
Move\ the\ camera\ over\ the\ primary\ calibration\ fiducial\ and\ capture\ its\ position.=Sposta la telecamera sopra il fiducial di calibrazione primario e acquisiscine la posizione.
Move\ the\ camera\ over\ the\ secondary\ calibration\ fiducial\ and\ capture\ its\ position.=Sposta la telecamera sopra il fiducial di calibrazione secondario e acquisiscine la posizione.
Only\ the\ GcodeAsyncDriver\ currently\ supports\ it.\ Advanced\ milestone\ required.=Al momento è supportato solo dal GcodeAsyncDriver. È richiesta la fase Advanced.
OpenPnP\ can\ often\ automatically\ select\ the\ right\ tool\ for\ you\ in\ Machine\ Controls.=Nei comandi macchina OpenPnP può spesso selezionare automaticamente l'utensile giusto al posto tuo.
Please\ add\ the\ command\ manually.=Aggiungi il comando manualmente.
Please\ assign\ a\ different\ Z\ axis.=Assegna un asse Z diverso.
Please\ assign\ a\ proper\ Rotation\ axis.\ You\ might\ need\ to\ create\ one\ first.=Assegna un vero asse di rotazione. Potrebbe essere necessario crearne prima uno.
Please\ assign\ a\ proper\ Z\ axis.\ You\ might\ need\ to\ create\ one\ first.=Assegna un vero asse Z. Potrebbe essere necessario crearne prima uno.
Please\ upgrade\ the\ firmware\ and/or\ axis\ configuration.\ See\ the\ info\ link.=Aggiorna il firmware e/o la configurazione degli assi. Vedi il link informativo.
Please\ upgrade\ to\ the\ special\ PnP\ version.\ See\ info\ link.=Aggiorna alla versione speciale PnP. Vedi il link informativo.
Pre-rotate\ bottom\ vision\ must\ be\ enabled,\ because\ the\ machine\ has\ a\ limited\ articulation\ nozzle.=La pre-rotazione della Bottom Vision deve essere abilitata, perché la macchina ha un ugello ad articolazione limitata.
Primary\ calibration\ fiducial\ position\ and\ initial\ camera\ calibration.=Posizione del fiducial di calibrazione primario e calibrazione iniziale della telecamera.
Primary/secondary\ calibration\ fiducial\ Z\ too\ close\ together.=Le Z dei fiducial di calibrazione primario e secondario sono troppo vicine tra loro.
Remove\ Gcode\ comments\ for\ superior\ communications\ speed.=Rimuovi i commenti dal G-code per una velocità di comunicazione superiore.
Remove\ driver\ Maximum\ Feed\ Rate.=Rimuovi la velocità di avanzamento massima del driver.
Remove\ the\ command.=Rimuovi il comando.
Replace\ with\ ContactProbeNozzle.=Sostituisci con ContactProbeNozzle.
Replace\ with\ ReferenceNozzle.=Sostituisci con ReferenceNozzle.
Retry\ the\ detection\ by\ connecting\ to\ the\ controller\ or\ assume\ a\ generic\ controller.=Riprova il rilevamento collegandoti al controller oppure assumi un controller generico.
Rotation\ can\ be\ optimized\ by\ wrapping-around\ the\ shorter\ way.\ Best\ combined\ with\ Limit\ ±180°.=La rotazione può essere ottimizzata passando per la via più breve. Meglio se combinata con Limita a ±180°.
Rotation\ cannot\ be\ wrapped-around\ on\ a\ limited\ articulation\ axis.=Su un asse ad articolazione limitata la rotazione non può passare per la via più breve.
Rotation\ must\ be\ limited\ on\ a\ limited\ articulation\ axis.=Su un asse ad articolazione limitata la rotazione deve essere limitata.
Script\ execuction\ performance\ can\ be\ improved\ by\ enabling\ engine\ pooling.=Le prestazioni di esecuzione degli script possono essere migliorate abilitando il pool di motori.
Secondary\ calibration\ fiducial\ position.=Posizione del fiducial di calibrazione secondario.
Select\ the\ feeder\ in\ the\ Feeders\ tab\ and\ make\ sure\ the\ feeder\ has\ an\ offset\ location\ from\ the\ slot=Seleziona l'alimentatore nella scheda Alimentatori e assicurati che abbia una posizione di offset rispetto allo slot
Select\ the\ feeder\ in\ the\ Feeders\ tab\ and\ make\ sure\ the\ slot\ has\ a\ set\ location=Seleziona l'alimentatore nella scheda Alimentatori e assicurati che lo slot abbia una posizione impostata
Set\ After\ Actuation\ machine\ coordination\ to\ WaitForUnconditionalCoordination.=Imposta il coordinamento con la macchina dopo l'azionamento su WaitForUnconditionalCoordination.
Set\ a\ suitable\ camera\ settling\ method\ automatically.=Imposta automaticamente un metodo di assestamento della telecamera adeguato.
Set\ an\ example\ expression=Imposta un'espressione di esempio
Set\ to\ 5\ FPS.=Imposta a 5 FPS.
Set\ to\ Rendering\ Quality\ to\ High\ (right\ click\ the\ Camera\ View\ to\ see\ other\ options).=Imposta la qualità di rendering su High (fai clic con il tasto destro sulla vista della telecamera per vedere le altre opzioni).
The\ nozzle\ can\ be\ replaced\ with\ a\ ContactProbeNozzle\ to\ support\ various\ probing\ features.=L'ugello può essere sostituito con un ContactProbeNozzle per supportare varie funzioni di tastatura.
The\ preview\ rendering\ quality\ can\ be\ improved.=La qualità di rendering dell'anteprima può essere migliorata.
To\ continue,\ the\ machine\ must\ be\ enabled\ and\ homed.=Per continuare la macchina deve essere abilitata e con l'Home eseguito.
Use\ Axis\ Letter\ Variables\ for\ simpler\ use,\ automatic\ G-code\ setup,\ and\ other\ advanced\ features.=Usa le variabili a lettera d'asse per un uso più semplice, la configurazione automatica del G-code e altre funzioni avanzate.
Use\ Keep-Alive\ only\ when\ necessary.\ It\ may\ cause\ hard\ to\ diagnose\ problems.=Usa il Keep Alive solo quando è necessario. Può causare problemi difficili da diagnosticare.
Use\ an\ adaptive\ camera\ settling\ method.=Usa un metodo adattivo di assestamento della telecamera.
Use\ continuous\ motion.\ OpenPnP\ will\ only\ wait\ for\ the\ machine\ when\ really\ needed.=Usa il movimento continuo. OpenPnP attenderà la macchina solo quando è davvero necessario.
Use\ the\ GcodeAsyncDriver\ for\ advanced\ features.\ Accept\ or\ Dismiss\ to\ continue.=Usa il GcodeAsyncDriver per le funzioni avanzate. Accetta o ignora per continuare.
Use\ the\ GcodeDriver\ for\ simpler\ setup.\ Accept\ or\ Dismiss\ to\ continue.=Usa il GcodeDriver per una configurazione più semplice. Accetta o ignora per continuare.
Use\ the\ M584\ S0\ option\ in\ your\ config.g\ file.=Usa l'opzione M584 S0 nel tuo file config.g.
On\ the\ camera's\ Device\ Settings\ tab\ select\ the\ correct\ Device\ and\ Format.\ Then\ click\ on\ the\ Capture\ FPS\ Test\ button.\ An\ image\ from\ the\ camera\ should\ appear\ in\ the\ camera's\ view\ pane.=Nella scheda delle impostazioni del dispositivo della telecamera seleziona il dispositivo e il formato corretti. Poi fai clic sul pulsante di prova degli FPS di acquisizione. Nel pannello della vista della telecamera dovrebbe comparire un'immagine.
Camera\ not\ connected\ to\ Pono=Telecamera non collegata a Pono
