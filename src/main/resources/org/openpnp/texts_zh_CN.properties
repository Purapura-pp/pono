Disable\ Compress\ G-code.=关闭 Compress G-code（压缩 G 代码）。
Disable\ Confirmation\ Flow\ Control\ for\ full\ asynchronous\ operation.=关闭 Confirmation Flow Control（确认流控制）以实现完全异步运行。
Disable\ Confirmation\ Flow\ Control.=关闭 Confirmation Flow Control（确认流控制）。
Disable\ Connection\ Keep-Alive.=关闭 Connection Keep-Alive（连接保活）。
Disable\ G-code\ compression\ for\ trouble-free\ operation\ with\ incompatible\ controllers.=关闭 G 代码压缩，以便与不兼容的主控稳定配合。
Disable\ Location\ Confirmation=关闭 Location Confirmation（位置确认）
Disable\ Remove\ Comments.=关闭 Remove Comments（移除注释）。
Disable\ Switch\ Linear\ ↔\ Rotational.=关闭「线性 ↔ 旋转」互换。
Disable\ Wrap\ Around.=关闭 Wrap Around（角度绕行）。
Disallow\ Pre-Move\ Commands\ for\ automatic\ G-code\ setup\ and\ other\ advanced\ features.\ Accept\ or\ Dismiss\ to\ continue.=禁用 Pre-Move Commands（移动前指令）方可使用自动 G 代码配置等高级功能。接受或忽略以继续。
Enable\ Auto\ Camera\ View.=启用 Auto Camera View（自动相机视图）。
Enable\ Auto\ tool\ select.=启用 Auto tool select（自动选择工具）。
Enable\ Compress\ Gcode.=启用 Compress Gcode（压缩 G 代码）。
Enable\ Confirmation\ Flow\ Control,\ controller\ has\ no\ axes,\ serial\ flow\ control\ is\ not\ available.=启用 Confirmation Flow Control（确认流控制）：主控没有报告轴，且串口流控不可用。
Enable\ Confirmation\ Flow\ Control,\ controller\ has\ no\ axes.=启用 Confirmation Flow Control（确认流控制）：主控没有报告轴。
Enable\ Confirmation\ Flow\ Control,\ serial\ flow\ control\ is\ not\ available.=启用 Confirmation Flow Control（确认流控制）：串口流控不可用。
Enable\ Confirmation\ Flow\ Control.=启用 Confirmation Flow Control（确认流控制）。
Enable\ Continuous\ Motion.=启用 Continuous Motion（连续运动）。
Enable\ Letter\ Variables.=启用 Letter Variables（字母变量）。
Enable\ Limit\ to\ Range.=启用 Limit to Range（限制在范围内）。
Enable\ Location\ Confirmation=启用 Location Confirmation（位置确认）
Enable\ Location\ Confirmation.=启用 Location Confirmation（位置确认）。
Enable\ Pre-Rotate.=启用 Pre-Rotate（预旋转）。
Enable\ Remove\ Comments.=启用 Remove Comments（移除注释）。
Enable\ Suspend\ during\ tasks.=启用 Suspend during tasks（任务期间挂起）。
Enable\ Switch\ Linear\ ↔\ Rotational.=启用「线性 ↔ 旋转」互换。
Enable\ Visual\ Homing.=启用视觉归位（Visual Homing）。
Enable\ Wrap\ Around.=启用 Wrap Around（角度绕行）。
Enable\ part\ aligned\ nozzle\ rotation\ mode,\ so\ camera\ view\ cross-hairs\ and\ DRO-coordinates\ show\ the\ bottom\ vision\ aligned\ part\ rotation\ instead\ of\ the\ unadjusted\ nozzle\ rotation.=启用「按元件对齐的吸嘴旋转」模式，使相机视图的十字标线与 DRO 坐标显示的是经底部视觉对齐后的元件角度，而不是未修正的吸嘴角度。
Enable\ script\ engine\ pooling.=启用脚本引擎池。
Feed\ rate\ per\ second=每秒进给速率
Feeder\ has\ no\ configured\ offset=供料器未配置偏移量
Feeder\ slot\ has\ no\ configured\ location=供料器槽位未配置位置
Feed-rate,\ acceleration,\ jerk\ etc.\ can\ now\ be\ set\ individually\ per\ axis.=进给速率、加速度、Jerk（急动度）等现在可以按轴单独设置。
Firmware\ was\ not\ detected\ (controller\ may\ not\ speak\ Gcode).\ Only\ if\ the\ firmware\ is\ know,\ can\ Issues\ &\ Solutions\ generate\ suggested\ G-code\ for\ your\ machine\ configuration.=未检测到固件（该主控可能不使用 G-code）。只有识别出固件，「问题与解决方案」才能为你的机器配置生成建议的 G-code。
Firmware\ was\ not\ detected\ (failure,\ check\ log).\ Only\ if\ the\ firmware\ is\ know,\ can\ Issues\ &\ Solutions\ generate\ suggested\ G-code\ for\ your\ machine\ configuration.=未检测到固件（检测失败，请查看日志）。只有识别出固件，「问题与解决方案」才能为你的机器配置生成建议的 G-code。
Firmware\ was\ not\ detected\ (machine\ is\ disabled).\ Only\ if\ the\ firmware\ is\ know,\ can\ Issues\ &\ Solutions\ generate\ suggested\ G-code\ for\ your\ machine\ configuration.=未检测到固件（机器未启用）。只有识别出固件，「问题与解决方案」才能为你的机器配置生成建议的 G-code。
For\ a\ SwitcherCamera\ it\ is\ mandatory\ to\ suspend\ camera\ preview\ during\ machine\ tasks\ /\ Jobs.=对 SwitcherCamera 而言，在机器任务／任务运行期间暂停相机预览是必须的。
For\ best\ results\ with\ color-keyed\ computer\ vision,\ it\ is\ recommended\ to\ use\ static\ white\ balance.=使用色键类机器视觉时，建议采用静态白平衡以获得最佳效果。
Get\ the\ new\ version\ through\ the\ linked\ web\ page.=请通过链接页面获取新版本。
Go\ to\ the\ nozzle(s)\ and\ enable\ the\ Compatible\ switches\ where\ appropriate.=请到相应吸嘴中，按需打开 Compatible（兼容）开关。
Home\ the\ machine\ now.=立即执行机器 Home 归位。
Homing\ does\ not\ put\ the\ machine\ origin\ back\ in\ the\ same\ place.=每次归位得到的机器原点都不在同一处。
How\ far\ past\ the\ target\ the\ axis\ drives\ before\ approaching\ it.=轴在接近目标之前先越过目标多远。
How\ far\ the\ commanded\ angle\ is\ shifted\ in\ the\ direction\ the\ axis\ is\ turning.=指令角度沿着轴的旋转方向偏移多少。
In\ single\ camera\ preview\ OpenPnP\ can\ automatically\ switch\ the\ camera\ for\ you.=在单相机预览模式下，OpenPnP 可以自动为您切换相机。
It\ is\ OK\ to\ share\ rotation\ axes.\ If\ intentional,\ just\ dismiss\ this\ issue.\ Otherwise\ assign\ a\ different\ Rotation\ axis.=共用旋转轴是允许的。若为有意设置，忽略此问题即可；否则请指定另一个旋转轴。
It\ is\ recommended\ to\ suspend\ camera\ preview\ during\ machine\ tasks\ /\ Jobs.=建议在机器任务／任务运行期间暂停相机预览。
Keep\ G-code\ comments\ for\ better\ debugging.=保留 G 代码注释以便于调试。
Link\ the\ Placements/Parts/Packages/Vision\ Settings/Feeders\ tables\ between\ tabs.=在各标签页之间联动 贴装/元件/封装/视觉设置/供料器 这几个表格。
Location\ Confirmation\ recommended\ for\ extra\ features\ in\ homing,\ contact\ probing,\ etc.=建议启用 Location Confirmation（位置确认），归位、接触探测等功能可借此获得额外能力。
Location\ Confirmation\ required\ when\ Confirmation\ Flow\ Control\ is\ off.\ Supports\ extra\ features\ in\ homing,\ contact\ probing,\ etc.=关闭 Confirmation Flow Control（确认流控制）时必须启用位置确认。它还为归零、接触探测等功能提供支持。
Location\ Confirmation\ usually\ not\ available\ when\ no\ axes\ present.=没有任何轴时，Location Confirmation（位置确认）通常不可用。
Lower\ the\ axis\ acceleration\ to\ the\ controller's\ own\ limit.=把轴的加速度降到主控自身的上限。
Lower\ the\ axis\ feed\ rate\ to\ the\ controller's\ own\ limit.=把轴的进给速率降到主控自身的上限。
Make\ sure\ the\ Max.\ Part\ Diameter\ is\ larger\ than\ the\ Min.\ Part\ Diameter.\ Press\ the\ blue\ info\ button\ (below)\ for\ more\ information.=请确保【最大】元件直径大于【最小】元件直径。点击下方的蓝色信息按钮了解更多。
Marlin\ sends\ location-like\ responses\ to\ other\ commands\ so\ Location\ Confirmation\ is\ not\ reliable=Marlin 在响应其他指令时也会发出形似位置报告的内容，因此 Location Confirmation（位置确认）并不可靠
Mount\ a\ permanent\ fiducial\ to\ your\ machine\ and\ use\ it\ for\ repeatable\ precision\ X/Y\ homing.=在机器上固定一个永久基准点，用它实现可重复的高精度 X/Y 归位。
Move\ the\ camera\ over\ the\ primary\ calibration\ fiducial\ and\ capture\ its\ position.=把相机移动到主校准基准点上方，并采集其位置。
Move\ the\ camera\ over\ the\ secondary\ calibration\ fiducial\ and\ capture\ its\ position.=把相机移动到次校准基准点上方，并采集其位置。
Nozzle\ tip\ run-out\ calibration\ accepts\ too\ few\ measurements\ to\ be\ meaningful.=吸嘴头跳动标定接受的测量点太少，结果没有意义。
One-sided\ backlash\ compensation\ is\ set\ to\ less\ offset\ than\ the\ axis\ has\ backlash.=单侧定位的补偿量小于该轴实际的反向间隙。
Only\ the\ GcodeAsyncDriver\ currently\ supports\ it.\ Advanced\ milestone\ required.=目前仅 GcodeAsyncDriver 支持该功能，且需达到 Advanced 里程碑。
OpenPnP\ can\ often\ automatically\ select\ the\ right\ tool\ for\ you\ in\ Machine\ Controls.=在机器控制面板中，OpenPnP 通常可以自动为您选中正确的工具。
Please\ add\ the\ command\ manually.=请手动添加该指令。
Please\ assign\ a\ different\ Z\ axis.=请指定另一个 Z 轴。
Please\ assign\ a\ proper\ Rotation\ axis.\ You\ might\ need\ to\ create\ one\ first.=请指定一个合适的旋转轴，可能需要先创建一个。
Please\ assign\ a\ proper\ Z\ axis.\ You\ might\ need\ to\ create\ one\ first.=请指定一个合适的 Z 轴，可能需要先创建一个。
Please\ assign\ the\ correct\ controller\ axis\ letter.\ Choose\ from\ the\ list\ or\ enter\ a\ custom\ letter\ (some\ contoller\ may\ support\ an\ extended\ range\ of\ letters).=请指定正确的主控轴字母。可以从列表中选择，也可以自行输入（部分主控支持更大范围的字母）。
Please\ assign\ the\ correct\ controller\ axis\ letter.\ Some\ controllers\ may\ not\ report\ all\ axes\ on\ M114,\ in\ which\ case\ the\ letter\ might\ still\ be\ valid.\ Press\ the\ blue\ info\ button\ (below)\ for\ more\ information.=请指定正确的主控轴字母。部分主控在 M114 中不会报告全部轴，这种情况下该字母仍可能是有效的。点击下方的蓝色信息按钮了解更多。
Please\ assign\ the\ correct\ controller\ axis\ letter.\ Some\ controllers\ may\ support\ an\ extended\ range\ of\ letters,\ in\ which\ case\ the\ letter\ might\ still\ be\ valid.\ Press\ the\ blue\ info\ button\ (below)\ for\ more\ information.=请指定正确的主控轴字母。部分主控支持更大范围的字母，这种情况下该字母仍可能是有效的。点击下方的蓝色信息按钮了解更多。
Please\ upgrade\ the\ firmware\ and/or\ axis\ configuration.\ See\ the\ info\ link.=请升级固件和／或调整轴配置。详见信息链接。
Please\ upgrade\ to\ the\ special\ PnP\ version.\ See\ info\ link.=请升级到专用的 PnP 版本。详见信息链接。
Pre-rotate\ bottom\ vision\ must\ be\ allowed\ on\ all\ vision\ settings,\ because\ the\ machine\ has\ a\ limited\ articulation\ nozzle.=所有视觉配置都必须允许「底部视觉预旋转」，因为本机的吸嘴摆角受限。
Pre-rotate\ bottom\ vision\ must\ be\ enabled,\ because\ the\ machine\ has\ a\ limited\ articulation\ nozzle.=必须启用底部视觉的预旋转，因为本机存在转动范围受限的吸嘴。
Primary\ calibration\ fiducial\ position\ and\ initial\ camera\ calibration.=主校准基准点位置与相机的初始标定。
Primary/secondary\ calibration\ fiducial\ Z\ too\ close\ together.=主、次校准基准点的 Z 坐标过于接近。
Raise\ the\ offset\ past\ the\ backlash\ that\ was\ measured.=把补偿量提高到超过实测的反向间隙。
Re-capture\ the\ homing\ fiducial\ at\ the\ primary\ calibration\ fiducial,\ or\ confirm\ that\ they\ are\ deliberately\ different.=在主标定基准点处重新采集归位基准点，或者确认这两处是有意分开的。
Reduce\ the\ misdetections\ it\ tolerates.=减少它允许的漏检次数。
Remove\ driver\ Maximum\ Feed\ Rate.=移除驱动上的 Maximum Feed Rate（最大进给速率）限制。
Remove\ Gcode\ comments\ for\ superior\ communications\ speed.=移除 G 代码注释可显著提升通信速度。
Remove\ the\ command.=移除该指令。
Replace\ with\ ContactProbeNozzle.=替换为 ContactProbeNozzle。
Replace\ with\ ReferenceNozzle.=替换为 ReferenceNozzle。
Resolution=分辨率
Retry\ the\ detection\ by\ connecting\ to\ the\ controller\ or\ assume\ a\ generic\ controller.=可连接主控后重试检测，或按通用主控处理。
Rotation\ can\ be\ optimized\ by\ limiting\ angles\ to\ ±180°.\ Best\ combined\ with\ Wrap\ Around.=把角度限制在 ±180° 可以优化旋转。与「角度回绕」配合使用效果最佳。
Rotation\ can\ be\ optimized\ by\ wrapping-around\ the\ shorter\ way.\ Best\ combined\ with\ Limit\ ±180°.=旋转可以通过就近绕行来优化，与 Limit ±180° 搭配效果最佳。
Rotation\ cannot\ be\ wrapped-around\ on\ a\ limited\ articulation\ axis.=在转动范围受限的轴上无法进行角度绕行。
Rotation\ must\ be\ limited\ on\ a\ limited\ articulation\ axis.=在转动范围受限的轴上必须限制旋转角度。
Script\ execuction\ performance\ can\ be\ improved\ by\ enabling\ engine\ pooling.=启用引擎池可以提升脚本执行性能。
Secondary\ calibration\ fiducial\ position.=次校准基准点的位置。
Select\ the\ feeder\ in\ the\ Feeders\ tab\ and\ make\ sure\ the\ feeder\ has\ an\ offset\ location\ from\ the\ slot=请在供料器标签页中选中该供料器，并确认它相对槽位设置了偏移位置
Select\ the\ feeder\ in\ the\ Feeders\ tab\ and\ make\ sure\ the\ slot\ has\ a\ set\ location=请在供料器标签页中选中该供料器，并确认其槽位已设置位置
Set\ a\ suitable\ camera\ settling\ method\ automatically.=自动设置合适的相机稳定策略（Camera Settling）。
Set\ After\ Actuation\ machine\ coordination\ to\ WaitForUnconditionalCoordination.=将 After Actuation（动作之后）的机器协调设为 WaitForUnconditionalCoordination。
Set\ an\ example\ expression=设置一个示例表达式
Set\ the\ Max.\ Pick\ Tolerance\ to\ the\ actual\ pick\ errors\ you\ expect.\ Press\ the\ blue\ info\ button\ (below)\ for\ more\ information.=请把【最大】取料偏差设为你预期的实际取料误差。点击下方的蓝色信息按钮了解更多。
Set\ the\ axis\ acceleration\ to\ the\ one\ it\ was\ measured\ reaching.=把轴的加速度设为实测能达到的那个值。
Set\ the\ axis\ feed\ rate\ to\ the\ one\ it\ was\ measured\ reaching.=把轴的进给速率设为实测能达到的那个值。
Set\ the\ resolution\ to\ one\ controller\ step.=把分辨率设为主控的一个步距。
Set\ to\ 5\ FPS.=设为 5 FPS。
Set\ to\ Rendering\ Quality\ to\ High\ (right\ click\ the\ Camera\ View\ to\ see\ other\ options).=将 Rendering Quality（渲染质量）设为 High（在相机视图上右键可查看其他选项）。
Set\ up\ visual\ homing,\ with\ the\ Enable\ Visual\ Homing\ solution\ offered\ here.=按本列表中的「启用视觉归位（Visual Homing）」方案来配置。
Shorten\ the\ wait\ to\ what\ the\ image\ was\ measured\ needing.=把等待时间缩短到实测所需的长度。
Switch\ super\ sampling\ on.=打开超采样。
The\ acceleration\ the\ axis\ will\ be\ planned\ with.=运动规划将按这个加速度来规划该轴。
The\ axis\ is\ planned\ with\ a\ feed\ rate\ the\ controller\ will\ not\ allow.=该轴按一个主控不会允许的进给速率做规划。
The\ axis\ is\ planned\ with\ an\ acceleration\ the\ controller\ will\ not\ allow.=该轴按一个主控不会允许的加速度做规划。
The\ axis\ never\ reaches\ the\ acceleration\ it\ is\ planned\ with.=该轴从未达到规划所用的加速度。
The\ axis\ never\ reaches\ the\ feed\ rate\ it\ is\ planned\ with.=该轴从未达到规划所用的进给速率。
The\ axis\ resolution\ is\ finer\ than\ the\ smallest\ step\ the\ controller\ can\ make.=轴的分辨率比主控能走的最小步距还细。
The\ camera\ waits\ a\ fixed\ time\ that\ ends\ before\ the\ image\ has\ stopped\ moving.=相机等待的固定时间在画面停稳之前就结束了。
The\ camera\ waits\ considerably\ longer\ than\ the\ image\ takes\ to\ settle.=相机等待的时间远超画面稳定所需。
The\ feed\ rate\ the\ axis\ will\ be\ planned\ with.=运动规划将按这个进给速率来规划该轴。
The\ homing\ fiducial\ and\ the\ primary\ calibration\ fiducial\ are\ not\ the\ same\ place.=归位基准点与主标定基准点不在同一处。
The\ nozzle\ can\ be\ replaced\ with\ a\ ContactProbeNozzle\ to\ support\ various\ probing\ features.=该吸嘴可以替换为 ContactProbeNozzle，以支持各种探测功能。
The\ preview\ rendering\ quality\ can\ be\ improved.=预览的渲染质量还可以提升。
The\ rotation\ axis\ has\ backlash\ and\ no\ compensation\ set.=旋转轴存在反向间隙，却没有设置任何补偿。
The\ smallest\ difference\ in\ coordinate\ the\ axis\ is\ asked\ to\ make.=该轴被要求分辨的最小坐标差。
To\ continue,\ the\ machine\ must\ be\ enabled\ and\ homed.=要继续，机器必须已启用并完成 Home 归位。
Units\ per\ Pixel\ does\ not\ agree\ with\ what\ the\ camera\ sees\ across\ its\ field\ of\ view.=像素尺寸(Units Per Pixel)与相机在整个视场里看到的实际比例不符。
Use\ an\ adaptive\ camera\ settling\ method.=采用自适应的相机稳定策略。
Use\ Axis\ Letter\ Variables\ for\ simpler\ use,\ automatic\ G-code\ setup,\ and\ other\ advanced\ features.=使用 Axis Letter Variables（轴字母变量）可简化使用，并支持自动 G 代码配置等高级功能。
Use\ continuous\ motion.\ OpenPnP\ will\ only\ wait\ for\ the\ machine\ when\ really\ needed.=采用连续运动，OpenPnP 只在确有必要时才等待机器。
Use\ Keep-Alive\ only\ when\ necessary.\ It\ may\ cause\ hard\ to\ diagnose\ problems.=请仅在必要时使用 Keep-Alive，它可能引发难以排查的问题。
Use\ the\ GcodeAsyncDriver\ for\ advanced\ features.\ Accept\ or\ Dismiss\ to\ continue.=使用 GcodeAsyncDriver 以启用高级功能。接受或忽略以继续。
Use\ the\ GcodeDriver\ for\ simpler\ setup.\ Accept\ or\ Dismiss\ to\ continue.=使用 GcodeDriver 可让配置更简单。接受或忽略以继续。
Use\ the\ M584\ S0\ option\ in\ your\ config.g\ file.=请在 config.g 文件中使用 M584 S0 选项。
Wait\ as\ long\ as\ the\ image\ was\ measured\ taking\ to\ settle.=等待时间取实测的画面稳定时间。
When\ a\ table\ row\ is\ selected\ on\ one\ tab,\ automatically\ select\ the\ corresponding\ ones\ on\ the\ other\ tabs.\ For\ instance,\ if\ a\ placement\ is\ selected,\ the\ corresponding\ part\ will\ be\ selected\ on\ the\ Parts\ tab,\ the\ package\ on\ the\ Packages\ tab,\ the\ vision\ settings\ on\ the\ Vision\ tab,\ and\ the\ feeder\ on\ the\ Feeders\ tab,\ if\ one\ is\ present\ for\ the\ part.=在某个标签页选中一行时，自动在其他标签页选中对应的行。例如选中一个贴装位后，会在「元件」页选中对应元件，在「封装」页选中其封装，在「视觉」页选中其视觉配置；若该元件有对应的飞达，也会在「飞达」页选中它。
The\ camera\ cannot\ locate\ a\ standing\ fiducial\ to\ within\ half\ a\ pixel\ from\ frame\ to\ frame.=相机对静止的基准点逐帧定位，散布超过半个像素。
Improve\ the\ lighting,\ exposure\ and\ focus\ of\ the\ camera,\ with\ the\ vision\ solutions\ offered\ here.=改善相机的照明、曝光与对焦，可用本列表中的视觉方案。
The\ camera\ waits\ a\ fixed\ time\ shorter\ than\ the\ delay\ of\ its\ own\ frames.=相机固定等待的时间比它自己的帧延迟还短。
Wait\ at\ least\ as\ long\ as\ the\ camera's\ frames\ were\ measured\ being\ late.=等待时间至少要覆盖实测的帧延迟。
The\ axis\ loses\ steps\ at\ the\ speed\ it\ is\ planned\ with.=轴在规划的速度下会丢步。
Lower\ the\ feed\ rate\ to\ the\ highest\ speed\ that\ was\ measured\ arriving\ where\ it\ was\ sent.=把进给速度降到实测不丢步的最高速度。
The\ Z\ axis\ has\ slack\ between\ moving\ down\ and\ moving\ up\ that\ is\ not\ compensated.=Z 轴向下与向上之间有未补偿的间隙。
Compensate\ Z\ in\ the\ direction\ of\ travel,\ by\ the\ slack\ measured\ at\ the\ focus.=按焦点处实测的间隙，对 Z 做行进方向补偿。
A\ commanded\ millimetre\ on\ the\ axis\ is\ not\ a\ millimetre\ on\ the\ table.=这根轴上指令的一毫米，到了台面上不是一毫米。
Correct\ the\ controller's\ steps\ per\ millimetre\ for\ the\ axis\ by\ the\ scale\ measured,\ or\ map\ the\ axis\ through\ a\ linear\ transformed\ axis\ with\ that\ factor.=按实测比例修正控制器上这根轴的每毫米步数，或用一个带该因子的线性变换轴映射它。
The\ X\ and\ Y\ axes\ are\ not\ square\ to\ each\ other.=X 轴与 Y 轴不垂直。
Compensate\ the\ squareness\ with\ a\ linear\ transformed\ X\ axis\ that\ takes\ the\ measured\ fraction\ of\ Y.=用一个线性变换 X 轴补偿垂直度，让它按实测比例带入 Y。
