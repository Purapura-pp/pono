Keep\ G-code\ comments\ for\ better\ debugging.=保留 G 代码注释以便于调试。
Link\ the\ Placements/Parts/Packages/Vision\ Settings/Feeders\ tables\ between\ tabs.=在各标签页之间联动贴片位、元件、封装、视觉配置和飞达表格。
Location\ Confirmation\ recommended\ for\ extra\ features\ in\ homing,\ contact\ probing,\ etc.=建议启用 Location Confirmation（位置确认），归位、接触探测等功能可借此获得额外能力。
Location\ Confirmation\ required\ when\ Confirmation\ Flow\ Control\ is\ off.\ Supports\ extra\ features\ in\ homing,\ contact\ probing,\ etc.=关闭 Confirmation Flow Control（确认流控制）时必须启用位置确认。位置确认还可为归位、接触探测等功能提供额外支持。
Location\ Confirmation\ usually\ not\ available\ when\ no\ axes\ present.=控制器未配置任何轴时，Location Confirmation（位置确认）通常不可用。
Lower\ the\ axis\ acceleration\ to\ the\ controller's\ own\ limit.=将轴的加速度降至控制器自身的上限。
Lower\ the\ axis\ feed\ rate\ to\ the\ controller's\ own\ limit.=将轴的进给速率降至控制器自身的上限。
Make\ sure\ the\ Max.\ Part\ Diameter\ is\ larger\ than\ the\ Min.\ Part\ Diameter.\ Press\ the\ blue\ info\ button\ (below)\ for\ more\ information.=请确保【最大】元件直径大于【最小】元件直径。点击下方的蓝色信息按钮了解更多。
Marlin\ sends\ location-like\ responses\ to\ other\ commands\ so\ Location\ Confirmation\ is\ not\ reliable=Marlin 在响应其他指令时也会发出形似位置报告的内容，因此 Location Confirmation（位置确认）并不可靠
Mount\ a\ permanent\ fiducial\ to\ your\ machine\ and\ use\ it\ for\ repeatable\ precision\ X/Y\ homing.=在机器上固定一个永久基准点，用于实现可重复的高精度 X/Y 归位。
Move\ the\ camera\ over\ the\ primary\ calibration\ fiducial\ and\ capture\ its\ position.=将相机移至主标定基准点上方，并采集其位置。
Move\ the\ camera\ over\ the\ secondary\ calibration\ fiducial\ and\ capture\ its\ position.=将相机移至副标定基准点上方，并采集其位置。
Nozzle\ tip\ run-out\ calibration\ accepts\ too\ few\ measurements\ to\ be\ meaningful.=吸嘴头跳动校准接受的测量点过少，不足以得出有意义的结果。
One-sided\ backlash\ compensation\ is\ set\ to\ less\ offset\ than\ the\ axis\ has\ backlash.=单侧定位的补偿量小于该轴实际的反向间隙。
Only\ the\ GcodeAsyncDriver\ currently\ supports\ it.\ Advanced\ milestone\ required.=目前仅 GcodeAsyncDriver 支持该功能，且需达到 Advanced 里程碑。
OpenPnP\ can\ often\ automatically\ select\ the\ right\ tool\ for\ you\ in\ Machine\ Controls.=在“手动控制”卡片中，OpenPnP 通常可以自动选中正确的工具。
Please\ add\ the\ command\ manually.=请手动添加该指令。
Please\ assign\ a\ different\ Z\ axis.=请指定另一个 Z 轴。
Please\ assign\ a\ proper\ Rotation\ axis.\ You\ might\ need\ to\ create\ one\ first.=请指定一个合适的旋转轴，可能需要先创建一个。
Please\ assign\ a\ proper\ Z\ axis.\ You\ might\ need\ to\ create\ one\ first.=请指定一个合适的 Z 轴，可能需要先创建一个。
Please\ assign\ the\ correct\ controller\ axis\ letter.\ Choose\ from\ the\ list\ or\ enter\ a\ custom\ letter\ (some\ contoller\ may\ support\ an\ extended\ range\ of\ letters).=请指定正确的控制器轴字母。可以从列表中选择，也可以自行输入（部分控制器支持更大范围的字母）。
Please\ assign\ the\ correct\ controller\ axis\ letter.\ Some\ controllers\ may\ not\ report\ all\ axes\ on\ M114,\ in\ which\ case\ the\ letter\ might\ still\ be\ valid.\ Press\ the\ blue\ info\ button\ (below)\ for\ more\ information.=请指定正确的控制器轴字母。部分控制器在 M114 中不会报告全部轴，此时该字母仍可能有效。点击下方的蓝色信息按钮了解更多。
Please\ assign\ the\ correct\ controller\ axis\ letter.\ Some\ controllers\ may\ support\ an\ extended\ range\ of\ letters,\ in\ which\ case\ the\ letter\ might\ still\ be\ valid.\ Press\ the\ blue\ info\ button\ (below)\ for\ more\ information.=请指定正确的控制器轴字母。部分控制器支持更大范围的字母，此时该字母仍可能有效。点击下方的蓝色信息按钮了解更多。
Please\ upgrade\ the\ firmware\ and/or\ axis\ configuration.\ See\ the\ info\ link.=请升级固件和／或调整轴配置。详见信息链接。
Please\ upgrade\ to\ the\ special\ PnP\ version.\ See\ info\ link.=请升级到专用的 PnP 版本。详见信息链接。
Pre-rotate\ bottom\ vision\ must\ be\ allowed\ on\ all\ vision\ settings,\ because\ the\ machine\ has\ a\ limited\ articulation\ nozzle.=当前机器有转动范围受限的吸嘴，因此所有视觉配置都必须允许“底部视觉预旋转”。
Pre-rotate\ bottom\ vision\ must\ be\ enabled,\ because\ the\ machine\ has\ a\ limited\ articulation\ nozzle.=当前机器有转动范围受限的吸嘴，因此必须启用底部视觉预旋转。
Primary\ calibration\ fiducial\ position\ and\ initial\ camera\ calibration.=主标定基准点位置与相机初始标定。
Primary/secondary\ calibration\ fiducial\ Z\ too\ close\ together.=主、副标定基准点的 Z 坐标过于接近。
Raise\ the\ offset\ past\ the\ backlash\ that\ was\ measured.=将补偿量增大至超过实测的反向间隙。
Re-capture\ the\ homing\ fiducial\ at\ the\ primary\ calibration\ fiducial,\ or\ confirm\ that\ they\ are\ deliberately\ different.=在主标定基准点处重新采集归位基准点，或确认两处是有意设置的不同位置。
Reduce\ the\ misdetections\ it\ tolerates.=减少跳动校准允许的漏检次数。
Remove\ driver\ Maximum\ Feed\ Rate.=移除驱动的最大进给速率(Maximum Feed Rate)限制。
Remove\ Gcode\ comments\ for\ superior\ communications\ speed.=移除 G 代码注释可显著提升通信速度。
Remove\ the\ command.=移除该指令。
Replace\ with\ ContactProbeNozzle.=替换为 ContactProbeNozzle。
Replace\ with\ ReferenceNozzle.=替换为 ReferenceNozzle。
Resolution=分辨率
Retry\ the\ detection\ by\ connecting\ to\ the\ controller\ or\ assume\ a\ generic\ controller.=连接控制器后重试检测，或按通用控制器处理。
Rotation\ can\ be\ optimized\ by\ limiting\ angles\ to\ ±180°.\ Best\ combined\ with\ Wrap\ Around.=将角度限制在 ±180° 范围内可优化旋转。与就近回转(Wrap Around)配合使用效果最佳。
Rotation\ can\ be\ optimized\ by\ wrapping-around\ the\ shorter\ way.\ Best\ combined\ with\ Limit\ ±180°.=沿较短方向回转可优化旋转。与 ±180° 范围限制配合使用效果最佳。
Rotation\ cannot\ be\ wrapped-around\ on\ a\ limited\ articulation\ axis.=转动范围受限的轴不能使用就近回转(Wrap Around)。
Rotation\ must\ be\ limited\ on\ a\ limited\ articulation\ axis.=在转动范围受限的轴上必须限制旋转角度。
Script\ execuction\ performance\ can\ be\ improved\ by\ enabling\ engine\ pooling.=启用引擎池可以提升脚本执行性能。
Secondary\ calibration\ fiducial\ position.=副标定基准点位置。
Select\ the\ feeder\ in\ the\ Feeders\ tab\ and\ make\ sure\ the\ feeder\ has\ an\ offset\ location\ from\ the\ slot=在“飞达”页选择该飞达，并确认已设置其相对槽位的偏移位置。
Select\ the\ feeder\ in\ the\ Feeders\ tab\ and\ make\ sure\ the\ slot\ has\ a\ set\ location=在“飞达”页选择该飞达，并确认其槽位已设置位置。
Set\ a\ suitable\ camera\ settling\ method\ automatically.=自动设置合适的相机稳定策略(Camera Settling)。
Set\ After\ Actuation\ machine\ coordination\ to\ WaitForUnconditionalCoordination.=在该执行器的“与机器协调”一节中，将“切换后”设为“无条件等待”(WaitForUnconditionalCoordination)。
Set\ an\ example\ expression=设置一个示例表达式
Set\ the\ Max.\ Pick\ Tolerance\ to\ the\ actual\ pick\ errors\ you\ expect.\ Press\ the\ blue\ info\ button\ (below)\ for\ more\ information.=将“取料容差”设为预期的实际取料误差。点击下方蓝色信息按钮可查看详细说明。
Set\ the\ axis\ acceleration\ to\ the\ one\ it\ was\ measured\ reaching.=将轴的加速度设为实测可达到的值。
Set\ the\ axis\ feed\ rate\ to\ the\ one\ it\ was\ measured\ reaching.=将轴的进给速率设为实测可达到的值。
Set\ the\ resolution\ to\ one\ controller\ step.=将分辨率设为控制器的一个步距。
Set\ to\ 5\ FPS.=设为 5 FPS。
Set\ to\ Rendering\ Quality\ to\ High\ (right\ click\ the\ Camera\ View\ to\ see\ other\ options).=将“渲染质量”设为“高质量”（右键点击相机视图可查看其他选项）。
Set\ up\ visual\ homing,\ with\ the\ Enable\ Visual\ Homing\ solution\ offered\ here.=使用校准页中的“视觉归位”一项配置视觉归位(Visual Homing)。
Shorten\ the\ wait\ to\ what\ the\ image\ was\ measured\ needing.=将等待时间缩短至实测所需时长。
Switch\ super\ sampling\ on.=启用超采样。
The\ acceleration\ the\ axis\ will\ be\ planned\ with.=规划该轴运动时使用的加速度。
The\ axis\ is\ planned\ with\ a\ feed\ rate\ the\ controller\ will\ not\ allow.=该轴规划使用的进给速率超出控制器允许的上限。
The\ axis\ is\ planned\ with\ an\ acceleration\ the\ controller\ will\ not\ allow.=该轴规划使用的加速度超出控制器允许的上限。
The\ axis\ never\ reaches\ the\ acceleration\ it\ is\ planned\ with.=该轴从未达到规划所用的加速度。
The\ axis\ never\ reaches\ the\ feed\ rate\ it\ is\ planned\ with.=该轴从未达到规划所用的进给速率。
The\ axis\ resolution\ is\ finer\ than\ the\ smallest\ step\ the\ controller\ can\ make.=该轴的分辨率小于控制器可执行的最小步距。
The\ camera\ waits\ a\ fixed\ time\ that\ ends\ before\ the\ image\ has\ stopped\ moving.=相机的固定等待时间在画面稳定前即已结束。
The\ camera\ waits\ considerably\ longer\ than\ the\ image\ takes\ to\ settle.=相机等待的时间远超画面稳定所需。
The\ feed\ rate\ the\ axis\ will\ be\ planned\ with.=规划该轴运动时使用的进给速率。
The\ homing\ fiducial\ and\ the\ primary\ calibration\ fiducial\ are\ not\ the\ same\ place.=归位基准点与主标定基准点不在同一处。
The\ nozzle\ can\ be\ replaced\ with\ a\ ContactProbeNozzle\ to\ support\ various\ probing\ features.=该吸嘴可以替换为 ContactProbeNozzle，以支持各种探测功能。
The\ preview\ rendering\ quality\ can\ be\ improved.=预览的渲染质量可进一步提升。
The\ rotation\ axis\ has\ backlash\ and\ no\ compensation\ set.=旋转轴存在反向间隙，但未设置补偿。
The\ smallest\ difference\ in\ coordinate\ the\ axis\ is\ asked\ to\ make.=要求该轴移动的最小坐标差。
To\ continue,\ the\ machine\ must\ be\ enabled\ and\ homed.=继续前，机器必须已启用并完成归位。
Units\ per\ Pixel\ does\ not\ agree\ with\ what\ the\ camera\ sees\ across\ its\ field\ of\ view.=像素尺寸(Units Per Pixel)与相机在整个视场内观测到的比例不符。
Use\ an\ adaptive\ camera\ settling\ method.=采用自适应的相机稳定策略。
Use\ Axis\ Letter\ Variables\ for\ simpler\ use,\ automatic\ G-code\ setup,\ and\ other\ advanced\ features.=使用轴字母变量(Axis Letter Variables)可简化操作，并支持 G 代码自动配置等高级功能。
Use\ continuous\ motion.\ OpenPnP\ will\ only\ wait\ for\ the\ machine\ when\ really\ needed.=采用连续运动，OpenPnP 只在确有必要时才等待机器。
Use\ Keep-Alive\ only\ when\ necessary.\ It\ may\ cause\ hard\ to\ diagnose\ problems.=仅在必要时使用 Keep-Alive。该选项可能引发难以排查的问题。
Use\ the\ GcodeAsyncDriver\ for\ advanced\ features.\ Accept\ or\ Dismiss\ to\ continue.=使用 GcodeAsyncDriver 以启用高级功能。点击“接受”或“忽略”以继续。
Use\ the\ GcodeDriver\ for\ simpler\ setup.\ Accept\ or\ Dismiss\ to\ continue.=使用 GcodeDriver 可简化配置。点击“接受”或“忽略”以继续。
Use\ the\ M584\ S0\ option\ in\ your\ config.g\ file.=请在 config.g 文件中使用 M584 S0 选项。
Wait\ as\ long\ as\ the\ image\ was\ measured\ taking\ to\ settle.=等待时间取实测的画面稳定时间。
When\ a\ table\ row\ is\ selected\ on\ one\ tab,\ automatically\ select\ the\ corresponding\ ones\ on\ the\ other\ tabs.\ For\ instance,\ if\ a\ placement\ is\ selected,\ the\ corresponding\ part\ will\ be\ selected\ on\ the\ Parts\ tab,\ the\ package\ on\ the\ Packages\ tab,\ the\ vision\ settings\ on\ the\ Vision\ tab,\ and\ the\ feeder\ on\ the\ Feeders\ tab,\ if\ one\ is\ present\ for\ the\ part.=在某一页选中表格中的一行时，自动在其他页选中对应的行。例如选中一个贴片位后，将在“元件”页选中对应元件，在“封装”页选中其封装，在“视觉”页选中其视觉配置。若该元件有对应的飞达，还将在“飞达”页选中该飞达。
The\ camera\ cannot\ locate\ a\ standing\ fiducial\ to\ within\ half\ a\ pixel\ from\ frame\ to\ frame.=相机对静止的基准点逐帧定位，散布超过半个像素。
Improve\ the\ lighting,\ exposure\ and\ focus\ of\ the\ camera,\ with\ the\ vision\ solutions\ offered\ here.=改善相机的照明、曝光与对焦，可使用校准页中的视觉相关项。
The\ camera\ waits\ a\ fixed\ time\ shorter\ than\ the\ delay\ of\ its\ own\ frames.=相机的固定等待时间短于其自身的帧延迟。
Wait\ at\ least\ as\ long\ as\ the\ camera's\ frames\ were\ measured\ being\ late.=等待时间应不短于实测的帧延迟。
The\ axis\ loses\ steps\ at\ the\ speed\ it\ is\ planned\ with.=轴在规划的速度下会丢步。
Lower\ the\ feed\ rate\ to\ the\ highest\ speed\ that\ was\ measured\ arriving\ where\ it\ was\ sent.=将进给速率降至实测不丢步的最高速度。
The\ Z\ axis\ has\ slack\ between\ moving\ down\ and\ moving\ up\ that\ is\ not\ compensated.=Z 轴向下与向上之间有未补偿的间隙。
Compensate\ Z\ in\ the\ direction\ of\ travel,\ by\ the\ slack\ measured\ at\ the\ focus.=按运动方向补偿 Z 轴，补偿量为焦点处实测的间隙。
A\ commanded\ millimetre\ on\ the\ axis\ is\ not\ a\ millimetre\ on\ the\ table.=该轴按指令移动 1 mm 时，台面上的实际位移并非 1 mm。
Correct\ the\ controller's\ steps\ per\ millimetre\ for\ the\ axis\ by\ the\ scale\ measured,\ or\ map\ the\ axis\ through\ a\ linear\ transformed\ axis\ with\ that\ factor.=按实测比例修正控制器中该轴的每毫米步数，或通过线性变换轴按该系数映射该轴。
The\ X\ and\ Y\ axes\ are\ not\ square\ to\ each\ other.=X 轴与 Y 轴不垂直。
Compensate\ the\ squareness\ with\ a\ linear\ transformed\ X\ axis\ that\ takes\ the\ measured\ fraction\ of\ Y.=使用线性变换 X 轴补偿垂直度，按实测比例计入 Y 轴分量。
Max.\ Distance=最大距离
Min.\ Detail\ Size=最小细节尺寸
Symmetry\ Left/Right=左右对称
Symmetry\ Upper/Lower=上下对称
Threshold=阈值
Maximum\ allowed\ distance\ between\ nominal\ fiducial\ location\ and\ detected\ location.=标称基准点位置与识别位置之间允许的最大距离。
Minimal\ size\ of\ a\ detail\ that\ should\ be\ included\ in\ the\ detected\ shape.=计入识别形状的最小细节尺寸。
Minimum\ Detail\ Size\ that\ should\ be\ considered\ masked.\ Only\ relevant\ for\ asymmetric\ detection.=细节计入遮罩所需的最小尺寸。仅对非对称识别有效。
Set\ the\ brightness\ threshold\ that\ isolates\ the\ shiny\ contacts\ of\ a\ part.=设置用于分离元件高亮引脚的亮度阈值。
Switch\ On\ if\ parts\ are\ symmetric\ Left/Right\ (seen\ in\ 0°\ rotation).=元件左右对称时启用（以 0° 方向为准）。
Switch\ On\ if\ parts\ are\ symmetric\ Upper/Lower\ (seen\ in\ 0°\ rotation)=元件上下对称时启用（以 0° 方向为准）。
Threshold\ brightness\ for\ relevant\ image\ elements\ (shiny\ contacts).\ Only\ relevant\ for\ asymmetric\ detection.=相关图像元素（高亮引脚）的亮度阈值。仅对非对称识别有效。
Stopping\ after\ the\ current\ step...=将在当前步骤完成后停止……
Stopped\ by\ the\ user.\ The\ report\ holds\ everything\ measured\ so\ far.=已按用户要求停止。报告包含截至目前的全部测量结果。
Configuration\ snapshot\ written.=配置快照已写入。
---\ Firmware\ ---=—— 固件 ——
---\ VisionNoise\ ---=—— 视觉噪声底 ——
---\ CameraLatency\ ---=—— 相机延迟 ——
