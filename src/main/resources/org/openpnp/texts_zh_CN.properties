Compensate\ the\ rotation\ in\ the\ direction\ of\ travel,\ by\ the\ offset\ measured.=按实测偏移量，沿运动方向补偿旋转轴的反向间隙。
Compress\ Gcode\ for\ superior\ communications\ speed.=启用 Compress Gcode（压缩 G 代码）可显著提升通信速度。
Connect\ the\ driver\ to\ your\ controller.=请将驱动连接到控制器。
