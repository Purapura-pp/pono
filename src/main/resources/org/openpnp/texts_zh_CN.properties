Firmware\ was\ not\ detected\ (failure,\ check\ log).\ Only\ if\ the\ firmware\ is\ know,\ can\ Issues\ &\ Solutions\ generate\ suggested\ G-code\ for\ your\ machine\ configuration.=未检测到固件（检测失败，请查看日志）。只有识别出固件，校准页的“采集问题”才能为当前机器配置生成建议的 G-code。
Firmware\ was\ not\ detected\ (machine\ is\ disabled).\ Only\ if\ the\ firmware\ is\ know,\ can\ Issues\ &\ Solutions\ generate\ suggested\ G-code\ for\ your\ machine\ configuration.=未检测到固件（机器未启用）。只有识别出固件，校准页的“采集问题”才能为当前机器配置生成建议的 G-code。
For\ a\ SwitcherCamera\ it\ is\ mandatory\ to\ suspend\ camera\ preview\ during\ machine\ tasks\ /\ Jobs.=使用 SwitcherCamera 时，必须在机器任务／任务运行期间暂停相机预览。
For\ best\ results\ with\ color-keyed\ computer\ vision,\ it\ is\ recommended\ to\ use\ static\ white\ balance.=使用色键类机器视觉时，建议采用静态白平衡以获得最佳效果。
