Feeder\ has\ no\ configured\ offset=飞达未配置偏移量
Feeder\ slot\ has\ no\ configured\ location=飞达槽位未配置位置
Feed-rate,\ acceleration,\ jerk\ etc.\ can\ now\ be\ set\ individually\ per\ axis.=进给速率、加速度、加加速度等现在可以按轴单独设置。
