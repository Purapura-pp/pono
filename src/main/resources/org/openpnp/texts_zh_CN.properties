# Translations for strings the source code carries as English prose rather than as a key.
#
# The Issues and Solutions descriptions are written that way, and their English wording is also
# their persisted identity - see Solutions.Issue.getFingerprint - so the English is the key here
# and stays untranslated in the source. Anything without an entry falls back to the English,
# which is also what happens to descriptions assembled from variables at runtime, since only
# whole strings are looked up.
#
# Keys are Java properties keys: spaces and : = # ! are backslash-escaped. Both files are read
# as UTF-8.

<html><h3>Assume\ a\ generic\ G-code\ controller</h3><p>When\ the\ M115\ command\ is\ not\ supported\ by\ your\ controller\ you\ can\ let\ OpenPnP\ propose\ a\ generic\ G-code\ configuration.</p><br/><p>You\ will\ likely\ need\ to\ hand-tune\ the\ G-code\ configuration\ to\ work\ with\ your\ controller.</p></html>=<html><h3>按通用 G-code 控制器处理</h3><p>如果控制器不支持 M115 命令，可由 OpenPnP 提供一份通用的 G-code 配置。</p><br/><p>通常还需要手动微调该配置，使其与控制器匹配。</p></html>
<html><h3>Brighness\ and\ Key-Color</h3><p>The\ nozzle\ tip\ and/or\ background\ (shade)\ is\ color-keyed\ so\ computer\ vision\ can\ robustly\ distinguish\ background\ pixels\ from\ foreground\ pixels\ ("green-screening").\ Use\ for\ green\ Juki\ style\ nozzles.</p></html>=<html><h3>亮度与色键</h3><p>对吸嘴头和/或背景（遮光罩）采用色键处理，使机器视觉能可靠地区分背景像素与前景像素（即“绿幕”原理）。适用于 Juki 风格的绿色吸嘴。</p></html>
<html><h3>Brightness</h3><p>The\ background\ is\ just\ dark,\ the\ foreground\ is\ distinguished\ by\ brighness\ only.</p><br/></html>=<html><h3>亮度</h3><p>背景仅为暗色，前景只通过亮度区分。</p><br/></html>
<html><h3>Detect\ the\ firmware\ automatically</h3><p>The\ M115\ command\ must\ be\ supported\ by\ the\ firmware.\ Make\ sure\ the\ controller\ is\ connected\ to\ the\ computer\ and\ accept\ the\ solution\ to\ perform\ the\ detection.</p><br/><p>This\ might\ take\ a\ while\!</p><br/><p>If\ the\ firmware\ is\ known\ by\ OpenPnP,\ it\ will\ be\ able\ to\ automatically\ generate\ G-code\ configuration\ for\ you.</html>=<html><h3>自动检测固件</h3><p>固件必须支持 M115 命令。请确认控制器已连接到计算机，然后接受此方案以执行检测。</p><br/><p>检测可能需要一些时间。</p><br/><p>如果 OpenPnP 能识别该固件，即可自动生成 G-code 配置。</html>
<html><h3>Dynamic\ Safe\ Z</h3><p>If\ a\ part\ is\ on\ the\ nozzle,\ the\ nozzle\ is\ lifted\ to\ Safe\ Z\ <strong>+</strong>\ part\ height.</p><br/><p>Safe\ Z\ must\ only\ account\ for\ the\ tallest\ obstacle.</p><br/><p>This\ will\ result\ in\ faster,\ more\ optimized\ machine\ motion.</p><br/><p><strong>Recommended.</strong>.</p><br/></html>=<html><h3>动态 Safe Z</h3><p>吸嘴上有元件时，抬升高度为 Safe Z <strong>加</strong> 元件高度。</p><br/><p>此时 Safe Z 只需考虑最高的障碍物。</p><br/><p>机器运动会更快、更优化。</p><br/><p><strong>推荐。</strong></p><br/></html>
<html><h3>Fixed\ Safe\ Z</h3><p>Safe\ Z\ is\ always\ at\ a\ fixed\ level.</p><br/><p>Safe\ Z\ must\ account\ for\ <em>both</em>\ the\ tallest\ obstacle\ <em>and</em>\ the\ tallest\ part\ on\ the\ nozzle.</p><br/><p>This\ will\ result\ in\ slower,\ less\ optimized\ machine\ motion.</p></html>=<html><h3>固定 Safe Z</h3><p>Safe Z 始终为一个固定高度。</p><br/><p>此时 Safe Z 必须<em>同时</em>兼顾最高的障碍物<em>和</em>吸嘴上最高的元件。</p><br/><p>机器运动会更慢、优化程度更低。</p></html>
<html><h3>Use\ Auto-Focus</h3><p>This\ is\ the\ recommended\ setting.</p></html>=<html><h3>使用自动对焦</h3><p>这是推荐的设置。</p></html>
<html><h3>Use\ nozzle\ Z\ location</h3><p><span\ style\="color\:red;">CAUTION\:</span>\ This\ will\ invalidate\ part\ height\ auto\ detection\ using\ auto\ focus.</p></html>=<html><h3>使用吸嘴 Z 位置</h3><p><span style\="color\:red;">注意：</span>这会使基于自动对焦的元件高度自动检测失效。</p></html>
<html><p>For\ precision\ in\ computer\ vision\ it\ is\ very\ important\ that\ the\ camera\ image\ has\ settled\ down\ after\ the\ machine\ has\ moved\ the\ camera\ or\ the\ subject.\ Some\ cameras\ exhibit\ a\ slight\ lag,\ where\ the\ frames\ might\ still\ show\ the\ camera\ in\ motion.\ Motion\ might\ also\ cause\ vibration\ that\ must\ abate\ sufficently\ before\ computer\ vision\ is\ performed.</p><br/><p>The\ simple\ solution\ is\ just\ to\ wait\ for\ a\ fixed\ amount\ of\ time.\ However,\ this\ is\ wasteful\ if\ there\ was\ no\ motion\ in\ the\ first\ place.\ Using\ an\ adaptive\ settling\ method\ can\ reduce\ the\ wait\ time\ in\ these\ cases,\ i.e.\ one\ does\ not\ need\ to\ set\ a\ large\ worst\ case\ settle\ wait\ time.</p><br/><p>When\ ready,\ press\ Accept.</p></html>=<html><p>为保证机器视觉的精度，机器移动相机或被摄物之后，必须等待相机画面稳定。部分相机存在轻微延迟，获取的帧可能仍显示相机处于运动中。运动还可能引起振动，必须等振动充分衰减后再执行视觉识别。</p><br/><p>最简单的方法是固定等待一段时间。但如果此前并未发生运动，这段等待并无必要。采用自适应稳定策略可在此类情况下缩短等待时间，从而无需按最坏情况设置较长的稳定等待时间。</p><br/><p>准备就绪后，点击“接受”。</p></html>
<html><p>You\ must\ be\ sure\ that\ your\ machine\ supports\ the\ homing\ command\ with\ the\ proper\ axis\ end-switches\ wired\ and\ configured.</p><br/><p>Press\ <strong>Accept</strong>\ to\ perform\ the\ homing.</p><br/><p>Afterwards,\ press\ <strong>Find\ Issues\ &\ Solutions</strong>\ again.</p></html>=<html><p>请先确认机器支持归位命令，并且各轴的限位开关已正确接线和配置。</p><br/><p>点击<strong>“接受”</strong>执行归位。</p><br/><p>完成后，在校准页再次点击<strong>“采集问题”</strong>。</p></html>
<html><span\ color\="red">CAUTION\:</span>\ This\ is\ a\ troubleshooting\ option\ offered\ to\ remove\ the\ ContactProbeNozzle\ if\ it\ causes\ problems,\ or\ if\ you\ don't\ want\ it\ after\ all.\ Going\ back\ to\ the\ plain\ ReferenceNozzle\ will\ lose\ you\ all\ the\ configuration\ for\ contact\ and\ Z\ probing\ and\ calibration.</html>=<html><span color\="red">注意：</span>这是一个排障选项，用于在 ContactProbeNozzle 引发问题或不再需要时将其移除。退回普通的 ReferenceNozzle 将丢失全部接触探测、Z 探测与校准配置。</html>
<html><span\ color\="red">CAUTION\:</span>\ This\ is\ a\ troubleshooting\ option\ offered\ to\ remove\ the\ GcodeAsyncDriver\ if\ it\ causes\ problems,\ or\ if\ you\ don't\ want\ it\ after\ all.\ Going\ back\ to\ the\ plain\ GcodeDriver\ will\ lose\ you\ all\ the\ advanced\ configuration.</html>=<html><span color\="red">注意：</span>这是一个排障选项，用于在 GcodeAsyncDriver 引发问题或不再需要时将其移除。退回普通的 GcodeDriver 将丢失全部高级配置。</html>
<html><span\ color\="red">CAUTION\:</span>\ This\ is\ a\ troubleshooting\ option,\ offered\ to\ remove\ the\ ReferenceAdvancedMotionPlanner\ if\ it\ causes\ problems,\ or\ if\ you\ don't\ want\ it\ after\ all.\ Going\ back\ to\ the\ plain\ NullPlanner\ will\ lose\ you\ all\ the\ advanced\ configuration.</html>=<html><span color\="red">注意：</span>这是一个排障选项，用于在 ReferenceAdvancedMotionPlanner 引发问题或不再需要时将其移除。退回普通的 NullPlanner 将丢失全部高级配置。</html>
<html><span\ color\="red">CAUTION\:</span>\ This\ is\ a\ troubleshooting\ option,\ you\ should\ only\ disable\ G-code\ compression\ if\ it\ causes\ problems.</html>=<html><span color\="red">注意：</span>这是一个排障选项，只有在 G-code 压缩确实引起问题时才应关闭它。</html>
<html><span\ color\="red">CAUTION\:</span>\ This\ is\ a\ troubleshooting\ option,\ you\ should\ only\ keep\ G-code\ comments\ if\ removing\ them\ causes\ problems.</html>=<html><span color\="red">注意：</span>这是一个排障选项，只有在去掉 G-code 注释会引起问题时才应保留它们。</html>
<html>By\ default,\ every\ time\ a\ script\ should\ be\ executed,\ a\ new\ instance\ of\ the\ appropriate\ script\ engine\ is\ created.<br><br>By\ enabling\ script\ engine\ pooling,\ a\ new\ instance\ of\ any\ script\ engine\ is\ only\ created\ if\ the\ pool\ doesn't\ contain\ an\ available\ instance\ of\ the\ appropriate\ type.\ Following\ executions\ re-use\ the\ already\ initialized\ script\ engines,\ lowering\ execution\ time\ for\ scripting\ hooks.This\ feature\ is\ only\ relevant\ if\ you\ use\ scripting\ in\ OpenPnP.<br><br><span\ style\="color\:red;">Script\ engine\ pooling\ can\ -\ depending\ on\ the\ script\ engine\ implementation\ -\ cause\ global\ state\ to\ be\ kept\ in\ following\ invocations.\ Check\ the\ wiki\ for\ further\ information.</span></html>=<html>默认情况下，每次执行脚本都会新建一个对应类型的脚本引擎实例。<br><br>启用脚本引擎池后，仅当池中无可用的同类型实例时才会新建实例。后续执行将复用已初始化的脚本引擎，从而缩短脚本钩子的执行时间。该功能仅在 OpenPnP 中使用脚本时才有意义。<br><br><span style\="color\:red;">视脚本引擎的实现而定，引擎池可能导致全局状态保留到后续调用中。详见 Wiki。</span></html>
A\ high\ Preview\ FPS\ value\ might\ create\ undue\ CPU\ load.=过高的 Preview FPS（预览帧率）会带来不必要的 CPU 负载。
A\ HTTPActuator\ with\ Read\ URL\ likely\ needs\ a\ regular\ Expression\ to\ parse\ the\ value.=配置了 Read URL 的 HTTPActuator 通常还需要一个正则表达式来解析返回值。
Acceleration\ per\ second\ squared=每秒平方加速度
Accept\ to\ replace\ ACTUATOR_READ_COMMAND\ with\ ACTUATOR_READ_WITH_DOUBLE_COMMAND.\ Dismiss\ to\ remove\ read\ with\ double.=接受则用 ACTUATOR_READ_WITH_DOUBLE_COMMAND 替换 ACTUATOR_READ_COMMAND；忽略则移除 read with double。
Advanced\ Motion\ Planner\ not\ set.\ Accept\ or\ Dismiss\ to\ continue.=尚未启用 Advanced Motion Planner（高级运动规划器）。接受或忽略以继续。
