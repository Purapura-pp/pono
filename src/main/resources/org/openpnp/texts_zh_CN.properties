How\ far\ the\ commanded\ angle\ is\ shifted\ in\ the\ direction\ the\ axis\ is\ turning.=指令角度沿轴旋转方向的偏移量。
In\ single\ camera\ preview\ OpenPnP\ can\ automatically\ switch\ the\ camera\ for\ you.=在单相机预览模式下，OpenPnP 可以自动切换相机。
It\ is\ OK\ to\ share\ rotation\ axes.\ If\ intentional,\ just\ dismiss\ this\ issue.\ Otherwise\ assign\ a\ different\ Rotation\ axis.=允许共用旋转轴。若为有意设置，忽略此问题即可。否则请指定另一个旋转轴。
