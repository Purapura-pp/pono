---\ XyPositioning\ ---=—— XY 定位 ——
---\ CameraSettle\ ---=—— 相机稳定 ——
---\ Homing\ ---=—— 重复归位 ——
---\ RotationBacklash\ ---=—— 旋转间隙 ——
---\ ZFocus\ ---=—— Z 焦点 ——
---\ DatumBoard\ ---=—— 基准板 ——
---\ HysteresisMap\ ---=—— 行程上的迟滞 ——
---\ ConfigSnapshot\ ---=—— 配置快照 ——
Non-color-keyed\ background\ elements\ are\ too\ bright.=不参与色键的背景部分过亮。
Non-color-keyed\ background\ elements\ are\ sufficiently\ dark.=不参与色键的背景部分足够暗。
Non-color-keyed\ background\ elements\ are\ possibly\ too\ dark.=不参与色键的背景部分可能过暗。
Non-color-keyed\ background\ elements\ are\ quite\ dark.\ Perfect\!=不参与色键的背景部分相当暗，效果理想。
Background\ elements\ are\ too\ bright.=背景过亮。
Background\ elements\ are\ sufficiently\ dark.=背景足够暗。
Background\ elements\ are\ possibly\ too\ dark.=背景可能过暗。
Background\ elements\ are\ quite\ dark.\ Perfect\!=背景相当暗，效果理想。
Try\ to\ eliminate\ highlights\ and\ reflections.=尽量消除高光和反光。
Use\ a\ shade\ behind\ the\ nozzle.=在吸嘴后方加装遮光板。
Renew\ the\ blackening\ of\ dark\ parts\ of\ the\ nozzle\ tip.=将吸嘴头深色部分重新涂黑。
Clean\ the\ nozzle\ tip.\ If\ it\ is\ shiny,\ make\ it\ dull.=清洁吸嘴头。如表面发亮，应做哑光处理。
Eliminate\ light\ sources\ that\ reflect\ on\ the\ nozzle\ tip.=移除会在吸嘴头上产生反光的光源。
Check\ camera\ exposure.=检查相机曝光。
The\ key\ color\ is\ not\ consistent\ enough.=色键颜色不够一致。
The\ key\ color\ is\ sufficiently\ consistent.=色键颜色足够一致。
The\ key\ color\ is\ very\ consistent.\ Perfect\!=色键颜色非常一致，效果理想。
The\ key\ color\ is\ not\ detectable.=检测不到色键颜色。
Check\ camera\ white\ balance\ (see\ the\ Wiki).=检查相机白平衡（见 Wiki）。
The\ key\ color\ is\ not\ vivid\ enough.=色键颜色不够鲜艳。
The\ key\ color\ is\ sufficiently\ saturated.=色键颜色足够饱和。
The\ key\ color\ is\ very\ vivid.\ Perfect\!=色键颜色非常鲜艳，效果理想。
Misdetections\ tolerated=跳动校准允许的漏检次数
How\ many\ of\ the\ angles\ may\ fail\ to\ be\ detected\ before\ the\ calibration\ gives\ up.=允许检测失败的角度数，超出此数后标定中止。
Super-sampling=对称检测超采样
Part-aligned\ rotation=吸嘴旋转对齐元件
Rotation\ mode=旋转模式
Pre-rotate=底部视觉预旋转
Settle\ time\ in\ milliseconds=相机稳定时间（毫秒）
How\ long\ the\ camera\ waits\ after\ a\ move\ before\ it\ captures.=相机在移动结束后、拍摄前的等待时间。
On\ the\ camera's\ Device\ Settings\ tab\ select\ the\ correct\ Device\ and\ Format.\ Then\ click\ on\ the\ Capture\ FPS\ Test\ button.\ An\ image\ from\ the\ camera\ should\ appear\ in\ the\ camera's\ view\ pane.=在“机器设置 › 相机”中选中该相机，并在“设备”一节选择正确的设备和图像格式。然后点击“测试”按钮检测帧率(FPS)。相机视图中应显示该相机的画面。
Camera\ not\ connected\ to\ Pono=相机未连接到 Pono
