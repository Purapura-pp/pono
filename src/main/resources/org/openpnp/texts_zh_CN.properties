Assign\ a\ driver.=请指定一个驱动。
Assign\ the\ unique\ axis\ letter\ where\ wrong,\ press\ Accept,\ then\ press\ Find\ Issues\ &\ Solutions\ again\ to\ clear\ the\ correct\ one.=请为字母有误的轴指定唯一的轴字母，点击“接受”，然后在校准页再次点击“采集问题”，以清除字母正确的轴上的同一问题。
Avoid\ axis\ letter\ E,\ if\ possible.\ Use\ proper\ rotation\ axes\ instead.=尽量不要使用轴字母 E，改用正规的旋转轴。
Axes\ should\ be\ configured\ as\ linear\ in\ feedrate\ calculations\ on\ the\ RepRapFirmware\ controller.\ See\ the\ linked\ web\ page.=在 RepRapFirmware 控制器上，进给速率计算中应将各轴配置为线性轴。详见链接页面。
Axis\ is\ not\ assigned\ to\ a\ driver.=该轴尚未指定驱动。
Axis\ letter\ is\ missing.\ Assign\ the\ letter\ to\ continue.=尚未指定轴字母。请先指定字母再继续。
Axis\ should\ be\ treated\ as\ a\ linear\ for\ detected\ firmware\ (all-primary\ axes\ mode).=按检测到的固件，该轴应作为线性轴处理（全主轴模式）。
Axis\ should\ be\ treated\ as\ linear\ according\ to\ its\ letter.=按该轴的字母判断，它应作为线性轴处理。
Axis\ should\ be\ treated\ as\ rotational\ according\ to\ its\ letter.=按该轴的字母判断，它应作为旋转轴处理。
Axis\ velocity\ limited\ by\ driver\ Maximum\ Feed\ Rate.\ =轴速度受到驱动的 Maximum Feed Rate（最大进给速率）限制。
Backlash\ offset=反向间隙补偿量
Calibrate\ the\ camera\ with\ the\ advanced\ camera\ calibration\ offered\ here.=通过本列表中该相机的“高级标定”项完成相机标定。
Change\ of\ serial\ port\ Flow\ Control\ recommended.=建议更改串口的 Flow Control（流控制）设置。
Change\ to\ NullMotionPlanner=改用 NullMotionPlanner
Change\ to\ ReferenceAdvancedMotionPlanner=改用 ReferenceAdvancedMotionPlanner
Check\ axis\ letters\ and\ make\ sure\ the\ controller\ is\ capable\ to\ use\ extra\ axes\ (i.e.\ not\ extruders).=请检查各轴字母，并确认控制器确实支持额外的轴（即非挤出机轴）。
Check\ axis\ letters\ and\ make\ sure\ use\ a\ proper\ 6-axis\ configuration\ without\ extruders.=请检查各轴字母，并确认采用的是不含挤出机轴的正规六轴配置。
Check\ if\ your\ controller\ supports\ proper\ axes\ A\ B\ C\ (etc.)\ instead\ of\ "extruder"\ E.\ Press\ the\ blue\ info\ button\ (below)\ for\ more\ information.=请确认控制器支持正规的 A B C 等轴，而非仅有“挤出机”轴 E。点击下方的蓝色信息按钮了解更多。
Check\ out\ firmwares\ known\ to\ be\ well\ supported.\ See\ info\ link.=建议了解已知支持良好的固件。详见信息链接。
Choose\ an\ advanced\ Motion\ Control\ Type\ for\ your\ controller\ type.=请根据控制器类型选择一种高级的 Motion Control Type（运动控制类型）。
Choose\ the\ right\ communications\ type\ and\ port/address\ settings.=请选择正确的通信类型与端口/地址设置。
