IssuesAndSolutionsPanel.MilestoneLabel.toolTipText=<html>\r\nЦелевой этап конфигурации машины.<br/>\r\nЭтап фильтрует и иногда влияет на предлагаемые решения<br/>\r\nчтобы гарантировать что основная работа машины будет достигнута, до того как будут выбраны более продвинутые,<br/>\r\nболее сложные <em>и трудные</em> решения.\r\n</html>\r\n
IssuesAndSolutionsPanel.IncludeSolvedLabel.toolTipText=<html>Включите уже решенные решения, если их можно пересмотреть.<br/>\r\nНекоторые решения можно принять только один раз, они больше не появятся.</html>
