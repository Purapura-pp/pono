PlacementsHolderLocationViewer.ViewingOption.Fiducials.ToolTip=<Html><body style='width: 400'>Накладывается на круг диаметром 1 мм, заполненный <span style='background-color: black; color: \#E89961'><b>медным цветом</span> в каждом месте репера. Символ плюс указывает на центр реперной точки.</html>
