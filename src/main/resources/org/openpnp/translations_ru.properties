Solutions.Issue.CompleteMilestone=Завершение этапа
Solutions.Issue.CompleteMilestone.Confirm=<html><p>Проблемы этапа <strong>%s</strong> всё ещё не решены\:</p> %s <p color\="red">Не рекомендуется переходить к следующему целевому этапу, пока они не решены или не отклонены\!</p><p><br/>Вы уверены, что всё равно хотите продолжить?</p></html>
Solutions.Issue.CompleteMilestone.Choice.0=<html><h3>Перейти к %s</h3><p>Подтвердите завершение и тестирование этапа <strong>%s</strong>:</p><br/><blockquote>%s</blockquote><br/><p>Примечание: все проблемы, связанные с этим этапом, должны быть решены или отклонены, прежде чем вы продолжите.</p><br/><p>Да? <em>Поздравляем!</em></p><br/><p>Вы можете перейти к следующему этапу <strong>%s</strong>:</p><br/><blockquote>%s</blockquote><br/><p>Будут представлены дополнительные проблемы и решения, которые необходимо решить для достижения следующего этапа.</p></html>
Solutions.Issue.CompleteMilestone.Choice.1=<html><h3>Вернуться назад к %s</h3><p>Чтобы ограничить объем проблем и решений, вы можете вернуться к предыдущему этапу. <strong>%s</strong>:</p><br/><blockquote>%s</blockquote><br/><p>Примечание. Большинство проблем и решений предыдущих этапов также сообщается в последующих этапах. Но в более ранних этапах некоторые решения предлагались более простые, более консервативные. Поэтому для устранения неполадок может быть полезно вернуться и попытаться заставить его работать там.</p></html>
