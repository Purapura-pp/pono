PlacementsHolderLocationViewer.ViewingOption.Locations.ToolTip=<Html><body style='width: 400'>Накладывает символ плюса на место каждой видимой плате и/или панели. Положительное направление Y обозначено отрезком <span style='background-color: black; color: \#00FFFF'><b>бирюзового цвета</span> похожим на перекрестие обзора камеры. Указывает место, куда должна переместиться камера, если она направлена в сторону платы или панели.</html>
