PlacementsHolderLocationViewer.ViewingOption.Origins.ToolTip=<Html><body style='width: 400'>Накладывает символ в начале каждой видимой системы координат платы и/или панели. Положительное направление X is обозначено стрелкой <span style='background-color: black; color: red'><b>красного цвета</span> а положительное Y направление обозначено стрелкой <span style='background-color: black; color: \#00FFFF'><b>бирюзового цвета</span>.</html>
PlacementsHolderLocationViewer.ViewingOption.Placements=Размещения
PlacementsHolderLocationViewer.ViewingOption.Placements.ToolTip=<Html><body style\='width\: 400'>Накладывает квадрат со стороной 1 мм в месте каждого видимого места размещения. Квадрат белый, если размещение включено, и серый, если отключено. Кроме того, маленький символ плюса отмечает центр размещения с положительным направлением Y обозначенным отрезком <span style\='background-color\: black; color\: \#00FFFF'><b>бирюзового цвета</span> похожим на перекрестие обзора камеры. Указывает место, куда должна переместиться камера, если она направлена на место размещения.</html>
