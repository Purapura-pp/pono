HeadSolutions.Issue.CreateNozzles=Создать сопла для этой головы
HeadSolutions.Solution.CreateNozzles=Выберите количество и тип сопел
HeadSolutions.Issue.CreateNozzles.Confirm=<html><p>Принятие этого решения может коренным образом изменить конфигурацию вашей машины.<br/>Произойдет следующее:<p/><ol><li>Текущая конфигурация машины сохраняется (так же, как Файл/Сохранить конфигурацию).</li><li>Новое решение перезаписывает существующую конфигурацию сопла и оси..</li><li>Поскольку сопла и оси остаются одного типа и количества, их детальная конфигурация сохраняется.</li><li>Решение для сопел можно применять несколько раз, вы можете пересматривать и расширять его.</li><li><span color=\"red\">Внимание:</span> Повторное открытие не восстановит предыдущую конфигурацию, а только позволит сделать новый выбор.<br/>Если вы хотите восстановить предыдущую конфигурацию, вы должны восстановить сохраненную конфигурацию вручную.</li></ol><br/>Are you sure?</html>
HeadSolutions.Solution.CreateNozzles.NumberOfNozzlesLabel.text=Количество сопел
HeadSolutions.Solution.CreateNozzles.NumberOfNozzlesLabel.toolTipText=Количество сопел или пар сопел
HeadSolutions.Solution.CreateNozzles.Choice.0=<html><h3>Автономное сопл</h3><p>Сопло имеет собственный двигатель оси Z.</p></html>
HeadSolutions.Solution.CreateNozzles.Choice.1=<html><h3>Пара сопел, общая ось Z, отрицательная</h3><p>Пара сопел использует двигатель оси Z. Когда первое сопло движется вверх, второе так же движется вниз. Сопла отрицательно связаны реечной передачей или ремнем.</p></html>
HeadSolutions.Solution.CreateNozzles.Choice.2=<html><h3>Пара сопел, общая ось Z, кулачок</h3><p>Пара сопел использует двигатель оси Z. Два сопла прижимаются вращающимся кулачком, подтянутым пружиной.</p></html>
