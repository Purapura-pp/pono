# Русская терминология
#
# Общий принцип, обратный китайскому: интерфейс переводится полностью, а не снабжается
# пояснением к английскому термину. Русская техническая лексика для станков и монтажа
# устоялась, поэтому «питатель» и «сопло» понятнее, чем «feeder» и «nozzle» с глоссой.
# Исключение сделано ровно для того, что пользователь встречает не только на экране:
# идентификаторы из machine.xml, значения перечислений и имена классов остаются английскими,
# иначе перевод разойдётся со скриншотами вики и с содержимым собственного файла конфигурации.
#
# Принятые переводы:
#   board плата              panel панель             placement размещение    job задание
#   part деталь              package корпус           feeder питатель         tape лента
#   nozzle сопло             nozzle tip наконечник сопла                      head головка
#   actuator актуатор        axis ось                 driver драйвер          machine машина
#   camera камера            vision обзор             pipeline конвейер       fiducial репер
#   pick подбор              place размещать          discard сброс           feed подача
#   home начальная позиция (действие — «Домой»)       homing базирование
#   backlash люфт            settling стабилизация    offset смещение         pitch шаг
#   Safe Z безопасная Z      units per pixel единицы на пиксель
#   issue проблема           solution решение         wizard мастер настройки
#   enabled включён          disabled отключён        apply применить         reset сброс
#   tool инструмент          slot слот                jog толчковое перемещение
#   Состояния «включено» и «отключено» в подписях, заголовках колонок и пунктах меню
#     ставятся в безличной форме среднего рода: одна и та же колонка появляется над
#     платами, панелями, размещениями и питателями, и род согласовать не с чем.
#
# Двоеточие перед подставляемым словом — не небрежность, а решение.
# Там, где Java приклеивает к строке существительное или подпись меню («Местоположение
# платы», «Миллиметры», «Включено»), приклеиваемое слово приходит в именительном падеже и с
# заглавной буквы, потому что оно же служит отдельным пунктом меню. Английский предлог этого
# не замечает — «on the Board Location» верно, — а русский требует падежа, которого
# подставляемое слово не несёт: «на Местоположение платы», «в Миллиметры». Поэтому в таких
# строках подстановка вынесена за двоеточие («Центрировать камеру: », «Введите размер.
# Единица: %s», «Установить для питателя(-ей) значение»): двоеточие принимает именительный
# падеж и заглавную букву, и правки в Java не требуется. Так же поступила французская строка.
# Если предлог вернуть, строка снова станет неграмотной.
#
# Одно русское слово на два английских — проверено и оставлено намеренно
# (i18n.py collisions находит их; здесь причина, чтобы не открывать вопрос заново):
#   Обзор       — и кнопка Browse, и vision. Кнопка выбора файла по-русски называется
#     только так, а vision по словарю выше — «обзор». Слова стоят на разных виджетах
#     и ни разу не спорят за одну подпись.
#   Выход       — Exit в меню «Файл» и Output в мастере сопоставленной оси, где он
#     составляет пару с «Вход» (Input).
#   Положение   — Location и Position. Различие английского здесь произвольное:
#     вкладка Position содержит панель Location с полем Location.
#   Шаг         — pitch у питателя и Step в задании и в построителе массива панелей.
#   Масштаб     — Scale в преобразовании термистора и Zoom в свойствах камеры.
#   Остальные совпадения — это одно и то же понятие, которое в английском написано
#     двумя способами: Crop/Cropped Width, Crop/Cropped Height, De-Interlace/Deinterlace,
#     Linear Transform/Transformation, Precision wanted/Wanted Precision, After/Post Pick,
#     % Round/% Roundness, «Add an existing panel to the job.»/«Add existing panel to job»
#     (подсказка действия и заголовок его же диалога), Load Gcode File/«Import the Gcode
#     profile from a file.» (вторая — дефект английского: в Name лежит целое предложение
#     из собственного описания, поэтому русская подпись кнопки короче исходной).
#
# Одно английское слово на два русских — то же решение с другой стороны:
#   Reticle     — «Прицельная сетка» в меню камеры и «Сетка» в просмотрщике панелей.
#     Это два разных наложения: у камеры перекрестие или окружность, а в просмотрщике,
#     по его же подсказке, «grid reticle» — координатная сетка. Английское слово одно,
#     предметов два.
#   Edit        — «Редактирование» в строке меню и «Редактировать» на кнопках. Меню верхнего
#     уровня по-русски называется существительным, кнопка — глаголом.
#
# Сознательно оставлено на английском (менять только всей группой сразу):
#   Имена классов и реализаций: GcodeDriver, ReferenceNozzle, ContactProbeNozzle, BlindsFeeder,
#     ReferenceStripFeeder, ReferencePushPullFeeder и подобные. Это идентификаторы: они
#     записаны в machine.xml и по ним ищут помощь в вики, перевод сделал бы их ненаходимыми.
#   Значения перечислений, встречающиеся в подсказках: None, LeaveAsIs, AssumeUnknown,
#     CommandStillstand, WaitForStillstand, OneSided, TwoSided и т. п. Сами выпадающие списки
#     строятся из Java-перечислений и не переводятся, так что перевод в подсказке описывал бы
#     пункт, которого на экране нет.
#   G-code и Gcode, команды контроллера, регулярные выражения, имена свойств.
#   Обозначения осей X, Y, Z, C и производные от них: Safe Z, Camera Z, «безопасная Z».
#     Буква остаётся латинской — это координата, а не слово.
#   Имена продуктов, форматов и протоколов: OpenPnP, OpenCV, Java, TCP, HTTP, USB, CSV, XML,
#     JSON, Hardware ID, KiCAD, Labcenter Proteus, EAGLE, Altium.
#   Сообщения журнала не переводятся вовсе: их читает тот, кто помогает разобраться с чужой
#     машиной, и он ожидает английский текст.
#
# Порядок работы с партиями и проверки описаны в TRANSLATIONS.md и tools/i18n/README.md.

