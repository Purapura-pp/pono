
A\ HTTPActuator\ with\ Read\ URL\ likely\ needs\ a\ regular\ Expression\ to\ parse\ the\ value.=HTTPActuator с URL для чтения, вероятно, требует регулярного выражения для разбора значения.
A\ high\ Preview\ FPS\ value\ might\ create\ undue\ CPU\ load.=Высокое значение частоты кадров предпросмотра может создать излишнюю нагрузку на процессор.
Accept\ to\ replace\ ACTUATOR_READ_COMMAND\ with\ ACTUATOR_READ_WITH_DOUBLE_COMMAND.\ Dismiss\ to\ remove\ read\ with\ double.=Нажмите «Принять», чтобы заменить ACTUATOR_READ_COMMAND на ACTUATOR_READ_WITH_DOUBLE_COMMAND. Нажмите «Отклонить», чтобы убрать чтение с типом double.
Advanced\ Motion\ Planner\ not\ set.\ Accept\ or\ Dismiss\ to\ continue.=Расширенный планировщик движения не задан. Нажмите «Принять» или «Отклонить», чтобы продолжить.
Advanced\ motion\ planner\ set.\ Revert\ to\ a\ simpler,\ safer\ planner.=Задан расширенный планировщик движения. Вернуться к более простому и безопасному планировщику.
Assign\ a\ driver\ as\ described\ in\ the\ Wiki.=Назначьте драйвер, как описано в вики.
Assign\ a\ driver.=Назначьте драйвер.
Assign\ the\ unique\ axis\ letter\ where\ wrong,\ press\ Accept,\ then\ press\ Find\ Issues\ &\ Solutions\ again\ to\ clear\ the\ correct\ one.=Назначьте уникальную букву оси там, где она неверна, нажмите «Принять», затем снова нажмите «Поиск проблем и решений», чтобы снять проблему с той оси, которая указана верно.
Avoid\ axis\ letter\ E,\ if\ possible.\ Use\ proper\ rotation\ axes\ instead.=По возможности избегайте буквы оси E. Используйте вместо неё настоящие оси вращения.
Axes\ should\ be\ configured\ as\ linear\ in\ feedrate\ calculations\ on\ the\ RepRapFirmware\ controller.\ See\ the\ linked\ web\ page.=В расчётах скорости подачи на контроллере RepRapFirmware оси должны быть настроены как линейные. См. страницу по ссылке.
Axis\ is\ not\ assigned\ to\ a\ driver.=Ось не назначена драйверу.
Axis\ letter\ is\ missing.\ Assign\ the\ letter\ to\ continue.=Не указана буква оси. Назначьте букву, чтобы продолжить.
Axis\ should\ be\ treated\ as\ a\ linear\ for\ detected\ firmware\ (all-primary\ axes\ mode).=Для обнаруженной прошивки ось должна считаться линейной (режим, в котором все оси основные).
Axis\ velocity\ limited\ by\ driver\ Maximum\ Feed\ Rate.\ =Скорость оси ограничена максимальной скоростью подачи драйвера. 
Change\ of\ serial\ port\ Flow\ Control\ recommended.=Рекомендуется изменить управление потоком последовательного порта.
Change\ to\ NullMotionPlanner=Сменить на NullMotionPlanner
Change\ to\ ReferenceAdvancedMotionPlanner=Сменить на ReferenceAdvancedMotionPlanner
Check\ axis\ letters\ and\ make\ sure\ the\ controller\ is\ capable\ to\ use\ extra\ axes\ (i.e.\ not\ extruders).=Проверьте буквы осей и убедитесь, что контроллер способен использовать дополнительные оси (то есть не экструдеры).
Check\ axis\ letters\ and\ make\ sure\ use\ a\ proper\ 6-axis\ configuration\ without\ extruders.=Проверьте буквы осей и убедитесь, что используется правильная 6-осевая конфигурация без экструдеров.
Check\ out\ firmwares\ known\ to\ be\ well\ supported.\ See\ info\ link.=Посмотрите прошивки, о которых известно, что они хорошо поддерживаются. См. ссылку с информацией.
Choose\ an\ advanced\ Motion\ Control\ Type\ for\ your\ controller\ type.=Выберите расширенный тип контроля движения для вашего типа контроллера.
Choose\ the\ right\ communications\ type\ and\ port/address\ settings.=Выберите правильный тип связи и настройки порта или адреса.
Choose\ the\ simplest\ Motion\ Control\ Type\ for\ the\ first\ basic\ setup.=Для первой базовой настройки выберите самый простой тип контроля движения.
Compress\ Gcode\ for\ superior\ communications\ speed.=Сжимайте G-код для более высокой скорости обмена.
Connect\ the\ driver\ to\ your\ controller.=Подключите драйвер к своему контроллеру.
Contact\ probe\ actuator\ needs\ unconditional\ machine\ coordination\ after\ actuation.=Актуатору контактного щупа требуется безусловная синхронизация машины после срабатывания.
Convert\ to\ GcodeAsyncDriver.=Преобразовать в GcodeAsyncDriver.
Convert\ to\ GcodeDriver.=Преобразовать в GcodeDriver.
Converting\ the\ ContactProbeNozzle\ back\ to\ a\ plain\ ReferenceNozzle\ may\ simplify\ the\ machine\ setup.=Преобразование ContactProbeNozzle обратно в обычный ReferenceNozzle может упростить настройку машины.
Depending\ on\ the\ type\ of\ nozzle\ tip\ or\ shade,\ select\ the\ proper\ background\ calibration.=В зависимости от типа наконечника сопла или его оттенка выберите подходящую калибровку фона.
Determine\ the\ camera\ head\ offsets.=Определить смещения камеры на головке.
Disable\ Allow\ Letter\ Pre-Move\ Commands.=Отключить разрешение буквенных команд перед перемещением.
Disable\ Compress\ G-code.=Отключить сжатие G-кода.
Disable\ Confirmation\ Flow\ Control\ for\ full\ asynchronous\ operation.=Отключите управление потоком по подтверждению для полностью асинхронной работы.
Disable\ Confirmation\ Flow\ Control.=Отключить управление потоком по подтверждению.
Disable\ Connection\ Keep-Alive.=Отключить поддержание соединения (Keep-Alive).
Disable\ G-code\ compression\ for\ trouble-free\ operation\ with\ incompatible\ controllers.=Отключите сжатие G-кода для безотказной работы с несовместимыми контроллерами.
Disable\ Location\ Confirmation=Отключить подтверждение положения
Disable\ Remove\ Comments.=Отключить удаление комментариев.
Disable\ Wrap\ Around.=Отключить «Обернуть вокруг».
Disallow\ Pre-Move\ Commands\ for\ automatic\ G-code\ setup\ and\ other\ advanced\ features.\ Accept\ or\ Dismiss\ to\ continue.=Запретите команды перед перемещением, чтобы работали автоматическая настройка G-кода и другие расширенные возможности. Нажмите «Принять» или «Отклонить», чтобы продолжить.
Enable\ Auto\ Camera\ View.=Включить автоматический вид камеры.
Enable\ Auto\ tool\ select.=Включить автоматический выбор инструмента.
Enable\ Compress\ Gcode.=Включить сжатие G-кода.
Enable\ Confirmation\ Flow\ Control.=Включить управление потоком по подтверждению.
Enable\ Continuous\ Motion.=Включить непрерывное движение.
Enable\ Letter\ Variables.=Включить буквенные переменные.
Enable\ Limit\ to\ Range.=Включить ограничение диапазона.
Enable\ Location\ Confirmation=Включить подтверждение положения
Enable\ Location\ Confirmation.=Включить подтверждение положения.
Enable\ Pre-Rotate.=Включить предварительный поворот деталей.
Enable\ Remove\ Comments.=Включить удаление комментариев.
Enable\ Suspend\ during\ tasks.=Включить приостановку во время выполнения задач.
Enable\ Visual\ Homing.=Включить визуальное базирование.
Enable\ Wrap\ Around.=Включить «Обернуть вокруг».
Enable\ script\ engine\ pooling.=Включить пул движков сценариев.
Feed-rate,\ acceleration,\ jerk\ etc.\ can\ now\ be\ set\ individually\ per\ axis.=Скорость подачи, ускорение, рывок и прочее теперь можно задавать отдельно для каждой оси.
Feeder\ has\ no\ configured\ offset=У питателя не настроено смещение
Feeder\ slot\ has\ no\ configured\ location=У слота питателя не настроено положение
For\ best\ results\ with\ color-keyed\ computer\ vision,\ it\ is\ recommended\ to\ use\ static\ white\ balance.=Для лучших результатов компьютерного зрения по цветовому ключу рекомендуется использовать статический баланс белого.
Get\ the\ new\ version\ through\ the\ linked\ web\ page.=Получите новую версию на странице по ссылке.
Go\ to\ the\ nozzle(s)\ and\ enable\ the\ Compatible\ switches\ where\ appropriate.=Перейдите к соплам и включите переключатели совместимости там, где это уместно.
Home\ the\ machine\ now.=Выполнить базирование машины сейчас.
In\ single\ camera\ preview\ OpenPnP\ can\ automatically\ switch\ the\ camera\ for\ you.=В режиме предпросмотра одной камеры OpenPnP может переключать камеру за вас автоматически.
It\ is\ OK\ to\ share\ rotation\ axes.\ If\ intentional,\ just\ dismiss\ this\ issue.\ Otherwise\ assign\ a\ different\ Rotation\ axis.=Использовать одну ось вращения совместно допустимо. Если это сделано намеренно, просто отклоните эту проблему. Иначе назначьте другую ось вращения.
Keep\ G-code\ comments\ for\ better\ debugging.=Сохраняйте комментарии в G-коде для более удобной отладки.
Link\ the\ Placements/Parts/Packages/Vision\ Settings/Feeders\ tables\ between\ tabs.=Связать таблицы размещений, деталей, корпусов, настроек обзора и питателей между вкладками.
Location\ Confirmation\ recommended\ for\ extra\ features\ in\ homing,\ contact\ probing,\ etc.=Подтверждение положения рекомендуется для дополнительных возможностей при базировании, контактном зондировании и т. п.
Location\ Confirmation\ usually\ not\ available\ when\ no\ axes\ present.=Подтверждение положения обычно недоступно, когда нет ни одной оси.
Marlin\ sends\ location-like\ responses\ to\ other\ commands\ so\ Location\ Confirmation\ is\ not\ reliable=Marlin отправляет похожие на отчёт о положении ответы и на другие команды, поэтому подтверждение положения ненадёжно
Mount\ a\ permanent\ fiducial\ to\ your\ machine\ and\ use\ it\ for\ repeatable\ precision\ X/Y\ homing.=Установите на машину постоянный репер и используйте его для повторяемого точного базирования по X и Y.
Move\ the\ camera\ over\ the\ primary\ calibration\ fiducial\ and\ capture\ its\ position.=Переместите камеру над первым калибровочным репером и захватите его положение.
Move\ the\ camera\ over\ the\ secondary\ calibration\ fiducial\ and\ capture\ its\ position.=Переместите камеру над вторым калибровочным репером и захватите его положение.
Only\ the\ GcodeAsyncDriver\ currently\ supports\ it.\ Advanced\ milestone\ required.=Сейчас это поддерживает только GcodeAsyncDriver. Требуется этап «Расширенные настройки».
OpenPnP\ can\ often\ automatically\ select\ the\ right\ tool\ for\ you\ in\ Machine\ Controls.=OpenPnP часто может сам выбрать нужный инструмент в панели «Управление машиной».
Please\ add\ the\ command\ manually.=Добавьте команду вручную.
Please\ assign\ a\ different\ Z\ axis.=Назначьте другую ось Z.
Please\ assign\ a\ proper\ Rotation\ axis.\ You\ might\ need\ to\ create\ one\ first.=Назначьте подходящую ось вращения. Возможно, сначала потребуется её создать.
Please\ assign\ a\ proper\ Z\ axis.\ You\ might\ need\ to\ create\ one\ first.=Назначьте подходящую ось Z. Возможно, сначала потребуется её создать.
Please\ upgrade\ the\ firmware\ and/or\ axis\ configuration.\ See\ the\ info\ link.=Обновите прошивку и/или конфигурацию осей. См. ссылку с информацией.
Please\ upgrade\ to\ the\ special\ PnP\ version.\ See\ info\ link.=Обновитесь до специальной версии PnP. См. ссылку с информацией.
Pre-rotate\ bottom\ vision\ must\ be\ enabled,\ because\ the\ machine\ has\ a\ limited\ articulation\ nozzle.=Предварительный поворот при обзоре снизу должен быть включён, потому что у машины сопло с ограниченным поворотом.
Primary\ calibration\ fiducial\ position\ and\ initial\ camera\ calibration.=Положение первого калибровочного репера и первичная калибровка камеры.
Primary/secondary\ calibration\ fiducial\ Z\ too\ close\ together.=Значения Z первого и второго калибровочных реперов слишком близки друг к другу.
Remove\ Gcode\ comments\ for\ superior\ communications\ speed.=Удаляйте комментарии из G-кода для более высокой скорости обмена.
Remove\ driver\ Maximum\ Feed\ Rate.=Убрать максимальную скорость подачи драйвера.
Remove\ the\ command.=Удалить команду.
Replace\ with\ ContactProbeNozzle.=Заменить на ContactProbeNozzle.
Replace\ with\ ReferenceNozzle.=Заменить на ReferenceNozzle.
Retry\ the\ detection\ by\ connecting\ to\ the\ controller\ or\ assume\ a\ generic\ controller.=Повторите обнаружение, подключившись к контроллеру, либо примите универсальный контроллер.
Rotation\ can\ be\ optimized\ by\ wrapping-around\ the\ shorter\ way.\ Best\ combined\ with\ Limit\ ±180°.=Поворот можно оптимизировать, обходя по более короткому пути. Лучше всего в сочетании с ограничением ±180°.
Rotation\ cannot\ be\ wrapped-around\ on\ a\ limited\ articulation\ axis.=На оси с ограниченным поворотом обход по короткому пути невозможен.
Rotation\ must\ be\ limited\ on\ a\ limited\ articulation\ axis.=На оси с ограниченным поворотом поворот должен быть ограничен.
Script\ execuction\ performance\ can\ be\ improved\ by\ enabling\ engine\ pooling.=Производительность выполнения сценариев можно повысить, включив пул движков.
Secondary\ calibration\ fiducial\ position.=Положение второго калибровочного репера.
Select\ the\ feeder\ in\ the\ Feeders\ tab\ and\ make\ sure\ the\ feeder\ has\ an\ offset\ location\ from\ the\ slot=Выберите питатель на вкладке питателей и убедитесь, что у питателя задано положение со смещением относительно слота
Select\ the\ feeder\ in\ the\ Feeders\ tab\ and\ make\ sure\ the\ slot\ has\ a\ set\ location=Выберите питатель на вкладке питателей и убедитесь, что у слота задано положение
Set\ After\ Actuation\ machine\ coordination\ to\ WaitForUnconditionalCoordination.=Установите синхронизацию машины после срабатывания в WaitForUnconditionalCoordination.
Set\ a\ suitable\ camera\ settling\ method\ automatically.=Автоматически подобрать подходящий метод стабилизации камеры.
Set\ an\ example\ expression=Задать пример выражения
Set\ to\ 5\ FPS.=Установить 5 кадр/с.
Set\ to\ Rendering\ Quality\ to\ High\ (right\ click\ the\ Camera\ View\ to\ see\ other\ options).=Установите качество отображения High (щёлкните правой кнопкой по виду камеры, чтобы увидеть остальные варианты).
The\ nozzle\ can\ be\ replaced\ with\ a\ ContactProbeNozzle\ to\ support\ various\ probing\ features.=Сопло можно заменить на ContactProbeNozzle, чтобы получить различные возможности зондирования.
The\ preview\ rendering\ quality\ can\ be\ improved.=Качество отображения предпросмотра можно улучшить.
To\ continue,\ the\ machine\ must\ be\ enabled\ and\ homed.=Чтобы продолжить, машина должна быть включена и базирована.
Use\ Axis\ Letter\ Variables\ for\ simpler\ use,\ automatic\ G-code\ setup,\ and\ other\ advanced\ features.=Используйте буквенные переменные осей для более простой работы, автоматической настройки G-кода и других расширенных возможностей.
Use\ Keep-Alive\ only\ when\ necessary.\ It\ may\ cause\ hard\ to\ diagnose\ problems.=Используйте Keep-Alive только при необходимости. Он может вызывать трудно диагностируемые проблемы.
Use\ an\ adaptive\ camera\ settling\ method.=Использовать адаптивный метод стабилизации камеры.
Use\ continuous\ motion.\ OpenPnP\ will\ only\ wait\ for\ the\ machine\ when\ really\ needed.=Используйте непрерывное движение. OpenPnP будет ждать машину только тогда, когда это действительно нужно.
Use\ the\ GcodeAsyncDriver\ for\ advanced\ features.\ Accept\ or\ Dismiss\ to\ continue.=Используйте GcodeAsyncDriver для расширенных возможностей. Нажмите «Принять» или «Отклонить», чтобы продолжить.
Use\ the\ GcodeDriver\ for\ simpler\ setup.\ Accept\ or\ Dismiss\ to\ continue.=Используйте GcodeDriver для более простой настройки. Нажмите «Принять» или «Отклонить», чтобы продолжить.
Use\ the\ M584\ S0\ option\ in\ your\ config.g\ file.=Используйте параметр M584 S0 в вашем файле config.g.
On\ the\ camera's\ Device\ Settings\ tab\ select\ the\ correct\ Device\ and\ Format.\ Then\ click\ on\ the\ Capture\ FPS\ Test\ button.\ An\ image\ from\ the\ camera\ should\ appear\ in\ the\ camera's\ view\ pane.=На вкладке настроек устройства камеры выберите правильные устройство и формат. Затем нажмите кнопку проверки частоты кадров захвата. В области просмотра камеры должно появиться изображение с камеры.
Camera\ not\ connected\ to\ Pono=Камера не подключена к Pono
