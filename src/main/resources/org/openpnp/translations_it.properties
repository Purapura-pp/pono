ReferenceNozzleTipToolChangerWizard.ChangerPanel.TouchLocationLabel.text=Posizione di contatto
ReferenceNozzleTipToolChangerWizard.ChangerPanel.ZCalibrateLabel.text=Calibrazione automatica di Z
ReferenceNozzleTipToolChangerWizard.ChangerPanel.ZCalibrateLabel.toolTipText=<html>\nCalibra la Z dell'ugello/puntale tastando la superficie della <strong>posizione di contatto</strong>.<br/>\nLa calibrazione di Z può essere avviata manualmente con il pulsante <strong>Calibra ora</strong> oppure automaticamente\:<br/>\n<ul>\n<li><strong>Manual\:</strong> non viene eseguita alcuna calibrazione automatica di Z. La calibrazione manuale viene salvata<br/>\nin modo permanente nella configurazione e resta valida anche dopo l'Home della macchina.</li>\n<li><strong>MachineHome\:</strong> la calibrazione automatica di Z viene eseguita all'Home della macchina.<br/>\nLa calibrazione Z dell'ugello viene riutilizzata quando si carica un altro puntale.</li>\n<li><strong>NozzleTipChange\:</strong> la calibrazione automatica di Z viene eseguita ogni volta che questo puntale<br/>\nviene cambiato oppure quando si esegue l'Home della macchina con questo puntale caricato.</li>\n</ul>\nNota\: puoi usare un puntale sostitutivo chiamato "unloaded" per eseguire la calibrazione di Z dell'ugello nudo. \n</html>
ReferenceNozzleTipToolChangerWizard.CloningSettingsPanel.BehaviorLabel.text=Comportamento
ReferenceNozzleTipToolChangerWizard.CloningSettingsPanel.BehaviorLabel.toolTipText=<html>\nUn puntale può diventare il <strong>modello</strong> da cui clonare gli altri.<br/>\nPono traslerà automaticamente le posizioni rispetto alla prima posizione.<br/>\nSe singoli puntali sono particolari, contrassegnali come <strong>Bloccato</strong>per impedirne la clonazione.\n</html>
ReferenceNozzleTipToolChangerWizard.CloningSettingsPanel.Border.title=Impostazioni di clonazione
ReferenceNozzleTipToolChangerWizard.CloningSettingsPanel.TemplateRadioButton.text=Modello
ReferenceNozzleTipToolChangerWizard.CloningSettingsPanel.TemplateRadioButton.toolTipText=Contrassegna questo puntale come modello da cui e verso cui clonare le impostazioni degli altri puntali.
ReferenceNozzleTipToolChangerWizard.UnnamedPanel.ClonesFromTemplateRadioButton.text=Clona dal modello
ReferenceNozzleTipToolChangerWizard.UnnamedPanel.ClonesFromTemplateRadioButton.toolTipText=Questo puntale può clonare le proprie impostazioni dal puntale contrassegnato come <strong>modello</strong>.
ReferenceNozzleTipToolChangerWizard.UnnamedPanel.LocationsLabel.text=Posizioni?
ReferenceNozzleTipToolChangerWizard.UnnamedPanel.LockedRadioButton.text=Bloccato
ReferenceNozzleTipToolChangerWizard.UnnamedPanel.LockedRadioButton.toolTipText=<html>Questo puntale è bloccato contro la clonazione.<br/>Nota\: la Z della sua posizione di contatto può comunque essere calibrata rispetto al riferimento del puntale modello. </html>
ReferenceNozzleTipToolChangerWizard.UnnamedPanel.VisionCalibrationLabel.text=Calibrazione con la visione?
ReferenceNozzleTipToolChangerWizard.UnnamedPanel.ZCalibrationLabel.text=Calibrazione di Z?
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.AdjustZLabel.text=Correzione di Z
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.AdjustZLabel.toolTipText=<html>\nCorregge di questo offset la coordinata Z della posizione di visione. Impostala alla distanza in Z tra <br/>\nil soggetto modello che stai rilevando con la calibrazione con la visione, ad es. la superficie visibile <br/>\ndello slot del cambia puntali, e il lato inferiore (immaginario) del puntale quando si trova in quella posizione. Correzione <br/>\npositiva se il puntale è sotto quella superficie, negativa se è sopra.<br/> \nQuesta impostazione permette di superare gli errori di scala nella vista della telecamera, specialmente quando gli oggetti sono molto <br/>\npiù vicini alla telecamera del solito.<br/>\n<strong>Sulla telecamera devono essere configurate le unità per pixel 3D.</strong> \n</html>
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.Border.title=Calibrazione con la visione
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.CalibrationTriggerLabel.text=Innesco della calibrazione
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.LastScoreLabel.text=Ultimo punteggio
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.MaxPassesLabel.text=Passaggi max.
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.MinScoreLabel.text=Punteggio minimo
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.MinScoreLabel.toolTipText=<html>\nQuando le immagini modello vengono confrontate con l'immagine della telecamera, viene calcolato un punteggio<br/>\nche indica la qualità della corrispondenza. Se il punteggio ottenuto è minore del punteggio minimo<br/>\nindicato qui, la calibrazione fallisce. Questo dovrebbe impedire alla macchina di tentare un cambio <br/>\ndi puntale quando la posizione è errata. \n</html>
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.TemplateEmptyLabel.text=Modello a slot vuoto
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.TemplateHeightLabel.text=Altezza del modello
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.TemplateHeightLabel.toolTipText=<html>\nAltezza (Y) dell'immagine modello. Il modello è centrato sulla posizione di visione selezionata.<br/>\nScegli dimensioni il più piccole possibile, ma i modelli devono comprendere bordi orizzontali e verticali<br/>\nsignificativi. Inoltre il puntale deve essere visibile quando occupa lo slot del cambia puntali.\n</html>
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.TemplateOccupiedLabel.text=Modello a slot occupato
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.TemplateWidthLabel.text=Larghezza del modello
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.TemplateWidthLabel.toolTipText=<html>\nLarghezza (X) dell'immagine modello. Il modello è centrato sulla posizione di visione selezionata.<br/>\nScegli dimensioni il più piccole possibile, ma i modelli devono comprendere bordi orizzontali e verticali<br/>\nsignificativi. Inoltre il puntale deve essere visibile quando occupa lo slot del cambia puntali.\n</html>
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.ToleranceLabel.text=Tolleranza
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.ToleranceLabel.toolTipText=Tolleranza massima di calibrazione, ovvero quanto la posizione calibrata può discostarsi da quella nominale.
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.VisionCalibrationHelpLabel.text=<html>\nAcquisisci due immagini modello dello slot del cambia puntali,<br/>\nuna a slot vuoto e una a slot occupato.<br/>\nUsando questi modelli, la calibrazione con la visione calibrerà le<br/>\nposizioni del cambia puntali in X/Y e verificherà anche che lo slot sia vuoto<br/>\no occupato come previsto.\n</html>
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.VisionLocationLabel.text=Posizione per la visione
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.VisionLocationLabel.toolTipText=<html>Posizione per la calibrazione con la visione, oppure None per nessuna calibrazione.<br/>\nScegli una posizione in cui il puntale nello slot sia visibile. \n</html>
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.WantedPrecisionLabel.text=Precisione desiderata
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.WantedPrecisionLabel.toolTipText=<html>Se la corrispondenza rilevata dell'immagine modello è più lontana della <strong>precisione desiderata</strong>,<br/>\nla telecamera viene ricentrata e viene eseguito un altro passaggio di visione.</html>
ReferenceNozzleToolChangerWizard.ChangerPanel.Border.title=Cambio puntali
ReferenceNozzleToolChangerWizard.ChangerPanel.ChangeOnManualLabel.text=Cambiare al prelievo manuale?
ReferenceNozzleToolChangerWizard.ChangerPanel.ChangerEnabledLabel.text=Cambio utensile automatico abilitato?
ReferenceNozzleToolChangerWizard.ChangerPanel.ManualChangeLocationLabel.text=Posizione di cambio manuale
