ReferencePushPullFeederConfigurationWizard.lblHole2Location.toolTipText=<html>Scegli il foro 2 più lontano dalla bobina del nastro.<br/>\r\nSe possibile scegli due fori che racchiudano i componenti da prelevare.\r\n</html>
ReferencePushPullFeederConfigurationWizard.lblMultiplier.text=Moltiplicatore
ReferencePushPullFeederConfigurationWizard.lblMultiplier.toolTipText=Per migliorare l'efficienza puoi azionare l'alimentatore più volte, così da far avanzare più componenti per ciclo.
ReferencePushPullFeederConfigurationWizard.lblNormalizePickLocation.text=Normalizzare?
ReferencePushPullFeederConfigurationWizard.lblNormalizePickLocation.toolTipText=Normalizza la posizione di prelievo rispetto ai fori di trascinamento secondo lo standard EIA-481.
ReferencePushPullFeederConfigurationWizard.lblOcrFontName.text=Nome del carattere OCR
ReferencePushPullFeederConfigurationWizard.lblOcrFontName.toolTipText=<html>Nome del carattere OCR da riconoscere oppure [Barcode].<br/>\r\nI caratteri a spaziatura fissa funzionano molto meglio, permettono una risoluzione minore e quindi un <br/>\r\nfunzionamento più rapido. Usa un carattere in cui tutti i simboli usati siano facilmente distinguibili.<br/>\r\nSono molto preferibili i caratteri con una netta separazione tra i glifi.</html>
ReferencePushPullFeederConfigurationWizard.lblOcrWrongPart.text=Azione OCR per componente errato
ReferencePushPullFeederConfigurationWizard.lblOcrWrongPart.toolTipText=<html>Determina quale azione intraprendere quando l'OCR rileva nell'alimentatore un ID componente errato.<br/> \r\n<ul>\r\n<li>\r\n<strong>None</strong>\: usa questa impostazione se non vuoi usare l'OCR.</li>\r\n<li>\r\n<strong>SwapFeeders</strong>\: se viene rilevato un componente errato ma il componente giusto è selezionato<br/>\r\nin un altro ReferencePushPullFeeder, le posizioni dei due alimentatori vengono scambiate. L'alimentatore<br/>\r\nsubentrante verrà abilitato. Questo accade se scarichi, ricarichi o riordini gli<br/>\r\nalimentatori sulla macchina.</li>\r\n<li>\r\n<strong>SwapOrCreate</strong>\: funziona come <strong>SwapFeeders</strong>, ma se non<br/>\r\nviene trovato nessun altro alimentatore con il componente giusto, ne viene creato uno nuovo e messo al posto<br/>\r\ndell'alimentatore attuale, nella sua posizione. L'alimentatore attuale viene a sua volta disabilitato (ora si trovano nella<br/>\r\nstessa posizione e solo uno deve essere abilitato).</li>\r\n<li>\r\n<strong>ChangePart</strong>\: viene cambiato il componente dell'alimentatore attuale. Funziona<br/>\r\ncorrettamente solo se le impostazioni del nastro ecc. restano le stesse tra i componenti, ovvero se limiti<br/>\r\nogni ricarica o riordino a gruppi di alimentatori con le stesse impostazioni.</li>\r\n<li>\r\n<strong>ChangePartAndClone</strong>\: viene cambiato il componente dell'alimentatore attuale, ma le<br/>\r\nimpostazioni vengono clonate da un alimentatore modello.</li>\r\n</ul>\r\n</html>\r\n
ReferencePushPullFeederConfigurationWizard.lblPartPitch.text=Passo dei componenti
ReferencePushPullFeederConfigurationWizard.lblPartPitch.toolTipText=Passo dei componenti nel nastro (2 mm, 4 mm, 8 mm, 12 mm, ecc.)
ReferencePushPullFeederConfigurationWizard.lblPickLocation.text=Posizione di prelievo
ReferencePushPullFeederConfigurationWizard.lblPickLocation.toolTipText=<html>Posizione di prelievo del componente. Se un'operazione di avanzamento ne rende disponibili più di uno<br/>\r\nquesta deve essere quella dell'ultimo prelevato, ovvero la più vicina alla bobina del nastro.</html>
ReferencePushPullFeederConfigurationWizard.lblPrecisionAverage.text=Precisione media
ReferencePushPullFeederConfigurationWizard.lblPrecisionAverage.toolTipText=Precisione media ottenuta, ovvero l'offset della posizione di prelievo rilevato dalla calibrazione
ReferencePushPullFeederConfigurationWizard.lblPrecisionConfidenceLimit.text=Limite di confidenza della precisione
ReferencePushPullFeederConfigurationWizard.lblPrecisionConfidenceLimit.toolTipText=Precisione ottenuta con il 95% di confidenza (assumendo una distribuzione normale)
ReferencePushPullFeederConfigurationWizard.lblPrecisionWanted.text=Precisione desiderata
ReferencePushPullFeederConfigurationWizard.lblPrecisionWanted.toolTipText=Precisione desiderata, ovvero l'offset tollerabile della posizione di prelievo
ReferencePushPullFeederConfigurationWizard.lblRotation.text=Rotazione nel nastro
ReferencePushPullFeederConfigurationWizard.lblRotation.toolTipText=<html>Rotazione del componente all'interno del nastro vista con i fori di trascinamento <br/>\r\nin alto. Il riferimento è l'orientamento del componente nel tuo E-CAD.<br/>\r\nVedi anche\: \r\n<ul>\r\n<li>EIA-481</li>\r\n<li>Component Zero Orientations for CAD Libraries</li>\r\n</ul>\r\n</html>
ReferencePushPullFeederConfigurationWizard.lblSnapToAxis.text=Agganciare all'asse?
ReferencePushPullFeederConfigurationWizard.lblSnapToAxis.toolTipText=Aggancia le file di fori di trascinamento alla parallela all'asse.
ReferencePushPullFeederConfigurationWizard.lblStopAfterWrong.text=Fermarsi dopo un componente errato?
ReferencePushPullFeederConfigurationWizard.lblTemplate.text=Modello\:
ReferencePushPullFeederConfigurationWizard.lblUsedAsTemplate.text=Usare questo come modello?
ReferencePushPullFeederConfigurationWizard.lblUsedAsTemplate.toolTipText=<html>Usa questo alimentatore come modello per clonare le impostazioni su altri alimentatori. <br/>\r\nI modelli vengono abbinati in base alla specifica di nastro e bobina o al package dei componenti <br/>\r\ncaricati negli alimentatori. <br/>\r\nQuando nessun modello corrisponde formalmente, viene preso l'alimentatore \ncon le maggiori somiglianze <br/>\r\n(passo di avanzamento, larghezza del nastro, vicinanza, ecc.).</html>
ReferencePushPullFeederConfigurationWizard.lblVisionType.text=Tipo di visione
ReferencePushPullFeederConfigurationWizard.lblVisionType.toolTipText=<html>\r\n<p>Scegli il tipo di visione, poi premi <strong>Reimposta pipeline</strong> per assegnare la<br/>\r\npipeline predefinita di quel tipo. I fori di trascinamento vengono rilevati così\:</p>\r\n<ul>\r\n<li><strong>ColorKeyed</strong>\: lo sfondo sotto i fori deve avere un colore vivace<br/>\r\n(verde per impostazione predefinita).</li>\r\n<li><strong>CircularSymmetry</strong>\: la forma dei fori deve essere circolare e il loro<br/>\r\ninterno/esterno uniforme.</li>\r\n</ul>\r\n<p>Entrambi i tipi di pipeline valutano ulteriormente i fori rilevati in base a dimensione, allineamento, passo<br/>\r\ne distanza attesa.</p>\r\n</html>
