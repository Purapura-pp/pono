ReferenceNozzleTipConfigurationWizard.PartDimensionsPanel.MaxPartHeightLabel.toolTipText=Altezza massima dei componenti prelevati con questo puntale. Usata per la Safe Z dinamica se l'altezza del componente è sconosciuta.
ReferenceNozzleTipConfigurationWizard.PartDimensionsPanel.MaxPickToleranceLabel.text=Tolleranza max. di prelievo
ReferenceNozzleTipConfigurationWizard.PartDimensionsPanel.MaxPickToleranceLabel.toolTipText=<html>\nTolleranza di prelievo massima ammessa con questo puntale.<br/>\nDetermina quanto lontano dalla posizione nominale può trovarsi una posizione di <br/>\nallineamento rilevata dalla Bottom Vision per essere accettata. Riduce inoltre il <br/>\ntempo di calcolo di alcune operazioni di visione limitando l'area di ricerca.\n</html>\n\n
ReferenceNozzleTipConfigurationWizard.PartDimensionsPanel.MinPartDiameterLabel.text=Diametro min. del componente
ReferenceNozzleTipConfigurationWizard.PartDimensionsPanel.MinPartDiameterLabel.toolTipText=<html>\nDiametro minimo del componente da prelevare con questo puntale.<br/>\nNota\: il <strong>diametro minimo del componente</strong> meno due volte la <strong>tolleranza di prelievo</strong><br/>\ndetermina il diametro <em>interno</em> minimo del puntale che<br/>\nviene sempre considerato coperto dal componente. Questo diametro interno viene ignorato<br/>\nnell'analisi del colore chiave e nella diagnostica della calibrazione dello sfondo.\n</html>
ReferenceNozzleTipConfigurationWizard.PickAndPlacePanel.Border.title=Prelievo e posa
ReferenceNozzleTipConfigurationWizard.PickAndPlacePanel.DwellTimeLabel.text=Nota\: il tempo di attesa totale è la somma del tempo di attesa dell'ugello e del tempo di attesa del puntale.
