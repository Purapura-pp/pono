ReferenceCameraCalibrationWizard.CameraCalibrationPanel.CautionLabel.text=<html><p width\="500" style\="color\:Black;background-color\:Yellow;">Attenzione - durante la sequenza di calibrazione il puntale verrà abbassato a queste coordinate Z e spostato su <b>tutto il campo visivo</b> della telecamera. Prima di avviare la calibrazione assicurati che ci sia spazio sufficiente rispetto a qualsiasi ostacolo vicino alla telecamera, altrimenti la macchina potrebbe danneggiarsi.</p></html>
