ReferencePushPullFeederConfigurationWizard.lblHole1Location.toolTipText=<html>Scegli il foro 1 più vicino alla bobina del nastro.<br/>\r\nSe possibile scegli due fori che racchiudano i componenti da prelevare.\r\n</html>
