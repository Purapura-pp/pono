PlacementsHolderLocationViewer.ViewingOption.Locations.ToolTip=<Html><body style\='width\: 400'>Sovrappone un simbolo più alla posizione di ogni scheda e/o pannello visibile. La direzione Y positiva è indicata dal braccio di <span style\='background-color\: black; color\: \#00FFFF'><b>colore ciano</span>, come nel mirino della vista della telecamera. Indica la posizione in cui la telecamera si sposterebbe se venisse inviata alla posizione della scheda o del pannello.</html>
