BambooFeederAutoVisionConfigurationWizard.textFieldRotationInTape.toolTipText=<html>\n<p>L'impostazione <strong>Rotazione nel nastro</strong> va interpretata rispetto all'orientamento del nastro, <br/>\nindipendentemente da come l'alimentatore o il nastro sono orientati sulla macchina. </p>\n<ol>\n<li>\n<p>Guarda l'orientamento <strong>neutro</strong> verticale del package/footprint del componente <br/>\ncome è disegnato nella <strong>libreria</strong> del tuo E-CAD.</p>\n</li>\n<li>\n<p>Osserva come sono orientati il pin 1, la polarità, il catodo ecc.  <br/>\nQuesto è lo 0° del componente.</p>\n</li>\n<li>\n<p>Guarda il nastro con i fori di trascinamento in alto. <br/>\nQuesto è lo 0° dell'orientamento del nastro (secondo lo standard industriale EIA-481).</p>\n</li>\n<li>\n<p>Determina come il componente è ruotato all'interno della tasca del nastro, <em>rispetto</em> al  <br/>\nsuo orientamento verticale del punto (1).  La rotazione positiva è antioraria.<br/>\nQuesta è la tua <strong>Rotazione nel nastro</strong>.</p>\n</li>\n</ol>\n</html>
