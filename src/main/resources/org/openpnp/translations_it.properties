ReferenceAdvancedMotionPlanner.MotionPlannerDiagnostics.title=Diagnostica del pianificatore del movimento
ReferenceAdvancedMotionPlannerConfigurationWizard.MotionPlannerPanel.AllowContinousMotionLabel.text=Consentire il movimento continuo?
ReferenceAdvancedMotionPlannerConfigurationWizard.MotionPlannerPanel.AllowContinousMotionLabel.toolTipText=<html>\r\n<p>Spesso Pono chiede ai controller di eseguire un movimento composto da più<br/>\r\nsegmenti. Ad esempio uno spostamento alla Safe Z, seguito da uno spostamento sopra la posizione <br/>\r\ndi destinazione, seguito da un abbassamento dell'ugello per prelevare o posizionare un componente. </p> \r\n<p>Se il pianificatore di movimento e/o il controller ricevono questi comandi come un'unica<br/>\r\nsequenza, possono applicarvi alcune ottimizzazioni. Inoltre non vengono introdotti ritardi<br/>\r\ndovuti alla comunicazione avanti e indietro. La pianificazione può anche procedere <br/>\r\nin parallelo mentre il controller sta ancora eseguendo gli ultimi comandi.</p>\r\n<p>Consentendo il movimento continuo abiliti queste ottimizzazioni. Tuttavia la <br/>\r\nconfigurazione della macchina, ovvero G-code, script personalizzati ecc., deve tenere conto del fatto che il <br/>\r\npianificatore non attende più il completamento di ogni movimento, se non gli viene richiesto esplicitamente. </p>\r\n</html>
ReferenceAdvancedMotionPlannerConfigurationWizard.MotionPlannerPanel.AllowUncoordinatedLabel.text=Consentire i movimenti non coordinati?
ReferenceAdvancedMotionPlannerConfigurationWizard.MotionPlannerPanel.AllowUncoordinatedLabel.toolTipText=<html>\r\nConsentire il movimento non coordinato permette al pianificatore di usare funzioni avanzate<br/>\r\ncome la sovraelongazione, la fusione dei movimenti ecc. Richiede un driver che supporti<br/>\r\nil controllo del movimento del terzo ordine, simulato o reale (con queste funzioni sul controller).\r\n</html>
ReferenceAdvancedMotionPlannerConfigurationWizard.MotionPlannerPanel.Border.title=Pianificatore del movimento
ReferenceAdvancedMotionPlannerConfigurationWizard.MotionPlannerPanel.FuseBacklashFinalApproachLabel.text=Fondere l'avvicinamento di gioco?
ReferenceAdvancedMotionPlannerConfigurationWizard.MotionPlannerPanel.FuseBacklashFinalApproachLabel.toolTipText=<html>\r\n<p>La compensazione del gioco in due parti - posizionamento unilaterale o avvicinamento<br/>\r\nlento - oltrepassa il bersaglio e poi lo raggiunge con un secondo movimento separato.<br/>\r\nQuel secondo movimento costa un arresto e una riga di G-code ogni volta.</p>\r\n<p>Con questa opzione attiva, il pianificatore fonde quell'avvicinamento nel movimento<br/>\r\nsuccessivo, purché questo non muova gli assi compensati - di norma la discesa in Z su un<br/>\r\ncomponente. L'asse arriva ancora dallo stesso lato, e più delicatamente di prima, perché<br/>\r\nora percorre la sua frazione di millimetro lungo tutta la discesa.</p>\r\n<p>Richiede il movimento continuo, senza il quale non c'è nulla in cui fondere. Il<br/>\r\nmovimento fuso porta con sé la corsa di compensazione durante la discesa, quindi<br/>\r\ndisattivarlo se un ugello deve scendere in una sede del cambiautensile o in un altro<br/>\r\npunto troppo stretto per lo scostamento del gioco.</p>\r\n</html>
ReferenceAdvancedMotionPlannerConfigurationWizard.MotionPlannerPanel.InterpolationRetimingLabel.text=Ritemporizzazione dell'interpolazione?
ReferenceAdvancedMotionPlannerConfigurationWizard.MotionPlannerPanel.InterpolationRetimingLabel.toolTipText=<html>\r\nL'interpolazione può solo approssimare i veri profili di movimento del terzo ordine,<br/>\r\nquindi sono attese alcune deviazioni. La ritemporizzazione allunga il movimento<br/>\r\nper farlo coincidere con la temporizzazione originale del terzo ordine. Questo però riduce leggermente<br/>\r\nla velocità di avanzamento di picco. Disattivandola ottieni la velocità di picco pianificata ma una durata<br/>\r\ndel movimento leggermente inferiore.\r\n</html>
ReferenceAdvancedMotionPlannerConfigurationWizard.MotionPlannerPanel.MinimumSpeedLabel.text=Velocità minima
ReferenceAdvancedMotionPlannerConfigurationWizard.MotionPlannerPanel.MinimumSpeedLabel.toolTipText=<html>\r\n<p>\r\nVelocità minima supportata dal pianificatore di movimento.\r\n</p><p>\r\nVelocità minime eccessivamente basse richiedono una precisione eccessiva per<br/>\r\nvelocità di avanzamento, accelerazione (e jerk). Mantenendo le velocità minime sopra<br/>\r\nlivelli ragionevoli (ad es. 5%), alcuni calcoli (come l'interpolazione) possono essere<br/>\r\nottimizzati.<br/>\r\n</p><p>\r\nPer i driver che comunicano tramite protocollo testuale (GcodeDriver) servono meno cifre<br/>\r\ndecimali, il che riduce la latenza dei comandi.<br/>\r\n</p>\r\n</html>
