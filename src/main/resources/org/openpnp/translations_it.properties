ReferenceNozzleTipPartDetectionWizard.PartOffVacuumSensingPanel.ValveOpenCloseLabel.toolTipText=<html>\n<p>La valvola viene aperta e chiusa per creare un piccolo impulso di depressione. </p>\n<p>Il tempo di apertura dovrebbe essere piuttosto breve\: non serve creare la piena aspirazione di prelievo.</p>\n<p>Il tempo di chiusura può servire ad attendere che il sistema reagisca all'impulso,<br/>\ncompresi i ritardi di propagazione e di lettura del segnale del sensore.</p>\n</html>
