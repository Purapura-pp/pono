ReferenceNozzleTipCalibrationWizard.TopPanel.RecalibrationLabel.toolTipText=<html>\n<p>Determina quando viene eseguita automaticamente una ricalibrazione\:</p>\n<p><ul><li>A ogni cambio di puntale.</li>\n<li>A ogni cambio di puntale, ma solo nei lavori.</li>\n<li>All'Home della macchina e al primo caricamento. </li></ul></p>\n<p>Manuale con calibrazione memorizzata (consigliata solo per macchine <br /> \ncon Home dell'asse C).</p>\n</html>
