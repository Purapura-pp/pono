PackageCompositingWizard.AllowInsideCornerLabel.text=Consentire l'angolo interno?
PackageCompositingWizard.AllowInsideCornerLabel.toolTipText=<html>\n<p>Consente di includere gli angoli rivolti verso l'interno, verso il centro del componente. <br/>\nSi può usare per allineare componenti ancora troppo grandi, ovvero quando il <strong>raggio di spostamento</strong><br/>\ndella telecamera è troppo piccolo. Richiede in genere pad grandi e ben distanziati.</p>\n<br/>\n<p>Esempio\: raddrizzatori di potenza SMD.</p>\n</html>
PackageCompositingWizard.Border.title=Composizione
PackageCompositingWizard.ComputeCompositing.Name=Calcola
PackageCompositingWizard.ComputeCompositing.ShortDescription=Ricalcola la composizione della visione.
PackageCompositingWizard.Error.text=Errore\: 
PackageCompositingWizard.ExtraShotsLabel.text=Scatti aggiuntivi
PackageCompositingWizard.ExtraShotsLabel.toolTipText=<html>\n<p>Il compositing di visione determina l'insieme minimo ottimale di scatti necessari per determinare<br/>\nposizione e angolo del componente. Oltre a questi suggerisce scatti aggiuntivi, utilizzabili per <br/>\nmigliorare l'accuratezza di posizione e di angolo. </p>\n<br/>\n<p>Esempio\: un componente quadrato può essere determinato con due scatti su angoli diagonali. I due<br/>\nangoli opposti del quadrato vengono proposti come scatti aggiuntivi.</p>\n<br/>\n<p><strong>Scatti aggiuntivi</strong> indica quanti di questi scatti aggiuntivi vanno usati. \n</html>
PackageCompositingWizard.MaxPickToleranceLabel.text=Tolleranza max. di prelievo
PackageCompositingWizard.MaxPickToleranceLabel.toolTipText=<html>\n<p>Se è zero, viene usata la <strong>tolleranza massima di prelievo</strong> del puntale.</p>\n<br/>\n<p>Se è diversa da zero, questa <strong>tolleranza massima di prelievo</strong> la sostituisce per questo package.</p>\n<br/>\n<p>In entrambi i casi la <strong>tolleranza massima di prelievo</strong> deve coprire gli offset <br/>\nlineari del componente prelevato sull'ugello, gli offset degli angoli <br/>\ncausati da offset di rotazione e le combinazioni dei due.</p>\n</html>
PackageCompositingWizard.MethodLabel.text=Metodo
PackageCompositingWizard.MethodLabel.toolTipText=<html>\n<p>Metodo di compositing\:</p>\n<ul>\n<li><strong>None\:</strong> non viene eseguito alcun compositing.</li>\n<li><strong>Restricted\:</strong> il compositing viene eseguito solo quando la <br/>\ndimensione del footprint è troppo grande oppure quando è asimmetrico.</li>\n<li><strong>Automatic\:</strong> il compositing viene sempre eseguito. Può comunque <br/>\nportare a una soluzione con un solo scatto, se gli angoli sono tutti convessi <br/>\ne simmetrici.</li>\n<li><strong>SingleCorner\:</strong> il compositing viene sempre eseguito. Ogni <br/>\nangolo viene ripreso singolarmente. Riduce gli errori di parallasse, perché <br/>\nogni angolo è centrato nella telecamera.</li>\n</ul>\n</html>\n\n
PackageCompositingWizard.MinAngleLeverageLabel.text=Leva angolare min.
PackageCompositingWizard.MinAngleLeverageLabel.toolTipText=<html>\n<p>Leva minima richiesta per ricavare l'informazione angolare da due angoli.</p>\n<br/>\n<p>La <strong>leva angolare minima</strong> è indicata in modo <em>relativo</em> rispetto a larghezza e altezza del footprint<br/>\n(la minore delle due).</p>\n<br/>\n<p>Esempio\: impostando 0.5 i due angoli devono coprire almeno metà della dimensione del componente<br/>\nper fornire l'informazione angolare.</p>\n</html>
