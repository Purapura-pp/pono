ReferenceNozzleTipCalibrationWizard.BackgroundCalibrationPanel.MinDetailSizeLabel.toolTipText=<html>\n<p>Indica la dimensione dei dettagli più piccoli dell'immagine che sono considerati parte<br/>\nsignificativa della forma da rilevare, come i contatti più piccoli ecc.<br/>\nPuntini e artefatti più piccoli, come rumore dell'immagine, texture, marcature o sporco sugli<br/>\noggetti, sono considerati irrilevanti per l'elaborazione dell'immagine, il che significa che<br/>\nsi possono applicare filtri per sopprimerli nell'immagine. </p> \n<p><strong>Nota\:</strong> la <strong>dimensione minima del dettaglio</strong> può anche\ninfluire sul costo di calcolo di alcune<br/>\npipeline/stage. Dettagli piccoli comportano un costo di calcolo elevato.</p>\n</html>
