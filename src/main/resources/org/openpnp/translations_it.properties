HeadSolutions.Issue.CreateNozzles=Crea gli ugelli per questa testa.
HeadSolutions.Issue.CreateNozzles.Confirm=<html><p>Accettare questa soluzione può modificare in modo sostanziale la configurazione della macchina.<br/>Succederà quanto segue\:<p/><ol><li>La configurazione attuale della macchina viene salvata (come File/Salva configurazione).</li><li>La nuova soluzione sovrascrive la configurazione esistente di ugelli e assi.</li><li>Se ugelli e assi mantengono lo stesso tipo e numero, la loro configurazione di dettaglio viene conservata.</li><li>Una soluzione per gli ugelli può essere applicata più volte\: puoi riprenderla ed estenderla.</li><li><span color\="red">Attenzione\:</span> Riapri non ripristina la configurazione precedente, permette solo una nuova scelta.<br/>Se vuoi ripristinare la configurazione precedente devi ripristinare manualmente la configurazione salvata.</li></ol><br/>Sei sicuro?</html>
HeadSolutions.Solution.CreateNozzles=Scegli il numero e il tipo di ugelli.
HeadSolutions.Solution.CreateNozzles.Choice.0=<html><h3>Ugello indipendente</h3><p>L'ugello ha un proprio motore dedicato per l'asse Z</p></html>
HeadSolutions.Solution.CreateNozzles.Choice.1=<html><h3>Coppia di ugelli, asse Z condiviso, movimento opposto</h3><p>Una coppia di ugelli condivide il motore dell'asse Z. Quando il primo ugello sale, il secondo scende della stessa quantità. Gli ugelli sono accoppiati in senso opposto tramite pignone e cremagliera o cinghia.</p></html>
HeadSolutions.Solution.CreateNozzles.Choice.2=<html><h3>Coppia di ugelli, asse Z condiviso, camma</h3><p>Una coppia di ugelli condivide il motore dell'asse Z. I due ugelli vengono spinti verso il basso da una camma rotante e riportati in alto da una molla.</p></html>
