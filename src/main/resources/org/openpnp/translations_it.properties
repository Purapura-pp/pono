ReferenceMachineConfigurationWizard.PanelGeneral.UnsafeZRoamingLabel.toolTipText=<html>Distanza massima di spostamento consentita a Z non sicura.<br/><br/>\r\nGli assi Z virtuali (di norma sulle telecamere) sono invisibili, perciò è facile non accorgersi<br/>\r\ndi trovarsi a Z non sicura. Quando in seguito premi il pulsante <strong>Sposta l'utensile alla posizione della telecamera</strong><br/>\r\nsi verifica un inatteso movimento di discesa in Z, che può far urtare l'utensile.<br/>\r\nLa distanza massima di spostamento consentita a Z non sicura limita quindi l'area di Jog<br/>\r\nentro la quale viene mantenuta una Z virtuale non sicura; dovrebbe bastare per la messa a punto fine di una posizione<br/>\r\nacquisita. Spostandosi oltre in Jog, l'asse virtuale viene portato automaticamente alla Safe Z.\r\n</html>
