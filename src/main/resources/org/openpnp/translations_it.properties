GcodeAsyncDriverSettings.InterpolationPanel.MaximumNumberofJerkStepsLabel.text=Numero massimo di passi di jerk
GcodeAsyncDriverSettings.InterpolationPanel.MaximumNumberofJerkStepsLabel.toolTipText=<html>\r\nNumero massimo di passi di interpolazione usati per simulare il controllo del jerk.<br/>\r\nSignifica che l'accelerazione verrà aumentata o diminuita in altrettanti passi <br/>\r\nrispetto all'accelerazione massima.\r\n</html>
GcodeAsyncDriverSettings.InterpolationPanel.MaximumNumberofStepsLabel.text=Numero massimo di passi
GcodeAsyncDriverSettings.InterpolationPanel.MaximumNumberofStepsLabel.toolTipText=<html>\r\nNumero massimo di passi utilizzabili per l'interpolazione di un singolo movimento.<br>\r\nUsa una frazione della profondità massima di coda del tuo controller. <br/>\r\nSe il numero viene superato, il pianificatore di movimento ricadrà su un singolo movimento moderato. \r\n</html>
GcodeAsyncDriverSettings.InterpolationPanel.MinimumAxisResolutionTicksLabel.text=Tick minimi di risoluzione dell'asse
GcodeAsyncDriverSettings.InterpolationPanel.MinimumAxisResolutionTicksLabel.toolTipText=<html>\r\n<p>Distanza minima di passo dell'asse usata per interpolare i percorsi di movimento avanzati.</p>\r\n<p>È indicata in tick di risoluzione degli assi.</p>\r\n</html>
GcodeAsyncDriverSettings.InterpolationPanel.MinimumStepTimeLabel.text=Tempo minimo di passo [s]
GcodeAsyncDriverSettings.InterpolationPanel.MinimumStepTimeLabel.toolTipText=<html>\r\n<p>Il passo temporale minimo usato per interpolare i percorsi di movimento avanzati. Espresso in secondi.</p>\r\n</html>
GcodeAsyncDriverSettings.SettingsPanel.Border.title=Impostazioni
GcodeAsyncDriverSettings.SettingsPanel.ConfirmationFlowControlLabel.text=Controllo di flusso con conferma?
GcodeAsyncDriverSettings.SettingsPanel.ConfirmationFlowControlLabel.toolTipText=<html>\r\n<p>La comunicazione con il controller è regolata attendendo la risposta "ok"<br/>\r\nprima di inviare il comando successivo. </p>\r\n<p>È più lenta di altri tipi di controllo di flusso, come RTS/CTS su una connessione seriale, quindi <br/>\r\nquesti ultimi sono preferibili.</p>\r\n</html>
GcodeAsyncDriverSettings.SettingsPanel.LocationConfirmationLabel.text=Conferma della posizione?
GcodeAsyncDriverSettings.SettingsPanel.LocationConfirmationLabel.toolTipText=<html>Chiede al controller di riportare la posizione al termine di un movimento.<br/>\r\nSe è cambiata, la posizione interna di Pono viene aggiornata. Il report di posizione viene <br/>\r\nusato anche per sincronizzare Pono quando il controllo di flusso con conferma è disabilitato.<br/>\r\nAlmeno una delle due opzioni deve essere abilitata. La conferma della posizione consente<br/>\r\nun funzionamento asincrono più esteso. \r\n</html>
