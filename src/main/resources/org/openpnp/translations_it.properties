ReferenceHeadConfigurationWizard.PumpPanel.VacuumPumpControlLabel.toolTipText=<html>\r\n<p>Determina come viene controllato lo stato acceso/spento della pompa\:</p>\r\n<ul>\r\n<li><strong>None</strong>\: la pompa è controllata manualmente o al di fuori di Pono.<br/>\r\nUsalo ad esempio per un controllo a isteresi lato controller.</li>\r\n<li><strong>PartOn</strong>\: la pompa viene accesa quando sta per essere prelevato <br/>\r\nun componente e spenta quando nessun ugello ha un componente.</li>\r\n<li><strong>TaskDuration</strong>\: la pompa viene accesa quando sta per essere<br/>\r\nprelevato un componente e viene spenta solo quando le operazioni in coda (ad es. <br/>\r\nil lavoro in corso) sono terminate, a condizione che nessun ugello abbia un componente.</li>\r\n<li><strong>KeepRunning</strong>\: la pompa viene accesa quando sta per essere<br/>\r\nprelevato un componente e resta in funzione finché non viene spenta esplicitamente <br/>\r\no finché la macchina non viene disabilitata.</li>\r\n</ul>\r\n</html>
