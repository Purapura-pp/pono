ReferenceCameraCalibrationWizard.CameraCalibrationPanel.MovableDefaultZTextFiled.toolTipText=<html><p width\="500">Questa è la coordinata Z presunta degli oggetti inquadrati dalla telecamera quando la loro coordinata Z reale è sconosciuta. Di solito viene impostata alla coordinata Z della superficie di lavoro delle schede da popolare.</p></html>
