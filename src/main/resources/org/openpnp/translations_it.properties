GcodeDriverSettings.SettingsPanel.MaxFeedRate.text=Velocità di avanzamento max. [/min]
GcodeDriverSettings.SettingsPanel.MaxFeedRate.toolTipText=<html><p>Velocità di avanzamento massima del percorso utensile in unità del driver al minuto. </p>\n<p>Imposta 0 per disattivarla e usare solo i limiti di velocità degli assi. I movimenti diagonali risulteranno così più rapidi. </p>\n</html>
GcodeDriverSettings.SettingsPanel.MotionControlTypeLabel.text=Tipo di controllo del movimento
GcodeDriverSettings.SettingsPanel.MotionControlTypeLabel.toolTipText=<html>\n<p>Determina come il MotionPlanner di Pono pianificherà il movimento e come dialogherà <br/>\ncon il controller\:</p>\n<ul>\n\n<li><strong>ToolpathFeedRate\:</strong><br/>\nApplica al percorso utensile il limite nominale di velocità di avanzamento del driver moltiplicato per il fattore di velocità.<br/>\nLa velocità di avanzamento del driver deve essere specificata. Non viene applicato alcun controllo dell'accelerazione.</li>\n\n<li><strong>EuclideanAxisLimits\:</strong><br/>\nApplica i limiti di velocità di avanzamento, accelerazione e jerk degli assi moltiplicati per i rispettivi fattori di velocità. <br/>\nLa metrica euclidea viene calcolata per permettere alla macchina di andare più veloce in diagonale.<br/>\nPono imposta solo il massimo del fattore di velocità; l'aumento e la riduzione della velocità sono <br/>\nlasciati interamente al controller. </li>  \n\n<li><strong>ConstantAcceleration\:</strong><br/>\nPianifica il movimento assumendo un controller con controllo del movimento ad accelerazione costante. </li>\n\n<li><strong>ModeratedConstantAcceleration\:</strong><br/>\nPianifica il movimento assumendo un controller ad accelerazione costante, ma<br/>\nmodera accelerazione e velocità per avvicinarle a quelle del controllo del terzo ordine, ottenendo<br/>\nun movimento che richiede lo stesso tempo e ha un'accelerazione media simile. <br/>\nQuesto riduce già un po' le vibrazioni.</li>\n\n<li><strong>SimpleSCurve\:</strong><br/>\nPianifica il movimento assumendo un controller con controllo del movimento a curva S semplificata. <br/>\nLe curve S semplificate non hanno una fase ad accelerazione costante, ma solo fasi di jerk (ad es. TinyG, Marlin).</li>\n\n<li><strong>Simulated3rdOrderControl\:</strong><br/>\nPianifica il movimento assumendo un controller ad accelerazione costante, ma<br/>\nsimulando il controllo del terzo ordine con interpolazione a passi temporali. </li> \n\n<li><strong>Full3rdOrderControl\:</strong><br/>\nPianifica il movimento assumendo un controller con controllo del movimento del terzo ordine completo.</li> \n\n</ul></html>
GcodeDriverSettings.SettingsPanel.RemoveCommentsLabel.text=Rimuovere i commenti?
GcodeDriverSettings.SettingsPanel.RemoveCommentsLabel.toolTipText=<html>\n<p>Rimuove i commenti dal G-code per velocizzare le trasmissioni <br/>\nverso il controller.</p>\n<p>Nota\: funziona solo con lo stile di sintassi G-code.</p>\n<p>Esempio\:</p>\n<p><code style\="background-color\:\#DDDDDD">G1 <span style\="color\:\#007700">(move to)</span> X100 Y20 <span style\="color\:\#007700">; move to the given X, Y</span><br/></code></p>\n<p>viene inviato come\:</p>\n<p><code style\="background-color\:\#DDDDDD">G1 X100 Y20 </code></p>\n</html>
