ReferencePushPullFeederConfigurationWizard.btnDiscardParts.toolTipText=<html>Scarta i componenti rimasti nel ciclo di avanzamento (multi-componente).<br/>\r\nRiparte con un nuovo ciclo di avanzamento, compresa la calibrazione con la visione (se abilitata). \r\n</html>
