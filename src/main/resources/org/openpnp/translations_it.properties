ReferenceNozzleVacuumWizard.ContentPanel.ClosesVacuumActuatorLabel.text=Chiude l'attuatore del vuoto?
ReferenceNozzleVacuumWizard.ContentPanel.ClosesVacuumActuatorLabel.toolTipText=<html>\r\nAzionare l'attuatore di soffiaggio spegne anche <em>implicitamente</em> l'attuatore del vuoto.<br/>\r\nSe questa opzione è abilitata, lo spegnimento <em>esplicito</em> dell'attuatore del vuoto viene omesso.\r\n</html>
