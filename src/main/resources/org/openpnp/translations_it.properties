ReferencePushPullFeederConfigurationWizard.checkBoxUsedAsTemplate.toolTipText=<html>Usa questo alimentatore come modello per clonare le impostazioni su altri alimentatori. <br/>\r\nI modelli vengono abbinati in base alla specifica di nastro e bobina o al package dei componenti <br/>\r\ncaricati negli alimentatori. <br/>\r\nQuando nessun modello corrisponde formalmente, viene preso l'alimentatore \ncon le maggiori somiglianze <br/>\r\n(passo di avanzamento, larghezza del nastro, vicinanza, ecc.).</html>
