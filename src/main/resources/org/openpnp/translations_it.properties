ReferenceNozzleTipCalibrationWizard.CalibrationPanel.CalibrationZOffsetLabel.toolTipText=<html>\n<p>\nQuando l'elemento rilevato dalla visione si trova più in alto sul puntale <br />\nsi consiglia di spostare il piano di messa a fuoco con l'"offset Z".\n</p>\n<p>Se un puntale è chiamato "unloaded", viene usato come sostituto per la calibrazione<br />\ndel portapuntale nudo. Anche in questo caso l'"offset Z" può servire a calibrare sul <br />\npiano focale corretto. \n</p>\n</html>
