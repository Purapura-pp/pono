FiducialVisionSettingsConfigurationWizard.lblParallaxAngle.text=Angolo di parallasse
FiducialVisionSettingsConfigurationWizard.lblParallaxAngle.toolTipText=<html>\n<p>\nAngolo secondo cui i due punti di vista di parallasse della telecamera sono distanziati tra loro.<br/>\nScegli un angolo che favorisca l'asse più rapido della tua macchina\: 0° favorisce X, 90° favorisce Y.<br/>\nAltri angoli possono servire a migliorare l'accuratezza o a uniformare i riflessi dell'anello di LED.\n</p>\n</html> \n\n
FiducialVisionSettingsConfigurationWizard.lblParallaxDiameter.text=Diametro di parallasse
FiducialVisionSettingsConfigurationWizard.lblParallaxDiameter.toolTipText=<html>\n<p>\nQuando è indicato il <strong>diametro di parallasse</strong>, il localizzatore di fiducial esegue il rilevamento da due<br/>\npunti di vista di parallasse della telecamera, su entrambi i lati della posizione attesa del fiducial. La distanza<br/> tra i due è definita dal diametro di parallasse.</p>\n<p>\nL'applicazione tipica riguarda i fiducial molto riflettenti, come quelli su PCB con finitura<br/>\nsuperficiale HASL (Hot Air Solder Leveling). Questi riflettono la telecamera che guarda attraverso il diffusore, perciò<br/> \nil fiducial può apparire (in parte) scuro e/o mal formato per il rilevamento.\n</p>\n<p>\nRilevando da un punto di vista di parallasse, il fiducial appare inclinato e riflette il<br/>\ndiffusore luminoso della luce della telecamera. Facendolo da punti di vista opposti e simmetrici, si può<br/>\nprendere il punto medio per annullare gli errori di parallasse.\n</p>\n</html>
