ReferenceStripFeederConfigurationWizard.PanelVision.lblParallaxDiameter.toolTipText=<html>\n<p>\nQuando è indicato il <strong>diametro di parallasse</strong>, la visione dei fori di trascinamento esegue il rilevamento da un<br/>\npunto di vista di parallasse della telecamera, a lato della posizione attesa del foro. La distanza<br/> dalla telecamera al foro è metà del diametro di parallasse.</p>\n<p>\nL'applicazione tipica riguarda il nastro trasparente, difficile da vedere con la visione diretta, ma la cui<br>\nsuperficie riflettente rimanda il diffusore luminoso della luce della telecamera.</p>\n</html>
