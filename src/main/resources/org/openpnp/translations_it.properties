ReferencePnpJobProcessorConfigurationWizard.lblOptimizeMultipleNozzles.toolTipText=Ottimizza il percorso dei passi di prelievo, allineamento e posa nelle macchine multiugello cambiando l'ordine in cui vengono gestiti gli ugelli.
ReferencePnpJobProcessorConfigurationWizard.lblPreRotateAllNozzles.text=Pre-ruotare tutti gli ugelli
ReferencePnpJobProcessorConfigurationWizard.lblPreRotateAllNozzles.toolTipText=<html>Pre-ruota tutti gli ugelli durante lo spostamento verso la prima posizione di avanzamento o di prelievo, verso la telecamera inferiore e verso la prima posizione di posizionamento.<br/>Ammesso che questi spostamenti richiedano più tempo del portare l'ugello successivo alla sua posizione di prelievo, alla telecamera inferiore<br/>o alla posizione di posizionamento, questo può aumentare le prestazioni e ridurrà il rischio che i componenti slittino sui puntali.</html>
ReferencePnpJobProcessorConfigurationWizard.lblStepsMotion.text=Passo al movimento successivo
ReferencePnpJobProcessorConfigurationWizard.lblStepsMotion.toolTipText=L'avanzamento passo passo si fermerà solo al passo successivo che comporta un movimento
