BoardsPanel.BoardPlacements.Placements.Rank.toolTip=<html><body style\='width\: 400'><strong>Ordine</strong> controlla la sequenza con cui i posizionamenti vengono gestiti durante un lavoro. I posizionamenti vengono eseguiti dall'ordine più basso a quello più alto. Vale un <strong>ordinamento stretto</strong> quando la differenza tra i valori di ordine è 10 o più. Tutti i posizionamenti con ordine R devono essere completati e corretti prima che l'ordine R+10 venga preso in considerazione. Non vale <strong>alcun vincolo di ordinamento</strong> quando la differenza tra i valori di ordine è minore di 10. I posizionamenti con ordine R possono essere eseguiti in qualsiasi punto tra R-9 e R+9, in base alle altre priorità di ottimizzazione del lavoro.</body></html>
