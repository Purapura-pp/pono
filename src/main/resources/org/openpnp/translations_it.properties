ReferenceNozzleTipToolChangerWizard.ChangerPanel.FirstLocationLabel.toolTipText=<html>Prima posizione della sequenza di movimento per il caricamento del puntale.<br/>\nÈ il primo punto di passaggio quando si carica il puntale e<br/>\nl'ultimo quando lo si scarica.\n</html>
ReferenceNozzleTipToolChangerWizard.ChangerPanel.LastLocationLabel.text=Ultima posizione
ReferenceNozzleTipToolChangerWizard.ChangerPanel.Post1ActuatorLabel.text=Attuatore dopo il passo 1
ReferenceNozzleTipToolChangerWizard.ChangerPanel.Post2ActuatorLabel.text=Attuatore dopo il passo 2
ReferenceNozzleTipToolChangerWizard.ChangerPanel.Post3ActuatorLabel.text=Attuatore dopo il passo 3
ReferenceNozzleTipToolChangerWizard.ChangerPanel.SecondLocationLabel.text=Seconda posizione
ReferenceNozzleTipToolChangerWizard.ChangerPanel.SpeedLabel.text=Velocità
