PlacementsHolderLocationViewer.ViewingOption.Placements.ToolTip=<Html><body style\='width\: 400'>Sovrappone un quadrato di 1mm alla posizione di ogni posizionamento visibile. Il quadrato è bianco se il posizionamento è abilitato, grigio se è disabilitato. Inoltre un piccolo simbolo più segna il centro del posizionamento, con la direzione Y positiva indicata dal braccio di <span style\='background-color\: black; color\: \#00FFFF'><b>colore ciano</span>, come nel mirino della vista della telecamera. Indica la posizione in cui la telecamera si sposterebbe se venisse inviata alla posizione del posizionamento.</html>
