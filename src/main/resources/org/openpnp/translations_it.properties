OpenPnpCaptureCameraConfigurationWizard.DevicePanel.CaptureFPSLabel.toolTipText=<html>\r\n<p>Il test acquisisce fotogrammi il più rapidamente possibile e calcola gli FPS medi ottenuti.</p>\r\n<p>I fotogrammi vengono copiati dal buffer della telecamera e convertiti in immagini Java, <br/>\r\nma non viene eseguita alcuna elaborazione aggiuntiva (nessuna calibrazione dell'obiettivo, nessuna trasformazione ecc.)</p>\r\n<p>Per risultati più accurati imposta gli FPS di anteprima a 0.</p>\r\n</html>
