GcodeDriverSettings.SettingsPanel.BackslashEscapedCharactersLabel.toolTipText=Consente di inserire caratteri unicode nelle stringhe G-code nella forma \\uxxxx, dove xxxx sono quattro caratteri esadecimali.  Ammette anche \\t per la tabulazione, \\b per il backspace, \\n per il line feed, \\r per il carriage return e \\f per il form feed.
