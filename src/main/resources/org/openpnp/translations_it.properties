ReferenceRotatedTrayFeederConfigurationWizard.ErrorMessage.OffsetsAndRotationInconsistency=Gli offset e/o la rotazione del vassoio sono incoerenti con i punti A, B, C, il numero di righe e/o il numero di colonne. Ricontrolla questi valori e poi fai clic sul pulsante Calcola offset e rotazione del vassoio per renderli coerenti.
