BacklashCompensationConfigurationWizard.BacklashDiagnosticsPanel.ToleranceLabel.toolTipText=<html>\n<p>Tolleranza accettabile (±) della compensazione del gioco meccanico per la calibrazione.</p>\n<p>Una tolleranza più ampia può consentire un metodo di compensazione del gioco più efficiente.</p>\n</html>
