Solutions.Issue.CompleteMilestone=Completa la fase
Solutions.Issue.CompleteMilestone.Choice.0=<html><h3>Passa a %s</h3><p>Conferma di aver completato e verificato la fase <strong>%s</strong>\:</p><br/><blockquote>%s</blockquote><br/><p>Nota\: tutti i problemi di questa fase dovrebbero essere risolti o ignorati prima di procedere.</p><br/><p>Sì? <em>Congratulazioni\!</em></p><br/><p>Puoi passare alla fase successiva <strong>%s</strong>\:</p><br/><blockquote>%s</blockquote><br/><p>Verranno presentati altri problemi e soluzioni da affrontare per raggiungere la fase successiva.</p></html>
Solutions.Issue.CompleteMilestone.Choice.1=<html><h3>Torna a %s</h3><p>Per limitare l'ambito di Problemi e soluzioni puoi tornare alla fase precedente <strong>%s</strong>\:</p><br/><blockquote>%s</blockquote><br/><p>Nota\: la maggior parte dei problemi e delle soluzioni delle fasi precedenti viene segnalata anche nelle fasi successive. Nelle fasi di destinazione più iniziali, però, alcune soluzioni proposte sono più semplici e prudenti. Per la ricerca dei guasti può quindi essere utile tornare indietro e provare a farlo funzionare lì.</p></html>
Solutions.Issue.CompleteMilestone.Confirm=<html><p>I problemi della fase <strong>%s</strong> sono ancora aperti\:</p> %s <p color\="red">Non è consigliabile passare alla fase di destinazione successiva prima che siano risolti o ignorati\!</p><p><br/>Vuoi davvero procedere comunque?</p></html>
