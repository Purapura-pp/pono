# Convenzioni terminologiche - italiano
#
# Principio generale: si traduce la lingua dell'interfaccia, non il vocabolario di OpenPnP.
# Chi usa la macchina legge il wiki in inglese e guarda gli screenshot della comunità, quindi i
# nomi delle funzioni, delle classi e dei concetti di coordinata restano in inglese; tutto il
# resto è in italiano. Dove un termine inglese resta ma non è trasparente, si aggiunge una
# glossa fra parentesi la prima volta che compare in una frase, per esempio
# "nozzle tip (puntale dell'ugello)". Non si mette la glossa nelle etichette brevi dei campi,
# dove non c'è spazio.
#
# Traducenti fissati:
#   actuator attuatore          axis asse                   board scheda
#   camera telecamera           head testa                  job lavoro
#   nozzle ugello               nozzle tip puntale          part componente
#   feeder alimentatore         placement posizionamento    panel pannello
#   pick prelievo/prelevare     place posizionare           discard scartare
#   feed avanzamento            feed rate velocità di avanzamento
#   units per pixel unità per pixel                         settling stabilizzazione
#   backlash gioco meccanico    speed velocità              enabled/disabled abilitato/disabilitato
#   vision visione artificiale  test/probe sonda, tastatura
#   settings impostazioni       wizard procedura guidata    tab scheda (di finestra)
#
# Voci lasciate deliberatamente in inglese (pensarci bene prima di cambiare):
#   Safe Z, Camera Z    concetti di coordinata citati ovunque nel wiki e nei forum; tradurli
#                       renderebbe impossibile ritrovarli nella documentazione
#   Home                è il nome scritto sul pulsante ed è usato anche come verbo; una resa
#                       italiana ("azzeramento") non coincide con ciò che l'utente vede
#   jog, jogging        movimento manuale a passi: nessun equivalente italiano altrettanto breve,
#                       ed è il termine corrente nella comunità
#   offset              già di uso comune in italiano tecnico, più chiaro di "scostamento"
#   driver, controller, firmware, pipeline, package, footprint, fiducial, Gcode
#                       termini tecnici che in italiano si usano così come sono
#   Bottom Vision, Top Vision, Blinds Feeder, Push-Pull, Contact Probing
#                       nomi di funzioni di OpenPnP, non descrizioni
#   nomi di classi e implementazioni: GcodeDriver, ReferenceNozzle, ContactProbeNozzle,
#                       ReferenceCamera, SimulatedUpCamera, e simili
#   Start, Stop, Step   etichette dei comandi macchina, già così nelle voci preesistenti
#   unità di misura e sigle: mm, mil, DPI, TCP, USB, CSV, XML, JSON, OpenCV
#
# Note di coerenza: per "camera" si usa "telecamera" e per "placement" si usa "posizionamento".
# Le voci vecchie che dicevano "videocamera", "piazzamento" o "inserimento" sono state allineate;
# restano solo dentro alcune voci morte, che non sono più nel bundle inglese e non compaiono da
# nessuna parte.
#
# Le etichette sono in stile frase, non in Title Case: si scrive "Salva lavoro", non "Salva
# Lavoro". Il maiuscolo su ogni parola è una convenzione inglese e in italiano è un errore.
#
# "Edit" è "Modifica", sia il menu sia i pulsanti; "Edita" non è italiano. "Language" nel menu
# di visualizzazione è "Lingua": "Linguaggio" vuol dire altro (linguaggio di programmazione,
# registro linguistico). "Next" su un pulsante è "Avanti", non "Seguente".
#
# Il pulsante Cancel è "Annulla", mai "Cancella", che in italiano vuol dire eliminare:
# davanti a un dialogo OK/Cancella l'utente sceglierebbe fra confermare e cancellare qualcosa.
# "Cancella" resta solo dove l'inglese dice davvero Clear o Delete, come nel tooltip del log.
#
# Verbo o sostantivo: la distinzione è voluta, anche se i18n.py consistency la segnala.
#   Feed     "Avanza" per l'azione su un pulsante, "Avanzamento" per etichette e colonne
#   Search   "Cerca" sui pulsanti e sulle etichette accanto al campo, "Ricerca" come titolo
#            di un pannello, dove serve un sostantivo
#   Step     "Step" per il comando macchina accanto a Start e Stop, "Passo" per il passo di
#            una matrice nel generatore di array: sono due sensi diversi
# Allo stesso modo "Enabled" e "Disabled" concordano in genere con il nome a cui si
# riferiscono: "Abilitata" per la scheda e per la macchina, "Abilitato" per il componente,
# l'alimentatore, l'asse e il posizionamento.
#
# Una sola parola italiana per più stringhe inglesi: è il rovescio del punto precedente e lo
# segnala i18n.py collisions. Anche queste sono scelte volute, perché l'inglese usa due parole
# dove l'italiano ne ha una, oppure perché l'italiano non distingue il plurale.
#   Annulla   Cancel e Edit > Undo. È la convenzione di Windows e di macOS, e le due voci non
#             si incontrano mai: Undo sta nel menu Modifica accanto a "Ripeti", Cancel sta sui
#             pulsanti dei dialoghi accanto a OK. Disambiguare con "Annulla operazione"
#             romperebbe l'abitudine che l'utente ha preso in ogni altro programma.
#   Passo     Pitch e Step sono la stessa grandezza, la distanza fra un elemento e il
#             successivo, nel nastro come nella matrice. È l'inglese ad avere due parole.
#   Posizione Location e Position, che l'inglese usa come sinonimi e annida uno dentro l'altro.
#   Stato     State e Status: in italiano è una parola sola.
#   File, Package, Proprietà   invariabili al plurale, quindi coprono anche Files, Packages
#             e Property.
#   Dopo il prelievo / Prima del prelievo   After Pick e Post Pick, Before Pick e Pre Pick:
#             è lo stesso momento, l'inglese non è coerente con sé stesso. Vale anche per
#             "% Rotondità", "Impostazioni di clonazione", "Precisione desiderata" e
#             "Trasformazione lineare".
#
# Il flusso di lavoro (batch, import, check) è descritto in TRANSLATIONS.md.

