ReferenceNozzleConfigurationWizard.OffsetsPanel.AlignwithPartLabel.toolTipText=<html>\n<p>Dopo l'allineamento del componente con la Bottom Vision, fa sì che l'offset della modalità di rotazione dell'ugello<br/>\nsi allinei alla rotazione del componente.</p>\n<br/>\n<p>In questo modo le coordinate dell'ugello indicate nel reticolo (mirino),<br/>\nnel DRO ecc. corrispondono alla rotazione rilevata del componente.</p>\n<br/>\n<p>Dopo il posizionamento o lo scarto del componente, l'ugello torna a indicare la rotazione <br/>\noriginale dell'asse.</p>\n</html>
