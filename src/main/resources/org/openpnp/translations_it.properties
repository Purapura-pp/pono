BlindsFeederArrayConfigurationWizard.lblNormalize.toolTipText=<html>\r\nNormalizza le distanze e lo scorrimento dei fiducial ai valori teoricamente <br />\r\ncorretti (griglia quadrata a millimetri interi). Significa che ti fidi della meccanica  <br />\r\ndella tua macchina e della tua stampante 3D più che dei rilevamenti dei fiducial tramite visione.  <br />\r\nLa posizione e l'angolo assoluti complessivi restano determinati dalla visione. \r\n</html>
