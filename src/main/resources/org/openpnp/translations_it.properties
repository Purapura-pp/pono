ReferenceCameraCalibrationWizard.CameraCalibrationPanel.DefaultWorkingPlaneZLabel.text=Z del piano di lavoro predefinito
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.DescriptionLabel.text=<html><p width\="500">Le impostazioni di questa scheda sono destinate col tempo a sostituire tutte le impostazioni di unità per pixel della scheda Configurazione generale, tutto il contenuto della scheda Calibrazione dell'obiettivo e tutto il contenuto della scheda Trasformazioni dell'immagine. Sostituiranno anche il pulsante di calibrazione di posizione e rotazione della telecamera nella scheda Calibrazione dei puntali.</p><p> </p><p width\="500"><b>Prerequisiti\:</b> gli assi X, Y e Z della macchina, la compensazione del gioco meccanico e la correzione della non ortogonalità devono essere tutti calibrati correttamente. Inoltre, prima di tentare la calibrazione della telecamera, vanno risolti eventuali problemi di non ripetibilità meccanica (passi persi, pulegge/ingranaggi allentati, cinghie che slittano ecc.). In più, per le telecamere inferiori, l'asse di rotazione e gli offset dell'ugello devono essere calibrati correttamente e l'Home visivo, se si intende usarlo, deve essere configurato e funzionante.</p></html>
