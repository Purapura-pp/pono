ReferenceCameraWhiteBalanceConfigurationWizard.Action.AutoWhiteBalance.Description=<html>Tieni un oggetto chiaro e neutro davanti alla telecamera e<br/>premi questo pulsante per calibrare automaticamente il bilanciamento del bianco.<br/><br/>Questo metodo considera dove si distribuisce la maggior parte del colore,<br/>nel complesso.</html>
