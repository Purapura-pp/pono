ReferenceControllerAxisConfigurationWizard.ControllerSettingsPanel.ResolutionLabel.text=Risoluzione [unità del driver]
ReferenceControllerAxisConfigurationWizard.ControllerSettingsPanel.ResolutionLabel.toolTipText=<html><strong>Risoluzione</strong> di questo asse. Le coordinate verranno arrotondate al multiplo più vicino quando si tratta<br/>\r\ndi confrontarle, ovvero un movimento viene eseguito solo se dopo l'arrotondamento risultano diverse.<br/>\r\nIdealmente va impostata alla risoluzione fisica in micro-passi (o simili) dell'asse, oppure a un multiplo intero<br/>\r\npratico di essa. La <strong>risoluzione</strong> è il reciproco degli <strong>Steps / Unit</strong>, che spesso vengono configurati<br/>\r\nnei controller.<br/>\r\n<br/>\r\nCon il GcodeDriver assicurati che la risoluzione sia esprimibile con il formato usato nel <br/>\r\n<code>MOVE_TO_COMMAND</code>. Il valore predefinito è 0.0001, che corrisponde al formato %.4f (quattro cifre decimali)<br/>\r\nnel <code>MOVE_TO_COMMAND</code>.<br/>\r\n<br/>\r\nNota\: la <strong>risoluzione</strong> è espressa in unità del driver (non di sistema).\r\n</html>
ReferenceControllerAxisConfigurationWizard.ControllerSettingsPanel.Steps.text=Passi
ReferenceControllerAxisConfigurationWizard.ControllerSettingsPanel.StepsUnitLabel.text=Passi / unità
ReferenceControllerAxisConfigurationWizard.ControllerSettingsPanel.StepsUnitLabel.toolTipText=<html>Gli <strong>Steps per Unit</strong> sono il reciproco della <strong>risoluzione</strong>.<br/>\r\nSpesso si trovano nella configurazione del controller, quindi puoi inserirli qui per<br/>\r\ncalcolare automaticamente la <strong>risoluzione</strong>.</html>
ReferenceControllerAxisConfigurationWizard.ControllerSettingsPanel.SwitchLinearRotationalLabel.text=Commutare lineare ↔ rotativo?
ReferenceControllerAxisConfigurationWizard.ControllerSettingsPanel.SwitchLinearRotationalLabel.toolTipText=<html>È importante che Pono sappia se un asse è lineare o rotazionale nel <br/>\r\ncontroller. <br/>\r\n<br/>\r\nQuasi sempre questo è già determinato dal tipo di asse, ovvero X, Y, Z sono lineari <br/>\r\ne Rotation è rotazionale. A volte però possono mancare assi adeguati sul <br/>\r\ncontroller e occorre usare un asse lineare del controller per un asse rotazionale di Pono <br/>\r\no viceversa.<br/>\r\n<br/>\r\nSe non puoi configurare il controller per invertire questo significato, è importante abilitare <br/>\r\nla casella Scambia lineare ↔ rotazionale.<br/>\r\n<br/>\r\nQuesto conta nel calcolo dei limiti corretti di velocità di avanzamento, accelerazione e jerk nei movimenti con assi<br/>\r\nmisti, perché per i limiti viene considerato solo il movimento degli assi lineari nel <br/>\r\nG-code standard.<br/>\r\n</html>
ReferenceControllerAxisConfigurationWizard.ControllerSettingsPanel.WrapAroundLabel.text=Percorso più breve
ReferenceControllerAxisConfigurationWizard.ControllerSettingsPanel.WrapAroundLabel.toolTipText=<html>Ruota sempre l'asse per la via più breve. Ad es. se si trova a 270° e riceve il comando <br/>\r\ndi andare a 0°, andrà invece a 360°.<br/>\r\nSe si combina con Limita a ±180°, l'asse viene riportato alla sua coordinata equivalente <br/>\r\nusando un comando Global Offset del driver. Con il GcodeDriver devi configurare il<br/> <code>SET_GLOBAL_OFFSETS_COMMAND</code>, altrimenti non funzionerà.\r\n</html>
