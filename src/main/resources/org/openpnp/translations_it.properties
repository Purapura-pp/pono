AbstractActuatorConfigurationWizard.GeneralPanel.ValueTypeLabel.toolTipText=<html>\n<p>\nDetermina il tipo di dato primario dei valori scritti sull'attuatore. \n</p>\n<ul>\n<li><strong>Boolean\:</strong><br/>Attuatore a commutazione ON/OFF.</li>\n<li><strong>Double\:</strong><br/>Attuatore numerico per pilotare valori scalari.</li>\n<li><strong>String\:</strong><br/>Attuatore testuale per pilotare codici e valori arbitrari.</li>\n<li><strong>Profile\:</strong><br/>Attuatore a scelta multipla che può definire una serie di profili con nome<br/>\ne pilotare altri attuatori.<br/>\nPremi Applica per abilitare la procedura guidata di configurazione dei profili.</li>\n</ul>\n<strong>Nota\:</strong> il tipo di dato primario non verrà imposto durante il funzionamento dell'attuatore.<br/>\nÈ comunque possibile un uso di tipi misti (per retrocompatibilità). \n</html>
