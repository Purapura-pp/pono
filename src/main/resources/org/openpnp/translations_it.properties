ReferenceCameraCalibrationWizard.CameraCalibrationPanel.MovableSecondaryCalZTextField.toolTipText=<html><p width\="500">Questa è la coordinata Z del fiducial di calibrazione secondario.</p></html>
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.NotMovableDefaultZTextFiled.toolTipText=<html><p width\="500">Questa è la coordinata Z alla quale verrà abbassata la superficie inferiore dei componenti trasportati dall'ugello per l'allineamento visivo.</p></html>
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.NotMovablePrimCalZTextField.toolTipText=<html><p width\="500">Questa è la coordinata Z alla quale gli oggetti risultano meglio a fuoco per questa telecamera.</p></html>
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.NotMovableSecondaryCalZTextField.toolTipText=<html><p width\="500">Impostala il più possibile maggiore (più alta) della Z di calibrazione primaria, ma in modo che il puntale resti ragionevolmente a fuoco.</p></html>
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.NumberOfRadialLinesTextField.toolTipText=<html><p width\="500">Questo è il numero desiderato di linee radiali lungo le quali verranno raccolti i punti di calibrazione a ciascuna coordinata Z di calibrazione. Il numero effettivo verrà arrotondato per eccesso al multiplo di 4 più vicino. Diminuirlo riduce il tempo di raccolta della calibrazione, ma può portare a una calibrazione di qualità inferiore o addirittura fallita. Aumentarlo può dare una calibrazione di qualità migliore, ma la raccolta richiederà più tempo.</p></html>
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.PhysicalFieldOfViewLabel.text=Campo visivo fisico [gradi]
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.PrimaryCalibrationZLabel.text=Z di calibrazione primaria
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.RadialLinesPerCalZLabel.text=Linee radiali per Z di calibrazione
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.ResidualError.text=Errore residuo
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.ResidualErrorMapDescriptionLabel.text=<html><p width\="500">Questo grafico mostra l'entità dell'errore residuo di posizione in funzione della posizione attesa del pixel nell'immagine. Le aree blu scuro hanno errori molto bassi, mentre quelle rosso scuro hanno gli errori più alti.  Nota che la scala dei colori è sempre normalizzata, così l'errore nullo corrisponde al blu più scuro e l'errore di entità massima al rosso più scuro. Perciò questo grafico non permette di giudicare l'entità dell'errore, ma solo la sua distribuzione sull'immagine. Tale distribuzione dovrebbe apparire più o meno casuale, senza schemi riconoscibili. Se sono chiaramente visibili schemi come anelli o strisce e gli errori residui osservati negli altri grafici sono grandi, il modello matematico della telecamera non si adatta bene alla fisica della telecamera e questo può indicare un problema della telecamera e/o dell'obiettivo.</p></html>
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.ResidualErrorMapLabel.text=Mappa dell'errore residuo
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.ResidualErrorXYScatterPlotLabel.text=Grafico a dispersione X-Y dell'errore residuo
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.ResidualErrorsInCollectionOrderLabel.text=Errori residui in ordine di acquisizione
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.ResidualErrorsLegendDescriptionLabel.text=<html><p width\="500">Questo grafico mostra l'errore residuo di posizione (ovvero l'errore che resta dopo l'applicazione della calibrazione) di ciascun punto di calibrazione, nell'ordine in cui è stato raccolto. Gli errori residui dovrebbero avere media nulla e apparire come rumore casuale. Se ci sono gradini significativi nel valore medio o andamenti sistematici negli errori, a seconda della loro entità può esserci un problema nella calibrazione. Alcune cause possibili sono\: movimento o slittamento dell'attrezzatura di calibrazione durante la raccolta; telecamera od obiettivo che si muovono nel supporto; motori che perdono passi; slittamento di cinghie/ingranaggi; dilatazioni o contrazioni termiche; eccetera.</p>%s</html>
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.ResidualErrorsXYDescriptionLabel.text=<html><p width\="500">Questo grafico mostra l'errore residuo di posizione di ciascun punto raccolto durante il processo di calibrazione. Il cerchio verde segna il confine approssimativo oltre il quale i punti sono considerati anomali e non vengono usati per determinare i parametri di calibrazione della telecamera. Gli errori residui dovrebbero formare un unico gruppo circolare centrato in (0, 0) e apparire distribuiti in modo casuale. Se sono presenti due o più gruppi distinti oppure il gruppo è nettamente non circolare, a seconda dell'entità degli errori può esserci un problema nella calibrazione. Alcune cause possibili sono\: rilevamento visivo errato del fiducial di calibrazione, movimento o slittamento dell'attrezzatura di calibrazione durante la raccolta; telecamera od obiettivo che si muovono nel supporto; gioco meccanico compensato per difetto o per eccesso; motori che perdono passi; slittamento di cinghie/ingranaggi; eccetera.</p></html>
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.RmsErrorTextField.toolTipText=<html><p width\="500">Questa è una stima dell'accuratezza ottenibile con questa telecamera nella misura della posizione degli oggetti alla Z predefinita. Su un gran numero di misure eseguite in posizioni casuali dell'immagine, ci si deve aspettare che il 63% delle posizioni misurate cada entro questa distanza dalla posizione reale e il 98% entro il doppio di questa distanza. Vedi i grafici qui sotto per maggiori dettagli.</p></html>
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.SecondaryCalibrationZLabel.text=Z di calibrazione secondaria
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.SelectedCalZForPlottingLabel.text=Z di calibrazione selezionata per il grafico
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.SetZeroForNoCropped1Label.text=(imposta a zero per non ritagliare)
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.SetZeroForNoCropped2Label.text=(imposta a zero per non ritagliare)
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.ShowOutliersChkBox.text=Mostra i valori anomali
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.ShowValidPixelsLabel.text=Mostra tutti i pixel validi
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.SliderLabel.text=<html><p width\="500">Il cursore qui sotto controlla come vengono gestiti i bordi dell'immagine. Il valore 0 ritaglia tutti i pixel non validi dal bordo dell'immagine, con il rischio di perdere alcuni pixel validi al bordo. Il valore 100 forza la visibilità di tutti i pixel validi nell'immagine, con il rischio che lungo i bordi risultino visibili alcuni pixel non validi (di solito neri). Per la migliore elaborazione di visione artificiale si consiglia di ritagliare tutti i pixel non validi (cursore a zero) al termine della calibrazione.</p></html>
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.StartCameraCalibrationButton.text=Avvia la calibrazione
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.UnitsPerPixelLabel.text=Unità per pixel
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.UnitsPerPixelTextField.toolTipText=<html><p width\="500">Queste sono le unità per pixel calcolate alla Z predefinita di questa telecamera. Nota che le unità per pixel sono le stesse sia in direzione X sia in direzione Y.</p></html>
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.UseSavedDateChkBox.text=Salta la nuova raccolta e rielabora quella precedente
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.UseSavedDateChkBox.toolTipText=Attiva questa opzione per saltare la raccolta di nuovi dati di calibrazione e rielaborare soltanto quelli raccolti in precedenza\: utile unicamente per il debug del codice
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.WidthLabel.text=Larghezza
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.XAxisLabel.text=Asse X
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.XRotationErrorTextField.toolTipText=<html><p width\="500">L'errore di montaggio della telecamera stimato secondo la regola della mano destra attorno all'asse X della macchina. Se il mirino del reticolo della telecamera appare troppo spostato (in alto o in basso) rispetto al centro dell'immagine, correggi questo errore di montaggio fisico e ricalibra la telecamera. Nota che questo errore non influisce sull'accuratezza della macchina, ma riduce soltanto la dimensione massima degli oggetti che possono essere centrati sul mirino del reticolo restando interamente visibili nell'immagine.</p></html>
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.YAxisLabel.text=Asse Y
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.YRotationErrorTextField.toolTipText=<html><p width\="500">L'errore di montaggio della telecamera stimato secondo la regola della mano destra attorno all'asse Y della macchina. Se il mirino del reticolo della telecamera appare troppo spostato (a sinistra o a destra) rispetto al centro dell'immagine, correggi questo errore di montaggio fisico e ricalibra la telecamera. Nota che questo errore non influisce sull'accuratezza della macchina, ma riduce soltanto la dimensione massima degli oggetti che possono essere centrati sul mirino del reticolo restando interamente visibili nell'immagine.</p></html>
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.ZAxisLabel.text=Asse Z
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.ZRotationErrorTextField.toolTipText=<html><p width\="500">L'errore di montaggio della telecamera stimato secondo la regola della mano destra attorno all'asse Z della macchina. Se l'immagine della telecamera appare troppo ruotata, correggi questo errore di montaggio fisico e ricalibra la telecamera. Nota che questo errore non influisce sull'accuratezza della macchina, ma è soprattutto estetico.</p></html>
