ReferencePushPullFeederConfigurationWizard.lblDiscoverOnJobStart.toolTipText=<html>All'avvio del lavoro verifica che negli alimentatori con OCR abilitato siano selezionati i componenti corretti nelle rispettive posizioni. <br/>\r\nAltrimenti il lavoro viene fermato.<br/>\r\nQuesto calibrerà con la visione anche le posizioni degli alimentatori, se la calibrazione è abilitata.</html>
