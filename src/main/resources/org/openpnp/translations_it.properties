ReferenceHeadConfigurationWizard.LocationsPanel.WarningChangingLabel.text=<html><p>\n<strong>Avviso importante</strong>\: il fiducial di Home va montato \ne configurato all'inizio della costruzione, prima di iniziare ad acquisire un gran numero di\nposizioni per la configurazione della macchina (cambia puntali, alimentatori ecc.) \n</p>\n<p style\="color\:red">Ogni volta che le impostazioni qui sopra vengono modificate o il fiducial viene spostato fisicamente, tutte le posizioni già acquisite nella configurazione della macchina risulteranno errate. </p></html>
