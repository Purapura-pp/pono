ReferenceCameraPositionConfigurationWizard.LocationPanel.RoamingRadiusLabel.text=Raggio di spostamento
ReferenceCameraPositionConfigurationWizard.LocationPanel.RoamingRadiusLabel.toolTipText=<html>\r\n<p>Il raggio di spostamento <em>nominale</em> massimo sopra la telecamera,<br/>\r\nche indica anche la diagonale massima del componente che può essere<br/>\r\ngestita.</p>\r\n<br/>\r\n<p>Se impostato a zero disattiva la visione a più scatti<br/> \r\n(vedi <strong>Vision Compositing</strong> del package).</p> \r\n<br/>\r\n<p>Durante la Bottom Vision il movimento dell'ugello viene <br/>\r\nlimitato tenendo conto di quanto segue\:</p>\r\n<ul>\r\n<li>La distanza dell'ugello dal centro della <br/>\r\ntelecamera.</li>\r\n<li>Quanto il footprint del componente sporge <br/>\r\nda lì (approssimato con un inviluppo ottagonale).</li>\r\n</ul>\r\n<p>All'interno del raggio di spostamento l'ugello viene inoltre <br/>\r\nmosso liberamente alla Z della telecamera, cioè senza passare per la Safe Z.</p> \r\n<p>Nota\: questo è il raggio <em>nominale</em>, ovvero deve restare<br/>\r\nspazio aggiuntivo per gli offset di prelievo e altre <br/>\r\ndeviazioni.</p>\r\n<br/>\r\n<p><strong color\="red">Attenzione\:</strong> il raggio di spostamento non viene applicato \r\ndurante il Jog.</p>\r\n</html>
