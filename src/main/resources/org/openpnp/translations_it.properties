BoardsPanel.BoardPlacements.Importer.OptionsBox.Question=<Html><body style\='width\: 400'><p>Cosa vuoi fare?</p><p> </p><p>Seleziona <b>Unisci</b> per aggiornare i posizionamenti esistenti i cui ID corrispondono a quelli dell'insieme importato, lasciare invariati i posizionamenti esistenti i cui ID non corrispondono a nessuno di quelli importati e aggiungere i posizionamenti importati i cui ID non corrispondono a nessuno di quelli esistenti.</p><p> </p><p>Seleziona <b>Sostituisci</b> per eliminare tutti i posizionamenti esistenti e aggiungere poi tutti quelli importati.</p></html>
