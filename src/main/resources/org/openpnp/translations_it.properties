ReferenceNozzleCameraOffsetWizard.InstructionPanel.IntroductionLabel.text=La procedura guidata semiautomatica per l'offset dell'ugello ti aiuta a misurare l'offset tra la testa della macchina e questo ugello.
ReferenceNozzleCameraOffsetWizard.InstructionPanel.MeasureButton.text=Memorizza la posizione
ReferenceNozzleCameraOffsetWizard.InstructionPanel.Step10Label.text=10. Verifica le nuove impostazioni alternando i pulsanti di posizionamento telecamera/ugello nel pannello di Jog.
ReferenceNozzleCameraOffsetWizard.InstructionPanel.Step1Label.text=1. Seleziona la telecamera della testa che userai per impostare l'offset.
ReferenceNozzleCameraOffsetWizard.InstructionPanel.Step2Label.text=2. Appoggia sul piano un oggetto su cui il puntale possa lasciare un segno. Mastice, farina o carta carbone sono una buona scelta.
ReferenceNozzleCameraOffsetWizard.InstructionPanel.Step3Label.text=3. Sposta il puntale sopra l'oggetto.
ReferenceNozzleCameraOffsetWizard.InstructionPanel.Step4Label.text=4. Abbassa il puntale (pannello di Jog) finché non lascia un segno sull'oggetto.
ReferenceNozzleCameraOffsetWizard.InstructionPanel.Step5Label.text=5. Per escludere l'eccentricità del puntale dalla misura, ruota l'ugello di circa 360°.
ReferenceNozzleCameraOffsetWizard.InstructionPanel.Step6Label.text=6. Se vuoi un offset anche in Z, attiva la casella "Includere Z?".
ReferenceNozzleCameraOffsetWizard.InstructionPanel.Step7Label.text=7. Premi "Memorizza la posizione del segno dell'ugello".
ReferenceNozzleCameraOffsetWizard.InstructionPanel.Step8Label.text=8. Porta in Jog la telecamera sopra il centro del segno. Al termine premi "Calcola l'offset dell'ugello".
ReferenceNozzleCameraOffsetWizard.InstructionPanel.Step9Label.text=9. Applica i nuovi offset dell'ugello premendo il pulsante "Applica"
