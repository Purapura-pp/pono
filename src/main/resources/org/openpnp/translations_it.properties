BottomVisionSettingsConfigurationWizard.lblAllowVisionOffsets.toolTipText=<html>\r\nAbilita se il componente/package è asimmetrico per progetto, ovvero se i contatti sono spostati<br/>\r\nrispetto al centro di progetto del componente/package, dove il componente viene anche prelevato.<br/>\r\nUna volta contrassegnato come asimmetrico, è possibile inserire o rilevare gli offset di visione<br/>\r\nda compensare nella Bottom Vision.<br/>\r\nNota\: questo va usato solo per asimmetrie <em>di progetto</em>, non per compensare<br/>\r\noffset di errore di posizionamento ripetibili. Se hai offset di errore di posizionamento ripetibili,<br/>\r\nverifica che il progetto del package E-CAD sia centrato correttamente, ripeti la calibrazione degli offset di telecamera e ugello<br/>\r\ne/o controlla le verifiche dei fiducial della scheda.\r\n</html>
