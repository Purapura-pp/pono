ReferenceNozzleTipToolChangerWizard.Action.ReferenceZ.Description=<html>Calibra la Z della posizione di contatto di tutti i puntali rispetto al riferimento <strong>modello</strong>.<br/>Verrà caricato il puntale modello sull'ugello di tastatura predefinito, verrà ricalibrata<br/>la Z della posizione di contatto del modello e poi tutti gli altri verranno tastati e riferiti a essa.<br/>Nota\: a differenza della clonazione, questo include anche i puntali contrassegnati come <strong>Bloccato</strong>.</html>
