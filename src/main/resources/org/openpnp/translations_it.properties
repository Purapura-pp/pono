ReferenceNozzleTipPartDetectionWizard.PartOffVacuumSensingPanel.EstablishLevelLabel.toolTipText=<html>Mentre l'ugello è premuto sul componente durante l'operazione di posizionamento,<br/>\nil livello di vuoto viene misurato ripetutamente finché non decade fino all'intervallo di vuoto <br/>\noppure finché non scade il tempo di attesa di posizionamento, a seconda di quale evento si verifichi prima.\n</html>
