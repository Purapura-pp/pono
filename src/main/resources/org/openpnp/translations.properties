ReferencePushPullFeederConfigurationWizard.lblFontSizept.toolTipText=The OCR font size in typographic points (1 pt \= 1/72 in).
ReferencePushPullFeederConfigurationWizard.lblHole1Location.text=Hole 1 Location
ReferencePushPullFeederConfigurationWizard.lblHole1Location.toolTipText=<html>Choose Hole 1 closer to the tape reel.<br/>\r\nIf possible choose two holes that bracket the part(s) to be picked.\r\n</html>
ReferencePushPullFeederConfigurationWizard.lblHole2Location.text=Hole 2 Location
ReferencePushPullFeederConfigurationWizard.lblHole2Location.toolTipText=<html>Choose Hole 2 further away from the tape reel.<br/>\r\nIf possible choose two holes that bracket the part(s) to be picked.\r\n</html>
ReferencePushPullFeederConfigurationWizard.lblMultiplier.text=Multiplier
ReferencePushPullFeederConfigurationWizard.lblMultiplier.toolTipText=To improve efficiency you can actuate the feeder multiple times to feed more parts per feed cycle.
ReferencePushPullFeederConfigurationWizard.lblNormalizePickLocation.text=Normalize?
ReferencePushPullFeederConfigurationWizard.lblNormalizePickLocation.toolTipText=Normalize the pick location relative to the sprocket holes according to the EIA-481 standard.
ReferencePushPullFeederConfigurationWizard.lblOcrFontName.text=OCR Font Name
ReferencePushPullFeederConfigurationWizard.lblOcrFontName.toolTipText=<html>Name of the OCR font to be recognized or [Barcode].<br/>\r\nMonospace fonts work much better, allow lower resolution and therefore faster <br/>\r\noperation. Use a font where all the used characters are easily distinguishable.<br/>\r\nFonts with clear separation between glyphs are much preferred.</html>
ReferencePushPullFeederConfigurationWizard.lblOcrWrongPart.text=OCR Wrong Part Action
ReferencePushPullFeederConfigurationWizard.lblOcrWrongPart.toolTipText=<html>Determines what action should be taken when OCR detects the wrong Part ID in the feeder.<br/> \r\n<ul>\r\n<li>\r\n<strong>None</strong>\: Use this setting if you don't want to use OCR.</li>\r\n<li>\r\n<strong>SwapFeeders</strong>\: If a wrong part is detected but the right part is selected<br/>\r\nin a different ReferencePushPullFeeder, the locations of the two feeders are swapped. The<br/>\r\nswapped-in feeder will be enabled. This will happen, if you unload/reload/rearrange your<br/>\r\nfeeders on the machine.</li>\r\n<li>\r\n<strong>SwapOrCreate</strong>\: Works like <strong>SwapFeeders</strong>, but if no<br/>\r\nother feeder with the right part is found, a new one will be created and swapped-in at the<br/>\r\ncurrent feeder's location. The current feeder is then disabled in turn (they are now sitting at<br/>\r\nthe same location and only one must be enabled).</li>\r\n<li>\r\n<strong>ChangePart</strong>\: The part in the current feeder is changed. This will only<br/>\r\nwork correctly, if the tape settings etc. remain the same between the parts i.e. if you restrict<br/>\r\nany reloading/rearranging to groups of feeders with the same settings.</li>\r\n<li>\r\n<strong>ChangePartAndClone</strong>\: The part in the current feeder is changed but<br/>\r\nsettings are cloned from a template feeder.</li>\r\n</ul>\r\n</html>\r\n
ReferencePushPullFeederConfigurationWizard.lblPartPitch.text=Part Pitch
ReferencePushPullFeederConfigurationWizard.lblPartPitch.toolTipText=Pitch of the parts in the tape (2mm, 4mm, 8mm, 12mm, etc.)
ReferencePushPullFeederConfigurationWizard.lblPickLocation.text=Pick Location
ReferencePushPullFeederConfigurationWizard.lblPickLocation.toolTipText=<html>Pick Location of the part. If multiple are produced by a feed operation<br/>\r\nthis must be the last one picked i.e. the one closest to the tape reel.</html>
ReferencePushPullFeederConfigurationWizard.lblPrecisionAverage.text=Precision Average
ReferencePushPullFeederConfigurationWizard.lblPrecisionAverage.toolTipText=Obtained precision average i.e. offset of the pick location, as detected by the calibration
ReferencePushPullFeederConfigurationWizard.lblPrecisionConfidenceLimit.text=Precision Confidence Limit
ReferencePushPullFeederConfigurationWizard.lblPrecisionConfidenceLimit.toolTipText=Precision obtained with 95% confidence (assuming normal distribution)
ReferencePushPullFeederConfigurationWizard.lblPrecisionWanted.text=Precision wanted
ReferencePushPullFeederConfigurationWizard.lblPrecisionWanted.toolTipText=Precision wanted i.e. the tolerable pick location offset
ReferencePushPullFeederConfigurationWizard.lblRotation.text=Rotation in Tape
ReferencePushPullFeederConfigurationWizard.lblRotation.toolTipText=<html>Rotation of the part inside the tape as seen when the sprocket holes <br/>\r\nare on top. Your E-CAD part orientation is the reference.<br/>\r\nSee also\: \r\n<ul>\r\n<li>EIA-481</li>\r\n<li>Component Zero Orientations for CAD Libraries</li>\r\n</ul>\r\n</html>
ReferencePushPullFeederConfigurationWizard.lblSnapToAxis.text=Snap to Axis?
ReferencePushPullFeederConfigurationWizard.lblSnapToAxis.toolTipText=Snap rows of sprocket holes to the Axis parallel.
ReferencePushPullFeederConfigurationWizard.lblStopAfterWrong.text=Stop after wrong part?
ReferencePushPullFeederConfigurationWizard.lblTemplate.text=Template\:
ReferencePushPullFeederConfigurationWizard.lblUsedAsTemplate.text=Use this one as Template?
ReferencePushPullFeederConfigurationWizard.lblUsedAsTemplate.toolTipText=<html>Use this feeder as a template for cloning settings to other feeders. <br/>\r\nThe templates are matched by tape & reel specification or package of the parts <br/>\r\nloaded in feeders. <br/>\r\nWhen no template matches formally, the feeder \nwith the greatest similarities <br/>\r\nis taken (feed pitch, tape width, proximity, etc.).</html>
ReferencePushPullFeederConfigurationWizard.lblVisionType.text=Vision Type
ReferencePushPullFeederConfigurationWizard.lblVisionType.toolTipText=<html>\r\n<p>Choose the vision type, then press <strong>Reset Pipeline</strong> to assign the<br/>\r\ndefault pipeline of that type. Sprocket holes are detected as follows\:</p>\r\n<ul>\r\n<li><strong>ColorKeyed</strong>\: the background under the holes must be of a vivid color<br/>\r\n(green by default).</li>\r\n<li><strong>CircularSymmetry</strong>\: the shape of the holes must be circular, their<br/>\r\ninside/outside must be plain.</li>\r\n</ul>\r\n<p>Both types of pipeline will further assess detected holes by size, alignment, pitch<br/>\r\nand expected distance.</p>\r\n</html>
