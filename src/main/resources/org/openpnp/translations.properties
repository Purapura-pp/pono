Solutions.Issue.CompleteMilestone.Choice.0=<html><h3>Proceed to %s</h3><p>Confirm to have completed and tested milestone <strong>%s</strong>\:</p><br/><blockquote>%s</blockquote><br/><p>Note\: all issues from this milestone should be resolved or dismissed before you proceed.</p><br/><p>Yes? <em>Congratulations\!</em></p><br/><p>You can proceed to the next milestone <strong>%s</strong>\:</p><br/><blockquote>%s</blockquote><br/><p>More Issues & Solutions will be presented that need addressing to reach the next milestone.</p></html>
Solutions.Issue.CompleteMilestone.Choice.1=<html><h3>Go back to %s</h3><p>To limit the scope for Issues & Solutions, you can go back to the previous milestone <strong>%s</strong>\:</p><br/><blockquote>%s</blockquote><br/><p>Note\: Most Issues & Solutions from previous milestones are also reported on subsequent milestones. But in earlier target milestones some solutions proposed are simpler, more conservative. For troubleshooting, it can therfore be beneficial to go back and try getting it to work there.</p></html>
Solutions.Issue.CompleteMilestone.Confirm=<html><p>Issues for milestone <strong>%s</strong> are still open\:</p> %s <p color\="red">It is not recommended to switch to the next target milestone before these are resolved or dismissed\!</p><p><br/>Are you sure you still want to proceed?</p></html>
