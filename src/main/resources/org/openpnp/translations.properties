CalibrateCameraProcess.AdjustDiameter=Zoom in on the fiducial or the nozzle tip with the mouse wheel, then set the detection diameter until the red circle turns green with a + in the middle and just fits it, the + on its centre. Click Next to start collecting the calibration automatically.
CalibrateCameraProcess.JogTipToCircle=With the Manual control card at the bottom right of the camera view, jog the nozzle tip so that it is roughly in the middle of the green circle. Click Next to take it down or up to the calibration height.
CalibrateCameraProcess.JogToFiducial=With the Manual control card at the bottom right of the camera view, jog the camera so that the calibration fiducial at Z \= %s is roughly in the middle of the green circle, then click Next.
CalibrateCameraProcess.LoadSmallestTip=Select a nozzle and load its smallest nozzle tip, then click Next.
CalibrateCameraProcess.RotateTip=Turn the nozzle tip through 360° with the Manual control card's rotation buttons and check that it stays in the green circle; if it leaves it, jog it in X or Y until it stays in while it turns. Click Next when it does.
