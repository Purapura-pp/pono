MachineDiagnosticsWizard.GraphsPanel.Border.title=Results
MachineDiagnosticsWizard.GraphsPanel.Positioning.text=Positioning
MachineDiagnosticsWizard.GraphsPanel.Positioning.toolTipText=<html>Positioning error and backlash against the distance approached from. A<br/>backlash that grows with distance is lash being taken up; one that does not is<br/>already fully taken up by the shortest move measured.</html>
MachineDiagnosticsWizard.GraphsPanel.Settle.text=Settling
MachineDiagnosticsWizard.GraphsPanel.Settle.toolTipText=<html>How far the image was from where it finally came to rest, against the time<br/>since the machine reported the move complete.</html>
MachineDiagnosticsWizard.GraphsPanel.Step.text=Step response
MachineDiagnosticsWizard.GraphsPanel.Step.toolTipText=<html>Where the machine actually went for each commanded step. A staircase, rather<br/>than a line, means it sticks and then breaks free.</html>
MachineDiagnosticsWizard.GraphsPanel.Timing.text=Move time
MachineDiagnosticsWizard.GraphsPanel.Timing.toolTipText=<html>Measured move time against distance, with the fitted model over it. A<br/>measurement well above the model means something slowed that move down.</html>
MachineDiagnosticsWizard.ParametersPanel.BacklashRepeats.text=Backlash pairs per cell
MachineDiagnosticsWizard.ParametersPanel.BacklashRepeats.toolTipText=Approach pairs measured for each distance and speed of the backlash matrix.
MachineDiagnosticsWizard.ParametersPanel.Border.title=Parameters
MachineDiagnosticsWizard.ParametersPanel.DriftSeconds.text=Standing drift s
MachineDiagnosticsWizard.ParametersPanel.DriftSeconds.toolTipText=After the noise floor, how long the camera goes on watching the fiducial with nothing moving, for the slow drift of the frame, the camera and the axes with temperature. 0 to skip.
MachineDiagnosticsWizard.ParametersPanel.FieldOfViewGridFraction.text=Grid fills
MachineDiagnosticsWizard.ParametersPanel.FieldOfViewGridFraction.toolTipText=<html>How much of the image the grid covers, as a fraction. Keep it below one so<br/>that the fiducial stays fully inside the image at the corners of the grid.</html>
MachineDiagnosticsWizard.ParametersPanel.FieldOfViewGridSteps.text=Field of view grid
MachineDiagnosticsWizard.ParametersPanel.FieldOfViewGridSteps.toolTipText=<html>The fiducial is measured at this many positions across and down the image.<br/>Its measured machine position should not change as it moves across the image; that<br/>it does is the Units per Pixel scale error and the lens distortion.</html>
MachineDiagnosticsWizard.ParametersPanel.FirmwareCommands.text=Controller commands
MachineDiagnosticsWizard.ParametersPanel.FirmwareCommands.toolTipText=<html>One command per line, sent to each G-code driver and recorded verbatim.<br/>The defaults are the Marlin ones. Change them for a controller that reports its<br/>settings differently.</html>
MachineDiagnosticsWizard.ParametersPanel.FocusRange.text=Focus sweep range (mm)
MachineDiagnosticsWizard.ParametersPanel.FocusRange.toolTipText=Half the Z range swept around the bottom camera's height. Keep it small if the camera's focus is close to its glass.
MachineDiagnosticsWizard.ParametersPanel.FocusRepeats.text=Focus sweeps per side
MachineDiagnosticsWizard.ParametersPanel.FocusRepeats.toolTipText=Sweeps from above and from below, each.
MachineDiagnosticsWizard.ParametersPanel.FocusStep.text=Focus step (mm)
MachineDiagnosticsWizard.ParametersPanel.FocusStep.toolTipText=Z step of the focus sweep; the peak is interpolated between steps.
MachineDiagnosticsWizard.ParametersPanel.FramesPerPoint.text=Frames per point
MachineDiagnosticsWizard.ParametersPanel.FramesPerPoint.toolTipText=Frames taken of each standing position; the median is the measurement and the scatter goes into the CSV.
MachineDiagnosticsWizard.ParametersPanel.HomeBeforeEachStressSpeed.text=Home before each stress speed
MachineDiagnosticsWizard.ParametersPanel.HomeBeforeEachStressSpeed.toolTipText=Home the machine before each speed factor of the lost steps test, so that every speed starts from the origin and the loss of one speed cannot carry the fiducial out of view for the next.
MachineDiagnosticsWizard.ParametersPanel.HomingCycles.text=Homing cycles
MachineDiagnosticsWizard.ParametersPanel.HomingCycles.toolTipText=How many times to home. Each cycle takes as long as homing does.
MachineDiagnosticsWizard.ParametersPanel.HysteresisLatticePitch.text=Table hole pitch (mm)
MachineDiagnosticsWizard.ParametersPanel.HysteresisLatticePitch.toolTipText=Pitch of the table's hole checkerboard, anchored on the primary fiducial; 15 for the LumenPnP staging plate. The hysteresis map goes straight to the nearest hole. 0 to search for features instead.
MachineDiagnosticsWizard.ParametersPanel.HysteresisTargets.text=Hysteresis targets
MachineDiagnosticsWizard.ParametersPanel.HysteresisTargets.toolTipText=Places with a round feature - a hole, a screw head - as "x, y; x, y; ..." in machine millimetres. When given, the hysteresis is read at these instead of at fractions of the travel. Jog the camera over each hole and read the coordinates off the readout.
MachineDiagnosticsWizard.ParametersPanel.LatencySpeedFactor.text=Latency move speed
MachineDiagnosticsWizard.ParametersPanel.LatencySpeedFactor.toolTipText=Speed factor of the latency test move\: slow enough that nothing vibrates once it stops.
MachineDiagnosticsWizard.ParametersPanel.MachineSettle.text=Settle [ms]
MachineDiagnosticsWizard.ParametersPanel.MachineSettle.toolTipText=<html>Pause after reaching a position before measuring, so that a timing is not<br/>shortened by the machine still ringing from the move before it.</html>
MachineDiagnosticsWizard.ParametersPanel.MeasureSpeedFactor.text=Positioning speed
MachineDiagnosticsWizard.ParametersPanel.MeasureSpeedFactor.toolTipText=Speed factor for every move whose speed is not itself measured\: reaching a fiducial, hopping between the datum board's fiducials, stepping along the ruler. Lower it on a machine that loses steps.
MachineDiagnosticsWizard.ParametersPanel.NoiseFrames.text=Noise floor frames
MachineDiagnosticsWizard.ParametersPanel.NoiseFrames.toolTipText=Frames taken of the fiducial with the machine standing still, for the vision noise floor.
MachineDiagnosticsWizard.ParametersPanel.PositioningDistances.text=Approach distances [mm]
MachineDiagnosticsWizard.ParametersPanel.PositioningDistances.toolTipText=<html>How far to move away from the fiducial before approaching it again. Backlash<br/>can depend on how far the axis travelled, so use a short, a medium and a long one.</html>
MachineDiagnosticsWizard.ParametersPanel.Repeats.text=Repeats
MachineDiagnosticsWizard.ParametersPanel.Repeats.toolTipText=<html>How many times each measurement is taken. More repeats give a better idea of<br/>the spread and take proportionally longer.</html>
MachineDiagnosticsWizard.ParametersPanel.RotationApproachAngle.text=Approach by [deg]
MachineDiagnosticsWizard.ParametersPanel.RotationApproachAngle.toolTipText=<html>How far past each angle to turn before coming back to it. The difference<br/>between arriving from one side and the other is the backlash.</html>
MachineDiagnosticsWizard.ParametersPanel.RotationTestAngles.text=Rotation angles [deg]
MachineDiagnosticsWizard.ParametersPanel.RotationTestAngles.toolTipText=<html>The angles the part is turned to and measured at. Backlash can differ around<br/>the turn, so more than one angle is worth measuring.</html>
MachineDiagnosticsWizard.ParametersPanel.RotationTestPartId.text=Rotation test part
MachineDiagnosticsWizard.ParametersPanel.RotationTestPartId.toolTipText=<html>The part to measure the rotation backlash with. Pick one by hand with the<br/>nozzle first. It needs a package and bottom vision settings, and a rectangular<br/>outline gives the clearest angle.</html>
MachineDiagnosticsWizard.ParametersPanel.RotationTimingAngles.text=Timing angles [deg]
MachineDiagnosticsWizard.ParametersPanel.RotationTimingAngles.toolTipText=The same for the rotation axis, in degrees.
MachineDiagnosticsWizard.ParametersPanel.RulerStep.text=Ruler step (mm)
MachineDiagnosticsWizard.ParametersPanel.RulerStep.toolTipText=Step along the ruler. A quarter of the 2 mm belt pitch, so that the pitch can be seen; 1 mm would sample it twice a period and hide it.
MachineDiagnosticsWizard.ParametersPanel.SettleDistances.text=Settle distances [mm]
MachineDiagnosticsWizard.ParametersPanel.SettleDistances.toolTipText=<html>Move lengths to measure settling after. A long move shakes the machine more<br/>than a short one, so the settle time is not one number.</html>
MachineDiagnosticsWizard.ParametersPanel.SettleRepeats.text=Settle runs per distance
MachineDiagnosticsWizard.ParametersPanel.SettleRepeats.toolTipText=Runs per settle distance; the slowest run is the conclusion, since the wait has to cover every move.
MachineDiagnosticsWizard.ParametersPanel.SettleSampleSeconds.text=Sample for [s]
MachineDiagnosticsWizard.ParametersPanel.SettleSampleSeconds.toolTipText=<html>How long to keep sampling the image after a move. Must be longer than the<br/>machine takes to settle, or no settle time can be reported.</html>
MachineDiagnosticsWizard.ParametersPanel.SettleThresholdPixels.text=Settled within [px]
MachineDiagnosticsWizard.ParametersPanel.SettleThresholdPixels.toolTipText=<html>The image counts as settled once it stays within this distance of where it<br/>finally came to rest.</html>
MachineDiagnosticsWizard.ParametersPanel.SpeedFactors.text=Speed factors
MachineDiagnosticsWizard.ParametersPanel.SpeedFactors.toolTipText=<html>Speeds to measure at, as a fraction of full speed. A machine that sticks and<br/>breaks free positions worse slowly than quickly, which only shows up if more than<br/>one speed is measured.</html>
MachineDiagnosticsWizard.ParametersPanel.StepTestDistance.text=Step test over [mm]
MachineDiagnosticsWizard.ParametersPanel.StepTestDistance.toolTipText=<html>The distance the step test walks across, one step at a time. Every step costs<br/>a vision detection, so a longer distance takes proportionally longer.</html>
MachineDiagnosticsWizard.ParametersPanel.StepTestStep.text=Step size [mm]
MachineDiagnosticsWizard.ParametersPanel.StepTestStep.toolTipText=<html>How far each commanded step of the step test is. Set it near the resolution<br/>of the axis to find out whether the machine follows a step that small at all.</html>
MachineDiagnosticsWizard.ParametersPanel.StressCycles.text=Stress cycles
MachineDiagnosticsWizard.ParametersPanel.StressCycles.toolTipText=Back-and-forth cycles per speed factor of the lost steps test.
MachineDiagnosticsWizard.ParametersPanel.StressDistance.text=Stress distance (mm)
MachineDiagnosticsWizard.ParametersPanel.StressDistance.toolTipText=Length of one leg of the lost steps test, centred on the fiducial and clipped to the axis travel.
MachineDiagnosticsWizard.ParametersPanel.StressSpeedFactors.text=Stress speed factors
MachineDiagnosticsWizard.ParametersPanel.StressSpeedFactors.toolTipText=Speed factors the lost steps test drives at, 1.0 being the configured limit.
MachineDiagnosticsWizard.ParametersPanel.TimingDistances.text=Timing distances [mm]
MachineDiagnosticsWizard.ParametersPanel.TimingDistances.toolTipText=<html>Distances timed to fit acceleration and velocity. Needs short moves, which<br/>show the acceleration, and long ones, which show the velocity limit. Distances<br/>beyond the soft limits are skipped.</html>
MachineDiagnosticsWizard.ParametersPanel.TimingIncludesZAndRotation.text=Also time Z and rotation
MachineDiagnosticsWizard.ParametersPanel.TimingIncludesZAndRotation.toolTipText=<html>Time the Z and rotation axes as well as X and Y. Z is only timed inside its<br/>safe zone, and is skipped if no safe zone is set.</html>
MachineDiagnosticsWizard.Test.CameraLatency=Camera latency
MachineDiagnosticsWizard.Test.CameraLatency.toolTipText=Frames are taken through a slow move; frames still showing the move after the controller reported it complete are the delay of the camera pipeline.
MachineDiagnosticsWizard.Test.CameraSettle=Camera settling
MachineDiagnosticsWizard.Test.CameraSettle.toolTipText=<html>Sample the image after a move and find when it stopped moving, to compare<br/>against the settle time the camera is configured to wait.</html>
MachineDiagnosticsWizard.Test.ConfigSnapshot=Configuration snapshot
MachineDiagnosticsWizard.Test.ConfigSnapshot.toolTipText=<html>Write out the settings the measurements were taken under, so that the numbers<br/>can be read against them later. Moves nothing.</html>
MachineDiagnosticsWizard.Test.DatumBoard=Datum board
MachineDiagnosticsWizard.Test.DatumBoard.toolTipText=Finds the seven copper fiducials of the LumenPnP datum board around the primary fiducial and fits the machine's frame to them\: scale per axis, squareness, residuals. Reads the ruler for the camera's own scale and for the position error along 30 mm.
MachineDiagnosticsWizard.Test.Firmware=Controller settings
MachineDiagnosticsWizard.Test.Firmware.toolTipText=<html>Ask the controller what it is configured for and put its own limits beside the<br/>ones OpenPnP plans with. A controller limit below the axis setting caps every move<br/>without saying so. Moves nothing.</html>
MachineDiagnosticsWizard.Test.Homing=Homing repeatability
MachineDiagnosticsWizard.Test.Homing.toolTipText=<html>Home repeatedly and measure how far the origin wanders between cycles.<br/>This scatter carries into every job.</html>
MachineDiagnosticsWizard.Test.HysteresisMap=Hysteresis along the travel
MachineDiagnosticsWizard.Test.HysteresisMap.toolTipText=Reads the raw backlash and a short staircase at several places along each axis, against whatever round feature the table offers there. Slack that peaks in the middle of the travel is the belt giving - tension is low; slack that is the same everywhere is play or friction.
MachineDiagnosticsWizard.Test.Kinematics=Kinematics
MachineDiagnosticsWizard.Test.Kinematics.toolTipText=<html>Time moves over a range of distances and fit the acceleration, velocity and<br/>fixed per-move cost the machine really has, to compare against the axis settings.</html>
MachineDiagnosticsWizard.Test.LostSteps=Lost steps
MachineDiagnosticsWizard.Test.LostSteps.toolTipText=A run of long fast moves at each speed factor, then back to the fiducial from the same side\: the offset is what the run lost.
MachineDiagnosticsWizard.Test.RotationBacklash=Rotation backlash
MachineDiagnosticsWizard.Test.RotationBacklash.toolTipText=<html>Measure the play in the nozzle rotation on the bottom camera. Load a nozzle<br/>tip, pick a rectangular part by hand, and name that part below before running this.</html>
MachineDiagnosticsWizard.Test.VisionNoise=Vision noise floor
MachineDiagnosticsWizard.Test.VisionNoise.toolTipText=Locates the fiducial in many frames with nothing moving. The scatter is the floor under every position the other groups report.
MachineDiagnosticsWizard.Test.XyPositioning=X/Y positioning
MachineDiagnosticsWizard.Test.XyPositioning.toolTipText=<html>Measure against the primary calibration fiducial\: how far apart repeated<br/>approaches land, how much backlash there is with compensation off, whether small<br/>steps are followed at all, and whether Units per Pixel is to scale across the<br/>field of view. The longest of the measurements.</html>
MachineDiagnosticsWizard.Test.ZFocus=Z focus
MachineDiagnosticsWizard.Test.ZFocus.toolTipText=Sweeps the nozzle tip through the bottom camera's focus from above and from below. Where it comes sharp is where Z really stops\: repeatability from one side, slack between the sides. Needs a nozzle tip loaded and no part.
