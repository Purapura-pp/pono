MachineSettings.Guide=How to set it
MachineSettings.Guide.Cameras=\#\# Choosing a camera's device\n1. Which USB port a camera is in decides its name and number in the list; after moving it to another port or another computer, choose it again.\n2. When two cameras are the same model, pick each and look at the preview\: the one that sees the table and the board is the top camera, the one that sees the nozzle the bottom camera.\n3. Take the highest resolution the camera offers; if the picture stutters, go one step down, or use MJPG.\n\#\# What is set here and what is measured\n- Set here\: the device, its format, which way it looks, where it is mounted, its light.\n- Measured on the calibration page\: the pixel size, the bottom camera's position, the lens distortion, the settling time. This page shows them with where they came from.
MachineSettings.Guide.Connection=\#\# Finding the port\n1. Open the Windows Device Manager and unfold Ports (COM and LPT).\n2. Unplug the machine's USB cable and plug it in again\: the entry that goes and comes back is it. Note its COM number.\n3. If none ever shows, try another cable or another port, then install the board maker's USB driver.\n\#\# Baud rate and flow control\n- Use what the firmware is set to; a LumenPnP has 115200 and RTS/CTS.\n- If the port opens but the firmware never answers, the baud rate or the flow control is usually wrong.\n\#\# G-code\nPono sends the commands for the firmware it detected\: moves, homing, the vacuum. They rarely need changing; where they do, change them in the element tree.
MachineSettings.Guide.Motion=\#\# Setting the soft limits\n1. Home the machine, then jog the axis slowly towards one end and stop 1 to 2 mm short of the mechanical end.\n2. Press the read button beside the low or the high limit to take the position; do the same at the other end.\n3. Switch the limit on and press Apply. A move beyond it is then stopped before it is sent.\n\#\# Speed and acceleration\n- Start with the preset's values.\n- If moves shake, lose steps or stall, lower the acceleration by a third before touching the speed.\n- The controller's firmware has limits of its own; the lower of the two applies.\n\#\# What is not set here\nValues only a measurement can tell, such as the backlash, come from the calibration page. This page shows them with their source; the link beside their heading goes there.
MachineSettings.Guide.Nozzles=\#\# Measuring a nozzle's offset\n1. Put something on the table that takes a mark\: modelling clay, flour or carbon paper.\n2. Press a mark into it with the nozzle and press Store nozzle position.\n3. Bring the camera's crosshair to the centre of the mark, press Work out the offset, check the result and press Apply.\n4. That comes to about 0.1 mm. For better, run the precise nozzle offsets on the calibration page, which uses the bottom camera.\n\#\# What dual negated means\nThe two nozzles hang on either side of one belt or gear\: as one goes down the other goes up. The second Z is not a motor of its own but a mirror of the first. A LumenPnP is built this way.\n\#\# Part diameters\nThey are for the bottom vision's background calibration\: the smallest less twice the pick tolerance is the middle of the tip a part always covers, the largest says how far round it the background is learnt. The smallest must be at least the air bore plus twice the pick tolerance.
MachineSettings.Guide.Presets=\#\# Using a preset\n1. Pick the preset of the same model as your machine and press Apply.\n2. Read what it changes; once you agree, Pono backs up, replaces the machine's definition and starts again.\n3. After the restart, choose this computer's port under Connection and its camera devices under Cameras.\n4. Press Collect issues on the calibration page and confirm the suggestions one by one.\n\#\# Your own model\n1. Get the machine placing properly first.\n2. Press New preset, choose This machine and give it a name.\n3. When the system is reinstalled, the computer changed or a second machine of the kind set up, pick it and press Apply.\n\#\# A configuration someone gave you\nNew preset, Import from a folder, and point it at their configuration folder, the one with a machine.xml in it. Only the machine's definition is taken, not their feeders or jobs.
