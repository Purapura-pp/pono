ReferencePushPullFeederConfigurationWizard.textFieldFeedPitch.toolTipText=How much the tape will be advanced by one lever actuation (usually multiples of 4mm)
ReferencePushPullFeederConfigurationWizard.textFieldPartPitch.toolTipText=Pitch of the parts in the tape (2mm, 4mm, 8mm, 12mm, etc.)
ReferencePushPullFeederConfigurationWizard.textFieldPrecisionAverage.toolTipText=Obtained precision average i.e. offset of the pick location, as detected by the calibration
ReferencePushPullFeederConfigurationWizard.textFieldPrecisionWanted.toolTipText=Precision wanted i.e. the tolerable pick location offset
ReferencePushPullFeederConfigurationWizard.textFieldRotationInTape.toolTipText=<html>\n<p>The <strong>Rotation in Tape</strong> setting must be interpreted relative to the tape's orientation, <br/>\nregardless of how the feeder/tape is oriented on the machine. </p>\n<ol>\n<li>\n<p>Look at the <strong>neutral</strong> upright orientation of the part package/footprint <br/>\nas drawn inside your E-CAD <strong>library</strong>.</p>\n</li>\n<li>\n<p>Note how pin 1, polarity, cathode etc. are oriented.  <br/>\nThis is your 0° for the part.</p>\n</li>\n<li>\n<p>Look at the tape so that the sprocket holes are at the top. <br/>\nThis is your 0° tape orientation (per EIA-481 industry standard).</p>\n</li>\n<li>\n<p>Determine how the part is rotated inside the tape pocket, <em>relative</em> from  <br/>\nits upright orientation in (1).  Positive rotation goes counter-clockwise.<br/>\nThis is your <strong>Rotation in Tape</strong>.</p>\n</li>\n</ol>\n</html>
ReferencePushPullMotionConfigurationWizard.additiveRotation.text=Additive
ReferencePushPullMotionConfigurationWizard.additiveRotation.toolTipText=<html>Before the feed is performed, the current coordinate of the Rotation axis is taken.<br/>\nRotations stated below are then added to that base angle.<br/>\nThis is typically used for peeling axes, creating a continuous cover tape spool wind-up.\n</html>
