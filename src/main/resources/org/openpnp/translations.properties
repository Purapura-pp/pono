ReferencePushPullFeederConfigurationWizard.lblDiscoverOnJobStart.toolTipText=<html>On Job Start, check that the correct parts are selected in OCR-enabled feeders at their locations. <br/>\r\nOtherwise the Job is stopped.<br/>\r\nThis will also vision-calibrate the feeders' locations, if calibration is enabled.</html>
