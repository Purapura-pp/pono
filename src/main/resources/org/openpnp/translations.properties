MachineDiagnosticsWizard.Compensate.Kept=Compensation kept
MachineDiagnosticsWizard.Compensate.KeptText=Against the board the machine millimetre was %+.3f%% / %+.3f%% (X / Y, the median of %d readings) and reads %+.3f%% / %+.3f%% now, from %d verification reading(s), against a line of %.3f%% / %.3f%%.<br><br>What is left is within what one reading of this machine scatters by. To take it out as well, read the board two or three more times and compensate again; the next compensation composes onto this one.<br><br>%d coordinates were carried across. machine.xml before the change is %s.
MachineDiagnosticsWizard.Compensate.NoBasis=No board measurement under the current compensation fits a frame closely enough to compensate from. Run the datum board group again, at a lower positioning speed if the machine drifts.
MachineDiagnosticsWizard.Compensate.NotMeasured=The board could not be measured after the change; the compensation was taken out again and nothing was saved.
MachineDiagnosticsWizard.Compensate.OneReading=one reading; two or three more would say how much they scatter
MachineDiagnosticsWizard.Compensate.Scatter=median of %d readings, which scatter by %.3f%% / %.3f%%
MachineDiagnosticsWizard.Compensate.Squareness=Also lean the Y axis back by the %+.3f° measured (readings scatter by %.3f°; only worth it when they agree)
MachineDiagnosticsWizard.Compensate.Text=<html><body style\='width\: 420px'>The datum board measured a machine millimetre %+.3f%% long in X and %+.3f%% in Y (%s).<br><br>This will\:<br>• copy machine.xml aside;<br>• add two linear transform axes that turn the controller's coordinates into true millimetres, and move every camera, nozzle and actuator onto them;<br>• carry every taught coordinate across - fiducials, feeders, nozzle tip changer, camera and nozzle offsets, the open job's boards - and put Units per Pixel into true millimetres. The primary fiducial keeps its coordinates. Feeders should be checked afterwards with their own auto setup;<br>• run the datum board group again, and once more if the first reading does not settle it. If the frame comes back closer to a true millimetre than it was and within the line the readings' scatter sets (0.1%% until six readings have said what the scatter is), the configuration is saved; otherwise everything is put back and nothing is saved. What is left within the line is taken out by the next compensation, which composes onto this one.<br><br>The machine will move.</body></html>
MachineDiagnosticsWizard.Compensate.Title=Compensate the machine's frame
MachineDiagnosticsWizard.Compensate.Undone=Compensation undone
MachineDiagnosticsWizard.Compensate.UndoneText=After the change the board read %+.3f%% / %+.3f%% (X / Y) and %+.3f°, from %d verification reading(s), against a basis of %+.3f%% / %+.3f%% and %+.3f° from %d reading(s).<br><br>To stand, the frame had to come back within %.3f%% / %.3f%% (%.2f°) of true and closer to it than the basis. It did not\: %s.<br><br>The compensation was taken out again and nothing was saved. A frame that reads differently from one run to the next is a machine that moves between the fiducials; the datum board report's anchor drift says how much, and the vision noise group's standing drift says how much of that moves with nothing commanded.
MachineDiagnosticsWizard.ConfirmMotion.Check=Before starting\: nothing in the way, hands and tools off the machine, and the stop within reach - Stop machine in the top bar, or %s.
MachineDiagnosticsWizard.ConfirmMotion.Moving=These measurements move the machine\: %s.
MachineDiagnosticsWizard.ConfirmMotion.Separator=, 
