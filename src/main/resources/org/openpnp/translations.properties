HeadSolutions.Solution.CreateNozzles.Choice.0=<html><h3>Standalone Nozzle</h3><p>A nozzle has its own dedicated Z axis motor</p></html>
HeadSolutions.Solution.CreateNozzles.Choice.1=<html><h3>Nozzle Pair, Shared Z Axis, Negated</h3><p>A nozzle pair shares a Z axis motor. When the first nozzle moves up, then second one moves down equally. The nozzles are negatively coupled by rack and pinion or belt.</p></html>
HeadSolutions.Solution.CreateNozzles.Choice.2=<html><h3>Nozzle Pair, Shared Z Axis, Cam</h3><p>A nozzle pair shares a Z axis motor. The two nozzles are pushed down by a rotational cam, pulled up with a spring.</p></html>
