MachineDiagnosticsWizard.Compensate.Fail.ShearNoCloser=the squareness came back no closer to square than before
MachineDiagnosticsWizard.Compensate.Fail.ShearOutside=the squareness came back outside the line
MachineDiagnosticsWizard.Compensate.Fail.XNoCloser=X came back no closer to true than before
