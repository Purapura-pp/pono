BoardsPanel.BoardPlacements.Placements.Rank.toolTip=<html><body style\='width\: 400'><strong>Rank</strong> controls the order in which placements are handled during a job. Placement are placed from low rank to high rank. There is a <strong>strict ordering</strong> when the difference between ranks is 10 or more. Placements in rank R must all be finished and correct before rank R+10 is considered for placement. There is <strong>no ordering</strong> requirement when the difference between ranks is less than 10. Placements at rank R may be placed anywhere between R-9 and R+9 given other job optimisation priorities.</body></html>
