ReferenceAdvancedMotionPlanner.MotionPlannerDiagnostics.title=Motion Planner Diagnostics
ReferenceAdvancedMotionPlannerConfigurationWizard.MotionPlannerPanel.AllowContinousMotionLabel.text=Allow continous motion?
ReferenceAdvancedMotionPlannerConfigurationWizard.MotionPlannerPanel.AllowContinousMotionLabel.toolTipText=<html>\r\n<p>Often, Pono directs the controller(s) to execute motion that involves multiple<br/>\r\nsegments. For example, consider a move to Safe Z, followed by a move over the target <br/>\r\nlocation, followed by a move to lower the the nozzle down to pick or place a part. </p> \r\n<p>If the motion planner and/or the motion controller get these commands as one<br/>\r\nsequence, they can apply certain optimizations to them. There are also no delays<br/>\r\nintroduced when communicating back and forth. Furthermore, the planning can go <br/>\r\nahead in parallel while the controller is still executing the last commands.</p>\r\n<p>By allowing continuous motion, you enable these optimizations. However, the <br/>\r\nMachine setup i.e. Gcode, custom scripts etc. must be configured in awareness that the <br/>\r\nplanner no longer waits for motion to complete each time, unless explicitly told to. </p>\r\n</html>
ReferenceAdvancedMotionPlannerConfigurationWizard.MotionPlannerPanel.AllowUncoordinatedLabel.text=Allow uncoordinated?
ReferenceAdvancedMotionPlannerConfigurationWizard.MotionPlannerPanel.AllowUncoordinatedLabel.toolTipText=<html>\r\nAllowing uncoordinated motion, will enable the planner to use advanced features<br/>\r\nsuch as overshooting, motion blending etc. This requires a driver that supports<br/>\r\nsimulated or true 3rd-order motion control (with these features on the controller).\r\n</html>
ReferenceAdvancedMotionPlannerConfigurationWizard.MotionPlannerPanel.Border.title=Motion Planner
ReferenceAdvancedMotionPlannerConfigurationWizard.MotionPlannerPanel.FuseBacklashFinalApproachLabel.text=Fuse backlash approach?
ReferenceAdvancedMotionPlannerConfigurationWizard.MotionPlannerPanel.FuseBacklashFinalApproachLabel.toolTipText=<html>\r\n<p>Two-part backlash compensation - one-sided positioning, or sneaking up - drives past<br/>\r\nthe target and then approaches it in a second, separate move. That second move costs a<br/>\r\nstill-stand and a G-code line of its own, every time an axis moves.</p>\r\n<p>With this on, the planner fuses that approach into the move that follows it, as long as<br/>\r\nthe following move does not touch the compensated axes - typically the Z descent onto a<br/>\r\npart. The axis still arrives from the side it was compensated for, and more gently than<br/>\r\nbefore, because it now covers its fraction of a millimetre over the whole descent.</p>\r\n<p>Requires continuous motion to be allowed, since there is nothing to fuse into if the<br/>\r\nplanner waits for each move to complete. The fused move carries the compensating travel<br/>\r\nthrough the descent, so switch this off if a nozzle has to descend into a changer slot or<br/>\r\nanother place too narrow for the backlash offset of lateral movement.</p>\r\n</html>
ReferenceAdvancedMotionPlannerConfigurationWizard.MotionPlannerPanel.InterpolationRetimingLabel.text=Interpolation Retiming?
ReferenceAdvancedMotionPlannerConfigurationWizard.MotionPlannerPanel.InterpolationRetimingLabel.toolTipText=<html>\r\nInterpolation can only approximate the true 3rd-order motion profiles,<br/>\r\nsome deviations are expected. Re-timing will stretch the motion<br/>\r\nto match the original 3rd-order timing. However this will slightly reduce<br/>\r\nthe peak feedrate. By switching this off, you get the planned peak feedrate but slightly shorter<br/>\r\nmove duration.\r\n</html>
ReferenceAdvancedMotionPlannerConfigurationWizard.MotionPlannerPanel.MinimumSpeedLabel.text=Minimum Speed
ReferenceAdvancedMotionPlannerConfigurationWizard.MotionPlannerPanel.MinimumSpeedLabel.toolTipText=<html>\r\n<p>\r\nMinimum speed supported by the motion planner.\r\n</p><p>\r\nExcessively low minimum speeds lead to excessive required precision for<br/>\r\nfeed-rates, acceleration (and jerk) rates. By keeping minmum speeds above<br/>\r\nreasonable levels (e.g. 5%), some computations (like interpolation) can be<br/>\r\noptimized.<br/>\r\n</p><p>\r\nFor drivers communicating via text protocol (GcodeDriver), fewer decimal<br/>\r\ndigits are required, which lowers command latency.<br/>\r\n</p>\r\n</html>
