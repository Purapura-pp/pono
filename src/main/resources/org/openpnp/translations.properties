MachineDiagnosticsWizard.State.Measured=measured
MachineDiagnosticsWizard.State.Never=never measured
MachineDiagnosticsWizard.State.NotSet=not set
MachineDiagnosticsWizard.State.Off=off
MachineDiagnosticsWizard.State.On=on
MachineDiagnosticsWizard.Test.CameraLatency=Camera latency
MachineDiagnosticsWizard.Test.CameraLatency.toolTipText=Frames are taken through a slow move; frames still showing the move after the controller reported it complete are the delay of the camera pipeline.
MachineDiagnosticsWizard.Test.CameraSettle=Camera settling
MachineDiagnosticsWizard.Test.CameraSettle.toolTipText=<html>Sample the image after a move and find when it stopped moving, to compare<br/>against the settle time the camera is configured to wait.</html>
MachineDiagnosticsWizard.Test.ConfigSnapshot=Configuration snapshot
MachineDiagnosticsWizard.Test.ConfigSnapshot.toolTipText=<html>Write out the settings the measurements were taken under, so that the numbers<br/>can be read against them later. Moves nothing.</html>
MachineDiagnosticsWizard.Test.DatumBoard=Datum board
MachineDiagnosticsWizard.Test.DatumBoard.toolTipText=Finds the seven copper fiducials of the LumenPnP datum board around the primary fiducial and fits the machine's frame to them\: scale per axis, squareness, residuals. Reads the ruler for the camera's own scale and for the position error along 30 mm.
MachineDiagnosticsWizard.Test.Firmware=Controller settings
MachineDiagnosticsWizard.Test.Firmware.toolTipText=<html>Ask the controller what it is configured for and put its own limits beside the<br/>ones OpenPnP plans with. A controller limit below the axis setting caps every move<br/>without saying so. Moves nothing.</html>
MachineDiagnosticsWizard.Test.Homing=Homing repeatability
MachineDiagnosticsWizard.Test.Homing.toolTipText=<html>Home repeatedly and measure how far the origin wanders between cycles.<br/>This scatter carries into every job.</html>
MachineDiagnosticsWizard.Test.HysteresisMap=Hysteresis along the travel
MachineDiagnosticsWizard.Test.HysteresisMap.toolTipText=Reads the raw backlash and a short staircase at several places along each axis, against whatever round feature the table offers there. Slack that peaks in the middle of the travel is the belt giving - tension is low; slack that is the same everywhere is play or friction.
MachineDiagnosticsWizard.Test.Kinematics=Kinematics
MachineDiagnosticsWizard.Test.Kinematics.toolTipText=<html>Time moves over a range of distances and fit the acceleration, velocity and<br/>fixed per-move cost the machine really has, to compare against the axis settings.</html>
MachineDiagnosticsWizard.Test.LostSteps=Lost steps
MachineDiagnosticsWizard.Test.LostSteps.toolTipText=A run of long fast moves at each speed factor, then back to the fiducial from the same side\: the offset is what the run lost.
MachineDiagnosticsWizard.Test.RotationBacklash=Rotation backlash
MachineDiagnosticsWizard.Test.RotationBacklash.toolTipText=<html>Measure the play in the nozzle rotation on the bottom camera. Load a nozzle<br/>tip, pick a rectangular part by hand, and name that part below before running this.</html>
MachineDiagnosticsWizard.Test.VisionNoise=Vision noise floor
MachineDiagnosticsWizard.Test.VisionNoise.toolTipText=Locates the fiducial in many frames with nothing moving. The scatter is the floor under every position the other groups report.
MachineDiagnosticsWizard.Test.XyPositioning=X/Y positioning
MachineDiagnosticsWizard.Test.XyPositioning.toolTipText=<html>Measure against the primary calibration fiducial\: how far apart repeated<br/>approaches land, how much backlash there is with compensation off, whether small<br/>steps are followed at all, and whether Units per Pixel is to scale across the<br/>field of view. The longest of the measurements.</html>
MachineDiagnosticsWizard.Test.ZFocus=Z focus
MachineDiagnosticsWizard.Test.ZFocus.toolTipText=Sweeps the nozzle tip through the bottom camera's focus from above and from below. Where it comes sharp is where Z really stops\: repeatability from one side, slack between the sides. Needs a nozzle tip loaded and no part.
