MachineSetup.JobProcessors.ReferencePnpJobProcessor.Label.FeederFaultLimit.toolTipText=<html>When using deferred errors, a feeder can be automatically disabled<br>if the parts obtained from that feeder cause problems. This is the<br>number of errors when a feeder is disabled</html>
MachineSetup.JobProcessors.ReferencePnpJobProcessor.Label.FeederFaultWindowSize=Feeder fault window size
MachineSetup.JobProcessors.ReferencePnpJobProcessor.Label.FeederFaultWindowSize.toolTipText=<html>When using deferred errors, a feeder can be automatically disabled<br>if the parts obtained from that feeder cause problems. This is the<br>number of recent placements over which it will count the errors.</html>
MachineSetup.JobProcessors.ReferencePnpJobProcessor.Label.JobOrder=Job order
MachineSetup.JobProcessors.ReferencePnpJobProcessor.Label.JobOrder.toolTipText=<html>All placements of a job will be sorted using this order. However, the actual order may differ<br>because parts that can be placed using the currently loaded nozzle tip(s) will take precedence.</html>
MachineSetup.JobProcessors.ReferencePnpJobProcessor.Label.MaxPlacementRetries=Max Placement Attempts
MachineSetup.JobProcessors.ReferencePnpJobProcessor.Label.MaxPlacementRetries.toolTipText=<html>The number of attempts at the whole feed/pick/align/place process for each<br>placement. The part is discarded after a failed attempt. Retries<br>may not be consecutive because each attempt is independently scheduled<br>by the job processor optimiser.</html>
MachineSetup.JobProcessors.ReferencePnpJobProcessor.Label.MaxVisionRetries=Max Vision Attempts
MachineSetup.JobProcessors.ReferencePnpJobProcessor.Label.MaxVisionRetries.toolTipText=The number of attempts at vision alignment, in cases where the first attempt raises an error.
