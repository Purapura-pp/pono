A\ HTTPActuator\ with\ Read\ URL\ likely\ needs\ a\ regular\ Expression\ to\ parse\ the\ value.=Ein HTTPActuator mit Lese-URL benötigt wahrscheinlich einen regulären Ausdruck, um den Wert auszuwerten.
A\ high\ Preview\ FPS\ value\ might\ create\ undue\ CPU\ load.=Ein hoher Wert für Vorschau-FPS kann eine unnötig hohe CPU-Last erzeugen.
Accept\ to\ replace\ ACTUATOR_READ_COMMAND\ with\ ACTUATOR_READ_WITH_DOUBLE_COMMAND.\ Dismiss\ to\ remove\ read\ with\ double.=Übernehmen, um ACTUATOR_READ_COMMAND durch ACTUATOR_READ_WITH_DOUBLE_COMMAND zu ersetzen. Verwerfen, um das Lesen mit Double zu entfernen.
Advanced\ Motion\ Planner\ not\ set.\ Accept\ or\ Dismiss\ to\ continue.=Erweiterte Bewegungsplanung nicht eingestellt. Übernehmen oder Verwerfen, um fortzufahren.
Advanced\ motion\ planner\ set.\ Revert\ to\ a\ simpler,\ safer\ planner.=Erweiterte Bewegungsplanung eingestellt. Zu einer einfacheren, sichereren Planung zurückkehren.
Assign\ a\ driver\ as\ described\ in\ the\ Wiki.=Einen Treiber zuweisen, wie im Wiki beschrieben.
Assign\ a\ driver.=Einen Treiber zuweisen.
Assign\ the\ unique\ axis\ letter\ where\ wrong,\ press\ Accept,\ then\ press\ Find\ Issues\ &\ Solutions\ again\ to\ clear\ the\ correct\ one.=Weisen Sie den eindeutigen Achsbuchstaben dort zu, wo er falsch ist, drücken Sie Übernehmen und drücken Sie dann erneut Probleme & Lösungen suchen, um den korrekten Eintrag zu bereinigen.
Avoid\ axis\ letter\ E,\ if\ possible.\ Use\ proper\ rotation\ axes\ instead.=Vermeiden Sie möglichst den Achsbuchstaben E. Verwenden Sie stattdessen richtige Rotationsachsen.
Axes\ should\ be\ configured\ as\ linear\ in\ feedrate\ calculations\ on\ the\ RepRapFirmware\ controller.\ See\ the\ linked\ web\ page.=Achsen sollten in den Vorschubberechnungen der RepRapFirmware-Steuerung als linear konfiguriert sein. Siehe die verlinkte Webseite.
Axis\ is\ not\ assigned\ to\ a\ driver.=Achse ist keinem Treiber zugewiesen.
Axis\ letter\ is\ missing.\ Assign\ the\ letter\ to\ continue.=Der Achsbuchstabe fehlt. Weisen Sie den Buchstaben zu, um fortzufahren.
Axis\ should\ be\ treated\ as\ a\ linear\ for\ detected\ firmware\ (all-primary\ axes\ mode).=Die Achse sollte für die erkannte Firmware als linear behandelt werden (Modus mit ausschließlich primären Achsen).
Axis\ velocity\ limited\ by\ driver\ Maximum\ Feed\ Rate.\ =Achsgeschwindigkeit durch die maximale Vorschubgeschwindigkeit des Treibers begrenzt. 
Change\ of\ serial\ port\ Flow\ Control\ recommended.=Änderung der Flusssteuerung des seriellen Anschlusses empfohlen.
Change\ to\ NullMotionPlanner=Zu NullMotionPlanner wechseln
Change\ to\ ReferenceAdvancedMotionPlanner=Zu ReferenceAdvancedMotionPlanner wechseln
Check\ axis\ letters\ and\ make\ sure\ the\ controller\ is\ capable\ to\ use\ extra\ axes\ (i.e.\ not\ extruders).=Prüfen Sie die Achsbuchstaben und stellen Sie sicher, dass die Steuerung zusätzliche Achsen verwenden kann (also keine Extruder).
Check\ axis\ letters\ and\ make\ sure\ use\ a\ proper\ 6-axis\ configuration\ without\ extruders.=Prüfen Sie die Achsbuchstaben und stellen Sie sicher, dass eine richtige 6-Achsen-Konfiguration ohne Extruder verwendet wird.
Check\ out\ firmwares\ known\ to\ be\ well\ supported.\ See\ info\ link.=Sehen Sie sich Firmwares an, die bekanntermaßen gut unterstützt werden. Siehe Info-Link.
Choose\ an\ advanced\ Motion\ Control\ Type\ for\ your\ controller\ type.=Wählen Sie eine erweiterte Art der Bewegungssteuerung für Ihren Steuerungstyp.
Choose\ the\ right\ communications\ type\ and\ port/address\ settings.=Wählen Sie den richtigen Kommunikationstyp und die richtigen Anschluss-/Adresseinstellungen.
Choose\ the\ simplest\ Motion\ Control\ Type\ for\ the\ first\ basic\ setup.=Wählen Sie für die erste Grundeinrichtung die einfachste Art der Bewegungssteuerung.
Compress\ Gcode\ for\ superior\ communications\ speed.=Gcode komprimieren für eine höhere Kommunikationsgeschwindigkeit.
Connect\ the\ driver\ to\ your\ controller.=Den Treiber mit Ihrer Steuerung verbinden.
Contact\ probe\ actuator\ needs\ unconditional\ machine\ coordination\ after\ actuation.=Der Aktuator zum Antasten benötigt nach der Betätigung eine unbedingte Koordination mit der Maschine.
Convert\ to\ GcodeAsyncDriver.=In GcodeAsyncDriver umwandeln.
Convert\ to\ GcodeDriver.=In GcodeDriver umwandeln.
Converting\ the\ ContactProbeNozzle\ back\ to\ a\ plain\ ReferenceNozzle\ may\ simplify\ the\ machine\ setup.=Das Zurückwandeln der ContactProbeNozzle in eine einfache ReferenceNozzle kann die Maschineneinrichtung vereinfachen.
Depending\ on\ the\ type\ of\ nozzle\ tip\ or\ shade,\ select\ the\ proper\ background\ calibration.=Wählen Sie je nach Art der Düsenspitze oder ihrer Färbung die passende Hintergrundkalibrierung.
Determine\ the\ camera\ head\ offsets.=Die Kopf-Versätze der Kamera bestimmen.
Disable\ Allow\ Letter\ Pre-Move\ Commands.=Befehle vor der Bewegung erlauben deaktivieren.
Disable\ Compress\ G-code.=G-code komprimieren deaktivieren.
Disable\ Confirmation\ Flow\ Control\ for\ full\ asynchronous\ operation.=Bestätigungs-Flusssteuerung für vollständig asynchronen Betrieb deaktivieren.
Disable\ Confirmation\ Flow\ Control.=Bestätigungs-Flusssteuerung deaktivieren.
Disable\ Connection\ Keep-Alive.=Keep Alive der Verbindung deaktivieren.
Disable\ G-code\ compression\ for\ trouble-free\ operation\ with\ incompatible\ controllers.=G-code-Komprimierung für einen störungsfreien Betrieb mit inkompatiblen Steuerungen deaktivieren.
Disable\ Location\ Confirmation=Positionsbestätigung deaktivieren
Disable\ Remove\ Comments.=Kommentare entfernen deaktivieren.
Disable\ Wrap\ Around.=Umlauf deaktivieren.
Disallow\ Pre-Move\ Commands\ for\ automatic\ G-code\ setup\ and\ other\ advanced\ features.\ Accept\ or\ Dismiss\ to\ continue.=Befehle vor der Bewegung für die automatische G-code-Einrichtung und weitere erweiterte Funktionen nicht erlauben. Übernehmen oder Verwerfen, um fortzufahren.
Enable\ Auto\ Camera\ View.=Automatische Kameraansicht aktivieren.
Enable\ Auto\ tool\ select.=Werkzeug automatisch auswählen aktivieren.
Enable\ Compress\ Gcode.=G-code komprimieren aktivieren.
Enable\ Confirmation\ Flow\ Control.=Bestätigungs-Flusssteuerung aktivieren.
Enable\ Continuous\ Motion.=Durchgehende Bewegung aktivieren.
Enable\ Letter\ Variables.=Buchstabenvariablen aktivieren.
Enable\ Limit\ to\ Range.=Auf Bereich begrenzen aktivieren.
Enable\ Location\ Confirmation=Positionsbestätigung aktivieren
Enable\ Location\ Confirmation.=Positionsbestätigung aktivieren.
Enable\ Pre-Rotate.=Vorab drehen aktivieren.
Enable\ Remove\ Comments.=Kommentare entfernen aktivieren.
Enable\ Suspend\ during\ tasks.=Während Aufgaben aussetzen aktivieren.
Enable\ Visual\ Homing.=Visuelle Referenzfahrt aktivieren.
Enable\ Wrap\ Around.=Umlauf aktivieren.
Enable\ script\ engine\ pooling.=Skript-Engines poolen aktivieren.
Feed-rate,\ acceleration,\ jerk\ etc.\ can\ now\ be\ set\ individually\ per\ axis.=Vorschubgeschwindigkeit, Beschleunigung, Ruck usw. können nun einzeln pro Achse eingestellt werden.
Feeder\ has\ no\ configured\ offset=Feeder hat keinen konfigurierten Versatz
Feeder\ slot\ has\ no\ configured\ location=Feeder-Slot hat keine konfigurierte Position
For\ best\ results\ with\ color-keyed\ computer\ vision,\ it\ is\ recommended\ to\ use\ static\ white\ balance.=Für die besten Ergebnisse mit farbschlüsselbasierter Bildverarbeitung wird ein statischer Weißabgleich empfohlen.
Get\ the\ new\ version\ through\ the\ linked\ web\ page.=Beziehen Sie die neue Version über die verlinkte Webseite.
Go\ to\ the\ nozzle(s)\ and\ enable\ the\ Compatible\ switches\ where\ appropriate.=Gehen Sie zu den Saugdüsen und aktivieren Sie dort, wo es passt, die Schalter Kompatibel.
Home\ the\ machine\ now.=Die Maschine jetzt referenzieren.
In\ single\ camera\ preview\ OpenPnP\ can\ automatically\ switch\ the\ camera\ for\ you.=In der Einzelkamera-Vorschau kann OpenPnP die Kamera automatisch für Sie umschalten.
It\ is\ OK\ to\ share\ rotation\ axes.\ If\ intentional,\ just\ dismiss\ this\ issue.\ Otherwise\ assign\ a\ different\ Rotation\ axis.=Rotationsachsen dürfen gemeinsam genutzt werden. Wenn das beabsichtigt ist, verwerfen Sie dieses Problem einfach. Andernfalls weisen Sie eine andere Rotationsachse zu.
Keep\ G-code\ comments\ for\ better\ debugging.=G-code-Kommentare für eine bessere Fehlersuche beibehalten.
Link\ the\ Placements/Parts/Packages/Vision\ Settings/Feeders\ tables\ between\ tabs.=Die Tabellen Bestückungspositionen/Bauteile/Gehäuse/Bildverarbeitungseinstellungen/Feeder zwischen den Reitern verknüpfen.
Location\ Confirmation\ recommended\ for\ extra\ features\ in\ homing,\ contact\ probing,\ etc.=Positionsbestätigung empfohlen für zusätzliche Funktionen bei Referenzfahrt, Antasten usw.
Location\ Confirmation\ usually\ not\ available\ when\ no\ axes\ present.=Positionsbestätigung ist in der Regel nicht verfügbar, wenn keine Achsen vorhanden sind.
Marlin\ sends\ location-like\ responses\ to\ other\ commands\ so\ Location\ Confirmation\ is\ not\ reliable=Marlin sendet auch auf andere Befehle positionsähnliche Antworten, daher ist die Positionsbestätigung nicht zuverlässig
Mount\ a\ permanent\ fiducial\ to\ your\ machine\ and\ use\ it\ for\ repeatable\ precision\ X/Y\ homing.=Montieren Sie eine dauerhafte Passermarke an Ihrer Maschine und verwenden Sie sie für eine wiederholbar präzise X/Y-Referenzfahrt.
Move\ the\ camera\ over\ the\ primary\ calibration\ fiducial\ and\ capture\ its\ position.=Fahren Sie die Kamera über die primäre Kalibrier-Passermarke und erfassen Sie ihre Position.
Move\ the\ camera\ over\ the\ secondary\ calibration\ fiducial\ and\ capture\ its\ position.=Fahren Sie die Kamera über die sekundäre Kalibrier-Passermarke und erfassen Sie ihre Position.
Only\ the\ GcodeAsyncDriver\ currently\ supports\ it.\ Advanced\ milestone\ required.=Derzeit unterstützt nur der GcodeAsyncDriver dies. Meilenstein Fortgeschritten erforderlich.
OpenPnP\ can\ often\ automatically\ select\ the\ right\ tool\ for\ you\ in\ Machine\ Controls.=OpenPnP kann in der Maschinensteuerung oft automatisch das richtige Werkzeug für Sie auswählen.
Please\ add\ the\ command\ manually.=Bitte fügen Sie den Befehl manuell hinzu.
Please\ assign\ a\ different\ Z\ axis.=Bitte weisen Sie eine andere Z-Achse zu.
Please\ assign\ a\ proper\ Rotation\ axis.\ You\ might\ need\ to\ create\ one\ first.=Bitte weisen Sie eine richtige Rotationsachse zu. Möglicherweise müssen Sie zuerst eine erstellen.
Please\ assign\ a\ proper\ Z\ axis.\ You\ might\ need\ to\ create\ one\ first.=Bitte weisen Sie eine richtige Z-Achse zu. Möglicherweise müssen Sie zuerst eine erstellen.
Please\ upgrade\ the\ firmware\ and/or\ axis\ configuration.\ See\ the\ info\ link.=Bitte aktualisieren Sie die Firmware und/oder die Achsenkonfiguration. Siehe den Info-Link.
Please\ upgrade\ to\ the\ special\ PnP\ version.\ See\ info\ link.=Bitte aktualisieren Sie auf die spezielle PnP-Version. Siehe Info-Link.
Pre-rotate\ bottom\ vision\ must\ be\ enabled,\ because\ the\ machine\ has\ a\ limited\ articulation\ nozzle.=Vorab drehen muss für Bottom Vision aktiviert sein, da die Maschine eine Saugdüse mit begrenztem Drehbereich hat.
Primary\ calibration\ fiducial\ position\ and\ initial\ camera\ calibration.=Position der primären Kalibrier-Passermarke und erste Kamerakalibrierung.
Primary/secondary\ calibration\ fiducial\ Z\ too\ close\ together.=Das Z der primären und der sekundären Kalibrier-Passermarke liegt zu dicht beieinander.
Remove\ Gcode\ comments\ for\ superior\ communications\ speed.=Gcode-Kommentare entfernen für eine höhere Kommunikationsgeschwindigkeit.
Remove\ driver\ Maximum\ Feed\ Rate.=Maximale Vorschubgeschwindigkeit des Treibers entfernen.
Remove\ the\ command.=Den Befehl entfernen.
Replace\ with\ ContactProbeNozzle.=Durch ContactProbeNozzle ersetzen.
Replace\ with\ ReferenceNozzle.=Durch ReferenceNozzle ersetzen.
Retry\ the\ detection\ by\ connecting\ to\ the\ controller\ or\ assume\ a\ generic\ controller.=Wiederholen Sie die Erkennung, indem Sie sich mit der Steuerung verbinden, oder gehen Sie von einer generischen Steuerung aus.
Rotation\ can\ be\ optimized\ by\ wrapping-around\ the\ shorter\ way.\ Best\ combined\ with\ Limit\ ±180°.=Die Drehung kann optimiert werden, indem der kürzere Weg genommen wird (Umlauf). Am besten in Kombination mit Auf ±180° begrenzen.
Rotation\ cannot\ be\ wrapped-around\ on\ a\ limited\ articulation\ axis.=Bei einer Achse mit begrenztem Drehbereich ist kein Umlauf möglich.
Rotation\ must\ be\ limited\ on\ a\ limited\ articulation\ axis.=Bei einer Achse mit begrenztem Drehbereich muss die Drehung begrenzt werden.
Script\ execuction\ performance\ can\ be\ improved\ by\ enabling\ engine\ pooling.=Die Leistung der Skriptausführung kann durch das Poolen der Engines verbessert werden.
Secondary\ calibration\ fiducial\ position.=Position der sekundären Kalibrier-Passermarke.
Select\ the\ feeder\ in\ the\ Feeders\ tab\ and\ make\ sure\ the\ feeder\ has\ an\ offset\ location\ from\ the\ slot=Wählen Sie den Feeder im Reiter Feeder und stellen Sie sicher, dass der Feeder eine Versatzposition gegenüber dem Slot hat
Select\ the\ feeder\ in\ the\ Feeders\ tab\ and\ make\ sure\ the\ slot\ has\ a\ set\ location=Wählen Sie den Feeder im Reiter Feeder und stellen Sie sicher, dass für den Slot eine Position festgelegt ist
Set\ After\ Actuation\ machine\ coordination\ to\ WaitForUnconditionalCoordination.=Die Maschinenkoordination Nach der Betätigung auf WaitForUnconditionalCoordination setzen.
Set\ a\ suitable\ camera\ settling\ method\ automatically.=Automatisch ein passendes Verfahren zur Kamera-Beruhigung einstellen.
Set\ an\ example\ expression=Einen Beispielausdruck festlegen
Set\ to\ 5\ FPS.=Auf 5 FPS setzen.
Set\ to\ Rendering\ Quality\ to\ High\ (right\ click\ the\ Camera\ View\ to\ see\ other\ options).=Die Renderqualität auf Hoch setzen (rechtsklicken Sie in die Kameraansicht, um weitere Optionen zu sehen).
The\ nozzle\ can\ be\ replaced\ with\ a\ ContactProbeNozzle\ to\ support\ various\ probing\ features.=Die Saugdüse kann durch eine ContactProbeNozzle ersetzt werden, um verschiedene Antastfunktionen zu unterstützen.
The\ preview\ rendering\ quality\ can\ be\ improved.=Die Renderqualität der Vorschau kann verbessert werden.
To\ continue,\ the\ machine\ must\ be\ enabled\ and\ homed.=Um fortzufahren, muss die Maschine aktiviert und referenziert sein.
Use\ Axis\ Letter\ Variables\ for\ simpler\ use,\ automatic\ G-code\ setup,\ and\ other\ advanced\ features.=Verwenden Sie Achsbuchstaben-Variablen für eine einfachere Nutzung, die automatische G-code-Einrichtung und weitere erweiterte Funktionen.
Use\ Keep-Alive\ only\ when\ necessary.\ It\ may\ cause\ hard\ to\ diagnose\ problems.=Verwenden Sie Keep Alive nur, wenn es nötig ist. Es kann schwer zu diagnostizierende Probleme verursachen.
Use\ an\ adaptive\ camera\ settling\ method.=Ein adaptives Verfahren zur Kamera-Beruhigung verwenden.
Use\ continuous\ motion.\ OpenPnP\ will\ only\ wait\ for\ the\ machine\ when\ really\ needed.=Durchgehende Bewegung verwenden. OpenPnP wartet dann nur noch auf die Maschine, wenn es wirklich nötig ist.
Use\ the\ GcodeAsyncDriver\ for\ advanced\ features.\ Accept\ or\ Dismiss\ to\ continue.=Verwenden Sie den GcodeAsyncDriver für erweiterte Funktionen. Übernehmen oder Verwerfen, um fortzufahren.
Use\ the\ GcodeDriver\ for\ simpler\ setup.\ Accept\ or\ Dismiss\ to\ continue.=Verwenden Sie den GcodeDriver für eine einfachere Einrichtung. Übernehmen oder Verwerfen, um fortzufahren.
Use\ the\ M584\ S0\ option\ in\ your\ config.g\ file.=Verwenden Sie die Option M584 S0 in Ihrer Datei config.g.
On\ the\ camera's\ Device\ Settings\ tab\ select\ the\ correct\ Device\ and\ Format.\ Then\ click\ on\ the\ Capture\ FPS\ Test\ button.\ An\ image\ from\ the\ camera\ should\ appear\ in\ the\ camera's\ view\ pane.=Wählen Sie im Tab Geräteeinstellungen der Kamera das richtige Gerät und Format. Klicken Sie dann auf die Schaltfläche für den Aufnahme-FPS-Test. Im Ansichtsbereich der Kamera sollte ein Bild der Kamera erscheinen.
Camera\ not\ connected\ to\ Pono=Kamera nicht mit Pono verbunden
