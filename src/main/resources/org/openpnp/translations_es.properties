ReferencePushPullFeederConfigurationWizard.checkBoxUsedAsTemplate.toolTipText=<html>Usar este alimentador como plantilla para clonar ajustes a otros alimentadores. <br/>\r\nLas plantillas se emparejan por la especificación de cinta y carrete o por el encapsulado de las piezas <br/>\r\ncargadas en los alimentadores. <br/>\r\nCuando ninguna plantilla coincide formalmente, se toma el alimentador \ncon mayor parecido <br/>\r\n(paso de avance, anchura de cinta, proximidad, etc.).</html>
