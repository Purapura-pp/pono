ReferenceNozzleTipCalibrationWizard.TopPanel.RecalibrationLabel.toolTipText=<html>\n<p>Determina cuándo se ejecuta automáticamente una recalibración\:</p>\n<p><ul><li>En cada cambio de punta de boquilla.</li>\n<li>En cada cambio de punta de boquilla, pero sólo en las tareas.</li>\n<li>Al referenciar la máquina y en la primera carga. </li></ul></p>\n<p>Manual con calibración almacenada (sólo se recomienda en máquinas <br /> \ncon referenciado del eje C).</p>\n</html>
