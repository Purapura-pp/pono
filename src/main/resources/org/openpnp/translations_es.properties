ReferencePushPullFeederConfigurationWizard.lblHole1Location.text=Ubicación del agujero 1
ReferencePushPullFeederConfigurationWizard.lblHole1Location.toolTipText=<html>Elija el agujero 1 más cerca del carrete de la cinta.<br/>\r\nSi es posible, elija dos agujeros que encuadren las piezas que se van a recoger.\r\n</html>
ReferencePushPullFeederConfigurationWizard.lblHole2Location.text=Ubicación del agujero 2
ReferencePushPullFeederConfigurationWizard.lblHole2Location.toolTipText=<html>Elija el agujero 2 más lejos del carrete de la cinta.<br/>\r\nSi es posible, elija dos agujeros que encuadren las piezas que se van a recoger.\r\n</html>
ReferencePushPullFeederConfigurationWizard.lblMultiplier.text=Multiplicador
ReferencePushPullFeederConfigurationWizard.lblMultiplier.toolTipText=Para mejorar la eficiencia puede accionar el alimentador varias veces y avanzar así más piezas por ciclo.
ReferencePushPullFeederConfigurationWizard.lblNormalizePickLocation.text=¿Normalizar?
ReferencePushPullFeederConfigurationWizard.lblNormalizePickLocation.toolTipText=Normalizar la ubicación de recogida respecto a los agujeros de arrastre según la norma EIA-481.
ReferencePushPullFeederConfigurationWizard.lblOcrFontName.text=Nombre de la fuente de OCR
ReferencePushPullFeederConfigurationWizard.lblOcrFontName.toolTipText=<html>Nombre de la fuente OCR que se debe reconocer, o [Barcode].<br/>\r\nLas fuentes monoespaciadas funcionan mucho mejor, permiten menor resolución y por tanto un <br/>\r\nfuncionamiento más rápido. Use una fuente en la que todos los caracteres usados se distingan con facilidad.<br/>\r\nSon muy preferibles las fuentes con una separación clara entre glifos.</html>
ReferencePushPullFeederConfigurationWizard.lblOcrWrongPart.text=Acción de OCR ante pieza incorrecta
ReferencePushPullFeederConfigurationWizard.lblOcrWrongPart.toolTipText=<html>Determina qué acción debe tomarse cuando el OCR detecta un ID de pieza incorrecto en el alimentador.<br/> \r\n<ul>\r\n<li>\r\n<strong>None</strong>\: use este ajuste si no quiere usar el OCR.</li>\r\n<li>\r\n<strong>SwapFeeders</strong>\: si se detecta una pieza incorrecta pero la pieza correcta está seleccionada<br/>\r\nen otro ReferencePushPullFeeder, se intercambian las ubicaciones de los dos alimentadores. El<br/>\r\nalimentador que entra quedará habilitado. Esto ocurrirá si descarga, recarga o reordena sus<br/>\r\nalimentadores en la máquina.</li>\r\n<li>\r\n<strong>SwapOrCreate</strong>\: funciona como <strong>SwapFeeders</strong>, pero si no<br/>\r\nse encuentra otro alimentador con la pieza correcta, se creará uno nuevo y entrará en la<br/>\r\nubicación del alimentador actual. El alimentador actual queda entonces deshabilitado (ahora están en<br/>\r\nla misma ubicación y sólo uno debe estar habilitado).</li>\r\n<li>\r\n<strong>ChangePart</strong>\: se cambia la pieza del alimentador actual. Esto sólo<br/>\r\nfuncionará correctamente si los ajustes de la cinta, etc., siguen siendo los mismos para las dos piezas, es decir, si limita<br/>\r\ncualquier recarga o reordenación a grupos de alimentadores con los mismos ajustes.</li>\r\n<li>\r\n<strong>ChangePartAndClone</strong>\: se cambia la pieza del alimentador actual, pero<br/>\r\nlos ajustes se clonan de un alimentador de plantilla.</li>\r\n</ul>\r\n</html>\r\n
ReferencePushPullFeederConfigurationWizard.lblPartPitch.text=Paso de las piezas
ReferencePushPullFeederConfigurationWizard.lblPartPitch.toolTipText=Paso de las piezas en la cinta (2 mm, 4 mm, 8 mm, 12 mm, etc.)
ReferencePushPullFeederConfigurationWizard.lblPickLocation.text=Ubicación de recogida
ReferencePushPullFeederConfigurationWizard.lblPickLocation.toolTipText=<html>Ubicación de recogida de la pieza. Si una operación de avance produce varias,<br/>\r\nesta debe ser la última que se recoge, es decir, la más cercana al carrete de la cinta.</html>
ReferencePushPullFeederConfigurationWizard.lblPrecisionAverage.text=Precisión media
ReferencePushPullFeederConfigurationWizard.lblPrecisionAverage.toolTipText=Precisión media obtenida, es decir, el desplazamiento de la ubicación de recogida detectado por la calibración
ReferencePushPullFeederConfigurationWizard.lblPrecisionConfidenceLimit.text=Límite de confianza de la precisión
ReferencePushPullFeederConfigurationWizard.lblPrecisionConfidenceLimit.toolTipText=Precisión obtenida con un 95% de confianza (suponiendo una distribución normal)
ReferencePushPullFeederConfigurationWizard.lblPrecisionWanted.text=Precisión deseada
ReferencePushPullFeederConfigurationWizard.lblPrecisionWanted.toolTipText=Precisión deseada, es decir, el desplazamiento tolerable de la ubicación de recogida
ReferencePushPullFeederConfigurationWizard.lblRotation.text=Rotación en la cinta
ReferencePushPullFeederConfigurationWizard.lblRotation.toolTipText=<html>Rotación de la pieza dentro de la cinta vista con los agujeros de arrastre <br/>\r\narriba. La referencia es la orientación de la pieza en su E-CAD.<br/>\r\nVea también\: \r\n<ul>\r\n<li>EIA-481</li>\r\n<li>Component Zero Orientations for CAD Libraries</li>\r\n</ul>\r\n</html>
ReferencePushPullFeederConfigurationWizard.lblSnapToAxis.text=¿Ajustar al eje?
ReferencePushPullFeederConfigurationWizard.lblSnapToAxis.toolTipText=Ajustar las filas de agujeros de arrastre a la paralela del eje.
ReferencePushPullFeederConfigurationWizard.lblStopAfterWrong.text=¿Detener tras una pieza incorrecta?
ReferencePushPullFeederConfigurationWizard.lblTemplate.text=Plantilla\:
ReferencePushPullFeederConfigurationWizard.lblUsedAsTemplate.text=¿Usar este como plantilla?
ReferencePushPullFeederConfigurationWizard.lblUsedAsTemplate.toolTipText=<html>Usar este alimentador como plantilla para clonar ajustes a otros alimentadores. <br/>\r\nLas plantillas se emparejan por la especificación de cinta y carrete o por el encapsulado de las piezas <br/>\r\ncargadas en los alimentadores. <br/>\r\nCuando ninguna plantilla coincide formalmente, se toma el alimentador \ncon mayor parecido <br/>\r\n(paso de avance, anchura de cinta, proximidad, etc.).</html>
ReferencePushPullFeederConfigurationWizard.lblVisionType.text=Tipo de visión
ReferencePushPullFeederConfigurationWizard.lblVisionType.toolTipText=<html>\r\n<p>Elija el tipo de visión y después pulse <strong>Restablecer pipeline</strong> para asignar el<br/>\r\npipeline predeterminado de ese tipo. Los agujeros de arrastre se detectan así\:</p>\r\n<ul>\r\n<li><strong>ColorKeyed</strong>\: el fondo bajo los agujeros debe ser de un color vivo<br/>\r\n(verde de forma predeterminada).</li>\r\n<li><strong>CircularSymmetry</strong>\: la forma de los agujeros debe ser circular y su<br/>\r\ninterior y su exterior deben ser lisos.</li>\r\n</ul>\r\n<p>Los dos tipos de pipeline valorarán además los agujeros detectados por tamaño, alineación, paso<br/>\r\ny distancia esperada.</p>\r\n</html>
