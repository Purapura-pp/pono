BoardsPanel.BoardPlacements.Importer.OptionsBox.Question=<Html><body style\='width\: 400'><p>¿Qué quiere hacer?</p><p> </p><p>Elija <b>Combinar</b> para actualizar las colocaciones existentes cuyos ID coincidan con los del conjunto importado, dejar sin cambios las colocaciones existentes cuyos ID no coincidan con ninguno del conjunto importado y añadir las colocaciones importadas cuyos ID no coincidan con ninguna de las existentes.</p><p> </p><p>Elija <b>Reemplazar</b> para eliminar todas las colocaciones existentes y añadir después todas las importadas.</p></html>
