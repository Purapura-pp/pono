HeadSolutions.Issue.CreateNozzles=Crear boquillas para este cabezal.
HeadSolutions.Issue.CreateNozzles.Confirm=<html><p>Aceptar esta solución puede cambiar de raíz la configuración de su máquina.<br/>Ocurrirá lo siguiente\:<p/><ol><li>Se guarda la configuración actual de la máquina (igual que Archivo/Guardar configuración).</li><li>La nueva solución sobrescribe su configuración actual de boquillas y ejes.</li><li>Mientras las boquillas y los ejes mantengan el mismo tipo y número, se conserva su configuración detallada.</li><li>Una solución de boquillas puede aplicarse varias veces; puede volver a ella y ampliarla.</li><li><span color\="red">Precaución\:</span> volver a abrirla no restaurará la configuración anterior, sólo permitirá elegir de nuevo.<br/>Si quiere restaurar la configuración anterior debe restaurar manualmente la configuración guardada.</li></ol><br/>¿Está seguro?</html>
HeadSolutions.Solution.CreateNozzles=Elija el número y el tipo de sus boquillas.
HeadSolutions.Solution.CreateNozzles.Choice.0=<html><h3>Boquilla independiente</h3><p>La boquilla tiene su propio motor de eje Z dedicado</p></html>
HeadSolutions.Solution.CreateNozzles.Choice.1=<html><h3>Par de boquillas, eje Z compartido, negado</h3><p>Un par de boquillas comparte un motor de eje Z. Cuando la primera boquilla sube, la segunda baja lo mismo. Las boquillas están acopladas de forma negativa mediante piñón y cremallera o correa.</p></html>
HeadSolutions.Solution.CreateNozzles.Choice.2=<html><h3>Par de boquillas, eje Z compartido, leva</h3><p>Un par de boquillas comparte un motor de eje Z. Las dos boquillas son empujadas hacia abajo por una leva giratoria y subidas por un resorte.</p></html>
