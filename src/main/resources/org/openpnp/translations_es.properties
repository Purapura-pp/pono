ReferenceCameraCalibrationWizard.CameraCalibrationPanel.DeInterlaceLabel.text=Desentrelazar
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.DeInterlaceLabel.toolTipText=Elimina el entrelazado de los fotogramas apilados
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.DefaultWorkingPlaneZLabel.text=Z del plano de trabajo predeterminado
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.DescriptionLabel.text=<html><p width\="500">Los ajustes de esta pestaña están pensados para sustituir con el tiempo todos los ajustes de unidades por píxel de la pestaña de configuración general, todo lo de la pestaña de calibración de lente y todo lo de la pestaña de transformaciones de imagen. También sustituirán al botón de calibrar la posición y la rotación de la cámara de la pestaña de calibración de puntas de boquilla.</p><p> </p><p width\="500"><b>Requisitos previos\:</b> los ejes X, Y y Z de la máquina, la compensación de backlash y la corrección de la no escuadría deben estar bien calibrados. Además, cualquier problema de falta de repetibilidad mecánica (pasos perdidos, poleas o engranajes flojos, correas que patinan, etcétera) debe resolverse antes de intentar calibrar la cámara. Asimismo, en las cámaras inferiores el eje de rotación y los desplazamientos de la boquilla deben estar bien calibrados y, si se va a usar el referenciado visual, debe estar configurado y funcionando correctamente.</p></html>
