ReferenceNozzleTipToolChangerWizard.ChangerPanel.FirstLocationLabel.text=Primera ubicación
ReferenceNozzleTipToolChangerWizard.ChangerPanel.FirstLocationLabel.toolTipText=<html>Primera ubicación de una secuencia de movimientos de carga de la punta de boquilla.<br/>\nEs el primer punto de paso al cargar la punta de boquilla y el<br/>\núltimo punto de paso al descargarla.\n</html>
ReferenceNozzleTipToolChangerWizard.ChangerPanel.LastLocationLabel.text=Última ubicación
ReferenceNozzleTipToolChangerWizard.ChangerPanel.Post1ActuatorLabel.text=Actuador del poste 1
ReferenceNozzleTipToolChangerWizard.ChangerPanel.Post2ActuatorLabel.text=Actuador del poste 2
ReferenceNozzleTipToolChangerWizard.ChangerPanel.Post3ActuatorLabel.text=Actuador del poste 3
ReferenceNozzleTipToolChangerWizard.ChangerPanel.SecondLocationLabel.text=Segunda ubicación
ReferenceNozzleTipToolChangerWizard.ChangerPanel.SpeedLabel.text=Velocidad
ReferenceNozzleTipToolChangerWizard.ChangerPanel.ThirdLocationLabel.text=Tercera ubicación
ReferenceNozzleTipToolChangerWizard.ChangerPanel.TouchLocationLabel.text=Ubicación de contacto
ReferenceNozzleTipToolChangerWizard.ChangerPanel.ZCalibrateLabel.text=Calibración Z automática
ReferenceNozzleTipToolChangerWizard.ChangerPanel.ZCalibrateLabel.toolTipText=<html>\nCalibrar la Z de la boquilla o de la punta de boquilla palpando contra la superficie de la <strong>ubicación de contacto</strong>.<br/>\nLa calibración de Z se puede lanzar manualmente con el botón <strong>Calibrar ahora</strong> o automáticamente\:<br/>\n<ul>\n<li><strong>Manual\:</strong> no se hace ninguna calibración de Z automática. La calibración manual se guarda<br/>\nde forma permanente en la configuración y sigue siendo válida después de referenciar la máquina.</li>\n<li><strong>MachineHome\:</strong> la calibración de Z automática se realiza al referenciar la máquina.<br/>\nLa calibración de Z de la boquilla se reutiliza cuando se carga otra punta de boquilla.</li>\n<li><strong>NozzleTipChange\:</strong> la calibración de Z automática se hace siempre que se cambia esta punta de boquilla<br/>\no cuando se referencia la máquina y esta punta de boquilla está cargada.</li>\n</ul>\nTenga en cuenta que puede usar una punta de boquilla sustituta llamada "unloaded" para calibrar la Z de la boquilla desnuda. \n</html>
ReferenceNozzleTipToolChangerWizard.CloningSettingsPanel.BehaviorLabel.text=Comportamiento
ReferenceNozzleTipToolChangerWizard.CloningSettingsPanel.BehaviorLabel.toolTipText=<html>\nUna punta de boquilla puede convertirse en la <strong>Template</strong> de la que se clonan las demás.<br/>\nPono trasladará automáticamente las ubicaciones respecto a la primera ubicación.<br/>\nSi alguna punta de boquilla es especial, márquela como <strong>Locked</strong> para evitar la clonación.\n</html>
ReferenceNozzleTipToolChangerWizard.CloningSettingsPanel.Border.title=Ajustes de clonación
ReferenceNozzleTipToolChangerWizard.CloningSettingsPanel.TemplateRadioButton.text=Plantilla
ReferenceNozzleTipToolChangerWizard.CloningSettingsPanel.TemplateRadioButton.toolTipText=Marcar esta punta de boquilla como la plantilla que se puede clonar hacia y desde las demás puntas de boquilla.
ReferenceNozzleTipToolChangerWizard.UnnamedPanel.ClonesFromTemplateRadioButton.text=Clona de la plantilla
ReferenceNozzleTipToolChangerWizard.UnnamedPanel.ClonesFromTemplateRadioButton.toolTipText=Esta punta de boquilla puede clonar sus ajustes de la punta de boquilla marcada como <strong>plantilla</strong>.
ReferenceNozzleTipToolChangerWizard.UnnamedPanel.LocationsLabel.text=¿Ubicaciones?
ReferenceNozzleTipToolChangerWizard.UnnamedPanel.LockedRadioButton.text=Bloqueado
ReferenceNozzleTipToolChangerWizard.UnnamedPanel.LockedRadioButton.toolTipText=<html>Esta punta de boquilla está bloqueada frente a la clonación.<br/>Tenga en cuenta que la Z de su ubicación de contacto todavía se puede calibrar respecto a la referencia de la punta de boquilla de plantilla. </html>
ReferenceNozzleTipToolChangerWizard.UnnamedPanel.VisionCalibrationLabel.text=¿Calibración por visión?
ReferenceNozzleTipToolChangerWizard.UnnamedPanel.ZCalibrationLabel.text=¿Calibración Z?
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.AdjustZLabel.text=Ajustar Z
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.AdjustZLabel.toolTipText=<html>\nAjustar la coordenada Z de la ubicación de visión con este desplazamiento. Póngalo a la distancia en Z entre <br/>\nel objeto de plantilla que está detectando con la calibración por visión, por ejemplo la superficie visible del <br/>\nhueco del cambiador, y la cara inferior (imaginaria) de la punta de boquilla cuando está en esa ubicación. Ajuste <br/>\npositivo cuando la punta de boquilla está por debajo y negativo cuando está por encima de esa superficie.<br/> \nEste ajuste puede corregir errores de escala en la vista de la cámara, sobre todo cuando las cosas están mucho <br/>\nmás cerca de la cámara de lo habitual.<br/>\n<strong>Deben configurarse las unidades por píxel 3D en la cámara.</strong> \n</html>
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.Border.title=Calibración por visión
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.CalibrationTriggerLabel.text=Disparo de la calibración
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.LastScoreLabel.text=Última puntuación
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.MaxPassesLabel.text=Pasadas máx.
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.MinScoreLabel.text=Puntuación mínima
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.MinScoreLabel.toolTipText=<html>\nCuando las imágenes de plantilla se comparan con la imagen de la cámara, se calcula una puntuación<br/>\nque indica la calidad de la coincidencia. Si la puntuación obtenida es menor que la puntuación mínima<br/>\nindicada aquí, la calibración falla. Esto debería impedir que la máquina intente un cambio de punta <br/>\nde boquilla cuando la posición es incorrecta. \n</html>
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.TemplateEmptyLabel.text=Plantilla vacía
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.TemplateHeightLabel.text=Altura de la plantilla
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.TemplateHeightLabel.toolTipText=<html>\nAltura (Y) de la imagen de plantilla. La plantilla se centra en la ubicación de visión seleccionada.<br/>\nElija dimensiones lo más pequeñas posible, pero las plantillas deben incluir bordes horizontales y verticales<br/>\ninequívocos. Además, la punta de boquilla debe verse cuando ocupa el hueco del cambiador.\n</html>
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.TemplateOccupiedLabel.text=Plantilla ocupada
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.TemplateWidthLabel.text=Anchura de la plantilla
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.TemplateWidthLabel.toolTipText=<html>\nAnchura (X) de la imagen de plantilla. La plantilla se centra en la ubicación de visión seleccionada.<br/>\nElija dimensiones lo más pequeñas posible, pero las plantillas deben incluir bordes horizontales y verticales<br/>\ninequívocos. Además, la punta de boquilla debe verse cuando ocupa el hueco del cambiador.\n</html>
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.ToleranceLabel.text=Tolerancia
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.ToleranceLabel.toolTipText=Tolerancia máxima de calibración, es decir, cuánto puede alejarse la ubicación calibrada de la nominal.
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.VisionCalibrationHelpLabel.text=<html>\nCapture dos imágenes de plantilla del hueco de su cambiador de puntas de boquilla,<br/>\nuna con el hueco vacío y otra con el hueco ocupado.<br/>\nCon esas plantillas, la calibración por visión calibrará las<br/>\nubicaciones del cambiador en X e Y y comprobará también que el hueco está vacío<br/>\nu ocupado como se espera.\n</html>
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.VisionLocationLabel.text=Ubicación de visión
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.VisionLocationLabel.toolTipText=<html>Ubicación para la calibración por visión, o None para no calibrar.<br/>\nElija una ubicación donde se vea la punta de boquilla que está en el hueco. \n</html>
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.WantedPrecisionLabel.text=Precisión deseada
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.WantedPrecisionLabel.toolTipText=<html>Si la coincidencia detectada de la imagen de plantilla está más lejos que la <strong>precisión deseada</strong>,<br/>\nla cámara se vuelve a centrar y se hace otra pasada de visión.</html>
ReferenceNozzleToolChangerWizard.ChangerPanel.Border.title=Cambiador de puntas de boquilla
ReferenceNozzleToolChangerWizard.ChangerPanel.ChangeOnManualLabel.text=¿Cambiar en la recogida manual?
