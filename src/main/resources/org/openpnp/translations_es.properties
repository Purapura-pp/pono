ReferenceControllerAxisConfigurationWizard.ControllerSettingsPanel.ResolutionLabel.toolTipText=<html><strong>Resolución</strong> de este eje. Las coordenadas se redondearán al múltiplo más próximo cuando se<br/>\r\ncomparen, es decir, un movimiento sólo se ejecuta si difieren después de redondearlas.<br/>\r\nLo ideal es fijarla a la resolución física de micropaso (o similar) del eje, o a un múltiplo entero  práctico<br/>\r\nde ella. La <strong>resolución</strong> es la inversa de los <strong>pasos / unidad</strong> que suelen configurarse<br/>\r\nen los controladores.<br/>\r\n<br/>\r\nPara el GcodeDriver, asegúrese de que la resolución se puede expresar con el formato del <br/>\r\n<code>MOVE_TO_COMMAND</code>. El valor predeterminado es 0.0001, que corresponde al formato %.4f (cuatro decimales)<br/>\r\ndel <code>MOVE_TO_COMMAND</code>.<br/>\r\n<br/>\r\nTenga en cuenta que la <strong>resolución</strong> se indica en unidades del driver, no del sistema.\r\n</html>
ReferenceControllerAxisConfigurationWizard.ControllerSettingsPanel.Steps.text=Pasos
ReferenceControllerAxisConfigurationWizard.ControllerSettingsPanel.StepsUnitLabel.text=Pasos / unidad
ReferenceControllerAxisConfigurationWizard.ControllerSettingsPanel.StepsUnitLabel.toolTipText=<html>Los <strong>pasos por unidad</strong> son la inversa de la <strong>resolución</strong>.<br/>\r\nSuelen aparecer en la configuración del controlador, así que puede introducirlos aquí para<br/>\r\ncalcular automáticamente la <strong>resolución</strong>.</html>
ReferenceControllerAxisConfigurationWizard.ControllerSettingsPanel.SwitchLinearRotationalLabel.text=¿Cambiar lineal ↔ rotacional?
ReferenceControllerAxisConfigurationWizard.ControllerSettingsPanel.SwitchLinearRotationalLabel.toolTipText=<html>Es importante que Pono sepa si un eje es lineal o rotacional en <br/>\r\nel controlador. <br/>\r\n<br/>\r\nLa mayoría de las veces esto ya lo determina el tipo de eje, es decir, X, Y y Z son lineales <br/>\r\ny Rotation es rotacional. Pero a veces puede quedarse sin ejes adecuados en el <br/>\r\ncontrolador y tener que usar un eje lineal del controlador para un eje rotacional de Pono <br/>\r\no al contrario.<br/>\r\n<br/>\r\nSi no puede configurar su controlador para cambiar ese significado, es importante marcar <br/>\r\nla casilla Switch Linear ↔ Rotational.<br/>\r\n<br/>\r\nEsto es relevante para calcular límites correctos de velocidad de avance, aceleración y jerk en los<br/>\r\nmovimientos de ejes mixtos, ya que sólo se tiene en cuenta el movimiento de los ejes lineales para esos límites en <br/>\r\nel G-Code estándar.<br/>\r\n</html>
ReferenceControllerAxisConfigurationWizard.ControllerSettingsPanel.WrapAroundLabel.text=Ajuste cíclico
ReferenceControllerAxisConfigurationWizard.ControllerSettingsPanel.WrapAroundLabel.toolTipText=<html>Girar siempre el eje por el camino más corto. Por ejemplo, si está a 270° y se le ordena <br/>\r\nir a 0°, irá en su lugar a 360°.<br/>\r\nSi esto se combina con Limit to ±180°, el eje se restablece a su coordenada equivalente <br/>\r\nmediante un comando de desplazamiento global del driver. Con el GcodeDriver debe configurar el<br/> <code>SET_GLOBAL_OFFSETS_COMMAND</code> o esto no funcionará.\r\n</html>
