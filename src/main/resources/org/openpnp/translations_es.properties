ReferenceNozzleTipPartDetectionWizard.PartOffVacuumSensingPanel.EstablishLevelLabel.text=¿Establecer el nivel?
ReferenceNozzleTipPartDetectionWizard.PartOffVacuumSensingPanel.EstablishLevelLabel.toolTipText=<html>Mientras la boquilla está presionada sobre la pieza en la operación de colocación,<br/>\nel nivel de vacío se mide repetidamente hasta que decae al rango de vacío <br/>\no hasta que expira el tiempo de espera de la pausa de colocación, lo que ocurra primero.\n</html>
