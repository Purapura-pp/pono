ReferenceNozzleConfigurationWizard.OffsetsPanel.AlignwithPartLabel.toolTipText=<html>\n<p>Después de la alineación de la pieza por Bottom Vision, hacer que el desplazamiento del modo de rotación de la boquilla<br/>\ncoincida con la rotación de la pieza.</p>\n<br/>\n<p>Así se asegura de que las coordenadas de la boquilla que se indican en la retícula (la cruz),<br/>\nen el DRO, etc., coincidan con la rotación detectada de la pieza.</p>\n<br/>\n<p>Después de colocar o descartar la pieza, la boquilla vuelve a indicar la rotación <br/>\noriginal del eje.</p>\n</html>
