BottomVisionSettingsConfigurationWizard.lblAllowVisionOffsets.text=¿Asimétrico?
BottomVisionSettingsConfigurationWizard.lblAllowVisionOffsets.toolTipText=<html>\r\nHabilítelo si la pieza o el encapsulado es asimétrico por diseño, es decir, si los contactos están desplazados<br/>\r\nrespecto al centro de diseño de la pieza o del encapsulado, que es donde también se recoge la pieza.<br/>\r\nUna vez marcada la pieza o el encapsulado como asimétrico, se pueden introducir o detectar desplazamientos de visión<br/>\r\npara compensarlos en Bottom Vision.<br/>\r\nTenga en cuenta que esto sólo debe usarse para asimetrías <em>de diseño</em>, no para compensar<br/>\r\ndesplazamientos repetibles de error de colocación. Si tiene desplazamientos repetibles de error de colocación,<br/>\r\ncompruebe que el diseño del encapsulado en el E-CAD está bien centrado, repita la calibración de los desplazamientos de la cámara y de la boquilla<br/>\r\ny revise las comprobaciones de fiduciales de la placa.\r\n</html>
