GcodeDriverSettings.SettingsPanel.CommandTimeout.text=Tiempo límite del comando [ms]
GcodeDriverSettings.SettingsPanel.CommandWaitTimeLabel.text=Tiempo de espera del comando $ [ms]
GcodeDriverSettings.SettingsPanel.CommandWaitTimeLabel.toolTipText=<html>\n<p>Cuando un comando empieza por el signo <strong>$ </strong>, añadir este tiempo de espera antes de<br/>\nenviar el comando siguiente. Se sabe que el controlador TinyG necesita esta<br/>\npausa para poder escribir los ajustes en la EEPROM sin interrupciones. </p>\n<br/>\n<p>Nota\: en un GcodeAsyncDriver sin control de flujo por confirmación, <br/>\nesto sólo funciona con seguridad si los comandos $ se envían a un  <br/>\ncontrolador inactivo. Es el caso si los comandos $ se envían como lo primero del <br/>\n<strong>CONNECT_COMMAND</strong>.</p> \n</html>
GcodeDriverSettings.SettingsPanel.CompressGCodeLabel.text=¿Comprimir el G-code?
GcodeDriverSettings.SettingsPanel.CompressGCodeLabel.toolTipText=<html>\r\n<p>Eliminar del G-code los espacios innecesarios y los decimales finales<br/>\r\npara acelerar las transmisiones al controlador.</p>\r\n<p>Nota\: esto sólo funciona con la sintaxis normal de G-code.</p>\r\n<p>Ejemplo\:</p>\r\n<p><code style\="background-color\:\#DDDDDD">G1&nbsp;&nbsp;X100.0000     Y20.1000&nbsp;&nbsp;&nbsp;&nbsp;</code></p>\r\n<p>se comprime en\:</p>\r\n<p><code style\="background-color\:\#DDDDDD">G1X100Y20.1</code></p>\r\n</html>
GcodeDriverSettings.SettingsPanel.ConnectWaitTimeoutLabel.text=Tiempo de espera de la conexión [ms]
