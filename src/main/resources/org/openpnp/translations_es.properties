ReferenceCameraCalibrationWizard.CameraCalibrationPanel.MovableDefaultZTextFiled.toolTipText=<html><p width\="500">Esta es la coordenada Z que se supone para los objetos que ve la cámara si no se conoce su coordenada Z real. Normalmente se fija a la coordenada Z de la superficie de trabajo de las placas que se van a poblar.</p></html>
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.MovablePrimCalZTextField.toolTipText=<html><p width\="500">Esta es la coordenada Z del fiducial de calibración primario.</p></html>
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.MovableSecondaryCalZTextField.toolTipText=<html><p width\="500">Esta es la coordenada Z del fiducial de calibración secundario.</p></html>
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.NotMovableDefaultZTextFiled.toolTipText=<html><p width\="500">Esta es la coordenada Z a la que se bajará la cara inferior de las piezas que lleva la boquilla para la alineación visual.</p></html>
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.NotMovablePrimCalZTextField.toolTipText=<html><p width\="500">Esta es la coordenada Z a la que los objetos quedan mejor enfocados para esta cámara.</p></html>
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.NotMovableSecondaryCalZTextField.toolTipText=<html><p width\="500">Póngala lo más grande (alta) posible respecto a la Z de calibración primaria, pero de modo que la punta de boquilla siga razonablemente enfocada.</p></html>
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.NumberOfRadialLinesTextField.toolTipText=<html><p width\="500">Este es el número deseado de líneas radiales a lo largo de las cuales se recogerán puntos de calibración en cada coordenada Z de calibración. El número real se redondeará al alza al múltiplo de 4 más próximo. Reducir este número acorta el tiempo de recogida de la calibración, pero puede dar una calibración de peor calidad o incluso fallida. Aumentarlo puede dar una calibración de mejor calidad, pero la recogida tardará más.</p></html>
