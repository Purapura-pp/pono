ReferenceNozzleVacuumWizard.ContentPanel.ClosesVacuumActuatorLabel.toolTipText=<html>\r\nAccionar el actuador de soplado también apaga <em>implícitamente</em> el actuador de vacío.<br/>\r\nSi esto está habilitado, se omite el apagado <em>explícito</em> del actuador de vacío.\r\n</html>
