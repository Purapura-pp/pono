ReferenceMachineConfigurationWizard.PanelGeneral.UnsafeZRoamingLabel.toolTipText=<html>Distancia de itinerancia máxima permitida a una Z no segura.<br/><br/>\r\nLos ejes Z virtuales (típicamente en las cámaras) son invisibles, por lo que es fácil pasar por alto<br/>\r\nque está a una Z no segura. Si después pulsa el botón <strong>Mover la herramienta a la ubicación de la cámara</strong><br/>\r\nse producirá un descenso inesperado en Z que podría estrellar la herramienta.<br/>\r\nLa distancia de itinerancia máxima permitida a una Z no segura limita por tanto la zona de movimiento manual<br/>\r\ndentro de la cual se mantiene una Z virtual no segura; debería bastar para ajustar con precisión una ubicación<br/>\r\ncapturada. Si se aleja más, el eje virtual se moverá automáticamente a Safe Z.\r\n</html>
