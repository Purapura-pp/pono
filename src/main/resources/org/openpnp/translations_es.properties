ReferenceCameraCalibrationWizard.CameraCalibrationPanel.RadialLinesPerCalZLabel.text=Líneas radiales por Z de calibración
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.ResidualError.text=Error residual
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.ResidualErrorMapDescriptionLabel.text=<html><p width\="500">Esta gráfica muestra la magnitud del error residual de ubicación en función de la ubicación esperada del píxel en la imagen. Las zonas azul oscuro tienen errores muy bajos, mientras que las zonas rojo oscuro tienen los errores más altos.  Tenga en cuenta que la escala de color siempre se ajusta de modo que el error cero es el azul más oscuro y el error de mayor magnitud es el rojo más oscuro. Por tanto, esta gráfica no sirve para juzgar la magnitud del error, sino sólo su distribución por la imagen. Esa distribución debería parecer más o menos aleatoria, sin patrones apreciables. Si se ven claramente patrones como anillos o franjas y los errores residuales de las otras gráficas son grandes, el modelo matemático de la cámara no se ajusta bien a la física de la cámara y puede indicar que algo va mal en la cámara o en el objetivo.</p></html>
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.ResidualErrorMapLabel.text=Mapa del error residual
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.ResidualErrorXYScatterPlotLabel.text=Diagrama de dispersión X-Y del error residual
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.ResidualErrorsInCollectionOrderLabel.text=Errores residuales en orden de recogida
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.ResidualErrorsLegendDescriptionLabel.text=<html><p width\="500">Esta gráfica muestra el error residual de ubicación (es decir, el error que queda después de aplicar la calibración) de cada punto de calibración en el orden en que se recogió. Los errores residuales deberían tener media cero y parecer ruido aleatorio. Si hay escalones significativos en el nivel medio o tendencias en los errores, según su magnitud puede haber un problema con la calibración. Algunas causas posibles son\: movimiento o deslizamiento del útil de calibración durante la recogida, movimiento de la cámara o del objetivo en su soporte, pasos perdidos de los motores, deslizamiento de correas o engranajes, expansión o contracción térmica, etcétera.</p>%s</html>
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.ResidualErrorsXYDescriptionLabel.text=<html><p width\="500">Esta gráfica muestra el error residual de ubicación de cada punto recogido durante el proceso de calibración. El círculo verde marca el límite aproximado a partir del cual los puntos se consideran atípicos y no se usan para determinar los parámetros de calibración de la cámara. Los errores residuales deberían formar un único grupo circular centrado en (0, 0) y parecer distribuidos al azar. Si hay dos o más grupos distintos, o si el grupo es claramente no circular, según la magnitud de los errores puede haber un problema con la calibración. Algunas causas posibles son\: mala detección por visión del fiducial de calibración, movimiento o deslizamiento del útil de calibración durante la recogida, movimiento de la cámara o del objetivo en su soporte, backlash compensado por defecto o por exceso, pasos perdidos de los motores, deslizamiento de correas o engranajes, etcétera.</p></html>
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.RmsErrorTextField.toolTipText=<html><p width\="500">Esta es una estimación de la exactitud de las ubicaciones de objetos medidas a la Z predeterminada que se puede obtener con esta cámara. Para un gran número de mediciones realizadas en ubicaciones aleatorias de la imagen, cabe esperar que el 63% de las ubicaciones medidas queden dentro de esta distancia de su ubicación real y el 98% dentro del doble de esta distancia. Vea las gráficas de abajo para más detalles.</p></html>
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.SecondaryCalibrationZLabel.text=Z de calibración secundaria
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.SelectedCalZForPlottingLabel.text=Z de calibración seleccionada para el gráfico
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.SetZeroForNoCropped1Label.text=(Ponga cero para no recortar)
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.SetZeroForNoCropped2Label.text=(Ponga cero para no recortar)
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.ShowOutliersChkBox.text=Mostrar los valores atípicos
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.ShowValidPixelsLabel.text=Mostrar todos los píxeles válidos
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.SliderLabel.text=<html><p width\="500">El deslizador de abajo controla cómo se tratan los bordes de la imagen. Un valor de 0 recorta todos los píxeles no válidos del borde de la imagen, con el riesgo de perder algunos píxeles válidos del borde. Un valor de 100 obliga a que todos los píxeles válidos sean visibles en la imagen, con el riesgo de que se vean algunos píxeles no válidos (normalmente negros) alrededor de los bordes. Para el mejor procesamiento de visión artificial se recomienda recortar todos los píxeles no válidos (deslizador a cero) una vez terminada la calibración.</p></html>
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.StartCameraCalibrationButton.text=Iniciar la calibración
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.UnitsPerPixelLabel.text=Unidades por píxel
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.UnitsPerPixelTextField.toolTipText=<html><p width\="500">Estas son las unidades por píxel calculadas a la Z predeterminada de esta cámara. Tenga en cuenta que las unidades por píxel son las mismas en las direcciones X e Y.</p></html>
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.UseSavedDateChkBox.text=Omitir la nueva captura y reprocesar la captura anterior
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.UseSavedDateChkBox.toolTipText=Marque esto para omitir la recogida de datos de calibración nuevos y sólo reprocesar los datos de calibración recogidos anteriormente; sólo es útil para depurar el código
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.WidthLabel.text=Anchura
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.XAxisLabel.text=Eje X
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.XRotationErrorTextField.toolTipText=<html><p width\="500">Error estimado de montaje de la cámara según la regla de la mano derecha alrededor del eje X de la máquina. Si la cruz de la retícula de la cámara aparece demasiado desplazada (arriba o abajo) respecto al centro de la imagen, corrija ese error de montaje físico y vuelva a calibrar la cámara. Tenga en cuenta que este error no afecta a la exactitud de la máquina, sólo reduce el tamaño máximo de los objetos que pueden centrarse en la cruz de la retícula y seguir siendo totalmente visibles en la imagen.</p></html>
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.YAxisLabel.text=Eje Y
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.YRotationErrorTextField.toolTipText=<html><p width\="500">Error estimado de montaje de la cámara según la regla de la mano derecha alrededor del eje Y de la máquina. Si la cruz de la retícula de la cámara aparece demasiado desplazada (a la izquierda o a la derecha) respecto al centro de la imagen, corrija ese error de montaje físico y vuelva a calibrar la cámara. Tenga en cuenta que este error no afecta a la exactitud de la máquina, sólo reduce el tamaño máximo de los objetos que pueden centrarse en la cruz de la retícula y seguir siendo totalmente visibles en la imagen.</p></html>
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.ZAxisLabel.text=Eje Z
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.ZRotationErrorTextField.toolTipText=<html><p width\="500">Error estimado de montaje de la cámara según la regla de la mano derecha alrededor del eje Z de la máquina. Si la imagen de la cámara aparece demasiado girada, corrija ese error de montaje físico y vuelva a calibrar la cámara. Tenga en cuenta que este error no afecta a la exactitud de la máquina, es principalmente estético.</p></html>
