Solutions.Issue.CompleteMilestone.Choice.0=<html><h3>Continuar a %s</h3><p>Confirme que ha completado y probado el hito <strong>%s</strong>\:</p><br/><blockquote>%s</blockquote><br/><p>Nota\: todos los problemas de este hito deberían resolverse o descartarse antes de continuar.</p><br/><p>¿Sí? <em>¡Enhorabuena\!</em></p><br/><p>Puede continuar al hito siguiente <strong>%s</strong>\:</p><br/><blockquote>%s</blockquote><br/><p>Se presentarán más problemas y soluciones que habrá que atender para llegar al hito siguiente.</p></html>
Solutions.Issue.CompleteMilestone.Choice.1=<html><h3>Volver a %s</h3><p>Para limitar el alcance de «Problemas y soluciones», puede volver al hito anterior <strong>%s</strong>\:</p><br/><blockquote>%s</blockquote><br/><p>Nota\: la mayoría de los problemas y soluciones de los hitos anteriores se informan también en los hitos posteriores. Pero en los hitos objetivo más tempranos algunas soluciones propuestas son más sencillas y conservadoras. Para diagnosticar problemas puede resultar útil, por tanto, volver atrás e intentar que funcione allí.</p></html>
Solutions.Issue.CompleteMilestone.Confirm=<html><p>Todavía hay problemas abiertos del hito <strong>%s</strong>\:</p> %s <p color\="red">No se recomienda pasar al siguiente hito objetivo antes de resolverlos o descartarlos.</p><p><br/>¿Seguro que quiere continuar de todos modos?</p></html>
