BambooFeederAutoVisionConfigurationWizard.lblVisionType.text=Tipo de visión
BambooFeederAutoVisionConfigurationWizard.lblVisionType.toolTipText=<html>\r\n<p>Elija el tipo de visión y después pulse <strong>Restablecer el pipeline</strong> para asignar el<br/>\r\npipeline predeterminado de ese tipo. Los agujeros de arrastre se detectan así\:</p>\r\n<ul>\r\n<li><strong>ColorKeyed</strong>\: el fondo bajo los agujeros debe tener un color vivo<br/>\r\n(verde por omisión).</li>\r\n<li><strong>CircularSymmetry</strong>\: la forma de los agujeros debe ser circular y su<br/>\r\ninterior y exterior deben ser lisos.</li>\r\n</ul>\r\n<p>Los dos tipos de pipeline evalúan además los agujeros detectados por tamaño, alineación, paso<br/>\r\ny distancia esperada.</p>\r\n</html>
