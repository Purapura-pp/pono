ReferenceNozzleTipPartDetectionWizard.PartOffVacuumSensingPanel.LastReadingLabel.text=Última lectura
ReferenceNozzleTipPartDetectionWizard.PartOffVacuumSensingPanel.LegendPartOnLabel.text=<html>\n<p style\="text-align\:right">Vacío <span style\="color\:\#FF0000">&mdash;&mdash;</span></p>\n<p/>\n<p style\="text-align\:right">Válvula <span style\="color\:\#005BD9">&mdash;&mdash;</span></p>\n</html>
