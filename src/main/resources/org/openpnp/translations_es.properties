ReferenceNozzleTipPartDetectionWizard.PartOffVacuumSensingPanel.ValveOpenCloseLabel.toolTipText=<html>\n<p>La válvula se abre y se cierra para crear un pequeño pulso de depresión. </p>\n<p>El tiempo de apertura debería ser bastante corto; no tiene sentido crear toda la succión de recogida.</p>\n<p>El tiempo de cierre puede usarse para esperar a que el sistema reaccione al pulso,<br/>\nincluidos los retardos de propagación y de lectura de la señal del sensor.</p>\n</html>
