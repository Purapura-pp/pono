ReferenceNozzleTipCalibrationWizard.BackgroundCalibrationPanel.MinDetailSizeLabel.toolTipText=<html>\n<p>Indique el tamaño de los detalles más pequeños de la imagen que se consideran<br/>\nparte significativa de la forma que se debe detectar, como los contactos más pequeños, etc.<br/>\nLas motas y artefactos menores, como el ruido de la imagen, las texturas, las marcas o la suciedad de<br/>\nlos objetos, se consideran irrelevantes para el procesamiento de imagen, lo que significa que<br/>\nse pueden aplicar filtros para suprimirlos en la imagen. </p> \n<p><strong>Nota\:</strong> el <strong>tamaño mínimo del detalle</strong> también puede\nafectar al coste de cálculo de algunos<br/>\npipelines o etapas. Los detalles pequeños suponen un coste de cálculo alto.</p>\n</html>
