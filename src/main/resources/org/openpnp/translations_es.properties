ReferenceNozzleTipPartDetectionWizard.PartOnVacuumSensingPanel.EstablishLevelLabel.toolTipText=<html>Mientras la boquilla está presionada sobre la pieza en la operación de recogida,<br/>\nel nivel de vacío se mide repetidamente hasta que alcanza el rango de vacío <br/>\no hasta que expira el tiempo de espera de la pausa de recogida, lo que ocurra primero.\n</html>
