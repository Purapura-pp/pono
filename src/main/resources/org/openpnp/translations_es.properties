ReferenceNozzleTipConfigurationWizard.PushAndDragPanel.PushAndDragAllowedLabel.text=¿Se permite empujar y arrastrar?
ReferenceNozzleTipConfigurationWizard.PushAndDragPanel.PushAndDragAllowedLabel.toolTipText=<html>\n<p>\nDetermina si se permite usar la punta de boquilla <br/>\npara empujar y arrastrar. \n</p><p>\nSólo debería habilitarse en las puntas de boquilla <br/>\nlo bastante robustas para soportar las fuerzas laterales, incluido <br/>\nalgún enganche ocasional. </p>\n</html>
