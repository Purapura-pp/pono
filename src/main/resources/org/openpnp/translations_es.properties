ReferenceHeadConfigurationWizard.LocationsPanel.WarningChangingLabel.text=<html><p>\n<strong>Aviso importante</strong>\: el fiducial de referenciado debería montarse \ny configurarse al principio del proceso de construcción, antes de empezar a capturar un gran número de\nubicaciones para la configuración de la máquina (cambiador de puntas de boquilla, alimentadores, etc.) \n</p>\n<p style\="color\:red">Cada vez que se cambien los ajustes anteriores o se mueva físicamente el fiducial, todas las ubicaciones ya capturadas en la configuración de la máquina quedarán inservibles. </p></html>
