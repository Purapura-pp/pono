ReferenceCameraPositionConfigurationWizard.LocationPanel.RoamingRadiusLabel.toolTipText=<html>\r\n<p>Radio de itinerancia <em>nominal</em> máximo sobre la cámara,<br/>\r\nque indica también la mayor diagonal de pieza que se puede<br/>\r\nadmitir.</p>\r\n<br/>\r\n<p>Si se pone a cero, se desactiva la visión de varias tomas<br/> \r\n(vea <strong>Vision Compositing</strong> del encapsulado).</p> \r\n<br/>\r\n<p>Durante Bottom Vision, el movimiento de la boquilla estará <br/>\r\nrestringido, teniendo en cuenta lo siguiente\:</p>\r\n<ul>\r\n<li>La distancia de la boquilla al centro de la <br/>\r\ncámara.</li>\r\n<li>Cuánto sobresale desde ahí la huella de la pieza <br/>\r\n(aproximada por una envolvente octogonal).</li>\r\n</ul>\r\n<p>Dentro del radio de itinerancia, la boquilla también se <br/>\r\nmoverá libremente a la Z de la cámara, es decir, sin pasar por Safe Z.</p> \r\n<p>Tenga en cuenta que este es el radio <em>nominal</em>, es decir, debe<br/>\r\nquedar espacio adicional para los desplazamientos de recogida y otras <br/>\r\ndesviaciones.</p>\r\n<br/>\r\n<p><strong color\="red">Precaución\:</strong> el radio de itinerancia no se aplica \r\nal mover manualmente.</p>\r\n</html>
