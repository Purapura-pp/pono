BoardsPanel.BoardPlacements.Placements.Rank.toolTip=<html><body style\='width\: 400'>El <strong>rango</strong> controla el orden en que se manejan las colocaciones durante una tarea. Las colocaciones se realizan de rango bajo a rango alto. Hay un <strong>orden estricto</strong> cuando la diferencia entre rangos es de 10 o más. Todas las colocaciones del rango R deben estar terminadas y correctas antes de que se considere el rango R+10. <strong>No hay ningún requisito de orden</strong> cuando la diferencia entre rangos es menor que 10. Las colocaciones del rango R pueden realizarse en cualquier punto entre R-9 y R+9 según las demás prioridades de optimización de la tarea.</body></html>
