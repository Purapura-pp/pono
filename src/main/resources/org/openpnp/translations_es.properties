ReferenceNozzleTipToolChangerWizard.Action.CloneFromNozzleTip=Clonar los ajustes del cambiador de herramienta desde la plantilla
ReferenceNozzleTipToolChangerWizard.Action.CloneFromNozzleTip.Description=<html>Clonar los ajustes del cambiador de herramienta desde la punta de boquilla marcada como <strong>Template</strong>.<br/>Todas las ubicaciones se trasladan respecto a la primera ubicación.</html>
ReferenceNozzleTipToolChangerWizard.Action.CloneToAllNozzleTip=Clonar los ajustes del cambiador de herramienta a todas las puntas de boquilla
ReferenceNozzleTipToolChangerWizard.Action.CloneToAllNozzleTip.Description=<html>Clonar los ajustes del cambiador de herramienta desde esta punta de boquilla <strong>Template</strong><br/>a todas las demás. Las ubicaciones se trasladan respecto a las primeras ubicaciones.</html>
ReferenceNozzleTipToolChangerWizard.Action.ReferenceZ=Calibrar la Z de todas las ubicaciones de contacto según la plantilla
ReferenceNozzleTipToolChangerWizard.Action.ReferenceZ.Description=<html>Calibrar la Z de la ubicación de contacto de todas las puntas de boquilla respecto a la referencia <strong>Template</strong>.<br/>Esto cargará la punta de boquilla de plantilla en la boquilla de palpado predeterminada, recalibrará<br/>la Z de la ubicación de contacto de la plantilla y después palpará y referenciará todas las demás respecto a ella.<br/>Tenga en cuenta que, a diferencia de la clonación, esto sí incluye las puntas de boquilla marcadas como <strong>Locked</strong>.</html>
ReferenceNozzleTipToolChangerWizard.Action.Reset=Restablecer
ReferenceNozzleTipToolChangerWizard.Action.Reset.Description=<html>Restablecer la calibración de Z.</html>
ReferenceNozzleTipToolChangerWizard.Action.ResetCaptureTemplateImageOccupied=Restablecer
ReferenceNozzleTipToolChangerWizard.Action.ResetCaptureTemplateImageOccupied.Description=<html>Restablecer la imagen de plantilla del hueco ocupado del portapuntas de boquilla.</html>
