ReferenceStripFeederConfigurationWizard.PanelVision.lblParallaxDiameter.text=Diámetro de paralaje
ReferenceStripFeederConfigurationWizard.PanelVision.lblParallaxDiameter.toolTipText=<html>\n<p>\nCuando se indica el <strong>diámetro de paralaje</strong>, la visión del agujero de arrastre realizará su detección desde un<br/>\npunto de vista de paralaje de la cámara situado a un lado de la ubicación esperada del agujero de arrastre. La distancia<br/> de la cámara al agujero es la mitad del diámetro de paralaje.</p>\n<p>\nLa aplicación típica es con cinta transparente, difícil de ver con visión directa, pero cuya<br>\nsuperficie reflectante reflejará el difusor brillante de la luz de la cámara.</p>\n</html>
