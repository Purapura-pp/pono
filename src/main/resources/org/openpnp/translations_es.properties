ReferenceCameraCalibrationWizard.CameraCalibrationPanel.CautionLabel.text=<html><p width\="500" style\="color\:Black;background-color\:Yellow;">Precaución\: durante la secuencia de calibración, la punta de boquilla bajará a estas coordenadas Z y se moverá por <b>todo el campo de visión</b> de la cámara. Asegúrese de que hay espacio libre suficiente respecto a cualquier obstáculo cercano a la cámara antes de iniciar la calibración, o podría dañar la máquina.</p></html>
ReferenceCameraCalibrationWizard.CameraCalibrationPanel.CollectionSequenceNumberLabel.text=Número de secuencia de la recogida de datos
