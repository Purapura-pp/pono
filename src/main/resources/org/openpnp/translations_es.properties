PackageCompositingWizard.AllowInsideCornerLabel.text=¿Permitir esquina interior?
PackageCompositingWizard.AllowInsideCornerLabel.toolTipText=<html>\n<p>Permite incluir esquinas orientadas hacia dentro, hacia el centro de la pieza. <br/>\nSe puede usar para alinear piezas que aún son demasiado grandes, es decir, cuando el <strong>Roaming Radius</strong><br/>\nde la cámara es demasiado pequeño. Normalmente requiere pads grandes y bien separados.</p>\n<br/>\n<p>Ejemplo\: rectificadores de potencia SMD.</p>\n</html>
PackageCompositingWizard.Border.title=Composición
PackageCompositingWizard.ComputeCompositing.Name=Calcular
PackageCompositingWizard.ComputeCompositing.ShortDescription=Recalcular la composición de visión.
PackageCompositingWizard.Error.text=Error\: 
PackageCompositingWizard.ExtraShotsLabel.text=Tomas adicionales
PackageCompositingWizard.ExtraShotsLabel.toolTipText=<html>\n<p>La composición de visión determina el conjunto mínimo óptimo de tomas necesarias para determinar<br/>\nla posición y el ángulo de la pieza. Además, sugiere tomas adicionales que se pueden usar para <br/>\nmejorar la exactitud de posición y de ángulo. </p>\n<br/>\n<p>Ejemplo\: una pieza cuadrada se puede determinar con dos tomas de esquinas diagonales. Las dos esquinas<br/>\nopuestas del cuadrado se proponen como tomas adicionales.</p>\n<br/>\n<p><strong>Tomas adicionales</strong> indica cuántas de esas tomas adicionales deben usarse. \n</html>
PackageCompositingWizard.MaxPickToleranceLabel.text=Tolerancia de recogida máx.
PackageCompositingWizard.MaxPickToleranceLabel.toolTipText=<html>\n<p>Si es cero, se toma la <strong>tolerancia máxima de recogida</strong> de la punta de boquilla.</p>\n<br/>\n<p>Si no es cero, esta <strong>tolerancia máxima de recogida</strong> la sustituye para este encapsulado.</p>\n<br/>\n<p>En ambos casos, la <strong>tolerancia máxima de recogida</strong> debe cubrir los desplazamientos <br/>\nlineales de la pieza recogida en la boquilla y los desplazamientos de las esquinas <br/>\nprovocados por desplazamientos de rotación, así como las combinaciones de ambos.</p>\n</html>
PackageCompositingWizard.MethodLabel.text=Método
PackageCompositingWizard.MethodLabel.toolTipText=<html>\n<p>Método de composición\:</p>\n<ul>\n<li><strong>None\:</strong> no se realiza ninguna composición.</li>\n<li><strong>Restricted\:</strong> la composición sólo se realiza cuando el <br/>\ntamaño de la huella es demasiado grande o cuando es asimétrica.</li>\n<li><strong>Automatic\:</strong> la composición se realiza siempre. Aun así puede <br/>\ndar como resultado una solución de una sola toma si todas las esquinas son convexas <br/>\ny simétricas.</li>\n<li><strong>SingleCorner\:</strong> la composición se realiza siempre. Cada <br/>\nesquina se toma por separado. Reduce los errores de paralaje, porque <br/>\ncada esquina queda centrada en la cámara.</li>\n</ul>\n</html>\n\n
PackageCompositingWizard.MinAngleLeverageLabel.text=Palanca angular mín.
PackageCompositingWizard.MinAngleLeverageLabel.toolTipText=<html>\n<p>Palanca mínima necesaria para deducir información angular a partir de dos esquinas.</p>\n<br/>\n<p>La <strong>palanca angular mínima</strong> se indica de forma <em>relativa</em> a la anchura y la altura de la huella<br/>\n(la menor de las dos).</p>\n<br/>\n<p>Ejemplo\: poner 0,5 exige que dos esquinas abarquen al menos la mitad de la dimensión de la pieza<br/>\npara aportar información angular.</p>\n</html>
