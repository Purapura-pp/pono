ReferenceNozzleTipCalibrationWizard.CalibrationPanel.CalibrationZOffsetLabel.toolTipText=<html>\n<p>\nCuando la característica de la boquilla que detecta la visión está más arriba en la punta de boquilla <br />\nse recomienda desplazar el plano de enfoque con el "Z Offset".\n</p>\n<p>Si una punta de boquilla se llama "unloaded", se usa como sustituta para calibrar<br />\nel portapuntas desnudo. De nuevo, el "Z Offset" se puede usar para calibrar en el <br />\nplano focal adecuado. \n</p>\n</html>
