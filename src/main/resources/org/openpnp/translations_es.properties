ReferenceHeadConfigurationWizard.PumpPanel.VacuumPumpControlLabel.text=Control de la bomba
ReferenceHeadConfigurationWizard.PumpPanel.VacuumPumpControlLabel.toolTipText=<html>\r\n<p>Determina cómo se controla el estado de encendido y apagado de la bomba\:</p>\r\n<ul>\r\n<li><strong>None</strong>\: la bomba se controla manualmente o fuera de Pono.<br/>\r\nÚselo, por ejemplo, para un control por histéresis del lado del controlador.</li>\r\n<li><strong>PartOn</strong>\: la bomba se enciende cuando se va a recoger una <br/>\r\npieza y se apaga cuando no hay ninguna pieza en ninguna boquilla.</li>\r\n<li><strong>TaskDuration</strong>\: la bomba se enciende cuando se va<br/>\r\na recoger una pieza y sólo se apaga cuando terminan las tareas en cola (por ejemplo, <br/>\r\nla tarea en ejecución), siempre que no haya ninguna pieza en ninguna boquilla.</li>\r\n<li><strong>KeepRunning</strong>\: la bomba se enciende cuando se va<br/>\r\na recoger una pieza y sigue funcionando hasta que se apaga explícitamente <br/>\r\no hasta que se deshabilita la máquina.</li>\r\n</ul>\r\n</html>
