ReferencePnpJobProcessorConfigurationWizard.lblOptimizeMultipleNozzles.toolTipText=Optimizar la trayectoria de los pasos de recogida, alineación y colocación en las máquinas de varias boquillas cambiando el orden en que se manejan las boquillas.
ReferencePnpJobProcessorConfigurationWizard.lblPreRotateAllNozzles.text=Pre-rotar todas las boquillas
ReferencePnpJobProcessorConfigurationWizard.lblPreRotateAllNozzles.toolTipText=<html>Pregirar todas las boquillas durante el movimiento hacia la primera ubicación de avance o de recogida, la cámara inferior y la primera ubicación de colocación.<br/>Suponiendo que esos movimientos tarden más que mover la siguiente boquilla a su ubicación de recogida, a la cámara inferior<br/>o a la ubicación de colocación, esto puede aumentar el rendimiento y reducirá el riesgo de que las piezas resbalen en sus puntas de boquilla.</html>
ReferencePnpJobProcessorConfigurationWizard.lblStepsMotion.text=Avanzar al siguiente movimiento
ReferencePnpJobProcessorConfigurationWizard.lblStepsMotion.toolTipText=La ejecución paso a paso sólo se detendrá en el siguiente paso que tenga movimiento
