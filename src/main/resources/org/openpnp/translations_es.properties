ReferencePushPullFeederConfigurationWizard.lblDiscoverOnJobStart.toolTipText=<html>Al iniciar la tarea, comprobar que en los alimentadores con OCR habilitado están seleccionadas las piezas correctas en sus ubicaciones. <br/>\r\nEn caso contrario, la tarea se detiene.<br/>\r\nEsto también calibrará por visión las ubicaciones de los alimentadores, si la calibración está habilitada.</html>
