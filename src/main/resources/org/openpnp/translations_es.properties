ReferenceNozzleTipConfigurationWizard.PartDimensionsPanel.MaxPartDiameterLabel.toolTipText=<html>\nDiámetro o diagonal máximo de las piezas recogidas con esta punta de boquilla, <br/>\nincluidas las tolerancias.\n</html>\n
ReferenceNozzleTipConfigurationWizard.PartDimensionsPanel.MaxPartHeightLabel.text=Altura máx. de la pieza
ReferenceNozzleTipConfigurationWizard.PartDimensionsPanel.MaxPartHeightLabel.toolTipText=Altura máxima de las piezas que se recogen con esta punta de boquilla. Se usa para el Safe Z dinámico cuando no se conoce la altura de la pieza.
ReferenceNozzleTipConfigurationWizard.PartDimensionsPanel.MaxPickToleranceLabel.text=Tolerancia de recogida máx.
ReferenceNozzleTipConfigurationWizard.PartDimensionsPanel.MaxPickToleranceLabel.toolTipText=<html>\nTolerancia de recogida máxima admitida con esta punta de boquilla.<br/>\nDetermina cuánto puede alejarse de la ubicación nominal una posición de alineación <br/>\ndetectada por Bottom Vision para que se acepte. También reduce el <br/>\ntiempo de cálculo de algunas operaciones de visión al limitar el rango de búsqueda.\n</html>\n\n
ReferenceNozzleTipConfigurationWizard.PartDimensionsPanel.MinPartDiameterLabel.text=Diámetro mín. de la pieza
ReferenceNozzleTipConfigurationWizard.PartDimensionsPanel.MinPartDiameterLabel.toolTipText=<html>\nDiámetro mínimo de pieza que se puede recoger con esta punta de boquilla.<br/>\nTenga en cuenta que el <strong>diámetro mínimo de pieza</strong> menos dos veces la <strong>tolerancia de recogida</strong><br/>\ndetermina el diámetro <em>interior</em> mínimo de la punta de boquilla que<br/>\nsiempre se considera cubierto por la pieza. Ese diámetro interior se ignora<br/>\nen el análisis del color clave y en los diagnósticos de la calibración del fondo.\n</html>
