ReferencePushPullFeederConfigurationWizard.lblFeedCount.toolTipText=Número total de avances del alimentador.
ReferencePushPullFeederConfigurationWizard.lblFeedPitch.text=Paso de avance
ReferencePushPullFeederConfigurationWizard.lblFeedPitch.toolTipText=Cuánto avanza la cinta con un accionamiento de la palanca (normalmente múltiplos de 4 mm)
