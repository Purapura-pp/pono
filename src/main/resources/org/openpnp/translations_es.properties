GcodeDriverSettings.SettingsPanel.BackslashEscapedCharactersLabel.toolTipText=Permite insertar caracteres unicode en las cadenas de Gcode como \\uxxxx, donde xxxx son cuatro caracteres hexadecimales.  También admite \\t para tabulador, \\b para retroceso, \\n para avance de línea, \\r para retorno de carro y \\f para salto de página.
