ReferenceAdvancedMotionPlannerConfigurationWizard.MotionPlannerPanel.AllowContinousMotionLabel.text=¿Permitir movimiento continuo?
ReferenceAdvancedMotionPlannerConfigurationWizard.MotionPlannerPanel.AllowContinousMotionLabel.toolTipText=<html>\r\n<p>A menudo Pono ordena a los controladores ejecutar movimientos formados por varios<br/>\r\nsegmentos. Piense, por ejemplo, en un movimiento a Safe Z, seguido de un movimiento sobre la ubicación <br/>\r\nde destino, seguido de un movimiento para bajar la boquilla y recoger o colocar una pieza. </p> \r\n<p>Si el planificador de movimiento y el controlador reciben estos comandos como una sola<br/>\r\nsecuencia, pueden aplicarles ciertas optimizaciones. Además, no se introducen retardos<br/>\r\nde comunicación de ida y vuelta. Es más, la planificación puede seguir <br/>\r\nen paralelo mientras el controlador aún ejecuta los últimos comandos.</p>\r\n<p>Al permitir el movimiento continuo habilita estas optimizaciones. Sin embargo, la <br/>\r\nconfiguración de la máquina, es decir el Gcode, los scripts personalizados, etc., debe hacerse sabiendo que el <br/>\r\nplanificador ya no espera cada vez a que el movimiento termine, salvo que se le indique explícitamente. </p>\r\n</html>
ReferenceAdvancedMotionPlannerConfigurationWizard.MotionPlannerPanel.AllowUncoordinatedLabel.text=¿Permitir movimiento no coordinado?
ReferenceAdvancedMotionPlannerConfigurationWizard.MotionPlannerPanel.AllowUncoordinatedLabel.toolTipText=<html>\r\nPermitir el movimiento no coordinado habilita al planificador para usar funciones avanzadas<br/>\r\ncomo el sobrepaso, la fusión de movimientos, etc. Esto exige un driver que admita<br/>\r\ncontrol de movimiento de tercer orden, simulado o real (con esas funciones en el controlador).\r\n</html>
ReferenceAdvancedMotionPlannerConfigurationWizard.MotionPlannerPanel.Border.title=Planificador de movimiento
ReferenceAdvancedMotionPlannerConfigurationWizard.MotionPlannerPanel.FuseBacklashFinalApproachLabel.text=¿Fusionar la aproximación de holgura?
ReferenceAdvancedMotionPlannerConfigurationWizard.MotionPlannerPanel.FuseBacklashFinalApproachLabel.toolTipText=<html>\r\n<p>La compensación de holgura en dos partes - posicionamiento unilateral o aproximación<br/>\r\nlenta - pasa de largo el objetivo y luego se acerca a él en un segundo movimiento<br/>\r\naparte. Ese segundo movimiento cuesta una parada y una línea de G-code cada vez.</p>\r\n<p>Con esta opción activada, el planificador fusiona esa aproximación con el movimiento<br/>\r\nsiguiente, siempre que este no mueva los ejes compensados - normalmente el descenso de<br/>\r\nZ sobre un componente. El eje sigue llegando por el mismo lado, y con más suavidad que<br/>\r\nantes, porque ahora recorre su fracción de milímetro durante todo el descenso.</p>\r\n<p>Requiere que el movimiento continuo esté permitido, ya que sin él no hay nada con lo<br/>\r\nque fusionar. El movimiento fusionado arrastra el recorrido de compensación durante el<br/>\r\ndescenso, así que desactívelo si una boquilla debe descender a un hueco del cambiador o<br/>\r\na otro lugar demasiado estrecho para el desplazamiento lateral de la holgura.</p>\r\n</html>
ReferenceAdvancedMotionPlannerConfigurationWizard.MotionPlannerPanel.InterpolationRetimingLabel.text=¿Recalcular los tiempos de interpolación?
ReferenceAdvancedMotionPlannerConfigurationWizard.MotionPlannerPanel.InterpolationRetimingLabel.toolTipText=<html>\r\nLa interpolación sólo puede aproximar los perfiles reales de movimiento de tercer orden,<br/>\r\npor lo que son de esperar algunas desviaciones. El recálculo de tiempos estirará el movimiento<br/>\r\npara ajustarlo a la temporización original de tercer orden. Sin embargo, esto reducirá ligeramente<br/>\r\nla velocidad de avance máxima. Si lo desactiva, obtiene la velocidad de avance máxima planificada pero una duración<br/>\r\ndel movimiento algo más corta.\r\n</html>
ReferenceAdvancedMotionPlannerConfigurationWizard.MotionPlannerPanel.MinimumSpeedLabel.text=Velocidad mínima
ReferenceAdvancedMotionPlannerConfigurationWizard.MotionPlannerPanel.MinimumSpeedLabel.toolTipText=<html>\r\n<p>\r\nVelocidad mínima admitida por el planificador de movimiento.\r\n</p><p>\r\nUnas velocidades mínimas excesivamente bajas obligan a una precisión excesiva en las<br/>\r\nvelocidades de avance y en las tasas de aceleración (y de jerk). Manteniendo las velocidades mínimas por encima<br/>\r\nde valores razonables (por ejemplo, 5%), algunos cálculos (como la interpolación) se pueden<br/>\r\noptimizar.<br/>\r\n</p><p>\r\nEn los drivers que se comunican por protocolo de texto (GcodeDriver) hacen falta menos<br/>\r\ndecimales, lo que reduce la latencia de los comandos.<br/>\r\n</p>\r\n</html>
