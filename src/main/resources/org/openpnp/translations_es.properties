BlindsFeederArrayConfigurationWizard.lblOcrFontName.toolTipText=<html>Nombre de la fuente de OCR que se debe reconocer, o [Barcode].<br/>\r\nLas fuentes monoespaciadas funcionan mucho mejor, permiten menor resolución y por tanto un <br/>\r\nfuncionamiento más rápido. Use una fuente en la que todos los caracteres usados se distingan con facilidad.<br/>\r\nSon muy preferibles las fuentes con una separación clara entre glifos.</html>
