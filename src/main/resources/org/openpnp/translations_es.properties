BambooFeederAutoVisionConfigurationWizard.textFieldRotationInTape.toolTipText=<html>\n<p>El ajuste <strong>Rotación en la cinta</strong> debe interpretarse respecto a la orientación de la cinta, <br/>\nindependientemente de cómo esté orientado el alimentador o la cinta en la máquina. </p>\n<ol>\n<li>\n<p>Fíjese en la orientación vertical <strong>neutra</strong> del encapsulado o la huella de la pieza <br/>\ntal como está dibujada en su <strong>biblioteca</strong> de E-CAD.</p>\n</li>\n<li>\n<p>Observe cómo están orientados el pin 1, la polaridad, el cátodo, etc.  <br/>\nEse es su 0° para la pieza.</p>\n</li>\n<li>\n<p>Mire la cinta con los agujeros de arrastre arriba. <br/>\nEsa es su orientación 0° de la cinta (según la norma industrial EIA-481).</p>\n</li>\n<li>\n<p>Determine cuánto está girada la pieza dentro de la cavidad de la cinta, <em>en relación</em> con  <br/>\nsu orientación vertical del punto (1).  La rotación positiva es antihoraria.<br/>\nEsa es su <strong>Rotación en la cinta</strong>.</p>\n</li>\n</ol>\n</html>
