ReferencePushPullFeederConfigurationWizard.btnDiscardParts.toolTipText=<html>Descartar las piezas que quedan en el ciclo de avance (de varias piezas).<br/>\r\nEmpieza con un ciclo de avance nuevo, incluida la calibración por visión (si está habilitada). \r\n</html>
