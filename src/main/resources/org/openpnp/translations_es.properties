ReferencePushPullFeederConfigurationWizard.textFieldRotationInTape.toolTipText=<html>\n<p>El ajuste <strong>Rotation in Tape</strong> debe interpretarse respecto a la orientación de la cinta, <br/>\nindependientemente de cómo estén orientados el alimentador o la cinta en la máquina. </p>\n<ol>\n<li>\n<p>Fíjese en la orientación vertical <strong>neutra</strong> del encapsulado o de la huella de la pieza <br/>\ntal como está dibujada en la <strong>biblioteca</strong> de su E-CAD.</p>\n</li>\n<li>\n<p>Observe cómo están orientados el pin 1, la polaridad, el cátodo, etc.  <br/>\nEse es su 0° para la pieza.</p>\n</li>\n<li>\n<p>Mire la cinta de modo que los agujeros de arrastre queden arriba. <br/>\nEsa es su orientación 0° de la cinta (según la norma industrial EIA-481).</p>\n</li>\n<li>\n<p>Determine cuánto está girada la pieza dentro de la cavidad de la cinta, <em>respecto</em> a  <br/>\nsu orientación vertical del punto (1).  La rotación positiva va en sentido antihorario.<br/>\nEse es su <strong>Rotation in Tape</strong>.</p>\n</li>\n</ol>\n</html>
ReferencePushPullMotionConfigurationWizard.additiveRotation.text=Aditiva
ReferencePushPullMotionConfigurationWizard.additiveRotation.toolTipText=<html>Antes de realizar el avance se toma la coordenada actual del eje de rotación.<br/>\nLas rotaciones indicadas abajo se suman entonces a ese ángulo base.<br/>\nEsto se usa típicamente en los ejes de pelado, para crear un bobinado continuo de la cinta de cubierta.\n</html>
