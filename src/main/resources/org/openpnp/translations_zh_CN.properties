ReferenceNozzleTipPartDetectionWizard.PartOffVacuumSensingPanel.EstablishLevelLabel.toolTipText=<html>在释放元件过程中，当吸嘴尖被按压在元件上时，会反复测量真空度，<br/>\n直到其衰减到真空范围内或超出放料时停留时间的设定时长，以先到者为准。\n</html>
ReferenceNozzleTipPartDetectionWizard.PartOffVacuumSensingPanel.HighValueLabel.text=高值
ReferenceNozzleTipPartDetectionWizard.PartOffVacuumSensingPanel.LastReadingLabel.text=最后的读取值
ReferenceNozzleTipPartDetectionWizard.PartOffVacuumSensingPanel.LegendPartOnLabel.text=<html>\n<p style\="text-align\:right">真空值 <span style\="color\:\#FF0000">&mdash;&mdash;</span></p>\n<p/>\n<p style\="text-align\:right"> 真空阀 <span style\="color\:\#005BD9">&mdash;&mdash;</span></p>\n</html>
