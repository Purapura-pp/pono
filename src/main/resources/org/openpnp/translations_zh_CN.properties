# 简体中文术语与文风约定
#
# 一、术语
#
# 总原则：保留英文术语，另加中文注解。用户看到的界面要能和英文 Wiki、社区截图对上，所以术语
# 本身不替换掉，而是在旁边给出中文说明。
#
# 字段标签用两行 HTML 实现这一点，英文在上、小字号中文在下：
#   <html><p align='right'>Safe Z<br/><span style='font-size:8.5px'>安全 Z 高度</span></p></html>
# 正文里则用括号，例如“像素尺寸(Units Per Pixel)”“相机稳定策略(Camera Settling)”。
#
# 既定译法：
#   actuator 执行器        nozzle 吸嘴          nozzle tip 吸嘴头     feeder 飞达
#   placement 贴片位       part 元件            package 封装          board 单板
#   panel 拼板             driver 驱动          controller 控制器     firmware 固件
#   axis 轴                home 归位            fiducial 基准点       pipeline 管线
#   vision 视觉            backlash 反向间隙（上下文明确时可简称“间隙”）
#   jerk 加加速度          feed rate 进给速率   units per pixel 像素尺寸
#   settling 稳定策略      pick 取料            place 贴装            discard 抛料
#   rank 顺序等级
#   computer 计算机：不写“电脑”，也不写“本机”，以免与贴片机混淆
#   calibration 沿用既有分工：测量性质的写“标定”（相机、标定基准点、反向间隙），
#   吸嘴头与视觉对位写“校准”；页面名为“校准”
#   界面部件：顶栏的“机器状态”按钮，不写“芯片”；相机画面上的“手动控制”卡片，不写“点动卡片”
#
# 刻意保留的撞车（i18n.py collisions 会报，不要去抹平）：
#   诊断页状态列的 on / off 写作“启用 / 关闭”，与别处的 Enabled、Close 同形。
#   那一列是状态取值而不是按钮或列名，同屏不会混淆。
#
# 刻意保留英文、不要翻译的条目（改动前请先想清楚）：
#   Safe Z    坐标概念，界面多处出现，译开反而难与文档对应
#   Camera Z  同上
#   TCP       网络协议名
#   Gcode     技术术语，社区通用
#
# 同一对象只用一种叫法：primary / secondary fiducial 主基准点 / 副基准点；vision settings 视觉配置；
# job processor 任务处理器；signaler 信号器；run-out calibration 跳动校准；tray 托盘（reel 为料盘）。
#
# 二、文风
#
# 界面文字使用规范的书面技术汉语：准确、简洁、中性。易读靠短句和一句一事，不靠口语。
#
#   1. 不用人称。不写“你、您、我、我们”；需要主语时写明对象（机器、吸嘴、本页），或写成无主句。
#      “我的预设”写作“自定义预设”。
#   2. 不用口语词：没、没有 → 未、无；还没 → 尚未；怎么 → 如何；这台、这里、这一步 → 当前、此处、
#      当前步骤；点 → 点击；看 → 查看；找 → 查找；改 → 修改；填 → 填写；做完 → 完成；停下 → 停止；
#      去某页 → 前往某页；跟着 → 跟随；好几 → 数；“东西”写明是什么。句末不加“了、吧、呢、的”。
#   3. 不用比喻、拟人和夸张，直接陈述事实与后果。
#   4. 状态和标签用标准短语：未设置、未测量、未连接、未使用预设、待处理、已完成、暂无飞达。
#   5. 操作说明用祈使句，动词在前，例如：选择端口；点击“应用”保存。多步操作写成编号列表。
#      警告写明后果，例如：机器将移动，请确认台面无障碍物。错误说明和确认框里可以用“请”，
#      工具提示和字段说明里不用。
#   6. 句子完整、主语明确，一句只讲一件事，不用分号串联短语。也不写公文腔：不用“进行……操作”
#      “予以”“之”。
#   7. 标点用全角。界面元素名和引用的词用“”，不用「」或半角引号；英文注解的括号保持“中文(English)”。
#   8. 数值与单位之间空一格（1–2 mm、500 ms）；“·”只用于标签内分隔并列信息。
#   9. 标签、按钮、列名不要比原来长出太多：界面宽度有限，UI 尺子会检查截断。
#
# 校验与批次流程见 TRANSLATIONS.md 与 tools/i18n/README.md。

