Solutions.Issue.CompleteMilestone=完成里程碑：
Solutions.Issue.CompleteMilestone.Choice.0=<html><h3>进入 %s</h3><p>请确认已完成并测试里程碑 <strong>%s</strong>：</p><br/><blockquote>%s</blockquote><br/><p>注意：继续之前，应解决或忽略此里程碑中的所有问题。</p><br/><p>如已完成，<em>恭喜！</em></p><br/><p>可进入下一里程碑 <strong>%s</strong>：</p><br/><blockquote>%s</blockquote><br/><p>进入后将列出达成下一里程碑所需处理的更多问题。</p><br/>\r\n</html>
Solutions.Issue.CompleteMilestone.Choice.1=<html><h3>返回 %s</h3><p>为缩小问题检查的范围，可返回上一里程碑 <strong>%s</strong>：</p><br/><blockquote>%s</blockquote><br/><p>注意：先前里程碑中的大多数问题在后续里程碑中也会报告。<br/>但在较早的目标里程碑中，部分解决方案更简单、更保守。<br/>因此排查故障时，可返回较早的里程碑，尝试在该阶段解决问题。</p><br/>\r\n</html>
Solutions.Issue.CompleteMilestone.Confirm=<html><p>里程碑 <strong>%s</strong> 中仍有未处理的问题：</p> %s <p color\="red">在解决或忽略这些问题之前，不建议切换到下一目标里程碑。</p><p><br/>是否仍要继续？</p></html>
