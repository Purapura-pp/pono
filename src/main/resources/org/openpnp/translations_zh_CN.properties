ReferenceNozzleCameraOffsetWizard.InstructionPanel.IntroductionLabel.text=半自动吸嘴连杆偏移向导将帮助您测量出机器贴装头与该吸嘴连杆之间的偏移量。
ReferenceNozzleCameraOffsetWizard.InstructionPanel.MeasureButton.text=存储标记位置的坐标
ReferenceNozzleCameraOffsetWizard.InstructionPanel.Step10Label.text=10.可通过点击位于操作面板右侧的"吸嘴指正"和"相机指正"按钮，来验证和确认新的配置结果。
ReferenceNozzleCameraOffsetWizard.InstructionPanel.Step1Label.text=1.请您选择用于测量偏移量的顶部相机。
ReferenceNozzleCameraOffsetWizard.InstructionPanel.Step2Label.text=2.在台面上放置一个能够让吸嘴尖留下印记的辅助材料。软泥、粉末或复写纸都是不错的选择。
ReferenceNozzleCameraOffsetWizard.InstructionPanel.Step3Label.text=3.选用一枚吸嘴并将其移动至辅助材料的上方。
ReferenceNozzleCameraOffsetWizard.InstructionPanel.Step4Label.text=4.通过操作面板，逐步降低吸嘴高度，直至吸嘴尖在辅助材料上留下印记。
ReferenceNozzleCameraOffsetWizard.InstructionPanel.Step5Label.text=5.为了在测量过程中，排除吸嘴尖偏心的影响，请将吸嘴旋转360°。
ReferenceNozzleCameraOffsetWizard.InstructionPanel.Step6Label.text=6.如果想要同时获得Z向上的偏移量，请勾选下方的 "包含Z坐标？"。
ReferenceNozzleCameraOffsetWizard.InstructionPanel.Step7Label.text=7.点击下方【记录吸嘴标记出的位置】按钮。
ReferenceNozzleCameraOffsetWizard.InstructionPanel.Step8Label.text=8.操控顶部相机，让其对准印记的中心，然后点击下方【计算吸嘴连杆的偏移量】按钮。
ReferenceNozzleCameraOffsetWizard.InstructionPanel.Step9Label.text=9.点击右下角【应用】按钮，为当前吸嘴连杆应用新的偏移量设定数据。
