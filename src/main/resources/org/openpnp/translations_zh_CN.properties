ReferenceNozzleTipToolChangerWizard.UnnamedPanel.VisionCalibrationLabel.text=包含 视觉校准 信息？
ReferenceNozzleTipToolChangerWizard.UnnamedPanel.ZCalibrationLabel.text=包含 Z校准 信息？
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.AdjustZLabel.text=<html><p align\='right'>Adjust Z<br/><span style\='font-size\:8.5px'>Z调整量</span></p></html>
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.AdjustZLabel.toolTipText=<html>\n通过此偏移值来调整视觉位置的Z坐标。 <br/>\n将其设定为视觉校准中识别的模板对象(例如更换器插槽的可见表面)与吸嘴在该位置时(假设的)下底面之间Z向的间距。<br/>\n若吸嘴位于该表面下方，则进行正调整；若位于上方，则进行负调整。<br/> \n此设置有助于消除相机视图中的缩放误差，尤其是当物体比平时更靠近相机时。<br/>\n<strong>相机必须设置了3D的像素尺寸(3D Units per Pixel)。</strong> \n</html>
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.Border.title=视觉校准
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.CalibrationTriggerLabel.text=校准触发条件
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.LastScoreLabel.text=上次评分
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.MaxPassesLabel.text=【最大】检测次数
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.MinScoreLabel.text=最低评分
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.MinScoreLabel.toolTipText=<html>\n当模板图像与相机图像进行匹配时，会计算出一个分数来指示匹配的质量。<br/>\n 如果获得的分数小于此处给定的最低评分，则校准失败。<br/>\n这应该能够阻止机器在位置错误时，去尝试更换吸嘴。\n</html>
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.TemplateEmptyLabel.text=空槽模板
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.TemplateHeightLabel.text=模板高度
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.TemplateHeightLabel.toolTipText=<html>\n模板图像高度（Y）。模板图像以选定的 视觉位置 为中心。<br/>\n尽可能选择较小的尺寸，但模板图像中应包含明显的水平和垂直边缘。<br/>\n 此外，当吸嘴占据插槽时，吸嘴应该是可见的。\n</html>
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.TemplateOccupiedLabel.text=有嘴模板
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.TemplateWidthLabel.text=模板宽度
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.TemplateWidthLabel.toolTipText=<html>\n模板图像高度（X）。模板图像以选定的 视觉位置 为中心。<br/>\n尽可能选择较小的尺寸，但模板图像中应包含明显的水平和垂直边缘。<br/>\n 此外，当吸嘴占据插槽时，吸嘴应该是可见的。\n</html>
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.ToleranceLabel.text=容差
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.ToleranceLabel.toolTipText=最大的校准公差，即校准后的位置可以偏离标称位置的最大偏差距离。
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.VisionCalibrationHelpLabel.text=<html>\n分别拍摄吸嘴插槽在空置和被占用状态下的两张模板图像。<br/>\n使用这两张模板图像，视觉校准将在X/Y方向上，校准吸嘴更换所使用的位置，<br/>\n同时确保了吸嘴插槽如预期那般，处于空置或是被占用的状态。\n</html>
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.VisionLocationLabel.text=视觉位置
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.VisionLocationLabel.toolTipText=<html>进行视觉校准的位置，None表示不进行校准。<br/>\n选择一个在吸嘴插槽中，可以看到吸嘴的位置。\n</html>
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.WantedPrecisionLabel.text=期望的精度
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.WantedPrecisionLabel.toolTipText=<html>如果检测到的图像与模板图像的匹配结果，超出了<strong>期望精度</strong>,<br/>\n则相机会重新居中并进行另一次视觉检测。</html>
