MachineSettings.Guide.Nozzles=\#\# 吸嘴偏移怎么量\n1. 在台面上放一样能留下印记的东西：软泥、面粉或复写纸。\n2. 用吸嘴轻轻压出一个印记，点「记下吸嘴位置」。\n3. 把相机的十字线对准印记中心，点「算出偏移」，检查结果后点「应用」。\n4. 这样能到 0.1 mm 左右。要更准，去校准页运行吸嘴偏移精测，用底部相机测。\n\#\# 双吸嘴取反是什么\n两个吸嘴挂在同一根皮带或齿轮的两边，一个往下另一个就往上。所以第二个 Z 不是独立电机，而是第一个的镜像。LumenPnP 就是这种结构。\n\#\# 元件直径\n这两个值给底部视觉的背景校准用：最小直径减去两倍取料容差，是吸嘴头中间总会被元件挡住的一块；最大直径决定要记住多大一圈背景。最小值至少是气孔直径加两倍取料容差。
MachineSettings.Guide.Cameras=\#\# 相机设备怎么选\n1. 相机插在哪个 USB 口，决定它在列表里的名字和序号；换了口或换了电脑，都要重新选一次。\n2. 两个相机型号一样时，逐个选中看预览：看到台面和板子的是顶部相机，看到吸嘴的是底部相机。\n3. 分辨率先选相机支持的最高值；画面卡顿就降一档，或者改用 MJPG。\n\#\# 哪些在这里设，哪些要测\n- 在这里设：设备、格式、朝向、装在哪、补光灯。\n- 由校准页测定：像素尺寸、底部相机的位置、镜头畸变、稳定时间。这里只显示结果和出处。
MachineSettings.Guide.Connection=\#\# 端口怎么找\n1. 打开 Windows 的「设备管理器」，展开「端口（COM 和 LPT）」。\n2. 拔掉机器的 USB 线再插上，消失又出现的那一项就是，记下它的 COM 号。\n3. 一直不出现：换一根 USB 线或换个口，再装主板厂家的 USB 驱动。\n\#\# 波特率和流控\n- 照固件里的设置填；LumenPnP 是 115200 和 RTS/CTS。\n- 端口打开了但固件一直没回应，多半是波特率或流控不对。\n\#\# G 代码\nPono 按识别出的固件发移动、归位、开关气路这些命令，一般不用改；确实要改，在「高级」里改。
