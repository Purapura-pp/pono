MachineDiagnosticsWizard.Action.Reopen.Description=撤销已接受的方案，或把已拒绝的方案重新打开。
MachineDiagnosticsWizard.Action.Run=开始测量
MachineDiagnosticsWizard.Action.Run.Description=<html>执行选中的测量并生成报告。<br/>机器会移动，但不会改动任何配置。</html>
MachineDiagnosticsWizard.Action.Stop=停止
MachineDiagnosticsWizard.Action.Stop.Description=<html>当前步骤结束后停止。已测得的数据会保留，<br/>测量期间临时关闭的设置也会恢复。</html>
