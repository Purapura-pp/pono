MachineSettings.Guide.Presets=\#\# 使用预设\n1. 选择与当前机器型号相同的预设，点击“应用”。\n2. 查看将要更改的内容。确认后，Pono 将备份配置、替换机器定义并重启。\n3. 重启后，在“连接”中选择此计算机的端口，在“相机”中选择此计算机的相机设备。\n4. 在校准页点击“采集问题”，按建议逐项确认。\n\#\# 自定义机型\n1. 先将机器调试至可正常贴片。\n2. 点击“新建预设”，来源选择“当前机器”，输入名称后保存。\n3. 重装系统、更换计算机或配置另一台同型号机器时，选择该预设并点击“应用”。\n\#\# 他人提供的配置\n点击“新建预设”，来源选择“从配置目录导入”，并指向对方的配置目录（其中包含 machine.xml）。仅导入机器定义，不包含对方的飞达和任务。
