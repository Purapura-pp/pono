CalibrationStep.Home=归位
CalibrationStep.Home.Description=启用机器并归位。
CalibrationStep.SafeZ=Safe Z
CalibrationStep.SafeZ.Description=将吸嘴点动到恰好高于需越过的最高物体的位置，然后继续。该高度即为吸嘴的 Safe Z。
CalibrationStep.SoftLimits=软限位
CalibrationStep.SoftLimits.Description=将此轴点动到安全行程的两端并分别采集位置，然后继续。
CalibrationStep.ManualNozzleTipChange=手动换嘴位置
CalibrationStep.ManualNozzleTipChange.Description=将吸嘴点动到手动更换吸嘴头的位置，然后继续。
CalibrationStep.ControllerLimits=控制器限值
CalibrationStep.ControllerLimits.Description=将各轴设置的进给速率、加速度和分辨率与控制器报告的值（M92、M203、M201）对照。机器不会移动。
CalibrationStep.SubPixel=亚像素检测
CalibrationStep.SubPixel.Description=将基准点和吸嘴头视觉的圆检测切换为亚像素精度。
CalibrationStep.Exposure=曝光与白平衡
CalibrationStep.Exposure.Description=在相机前放置一个有代表性且较亮的物体，然后继续。随后将据此固定曝光和白平衡。
CalibrationStep.PrimaryFiducial=主基准点与相机初标
CalibrationStep.PrimaryFiducial.Description=放置好标定板，将相机点动到主基准点大致上方，然后继续。随后将据此测量基准点位置和相机比例。
CalibrationStep.NozzleTouchPrimary=默认吸嘴触碰主基准点
CalibrationStep.NozzleTouchPrimary.Description=将默认吸嘴向下点动，直至恰好接触主基准点，然后继续。
CalibrationStep.SecondaryFiducial=副基准点与 Z
CalibrationStep.SecondaryFiducial.Description=先将相机点动到副基准点上方，再将默认吸嘴向下点动至接触该基准点，每步完成后继续。
CalibrationStep.OtherNozzleOffsets=其他吸嘴粗偏移
CalibrationStep.OtherNozzleOffsets.Description=将该吸嘴向下点动至接触主基准点，然后继续。
CalibrationStep.OtherCameraOffsets=其他下视相机偏移
CalibrationStep.OtherCameraOffsets.Description=在主基准点上测量该相机相对于贴装头的偏移。
CalibrationStep.BottomCamera=底部相机位置与初标
CalibrationStep.BottomCamera.Description=安装最小的吸嘴头，将默认吸嘴点动到底部相机上方并对焦，然后继续。
CalibrationStep.CameraSettle=相机延迟与稳定
CalibrationStep.CameraSettle.Description=设置相机移动后的等待时间：采用测得的稳定时间或帧延迟加上余量，或采用自适应方法。
CalibrationStep.VisualHoming=视觉归位
CalibrationStep.VisualHoming.Description=此后归位时对准基准点，使每次归位都回到同一原点。
CalibrationStep.XyBacklash=XY 间隙
CalibrationStep.XyBacklash.Description=在主基准点上测量此轴的反向间隙，并设置补偿方法和补偿量。
CalibrationStep.FeedAcceleration=进给与加速度
CalibrationStep.FeedAcceleration.Description=将此轴的进给速率和加速度设为实测中可达到且不丢步的值。
CalibrationStep.ZBacklash=Z 间隙
CalibrationStep.ZBacklash.Description=通过底部相机对焦测量 Z 轴的反向间隙（测量时关闭补偿），并据此设置补偿。
CalibrationStep.RotationBacklash=旋转间隙
CalibrationStep.RotationBacklash.Description=手动使吸嘴吸取测试件，然后继续。随后将在底部相机上从两个方向读取其角度。
CalibrationStep.FrameCompensation=基准板坐标补偿
CalibrationStep.FrameCompensation.Description=读取基准板，直到三次有效读数一致，据此补偿机器的比例和垂直度。验证不通过时撤销补偿。
CalibrationStep.AdvancedDownCamera=下视相机高级标定
CalibrationStep.AdvancedDownCamera.Description=在主、副基准点上标定相机的比例、倾斜和镜头畸变。
CalibrationStep.AdvancedUpCamera=上视相机高级标定
CalibrationStep.AdvancedUpCamera.Description=确认吸嘴在相机上方移动时不会碰撞任何物体，然后继续。随后将使用吸嘴头标定该相机。
CalibrationStep.NozzleTipCalibration=吸嘴头跳动与背景
CalibrationStep.NozzleTipCalibration.Description=使用底部相机校准吸嘴头的跳动和背景。
CalibrationStep.PreciseNozzleOffsets=测试件精密吸嘴偏移
CalibrationStep.PreciseNozzleOffsets.Description=在主基准点上放置测试件，将相机点动到其上方并确认真空正常，然后继续。
CalibrationStep.Remeasure=复测
CalibrationStep.Remeasure.Description=重新测量本次各步骤改动过的测量组，用于前后对比。
