MachineSettings.Guide.Nozzles=\#\# 测量吸嘴偏移\n1. 在台面上放置可留下印记的材料，例如软泥、面粉或复写纸。\n2. 用吸嘴轻压出一个印记，点击“记录吸嘴位置”。\n3. 将相机十字线对准印记中心，点击“计算偏移”，检查结果后点击“应用”。\n4. 此方法的精度约为 0.1 mm。如需更高精度，在校准页运行精密吸嘴偏移测量，该测量使用底部相机。\n\#\# 双吸嘴取反的含义\n两个吸嘴分别位于同一根皮带或同一个齿轮的两侧，升降方向相反。因此第二个 Z 轴并非由独立电机驱动，而是第一个 Z 轴的镜像。LumenPnP 采用此结构。\n\#\# 元件直径\n最小和最大元件直径用于底部视觉的背景校准。最小直径减去两倍取料容差，即吸嘴头中央始终被元件覆盖的区域。最大直径决定背景学习的范围。最小直径应不小于气孔直径与两倍取料容差之和。
MachineSettings.Guide.Cameras=\#\# 选择相机设备\n1. 相机所接的 USB 端口决定其在列表中的名称和序号。将相机改接到其他端口或其他计算机后，需重新选择。\n2. 两台相机型号相同时，逐一选择并查看预览：显示台面和单板的是顶部相机，显示吸嘴的是底部相机。\n3. 分辨率选择相机支持的最高值。画面卡顿时降低一档，或改用 MJPG。\n\#\# 设置项与测量项\n- 在本页设置：设备、格式、朝向、安装位置、补光灯。\n- 由校准页测定：像素尺寸、底部相机位置、镜头畸变、稳定时间。本页仅显示测定结果及其来源。
MachineSettings.Guide.Connection=\#\# 查找端口\n1. 打开 Windows“设备管理器”，展开“端口（COM 和 LPT）”。\n2. 拔下机器的 USB 线后重新插入，消失后又出现的条目即为机器端口。记录其 COM 编号。\n3. 如始终未出现，更换 USB 线或 USB 端口，然后安装主板厂商的 USB 驱动。\n\#\# 波特率和流控制\n- 按固件中的设置填写。LumenPnP 为 115200 和 RTS/CTS。\n- 端口可以打开但固件始终无响应时，通常是波特率或流控制设置有误。\n\#\# G 代码\nPono 根据识别出的固件发送移动、归位、气路开关等命令，通常无需修改。确需修改时，可在“高级”中编辑。
