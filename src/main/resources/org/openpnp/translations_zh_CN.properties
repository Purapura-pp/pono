MachineDiagnosticsWizard.Error.NoReport=尚未生成报告，请先执行测量。
MachineDiagnosticsWizard.GraphsPanel.Border.title=结果
MachineDiagnosticsWizard.GraphsPanel.Positioning.text=定位
MachineDiagnosticsWizard.GraphsPanel.Positioning.toolTipText=<html>定位误差和反向间隙随进给距离的变化。间隙随距离增大，表示空程正被逐步收紧。<br/>间隙不随距离变化，表示所测最短行程已将空程完全收紧。</html>
MachineDiagnosticsWizard.GraphsPanel.Settle.text=稳定过程
MachineDiagnosticsWizard.GraphsPanel.Settle.toolTipText=<html>图像距最终静止位置的偏差，横坐标为机器报告移动完成后的时间。</html>
MachineDiagnosticsWizard.GraphsPanel.Step.text=步进响应
MachineDiagnosticsWizard.GraphsPanel.Step.toolTipText=<html>每个指令步进下机器的实际位置。曲线呈台阶状而非直线，表示机器先卡滞、后突然滑移。</html>
MachineDiagnosticsWizard.GraphsPanel.Timing.text=移动耗时
MachineDiagnosticsWizard.GraphsPanel.Timing.toolTipText=<html>实测耗时随距离的变化，并叠加拟合曲线。明显高于拟合值的点表示该次移动因其他原因变慢。</html>
MachineDiagnosticsWizard.ParametersPanel.BacklashRepeats.text=间隙每格对数
MachineDiagnosticsWizard.ParametersPanel.BacklashRepeats.toolTipText=间隙矩阵中每组距离与速度下测量的双向逼近对数。
MachineDiagnosticsWizard.ParametersPanel.Border.title=参数
MachineDiagnosticsWizard.ParametersPanel.DriftSeconds.text=静止漂移 s
MachineDiagnosticsWizard.ParametersPanel.DriftSeconds.toolTipText=噪声底测量完成后，机器保持静止，相机继续观测基准点的时长，用于测量机架、相机和各轴随温度的缓慢漂移。设为 0 则跳过。
MachineDiagnosticsWizard.ParametersPanel.FieldOfViewGridFraction.text=网格占视场
MachineDiagnosticsWizard.ParametersPanel.FieldOfViewGridFraction.toolTipText=<html>网格覆盖图像的比例。应小于 1，使基准点位于网格四角时仍完整处于图像内。</html>
MachineDiagnosticsWizard.ParametersPanel.FieldOfViewGridSteps.text=视场网格
MachineDiagnosticsWizard.ParametersPanel.FieldOfViewGridSteps.toolTipText=<html>在图像横向和纵向各取此数量的位置测量基准点。基准点的机器坐标不应随其在图像中的位置而变化。<br/>实际出现的变化即为 Units per Pixel 的比例误差和镜头畸变。</html>
MachineDiagnosticsWizard.ParametersPanel.FirmwareCommands.text=控制器指令
MachineDiagnosticsWizard.ParametersPanel.FirmwareCommands.toolTipText=<html>每行一条指令，发送给每个 G-code 驱动，并原样记录回复。<br/>默认为 Marlin 指令。控制器以其他方式报告设置时，需相应修改。</html>
MachineDiagnosticsWizard.ParametersPanel.FocusRange.text=焦点扫描范围 (mm)
MachineDiagnosticsWizard.ParametersPanel.FocusRange.toolTipText=以底部相机高度为中心，向上和向下各扫描的 Z 范围。相机焦点距玻璃较近时，应减小此值。
MachineDiagnosticsWizard.ParametersPanel.FocusRepeats.text=每侧扫描次数
MachineDiagnosticsWizard.ParametersPanel.FocusRepeats.toolTipText=从上方和下方各扫描的次数。
MachineDiagnosticsWizard.ParametersPanel.FocusStep.text=焦点步长 (mm)
MachineDiagnosticsWizard.ParametersPanel.FocusStep.toolTipText=焦点扫描的 Z 步长。峰值在相邻两步之间插值求得。
MachineDiagnosticsWizard.ParametersPanel.FramesPerPoint.text=每点帧数
MachineDiagnosticsWizard.ParametersPanel.FramesPerPoint.toolTipText=每个静止位置拍摄的帧数。取中值作为测量值，逐帧散布写入 CSV。
MachineDiagnosticsWizard.ParametersPanel.HomeBeforeEachStressSpeed.text=每个应力速度前先归位
MachineDiagnosticsWizard.ParametersPanel.HomeBeforeEachStressSpeed.toolTipText=丢步检测中，每个速度因子开始前先将机器归位。这样每个速度都从原点开始，前一速度的丢步不会使基准点在下一速度时移出视野。
MachineDiagnosticsWizard.ParametersPanel.HomingCycles.text=归位次数
MachineDiagnosticsWizard.ParametersPanel.HomingCycles.toolTipText=归位的次数。每个循环的耗时与一次归位相同。
MachineDiagnosticsWizard.ParametersPanel.HysteresisLatticePitch.text=台面孔距 (mm)
MachineDiagnosticsWizard.ParametersPanel.HysteresisLatticePitch.toolTipText=台面孔阵（棋盘格）的节距，以主基准点定位。LumenPnP 底板为 15。迟滞图测量时直接移至最近的孔。设为 0 则改为搜索特征。
MachineDiagnosticsWizard.ParametersPanel.HysteresisTargets.text=迟滞测试靶点
MachineDiagnosticsWizard.ParametersPanel.HysteresisTargets.toolTipText=台面上具有圆形特征（孔、螺钉头）的位置，格式为“x, y; x, y; …”，单位为机器毫米。填写后在这些位置测量迟滞，不再按行程比例取点。将相机点动到每个孔上方，记录坐标读数。
MachineDiagnosticsWizard.ParametersPanel.LatencySpeedFactor.text=延迟测试移动速度
MachineDiagnosticsWizard.ParametersPanel.LatencySpeedFactor.toolTipText=延迟测试移动的速度因子。速度应足够低，使移动停止后不产生任何振动。
MachineDiagnosticsWizard.ParametersPanel.MachineSettle.text=静待 [ms]
MachineDiagnosticsWizard.ParametersPanel.MachineSettle.toolTipText=<html>到位后、测量前的停顿，避免上一次移动的残余振动影响本次计时。</html>
MachineDiagnosticsWizard.ParametersPanel.MeasureSpeedFactor.text=定位移动速度
MachineDiagnosticsWizard.ParametersPanel.MeasureSpeedFactor.toolTipText=所有速度本身不作为测量对象的移动所用的速度因子，包括移至基准点、在基准板各基准点之间移动、沿刻度尺步进。机器存在丢步时应调低此值。
MachineDiagnosticsWizard.ParametersPanel.NoiseFrames.text=噪声底帧数
MachineDiagnosticsWizard.ParametersPanel.NoiseFrames.toolTipText=测量视觉噪声底时，在机器静止状态下对基准点拍摄的帧数。
MachineDiagnosticsWizard.ParametersPanel.PositioningDistances.text=进给距离 [mm]
MachineDiagnosticsWizard.ParametersPanel.PositioningDistances.toolTipText=<html>重新逼近基准点前先离开的距离。反向间隙可能随行程长短变化，<br/>因此应分别取短、中、长三个距离。</html>
MachineDiagnosticsWizard.ParametersPanel.Repeats.text=重复次数
MachineDiagnosticsWizard.ParametersPanel.Repeats.toolTipText=<html>每项测量重复的次数。次数越多，对散布的估计越可靠，<br/>耗时也成比例增加。</html>
MachineDiagnosticsWizard.ParametersPanel.RotationApproachAngle.text=过冲角度 [deg]
MachineDiagnosticsWizard.ParametersPanel.RotationApproachAngle.toolTipText=<html>转回目标角度前先越过该角度的转动量。从两侧分别到达时的角度差即为间隙。</html>
MachineDiagnosticsWizard.ParametersPanel.RotationTestAngles.text=旋转测试角度 [deg]
MachineDiagnosticsWizard.ParametersPanel.RotationTestAngles.toolTipText=<html>将元件旋转到这些角度后测量。间隙在一周内可能不一致，宜测量多个角度。</html>
MachineDiagnosticsWizard.ParametersPanel.RotationTestPartId.text=旋转测试元件
MachineDiagnosticsWizard.ParametersPanel.RotationTestPartId.toolTipText=<html>用于测量旋转间隙的元件，需先用吸嘴手动吸取。<br/>该元件须具有封装和底部视觉配置，矩形外形的角度最易识别。</html>
MachineDiagnosticsWizard.ParametersPanel.RotationTimingAngles.text=计时角度 [deg]
MachineDiagnosticsWizard.ParametersPanel.RotationTimingAngles.toolTipText=旋转轴的同类项，单位为度。
MachineDiagnosticsWizard.ParametersPanel.RulerStep.text=刻度尺步长 (mm)
MachineDiagnosticsWizard.ParametersPanel.RulerStep.toolTipText=沿刻度尺步进的步长。取 2 mm 皮带节距的四分之一，使节距周期可见。取 1 mm 时每个周期仅采样两次，节距周期将被掩盖。
MachineDiagnosticsWizard.ParametersPanel.SettleDistances.text=稳定测试距离 [mm]
MachineDiagnosticsWizard.ParametersPanel.SettleDistances.toolTipText=<html>分别在这些距离的移动后测量稳定时间。长行程引起的振动大于短行程，<br/>因此稳定时间并非定值。</html>
MachineDiagnosticsWizard.ParametersPanel.SettleRepeats.text=稳定每距次数
MachineDiagnosticsWizard.ParametersPanel.SettleRepeats.toolTipText=每个稳定测试距离的运行次数。取最慢的一次作为结论，因为等待时间须覆盖每一次移动。
MachineDiagnosticsWizard.ParametersPanel.SettleSampleSeconds.text=采样时长 [s]
MachineDiagnosticsWizard.ParametersPanel.SettleSampleSeconds.toolTipText=<html>移动后持续采样的时长。须长于机器的稳定时间，否则无法得出稳定时间。</html>
MachineDiagnosticsWizard.ParametersPanel.SettleThresholdPixels.text=稳定阈值 [px]
MachineDiagnosticsWizard.ParametersPanel.SettleThresholdPixels.toolTipText=<html>图像保持在距最终静止位置此距离以内时，即视为稳定。</html>
MachineDiagnosticsWizard.ParametersPanel.SpeedFactors.text=速度系数
MachineDiagnosticsWizard.ParametersPanel.SpeedFactors.toolTipText=<html>测量所用的速度，以满速的比例表示。存在黏滑的机器在低速下定位反而更差，<br/>仅测量一个速度无法发现此问题。</html>
MachineDiagnosticsWizard.ParametersPanel.StepTestDistance.text=步进测试行程 [mm]
MachineDiagnosticsWizard.ParametersPanel.StepTestDistance.toolTipText=<html>步进测试逐步走过的总距离。每一步都需执行一次视觉检测，<br/>因此耗时随行程成比例增加。</html>
MachineDiagnosticsWizard.ParametersPanel.StepTestStep.text=步长 [mm]
MachineDiagnosticsWizard.ParametersPanel.StepTestStep.toolTipText=<html>步进测试中每一步的指令位移。设为接近轴分辨率的值，可检验机器能否响应如此小的步进。</html>
MachineDiagnosticsWizard.ParametersPanel.StressCycles.text=应力测试往复次数
MachineDiagnosticsWizard.ParametersPanel.StressCycles.toolTipText=丢步检测中每个速度因子下的往复次数。
MachineDiagnosticsWizard.ParametersPanel.StressDistance.text=应力测试距离 (mm)
MachineDiagnosticsWizard.ParametersPanel.StressDistance.toolTipText=丢步检测单程长度，以基准点为中心，受轴行程限制。
MachineDiagnosticsWizard.ParametersPanel.StressSpeedFactors.text=应力测试速度因子
MachineDiagnosticsWizard.ParametersPanel.StressSpeedFactors.toolTipText=丢步检测使用的速度因子序列，1.0 即配置上限。
MachineDiagnosticsWizard.ParametersPanel.TimingDistances.text=计时距离 [mm]
MachineDiagnosticsWizard.ParametersPanel.TimingDistances.toolTipText=<html>用于拟合加速度和速度的距离。需要短距离（反映加速度）<br/>和长距离（反映速度上限）。超出软限位的距离将被跳过。</html>
MachineDiagnosticsWizard.ParametersPanel.TimingIncludesZAndRotation.text=一并计时 Z 与旋转轴
MachineDiagnosticsWizard.ParametersPanel.TimingIncludesZAndRotation.toolTipText=<html>除 X/Y 外也对 Z 和旋转轴计时。Z 只在安全区内计时，<br/>未设安全区则跳过。</html>
MachineDiagnosticsWizard.Test.CameraLatency=相机延迟
MachineDiagnosticsWizard.Test.CameraLatency.toolTipText=在低速移动过程中连续采集图像帧。控制器报告移动完成后仍显示运动的帧，反映相机管线的延迟。
MachineDiagnosticsWizard.Test.CameraSettle=相机稳定
MachineDiagnosticsWizard.Test.CameraSettle.toolTipText=<html>移动后连续采样图像，确定图像实际静止的时刻，<br/>并与相机设定的稳定等待时间对比。</html>
MachineDiagnosticsWizard.Test.ConfigSnapshot=配置快照
MachineDiagnosticsWizard.Test.ConfigSnapshot.toolTipText=<html>导出测量时所用的设置，便于日后对照这些设置解读测量数据。<br/>不移动机器。</html>
MachineDiagnosticsWizard.Test.DatumBoard=基准板
MachineDiagnosticsWizard.Test.DatumBoard.toolTipText=以主基准点为起点，查找 LumenPnP 基准板上的七个铜基准点，并据此拟合机器坐标系，得出每轴比例、垂直度和残差。随后读取刻度尺，得出相机自身的比例和 30 mm 范围内的位置误差。
MachineDiagnosticsWizard.Test.Firmware=控制器设置
MachineDiagnosticsWizard.Test.Firmware.toolTipText=<html>读取控制器自身的参数，并与 OpenPnP 用于规划运动的限值并列对照。<br/>控制器上限低于轴设置时会静默地限制每一次移动。不移动机器。</html>
MachineDiagnosticsWizard.Test.Homing=归位重复性
MachineDiagnosticsWizard.Test.Homing.toolTipText=<html>反复归位，测量原点在各次归位之间的漂移。<br/>此散布会带入每一个任务。</html>
MachineDiagnosticsWizard.Test.HysteresisMap=行程上的迟滞
MachineDiagnosticsWizard.Test.HysteresisMap.toolTipText=在每根轴行程上的若干位置，以台面上该处的任意圆形特征为目标，测量原始间隙和一小段步进。间隙在行程中部最大，表示皮带受力伸长、张力偏低。间隙处处相同，表示存在游隙或摩擦。
MachineDiagnosticsWizard.Test.Kinematics=运动学
MachineDiagnosticsWizard.Test.Kinematics.toolTipText=<html>对一系列距离的移动计时，拟合出机器实际的加速度、速度和每次移动的固定开销，<br/>用于与轴设置对照。</html>
MachineDiagnosticsWizard.Test.LostSteps=丢步检测
MachineDiagnosticsWizard.Test.LostSteps.toolTipText=在每个速度因子下执行一段长距离快速往复运动，然后从同一侧返回基准点。所得偏差即为该段运动丢失的步数。
MachineDiagnosticsWizard.Test.RotationBacklash=旋转间隙
MachineDiagnosticsWizard.Test.RotationBacklash.toolTipText=<html>在底部相机上测量吸嘴旋转的空程。运行前需安装吸嘴头、<br/>手动吸取一个矩形元件，并在下方填写该元件名称。</html>
MachineDiagnosticsWizard.Test.VisionNoise=视觉噪声底
MachineDiagnosticsWizard.Test.VisionNoise.toolTipText=在机器静止状态下，连续多帧定位同一基准点。所得散布是其他各测试组所报告位置的误差下限。
MachineDiagnosticsWizard.Test.XyPositioning=X/Y 定位
MachineDiagnosticsWizard.Test.XyPositioning.toolTipText=<html>以主标定基准点为参考，测量重复定位的散布、关闭补偿后的反向间隙、<br/>机器能否响应微小步进，以及 Units per Pixel 在整个视场内是否准确。<br/>此项耗时最长。</html>
MachineDiagnosticsWizard.Test.ZFocus=Z 焦点
MachineDiagnosticsWizard.Test.ZFocus.toolTipText=使吸嘴头从上方和下方分别扫过底部相机的焦平面。成像最清晰的高度即 Z 的实际停止位置：同侧的散布反映重复性，两侧之差反映间隙。需安装吸嘴头，且不吸取元件。
MachineSetup.JobProcessors.ReferencePnpJobProcessor.JobOrder.BoardPart=按单板，再按元件
MachineSetup.JobProcessors.ReferencePnpJobProcessor.JobOrder.HeightPartBoard=按元件高度，再按元件、单板
MachineSetup.JobProcessors.ReferencePnpJobProcessor.JobOrder.NozzleTips=按吸嘴头
MachineSetup.JobProcessors.ReferencePnpJobProcessor.JobOrder.NozzleTipsByFlexibility=按吸嘴头（通用性低的优先，再缩短取放行程）
MachineSetup.JobProcessors.ReferencePnpJobProcessor.JobOrder.Part=按元件
MachineSetup.JobProcessors.ReferencePnpJobProcessor.JobOrder.PartBoard=按元件，再按单板
MachineSetup.JobProcessors.ReferencePnpJobProcessor.JobOrder.PartHeight=按元件高度，再按元件
MachineSetup.JobProcessors.ReferencePnpJobProcessor.JobOrder.PickLocation=按取料位置（缩短取料行程）
MachineSetup.JobProcessors.ReferencePnpJobProcessor.JobOrder.PickPlaceLocation=按取放位置（缩短取放行程）
MachineSetup.JobProcessors.ReferencePnpJobProcessor.JobOrder.Unsorted=不排序（按贴片位原有顺序）
MachineSetup.JobProcessors.ReferencePnpJobProcessor.Label.FeederFaultLimit=飞达出错上限
MachineSetup.JobProcessors.ReferencePnpJobProcessor.Label.FeederFaultLimit.toolTipText=<html>使用延迟报错时，若某个飞达供出的元件反复出错，<br>可自动禁用该飞达。此值为触发禁用所需的<br>错误次数。</html>
MachineSetup.JobProcessors.ReferencePnpJobProcessor.Label.FeederFaultWindowSize=统计最近
MachineSetup.JobProcessors.ReferencePnpJobProcessor.Label.FeederFaultWindowSize.toolTipText=<html>使用延迟报错时，若某个飞达供出的元件反复出错，<br>可自动禁用该飞达。此值为统计错误次数时所取的<br>最近贴装次数。</html>
MachineSetup.JobProcessors.ReferencePnpJobProcessor.Label.JobOrder=贴装顺序
MachineSetup.JobProcessors.ReferencePnpJobProcessor.Label.JobOrder.toolTipText=<html>\n任务中的所有贴片位将按所选顺序排序。<br/>\n 但实际执行顺序可能不同，<br/>\n 因为可使用当前已安装吸嘴头贴装的元件将优先贴装。\n</html>
MachineSetup.JobProcessors.ReferencePnpJobProcessor.Label.MaxPlacementRetries=贴装最多尝试
MachineSetup.JobProcessors.ReferencePnpJobProcessor.Label.MaxPlacementRetries.toolTipText=<html>每个贴片位在“送料/取料/对位/贴装”整个流程上的尝试次数。<br>尝试失败后元件将被丢弃。由于每次尝试均由任务处理器的<br>优化器独立调度，各次重试不一定连续。</html>
MachineSetup.JobProcessors.ReferencePnpJobProcessor.Label.MaxVisionRetries=视觉最多尝试
MachineSetup.JobProcessors.ReferencePnpJobProcessor.Label.MaxVisionRetries.toolTipText=首次视觉对位报错时，最多可尝试的总次数（含首次）。
MachineSetup.JobProcessors.ReferencePnpJobProcessor.Strategy.FullyAsPlanned=完全按计划
MachineSetup.JobProcessors.ReferencePnpJobProcessor.Strategy.Minimize=最小化
MachineSetup.JobProcessors.ReferencePnpJobProcessor.Strategy.StartAsPlanned=起始按计划
MachineSetup.JobProcessors.ReferencePnpJobProcessor.lblPlannerStrategy.text=换吸嘴头策略
