ReferenceNozzleTipConfigurationWizard.PushAndDragPanel.OutsideDiameterLabel.toolTipText=吸嘴尖外径，最小允许值约为0.75mm。
ReferenceNozzleTipConfigurationWizard.PushAndDragPanel.PushAndDragAllowedLabel.text=作为推拉用途？
ReferenceNozzleTipConfigurationWizard.PushAndDragPanel.PushAndDragAllowedLabel.toolTipText=<html>\n<p>\n是否允许将此吸嘴用作推拉用途。\n</p><p>\n仅当吸嘴尖足够坚固，能够承受包括偶尔的卡顿在内的侧向力时，<br/>\n方可启用此功能。</p>\n</html>
