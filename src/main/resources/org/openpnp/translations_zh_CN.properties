BoardsPanel.BoardPlacements.Placements.Rank.toolTip=<html><body style\='width\: 400'><strong>Rank（顺序等级）</strong>决定作业中各贴装点的处理顺序，按 rank 从低到高贴装。当两个 rank 相差 10 或以上时，存在<strong>严格顺序</strong>：rank R 的贴装点必须全部完成且正确，才会开始考虑 rank R+10。当相差小于 10 时<strong>不要求顺序</strong>：在作业其他优化目标的影响下，rank R 的贴装点可能在 R-9 到 R+9 之间的任意时机被贴装。</body></html>
