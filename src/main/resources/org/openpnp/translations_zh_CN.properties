MachineDiagnosticsWizard.GraphsPanel.Border.title=结果
MachineDiagnosticsWizard.GraphsPanel.Positioning.text=定位
MachineDiagnosticsWizard.GraphsPanel.Positioning.toolTipText=<html>定位误差和反向间隙随进给距离的变化。随距离增大的间隙是逐渐被拉满的空程；<br/>不随距离变的则在最短行程内就已经拉满。</html>
MachineDiagnosticsWizard.GraphsPanel.Settle.text=稳定过程
MachineDiagnosticsWizard.GraphsPanel.Settle.toolTipText=<html>图像距最终静止位置的偏差，横坐标为机器报告移动完成后的时间。</html>
MachineDiagnosticsWizard.GraphsPanel.Step.text=步进响应
MachineDiagnosticsWizard.GraphsPanel.Step.toolTipText=<html>每一个指令步进机器实际走到了哪里。出现台阶而不是直线，说明它先卡住再突然跑掉。</html>
MachineDiagnosticsWizard.GraphsPanel.Timing.text=移动耗时
MachineDiagnosticsWizard.GraphsPanel.Timing.toolTipText=<html>实测耗时随距离的变化，叠加拟合曲线。明显高于拟合值的点说明那次移动被什么拖慢了。</html>
MachineDiagnosticsWizard.ParametersPanel.BacklashRepeats.text=间隙每格对数
MachineDiagnosticsWizard.ParametersPanel.BacklashRepeats.toolTipText=间隙矩阵每个距离×速度格里测几对双向逼近。
MachineDiagnosticsWizard.ParametersPanel.Border.title=参数
MachineDiagnosticsWizard.ParametersPanel.DriftSeconds.text=静止漂移 s
MachineDiagnosticsWizard.ParametersPanel.DriftSeconds.toolTipText=测完噪声底之后，相机在什么都不动的情况下继续盯着基准点看多久，测机架、相机、各轴随温度的慢漂移。填 0 跳过。
MachineDiagnosticsWizard.ParametersPanel.FieldOfViewGridFraction.text=网格占视场
MachineDiagnosticsWizard.ParametersPanel.FieldOfViewGridFraction.toolTipText=<html>网格覆盖图像的比例。保持小于 1，以免网格四角上基准点落到图像外。</html>
MachineDiagnosticsWizard.ParametersPanel.FieldOfViewGridSteps.text=视场网格
MachineDiagnosticsWizard.ParametersPanel.FieldOfViewGridSteps.toolTipText=<html>在图像的横纵各取这么多个位置测量基准点。基准点的机器坐标不该随它在图像中的位置变化；<br/>变化的那部分就是 Units per Pixel 的比例误差和镜头畸变。</html>
MachineDiagnosticsWizard.ParametersPanel.FirmwareCommands.text=控制器指令
MachineDiagnosticsWizard.ParametersPanel.FirmwareCommands.toolTipText=<html>每行一条，发给每个 G-code 驱动并原样记录回复。<br/>默认是 Marlin 的指令；其他固件请自行修改。</html>
MachineDiagnosticsWizard.ParametersPanel.FocusRange.text=焦点扫描范围 (mm)
MachineDiagnosticsWizard.ParametersPanel.FocusRange.toolTipText=以底部相机高度为中心，上下各扫这么多。如果相机焦点离玻璃很近，把它调小。
MachineDiagnosticsWizard.ParametersPanel.FocusRepeats.text=每侧扫描次数
MachineDiagnosticsWizard.ParametersPanel.FocusRepeats.toolTipText=从上、从下各扫这么多次。
MachineDiagnosticsWizard.ParametersPanel.FocusStep.text=焦点步长 (mm)
MachineDiagnosticsWizard.ParametersPanel.FocusStep.toolTipText=焦点扫描的 Z 步长；峰值在步之间插值。
MachineDiagnosticsWizard.ParametersPanel.FramesPerPoint.text=每点帧数
MachineDiagnosticsWizard.ParametersPanel.FramesPerPoint.toolTipText=每个静止位置拍几帧；中值作为测量值，逐帧散布写入 CSV。
MachineDiagnosticsWizard.ParametersPanel.HomeBeforeEachStressSpeed.text=每个应力速度前先归位
MachineDiagnosticsWizard.ParametersPanel.HomeBeforeEachStressSpeed.toolTipText=丢步检测里每个速度因子开始前先回零归位，让每个速度都从原点出发，前一个速度丢的位置不会把基准点带出视野。
MachineDiagnosticsWizard.ParametersPanel.HomingCycles.text=归位次数
MachineDiagnosticsWizard.ParametersPanel.HomingCycles.toolTipText=归位多少次。每次的耗时就是一次归位的耗时。
MachineDiagnosticsWizard.ParametersPanel.HysteresisLatticePitch.text=台面孔距 (mm)
MachineDiagnosticsWizard.ParametersPanel.HysteresisLatticePitch.toolTipText=台面孔阵（棋盘格）的节距，以主基准点为锚；LumenPnP 底板是 15。迟滞图直接去最近的孔。填 0 则改为搜索。
MachineDiagnosticsWizard.ParametersPanel.HysteresisTargets.text=迟滞测试靶点
MachineDiagnosticsWizard.ParametersPanel.HysteresisTargets.toolTipText=台面上有圆形特征（孔、螺钉头）的位置，格式 "x, y; x, y; …"，机器毫米。填了就在这些点测，不再按行程百分比去找。把相机点动到每个孔上，从读数抄坐标即可。
MachineDiagnosticsWizard.ParametersPanel.LatencySpeedFactor.text=延迟测试移动速度
MachineDiagnosticsWizard.ParametersPanel.LatencySpeedFactor.toolTipText=延迟测试那一次移动的速度因子：要慢到停下来后没有任何振动。
MachineDiagnosticsWizard.ParametersPanel.MachineSettle.text=静待 [ms]
MachineDiagnosticsWizard.ParametersPanel.MachineSettle.toolTipText=<html>到位后、测量前的停顿，避免上一次移动的残余振动影响本次计时。</html>
MachineDiagnosticsWizard.ParametersPanel.MeasureSpeedFactor.text=定位移动速度
MachineDiagnosticsWizard.ParametersPanel.MeasureSpeedFactor.toolTipText=所有"速度本身不是被测量对象"的移动用的速度因子：去基准点、在基准板各点之间跳、沿刻度尺步进。会丢步的机器把它调低。
MachineDiagnosticsWizard.ParametersPanel.NoiseFrames.text=噪声底帧数
MachineDiagnosticsWizard.ParametersPanel.NoiseFrames.toolTipText=测视觉噪声底时，机器静止状态下对基准点拍的帧数。
MachineDiagnosticsWizard.ParametersPanel.PositioningDistances.text=进给距离 [mm]
MachineDiagnosticsWizard.ParametersPanel.PositioningDistances.toolTipText=<html>先离开基准点多远再重新靠过去。反向间隙可能随行程长短变化，<br/>所以短、中、长各取一个。</html>
MachineDiagnosticsWizard.ParametersPanel.Repeats.text=重复次数
MachineDiagnosticsWizard.ParametersPanel.Repeats.toolTipText=<html>每项测量重复多少次。次数越多，对散布的估计越可靠，<br/>耗时也成比例增加。</html>
MachineDiagnosticsWizard.ParametersPanel.RotationApproachAngle.text=过冲角度 [deg]
MachineDiagnosticsWizard.ParametersPanel.RotationApproachAngle.toolTipText=<html>先转过目标角度多少再转回来。从两侧分别靠过来的差值就是间隙。</html>
MachineDiagnosticsWizard.ParametersPanel.RotationTestAngles.text=旋转测试角度 [deg]
MachineDiagnosticsWizard.ParametersPanel.RotationTestAngles.toolTipText=<html>元件转到这些角度上测量。间隙在一周内可能不一致，多取几个角度更可靠。</html>
MachineDiagnosticsWizard.ParametersPanel.RotationTestPartId.text=旋转测试元件
MachineDiagnosticsWizard.ParametersPanel.RotationTestPartId.toolTipText=<html>用来测旋转间隙的元件，需要先用吸嘴手动吸起来。<br/>它必须有封装和底部视觉设置，矩形外形的角度最好识别。</html>
MachineDiagnosticsWizard.ParametersPanel.RotationTimingAngles.text=计时角度 [deg]
MachineDiagnosticsWizard.ParametersPanel.RotationTimingAngles.toolTipText=旋转轴的同类项，单位为度。
MachineDiagnosticsWizard.ParametersPanel.RulerStep.text=刻度尺步长 (mm)
MachineDiagnosticsWizard.ParametersPanel.RulerStep.toolTipText=沿刻度尺步进的步长。取 2 mm 皮带节距的四分之一才看得见节距；1 mm 每周期只采两次，会把它藏起来。
MachineDiagnosticsWizard.ParametersPanel.SettleDistances.text=稳定测试距离 [mm]
MachineDiagnosticsWizard.ParametersPanel.SettleDistances.toolTipText=<html>分别在这些移动距离后测稳定时间。长行程比短行程抖得厉害，<br/>稳定时间并不是一个定值。</html>
MachineDiagnosticsWizard.ParametersPanel.SettleRepeats.text=稳定每距次数
MachineDiagnosticsWizard.ParametersPanel.SettleRepeats.toolTipText=每个稳定测试距离跑几次；取最慢的一次作结论，因为等待时间得覆盖每一次移动。
MachineDiagnosticsWizard.ParametersPanel.SettleSampleSeconds.text=采样时长 [s]
MachineDiagnosticsWizard.ParametersPanel.SettleSampleSeconds.toolTipText=<html>移动后持续采样多久。必须长于机器的稳定时间，否则无法给出结果。</html>
MachineDiagnosticsWizard.ParametersPanel.SettleThresholdPixels.text=稳定阈值 [px]
MachineDiagnosticsWizard.ParametersPanel.SettleThresholdPixels.toolTipText=<html>图像一直保持在距最终静止位置这个距离以内，就算稳定。</html>
MachineDiagnosticsWizard.ParametersPanel.SpeedFactors.text=速度系数
MachineDiagnosticsWizard.ParametersPanel.SpeedFactors.toolTipText=<html>测量所用的速度，以满速的比例表示。存在黏滑的机器在低速下反而定位更差，<br/>只测一个速度看不出来。</html>
MachineDiagnosticsWizard.ParametersPanel.StepTestDistance.text=步进测试行程 [mm]
MachineDiagnosticsWizard.ParametersPanel.StepTestDistance.toolTipText=<html>步进测试走过的总距离。每一步都要做一次视觉检测，<br/>行程越长耗时成比例增加。</html>
MachineDiagnosticsWizard.ParametersPanel.StepTestStep.text=步长 [mm]
MachineDiagnosticsWizard.ParametersPanel.StepTestStep.toolTipText=<html>每一步的指令位移。取到接近轴分辨率，就能看出机器能不能响应这么小的一步。</html>
MachineDiagnosticsWizard.ParametersPanel.StressCycles.text=应力测试往复次数
MachineDiagnosticsWizard.ParametersPanel.StressCycles.toolTipText=丢步检测里每个速度因子跑的往复次数。
MachineDiagnosticsWizard.ParametersPanel.StressDistance.text=应力测试距离 (mm)
MachineDiagnosticsWizard.ParametersPanel.StressDistance.toolTipText=丢步检测单程长度，以基准点为中心，受轴行程限制。
MachineDiagnosticsWizard.ParametersPanel.StressSpeedFactors.text=应力测试速度因子
MachineDiagnosticsWizard.ParametersPanel.StressSpeedFactors.toolTipText=丢步检测使用的速度因子序列，1.0 即配置上限。
MachineDiagnosticsWizard.ParametersPanel.TimingDistances.text=计时距离 [mm]
MachineDiagnosticsWizard.ParametersPanel.TimingDistances.toolTipText=<html>用来拟合加速度和速度的距离。需要短距离（反映加速度）<br/>和长距离（反映速度上限）。超出软限位的距离会被跳过。</html>
MachineDiagnosticsWizard.ParametersPanel.TimingIncludesZAndRotation.text=一并计时 Z 与旋转轴
MachineDiagnosticsWizard.ParametersPanel.TimingIncludesZAndRotation.toolTipText=<html>除 X/Y 外也对 Z 和旋转轴计时。Z 只在安全区内计时，<br/>未设安全区则跳过。</html>
MachineDiagnosticsWizard.Test.CameraLatency=相机延迟
MachineDiagnosticsWizard.Test.CameraLatency.toolTipText=低速移动期间连续拍帧；控制器已报告移动完成之后仍显示在动的帧，就是相机流水线的延迟。
MachineDiagnosticsWizard.Test.CameraSettle=相机稳定
MachineDiagnosticsWizard.Test.CameraSettle.toolTipText=<html>移动后连续采样图像，找出图像真正停住的时刻，<br/>与相机设定的稳定等待时间对照。</html>
MachineDiagnosticsWizard.Test.ConfigSnapshot=配置快照
MachineDiagnosticsWizard.Test.ConfigSnapshot.toolTipText=<html>导出本次测量所依据的设置，以便日后照着它读数据。<br/>不移动机器。</html>
MachineDiagnosticsWizard.Test.DatumBoard=基准板
MachineDiagnosticsWizard.Test.DatumBoard.toolTipText=以主基准点为锚，找到 LumenPnP 基准板上的七个铜基准点，把机器坐标系拟合上去：每轴比例、垂直度、残差。再读刻度尺，得相机自身的比例与 30 mm 内的位置误差。
MachineDiagnosticsWizard.Test.Firmware=控制器设置
MachineDiagnosticsWizard.Test.Firmware.toolTipText=<html>读取控制器自身的参数，并与 OpenPnP 用来规划运动的限值并列对照。<br/>控制器上限低于轴设置时会静默地限制每一次移动。不移动机器。</html>
MachineDiagnosticsWizard.Test.Homing=归位重复性
MachineDiagnosticsWizard.Test.Homing.toolTipText=<html>反复归位，测量原点在多次归位之间的漂移。<br/>这个散布会传到每一个任务上。</html>
MachineDiagnosticsWizard.Test.HysteresisMap=行程上的迟滞
MachineDiagnosticsWizard.Test.HysteresisMap.toolTipText=在每根轴行程的几个位置，对工作台上随便一个圆形特征测原始间隙和一小段步进。间隙在行程中间最大→皮带在让，张力低；处处一样→游隙或摩擦。
MachineDiagnosticsWizard.Test.Kinematics=运动学
MachineDiagnosticsWizard.Test.Kinematics.toolTipText=<html>对一系列距离计时，拟合出机器真实的加速度、速度和每次移动的固定开销，<br/>用来和轴设置对照。</html>
MachineDiagnosticsWizard.Test.LostSteps=丢步检测
MachineDiagnosticsWizard.Test.LostSteps.toolTipText=每个速度因子下跑一段长距离快速往复，再从同一侧回到基准点：偏差就是这一段丢掉的步数。
MachineDiagnosticsWizard.Test.RotationBacklash=旋转间隙
MachineDiagnosticsWizard.Test.RotationBacklash.toolTipText=<html>在底部相机上测量吸嘴旋转的空程。运行前请先装上吸嘴、<br/>手动吸住一个矩形元件，并在下方填入该元件名。</html>
MachineDiagnosticsWizard.Test.VisionNoise=视觉噪声底
MachineDiagnosticsWizard.Test.VisionNoise.toolTipText=机器静止不动，连续多帧定位同一基准点。这个散布是其他测试组所有位置结论的下限。
MachineDiagnosticsWizard.Test.XyPositioning=X/Y 定位
MachineDiagnosticsWizard.Test.XyPositioning.toolTipText=<html>以主校准基准点为参考测量：重复定位的散布、关闭补偿后的反向间隙、<br/>微小步进是否真的跟得上，以及 Units per Pixel 在整个视场内是否准确。<br/>这是耗时最长的一项。</html>
MachineDiagnosticsWizard.Test.ZFocus=Z 焦点
MachineDiagnosticsWizard.Test.ZFocus.toolTipText=让吸嘴尖从上、从下扫过底部相机的焦平面。最清楚的高度就是 Z 真正停下的位置：同侧的散布是重复性，两侧之差是间隙。需要装上吸嘴并且不吸元件。
MachineSetup.JobProcessors.ReferencePnpJobProcessor.JobOrder.BoardPart=按单板，再按元件
MachineSetup.JobProcessors.ReferencePnpJobProcessor.JobOrder.HeightPartBoard=按元件高度，再按元件、单板
MachineSetup.JobProcessors.ReferencePnpJobProcessor.JobOrder.NozzleTips=吸嘴
MachineSetup.JobProcessors.ReferencePnpJobProcessor.JobOrder.NozzleTipsByFlexibility=按吸嘴头（先排不能换头的，再缩短取放行程）
MachineSetup.JobProcessors.ReferencePnpJobProcessor.JobOrder.Part=元件
MachineSetup.JobProcessors.ReferencePnpJobProcessor.JobOrder.PartBoard=按元件，再按单板
MachineSetup.JobProcessors.ReferencePnpJobProcessor.JobOrder.PartHeight=按元件高度，再按元件
MachineSetup.JobProcessors.ReferencePnpJobProcessor.JobOrder.PickLocation=按取料位置（缩短取料行程）
MachineSetup.JobProcessors.ReferencePnpJobProcessor.JobOrder.PickPlaceLocation=按取放位置（缩短取放行程）
MachineSetup.JobProcessors.ReferencePnpJobProcessor.JobOrder.Unsorted=不排序（按贴片位原本的顺序）
MachineSetup.JobProcessors.ReferencePnpJobProcessor.Label.FeederFaultLimit=飞达出错上限
MachineSetup.JobProcessors.ReferencePnpJobProcessor.Label.FeederFaultLimit.toolTipText=<html>使用延迟报错时，若某个供料器供出的元件反复出问题，<br>该供料器可以被自动禁用。此处设定触发禁用所需的<br>错误次数。</html>
MachineSetup.JobProcessors.ReferencePnpJobProcessor.Label.FeederFaultWindowSize=统计最近
MachineSetup.JobProcessors.ReferencePnpJobProcessor.Label.FeederFaultWindowSize.toolTipText=<html>使用延迟报错时，若某个供料器供出的元件反复出问题，<br>该供料器可以被自动禁用。此处设定在最近多少次贴装<br>范围内统计错误次数。</html>
MachineSetup.JobProcessors.ReferencePnpJobProcessor.Label.JobOrder=贴装顺序
MachineSetup.JobProcessors.ReferencePnpJobProcessor.Label.JobOrder.toolTipText=<html>\n贴片任务中所有的贴片项将按所选规则进行排序。<br/>\n 然而，实际所执行顺序可能会有所不同，<br/>\n 因为系统会优先使用当前已装载着的吸嘴进行贴片。\n</html>
MachineSetup.JobProcessors.ReferencePnpJobProcessor.Label.MaxPlacementRetries=贴装最多尝试
MachineSetup.JobProcessors.ReferencePnpJobProcessor.Label.MaxPlacementRetries.toolTipText=<html>每个贴装点在「送料/取料/对位/贴装」整个流程上的尝试次数。<br>每次尝试失败后元件会被丢弃。由于每次尝试都由作业处理器的<br>优化器独立调度，重试不一定是连续进行的。</html>
MachineSetup.JobProcessors.ReferencePnpJobProcessor.Label.MaxVisionRetries=视觉最多尝试
MachineSetup.JobProcessors.ReferencePnpJobProcessor.Label.MaxVisionRetries.toolTipText=当首次视觉对位报错时，允许再次尝试的次数。
MachineSetup.JobProcessors.ReferencePnpJobProcessor.Strategy.FullyAsPlanned=完全按计划
MachineSetup.JobProcessors.ReferencePnpJobProcessor.Strategy.Minimize=最小化
MachineSetup.JobProcessors.ReferencePnpJobProcessor.Strategy.StartAsPlanned=起始按计划
MachineSetup.JobProcessors.ReferencePnpJobProcessor.lblPlannerStrategy.text=换吸嘴头策略
