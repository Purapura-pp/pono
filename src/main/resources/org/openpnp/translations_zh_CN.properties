MachineSettings.Guide.Motion=\#\# 软限位怎么定\n1. 先回零，再用手动控制把轴慢慢移向一端，停在离机械极限 1–2 mm 的地方。\n2. 点下限或上限旁边的读取按钮，把当前位置填进去；另一头同样做。\n3. 打开限位的开关，点「应用」。以后超出范围的移动在发出之前就会被拦下。\n\#\# 速度和加速度\n- 先用预设里的值。\n- 移动时抖动、丢步或撞停：先把加速度降三成，速度不用动。\n- 控制器固件里也有上限，两边以小的为准。\n\#\# 这里不改的\n间隙补偿这类要测才知道的值由校准页测定，这里只显示结果和出处；点它标题右边的链接去测。
