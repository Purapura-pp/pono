ReferencePnpJobProcessorConfigurationWizard.lblOptimizeMultipleNozzles.toolTipText=通过调整吸嘴的处理次序，优化多吸嘴机器在执行拾取、对齐和放置操作时的运动路径。
ReferencePnpJobProcessorConfigurationWizard.lblPreRotateAllNozzles.text=提前旋转所有的吸嘴
ReferencePnpJobProcessorConfigurationWizard.lblPreRotateAllNozzles.toolTipText=<html>在到达首个供料或取料位置、底部相机检测位置以及首个贴片位置之前，对所有的吸嘴进行提前旋转和调整。<br/>如果提前旋转当前吸嘴所需的调整时间，预计将会超过下一个吸嘴到达其取料位置、底部相机检测位置以及首个贴片位置所需的时间，<br/>那么，启用该选项，将有效提升工作效率，并能显著降低元件在吸嘴上发生滑动的潜在风险。</html>
