MachineSettings.Guide.Motion=\#\# 设定软限位\n1. 机器归位后，使用“手动控制”将轴缓慢移向一端，停在距机械极限 1–2 mm 处。\n2. 点击下限或上限旁的读取按钮，填入当前位置。在另一端执行相同操作。\n3. 启用限位并点击“应用”。此后超出限位的移动在发送前即被拦截。\n\#\# 速度和加速度\n- 初始采用预设中的值。\n- 移动出现抖动、丢步或堵转时，先将加速度降低三分之一，再考虑调整速度。\n- 控制器固件也有自身的上限，两者以较小值为准。\n\#\# 本页不设置的值\n反向间隙等只能通过测量确定的值由校准页测定。本页仅显示结果和来源，点击该项标题右侧的链接可前往校准页。
