ReferenceNozzleVacuumWizard.ContentPanel.ClosesVacuumActuatorLabel.toolTipText=<html>\r\n启动吹气执行器会<em>隐藏式的</em>关闭真空执行器。<br/>\r\n勾选该选项后，就省去了对真空执行器<em>刻意的</em>关闭操作。\r\n</html>
