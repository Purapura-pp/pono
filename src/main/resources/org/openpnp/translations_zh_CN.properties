HeadSolutions.Issue.CreateNozzles=为该贴装头创建吸嘴单元。
HeadSolutions.Issue.CreateNozzles.Confirm=<html><p>接受此解决方案可能会从根本上改变您的机器配置。<br/>以下将会发生：<p/><ol><li>当前机器配置将被保存 (与 文件/保存配置 的效果相同)。</li><li>新的解决方案将覆盖您现有的吸嘴单元和轴的配置。</li><li>只要吸嘴单元数量和轴的类型保持不变，它们的详细配置将被保留。</li><li>吸嘴单元的解决方案可以多次应用，您可以重新访问并扩展它。</li><li><span color\="red">警告\:</span> 重新开放(Reopen)不会恢复之前的配置，只能重新选择。<br/>如果您想恢复之前的配置，必须手动恢复已保存的配置文件。</li></ol><br/>您确定吗？</html>
HeadSolutions.Solution.CreateNozzles=选择吸嘴单元的数量和类型。
HeadSolutions.Solution.CreateNozzles.Choice.0=<html><h3>独立吸嘴单元</h3><p>每一个吸嘴拥有其专用的Z轴电机。</p></html>
HeadSolutions.Solution.CreateNozzles.Choice.1=<html><h3>往返式吸嘴对</h3><p>每对吸嘴共用一个Z轴电机。当第一个吸嘴向上移动时，第二个吸嘴同时向下移动。通过齿轮、齿条或同步带，进行负耦合。</p></html>
HeadSolutions.Solution.CreateNozzles.Choice.2=<html><h3>翘板式吸嘴对</h3><p>每对吸嘴共用一个Z轴电机。这两个吸嘴由一个旋转凸轮向下推，并由弹簧向上拉。</p></html>
