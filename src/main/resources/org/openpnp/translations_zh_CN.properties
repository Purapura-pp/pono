MachineSettings.Guide.Presets=\#\# 怎样用预设\n1. 选和你的机器同型号的预设，点「应用」。\n2. 先看会改什么；确认后 Pono 先备份，再换掉机器定义，然后重启。\n3. 重启后到「连接」选本机端口，到「相机」选本机的相机设备。\n4. 去校准页点「采集问题」，按建议逐项确认。\n\#\# 自己的机型\n1. 先把机器调到能正常贴片。\n2. 点「新建预设」，来源选「当前机器」，起个名字保存。\n3. 以后重装系统、换电脑，或者再配一台同样的机器，选它点「应用」即可。\n\#\# 别人给的配置\n「新建预设」，来源选「从配置目录导入」，指向对方的配置目录（里面有 machine.xml）。只取机器定义，不带对方的飞达和任务。
