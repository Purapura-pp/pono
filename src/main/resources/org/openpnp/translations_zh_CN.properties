CalibrationStep.Home=回零
CalibrationStep.Home.Description=启用机器并回零。
CalibrationStep.SafeZ=Safe Z
CalibrationStep.SafeZ.Description=把吸嘴点动到刚好高过它要越过的最高物体，然后继续：这个高度就是它的 Safe Z。
CalibrationStep.SoftLimits=软限位
CalibrationStep.SoftLimits.Description=把这根轴点动到安全行程的两端并分别采集，然后继续。
CalibrationStep.ManualNozzleTipChange=手动换嘴位置
CalibrationStep.ManualNozzleTipChange.Description=把吸嘴点动到你手动换吸嘴头的位置，然后继续。
CalibrationStep.ControllerLimits=控制器限值
CalibrationStep.ControllerLimits.Description=把各轴设置的进给、加速度和分辨率与控制器报告的值（M92、M203、M201）对照。机器不动。
CalibrationStep.SubPixel=亚像素检测
CalibrationStep.SubPixel.Description=把基准点和吸嘴头视觉的圆检测切换到亚像素精度。
CalibrationStep.Exposure=曝光与白平衡
CalibrationStep.Exposure.Description=在相机前放一个有代表性、偏亮的物体，然后继续：曝光和白平衡会按它固定下来。
CalibrationStep.PrimaryFiducial=主基准点与相机初标
CalibrationStep.PrimaryFiducial.Description=放好标定板，把相机大致点动到主基准点上方，然后继续：从那里测出基准点位置和相机比例。
CalibrationStep.NozzleTouchPrimary=默认吸嘴触碰主基准点
CalibrationStep.NozzleTouchPrimary.Description=把默认吸嘴点动下去，刚好碰到主基准点，然后继续。
CalibrationStep.SecondaryFiducial=副基准点与 Z
CalibrationStep.SecondaryFiducial.Description=把相机点动到副基准点上方，之后再把默认吸嘴点动下去碰到它，每次完成后继续。
CalibrationStep.OtherNozzleOffsets=其它吸嘴粗偏移
CalibrationStep.OtherNozzleOffsets.Description=把这个吸嘴点动下去碰到主基准点，然后继续。
CalibrationStep.OtherCameraOffsets=其它下视相机偏移
CalibrationStep.OtherCameraOffsets.Description=在主基准点上测出这台相机相对于吸嘴头的位置。
CalibrationStep.BottomCamera=底部相机位置与初标
CalibrationStep.BottomCamera.Description=装上最小的吸嘴头，把默认吸嘴点动到底部相机上方并对焦，然后继续。
CalibrationStep.CameraSettle=相机延迟与稳定
CalibrationStep.CameraSettle.Description=设置相机在移动后等待多久：按测得的稳定时间或帧延迟加余量，或者用自适应方法。
CalibrationStep.VisualHoming=视觉归位
CalibrationStep.VisualHoming.Description=以后回零时再对准基准点，让每次回零都回到同一个原点。
CalibrationStep.XyBacklash=XY 间隙
CalibrationStep.XyBacklash.Description=在主基准点上测量这根轴的间隙，并设置补偿方法和偏移。
CalibrationStep.FeedAcceleration=进给与加速度
CalibrationStep.FeedAcceleration.Description=把这根轴的进给和加速度设为实测中能达到、并且不丢步的值。
CalibrationStep.ZBacklash=Z 间隙
CalibrationStep.ZBacklash.Description=在底部相机的对焦上测量 Z 的间隙（测量时关掉补偿），并加以补偿。
CalibrationStep.RotationBacklash=旋转间隙
CalibrationStep.RotationBacklash.Description=手动让吸嘴吸起测试件，然后继续：在底部相机上从两个方向读取它的角度。
CalibrationStep.FrameCompensation=基准板坐标补偿
CalibrationStep.FrameCompensation.Description=读取基准板直到有三次干净且一致的读数，据此补偿比例和垂直度；验证不通过就撤回。
CalibrationStep.AdvancedDownCamera=下视相机高级标定
CalibrationStep.AdvancedDownCamera.Description=在主、副基准点上标定相机的比例、倾斜和镜头畸变。
CalibrationStep.AdvancedUpCamera=上视相机高级标定
CalibrationStep.AdvancedUpCamera.Description=确认吸嘴在相机上方移动不会碰到任何东西，然后继续：用吸嘴头标定这台相机。
CalibrationStep.NozzleTipCalibration=吸嘴头跳动与背景
CalibrationStep.NozzleTipCalibration.Description=在底部相机上标定吸嘴头的跳动和背景。
CalibrationStep.PreciseNozzleOffsets=测试件精密吸嘴偏移
CalibrationStep.PreciseNozzleOffsets.Description=把测试件放到主基准点上，把相机点动到它上方并确认真空正常，然后继续。
CalibrationStep.Remeasure=复测
CalibrationStep.Remeasure.Description=重测这次各步改动过的测量组，得到前后对比。
