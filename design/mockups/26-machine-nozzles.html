<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Pono · 机器设置 · 吸嘴与吸嘴头（深色）</title>
<link rel="stylesheet" href="mock.css">
<script src="icons.js"></script>
<script src="scene.js"></script>
<script src="frame.js"></script>
<script src="ms.js"></script>
</head>
<body>
<script>
var F = Frame, ic = F.ic;
var m = function (t) { return '<span class="mono">' + t + '</span>'; };

var opt = function (kind, title, text, on) {
  return '<div class="opt' + (on ? ' on' : '') + '">' + MS.nozzlePic(kind) + '<div><b>' + title + '</b><span>' + text + '</span></div></div>';
};
var structure = F.sec('数量与结构', 'nozzle', [
  ['吸嘴数量', F.seg(['1', '2', '3', '4'], 1)],
  ['结构', '<div class="opts">'
    + opt('independent', '各自独立 Z', '每个吸嘴一个 Z 电机')
    + opt('negated', '双吸嘴取反', '共用一个 Z 电机，一个下另一个就上', true)
    + opt('cam', '凸轮联动', '共用一个电机，凸轮轮流压下吸嘴')
    + '</div>'],
  [null, '<div class="fhint info" style="grid-column:2">' + ic('info') + '改数量或结构会新建或删掉吸嘴和它们的轴；点「应用」时先列出要新建和删掉的东西，确认后才改。</div>']
], { rt: '按现有的轴识别为：2 个 · 双吸嘴取反' });

var nozzles = '<div class="boxed">' + F.table(
  [{ t: '吸嘴', w: 56 }, { t: 'Z 轴', w: 54 }, { t: '旋转轴', w: 60 }, { t: '偏移 X', r: true, w: 90 }, { t: '偏移 Y', r: true, w: 90 }, { t: '偏移 Z', r: true, w: 80 }, { t: '偏移从哪来' }, { t: '气路', w: 60 }, { t: '当前吸嘴头', w: 90 }],
  [
    ['<b>N1</b>', 'z1', 'a', m('−23.444'), m('−64.888'), m('0.000'), '<span class="src">' + ic('hand') + '手动对准 · 09-20</span>', 'VAC1', 'N045'],
    ['<b>N2</b>', 'z2', 'b', m('23.922'), m('−64.393'), m('0.000'), '<span class="src">' + ic('hand') + '手动对准 · 09-20</span>', 'VAC2', 'N08']
  ], 0) + '</div>';

var capture = '<div class="row" style="gap:6px">'
  + '<button class="btn sm">' + ic('camera', 'sm') + '① 记下相机位置</button>'
  + '<button class="btn sm">' + ic('nozzle', 'sm') + '② 记下吸嘴位置</button>'
  + '<span class="muted" style="font-size:11.5px;margin-left:4px">两次对准同一点，差值就是偏移</span>'
  + '<span class="grow"></span><span class="link" style="font-size:12px">更准：去校准页精测 ›</span></div>';

var nozzleSec = F.sec('吸嘴', 'nozzle', [
  [null, '<div style="grid-column:1 / span 2">' + nozzles + '</div>'],
  ['N1 偏移', '<div class="row" style="gap:6px">' + F.inp('−23.444', { mono: true, pre: 'X', u: 'mm', w: 140 }) + F.inp('−64.888', { mono: true, pre: 'Y', u: 'mm', w: 140 }) + F.inp('0.000', { mono: true, pre: 'Z', u: 'mm', w: 120 }) + '</div>'],
  ['', capture],
  ['真空泵', '<div class="row" style="gap:6px"><div class="inp warn" style="flex:0 0 200px;width:200px"><span class="muted">未设</span>' + ic('chevdown', 'sm caret') + '</div></div>'],
  [null, '<div class="fhint" style="grid-column:2">' + ic('alert') + '只有一个泵供所有吸嘴时才要设。像 LumenPnP 这样每个吸嘴自己开关气路（VAC1、VAC2）的，选「不需要」。</div>']
], { rt: '选中 N1' });

var bad = function (t) { return '<div class="inp mono cell err" style="width:82px">' + t + '<span class="u">mm</span></div>'; };
var ok = function (t) { return '<div class="inp mono cell" style="width:82px">' + t + '<span class="u">mm</span></div>'; };
var tipRow = function (name, pick, place) {
  return ['<b>' + name + '</b>', 'N1、N2', '<div class="row" style="gap:6px">' + bad('0.000') + '<span class="muted">–</span>' + ok('20.000') + '</div>', m('1.000 mm'), m(pick + ' / ' + place + ' ms'), '<span class="t2">开</span>'];
};
var tips = F.sec('吸嘴头', 'pkg', [
  [null, '<div class="fhint err" style="grid-column:1 / span 2">' + ic('alert') + '6 个吸嘴头的最小元件直径都是 0.000，无效：至少要是气孔直径加两倍取料容差（2 × 1.000 mm）。在红框里填上。</div>'],
  [null, '<div style="grid-column:1 / span 2" class="boxed">' + F.table(
    [{ t: '吸嘴头', w: 70 }, { t: '可装在', w: 76 }, { t: '元件直径（最小 – 最大）', w: 230 }, { t: '取料容差', w: 90 }, { t: '取料 / 放料停留', w: 130 }, { t: '跳动标定' }],
    [tipRow('N045', 200, 100), tipRow('N08', 500, 500), tipRow('N14', 500, 500), tipRow('N24', 300, 100), tipRow('N40', 500, 500), tipRow('N75', 500, 500)]
  ) + '</div>']
], { rt: '6 个 · 跳动标定的参数在校准页' });

var body = structure + nozzleSec + tips;

var guide = '<h4>吸嘴偏移怎么量</h4><ol>'
  + '<li>在台面上贴一小块胶带，用笔点一个清楚的小点。</li>'
  + '<li>用顶部相机的十字线对准这个点，点「① 记下相机位置」。</li>'
  + '<li>换成吸嘴 N1，降到快碰到胶带，目视对准同一个点，点「② 记下吸嘴位置」。</li>'
  + '<li>Pono 用两次的坐标差算出偏移填进去；N2 同样做一遍。</li>'
  + '<li>这样能到 0.1 mm 左右。要更准，去校准页运行「吸嘴偏移精测」，用底部相机测。</li></ol>'
  + '<h4>双吸嘴取反是什么</h4>'
  + '<p>两个吸嘴挂在同一根皮带或齿轮的两边，一个往下另一个就往上。所以 z2 不是独立电机，而是 z1 的镜像：z2 = 63 − z1。LumenPnP 就是这种结构。</p>'
  + '<h4>元件直径</h4>'
  + '<p>这两个值给底部视觉的背景校准用：最小直径减去两倍取料容差，是吸嘴头中间总会被元件挡住的一块；最大直径决定要记住多大一圈背景。最小值至少是气孔直径加两倍取料容差。</p>';

MS.app({
  topic: 'nozzles', body: body, guide: guide,
  foot: '',
  status: { text: '机器设置 · 吸嘴与吸嘴头', right: ['配置已保存 · 20:05'] }
});
</script>
</body>
</html>
