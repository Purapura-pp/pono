<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Pono · 元件页（深色）</title>
<link rel="stylesheet" href="mock.css">
<script src="icons.js"></script>
<script src="scene.js"></script>
<script src="frame.js"></script>
</head>
<body>
<script>
var F = Frame, ic = F.ic;
var parts = [
  ['R0603-10K', '10kΩ ±1%', 'R0603', '0.45', '100', '默认底部视觉', '—', '2', '9'],
  ['R0603-1K', '1kΩ ±1%', 'R0603', '0.45', '100', '默认底部视觉', '—', '1', '7'],
  ['R0402-4K7', '4.7kΩ ±1%', 'R0402', '0.35', '100', '默认底部视觉', '—', '2', '3'],
  ['C0402-100N', '100nF 16V X7R', 'C0402', '0.50', '100', '默认底部视觉', '—', '2', '10'],
  ['C0603-1U', '1µF 16V', 'C0603', '0.80', '100', '默认底部视觉', '—', '3', '4'],
  ['C0805-10U', '10µF 10V', 'C0805', '1.25', '80', '默认底部视觉', '—', '2', '3'],
  ['LED-0805-RED', '红色 LED', 'LED-0805', '0.80', '100', '<span class="link">LED 顶面识别</span>', '—', '1', '3'],
  ['SOT-23-BSS138', 'N 沟道 MOSFET', 'SOT-23', '1.10', '100', '默认底部视觉', '—', '1', '2'],
  ['SOIC-8-LM358', '双运放', 'SOIC-8', '1.75', '60', '<span class="link">SOIC 引脚</span>', '—', '1', '2'],
  ['QFN-32-STM32G0', 'MCU', 'QFN-32', '0.90', '40', '<span class="link">QFN 焊盘</span>', '—', '1', '1'],
  ['FIDUCIAL-1MM', '基准点', 'FIDUCIAL-1MM', '0.00', '100', '—', '默认基准视觉', '<span class="muted">0</span>', '3']
].map(function (p) {
  return ['<b>' + p[0] + '</b>', '<span class="t2">' + p[1] + '</span>', p[2], p[3], p[4] + ' %', '<span class="t2">' + p[5] + '</span>', '<span class="t2">' + p[6] + '</span>', p[7], p[8]];
});

var toolbar = F.btn('新建元件', 'plus', 'primary') + F.btn('', 'trash', 'ghost icon', ' title="删除所选元件"') + F.sep()
  + F.btn('复制', 'copy') + F.btn('粘贴', 'upload') + F.sep()
  + F.btn('用 N1 取料', 'nozzle', '', ' title="会移动机器：从第一个可用飞达取这个元件"').replace('用 N1 取料', '用 N1 取料' + ic('zap', 'moves'))
  + F.filter('筛选 ID / 名称 / 封装…');

var banner = '<div class="banner info">' + ic('info') + '<div class="bt"><b>已新建元件 NEW-1</b><span>封装沿用了上次选的 R0603，高度 0.45 mm。右侧可以改。</span></div><div class="acts"><button class="btn xs ghost">撤销新建</button><button class="btn xs ghost">' + ic('x', 'sm') + '</button></div></div>';

var dock = F.dock({
  tabs: [{ icon: 'parts', t: '元件', n: 11 }, { icon: 'alert', t: '未使用', n: 1 }],
  banner: banner,
  toolbar: toolbar,
  body: F.table([
    { t: 'ID', w: 150 }, { t: '名称' }, { t: '封装', w: 110 }, { t: '高度 mm', r: 1, w: 76, cls: 'num' },
    { t: '速度', r: 1, w: 64, cls: 'num' }, { t: '底部视觉', w: 118 }, { t: '基准视觉', w: 104 },
    { t: '飞达', r: 1, w: 52, cls: 'num' }, { t: '贴片', r: 1, w: 52, cls: 'num' }
  ], parts, 0),
  foot: '11 个元件 · 1 个没有贴片位用到 · 列宽按内容，窄时先藏「基准视觉」「贴片」'
});

var feederRow = function (name, detail) {
  return '<div class="row" style="height:30px"><span class="status ok" style="height:18px">' + name + '</span><span class="t2" style="font-size:12px">' + detail + '</span><span class="link" style="margin-left:auto;font-size:12px">去飞达页 ›</span></div>';
};
var side = F.side({
  icon: 'parts', title: 'R0603-10K', sub: '元件 · 10kΩ ±1% · 封装 R0603',
  body:
    F.sec('基本', 'info', [
      ['ID', F.inp('R0603-10K', { mono: true })],
      ['名称', F.inp('10kΩ ±1%')],
      ['封装', F.inp('<b>R0603</b><span class="muted" style="margin-left:6px">1.6 × 0.8 mm · 2 焊盘</span>', { select: true })],
      ['高度', '<div class="inp-row">' + F.inp('0.450', { mono: true, u: 'mm', w: 120 }) + '<button class="btn sm">' + ic('nozzle', 'sm') + '用吸嘴探测' + ic('zap', 'moves') + '</button></div>'],
      ['透穿深度', F.inp('0.000', { mono: true, u: 'mm', w: 120 })]
    ]) +
    F.sec('贴装', 'move', [
      ['速度', '<div class="inp-row">' + F.inp('100', { mono: true, u: '%', w: 90 }) + F.seg(['25', '50', '75', '100'], 3, true) + '</div>'],
      ['取料重试', '<div class="row">' + F.inp('3', { mono: true, w: 90 }) + '<span class="t2">次，每次失败先抛料</span></div>']
    ]) +
    F.sec('视觉', 'eye', [
      ['底部视觉', '<div class="inp-row">' + F.inp('默认底部视觉<span class="muted" style="margin-left:6px">封装的设置</span>', { select: true }) + '<button class="btn sm">' + ic('edit', 'sm') + '编辑</button></div>'],
      ['基准视觉', F.inp('<span class="muted">不是基准点</span>', { select: true })]
    ]) +
    F.sec('飞达', 'feeder', null, { rt: '2 个', after: feederRow('F-01', '料带飞达 · 槽位 A1 · 余 1,240') + feederRow('F-10', '料带飞达 · 槽位 A9 · 余 860') }) +
    F.sec('用在', 'board', null, { rt: '9 处', after: '<div class="row" style="flex-wrap:wrap;gap:4px">' + ['R11', 'R12', 'R13', 'R14', 'R15', 'R16', 'R17', 'R18', 'R19'].map(function (x) { return '<span class="tag">' + x + '</span>'; }).join('') + '<span class="t2" style="font-size:12px">demo-board</span></div>' })
});

F.app({
  page: 'parts', centerClass: 'strip-top',
  badges: { feeders: ['warn', 1], issues: ['err', 2], calibration: ['warn', 9] },
  center: F.strip() + dock,
  side: side,
  status: { text: '元件 11 · 封装 10', right: ['配置已保存 · 16:42'] },
  scene: Scene.pcb({ footprintLabel: 'R12 · R0603' })
});
</script>
</body>
</html>
