<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Pono · 机器设置 · 连接（深色）</title>
<link rel="stylesheet" href="mock.css">
<script src="icons.js"></script>
<script src="scene.js"></script>
<script src="frame.js"></script>
<script src="ms.js"></script>
</head>
<body>
<script>
var F = Frame, ic = F.ic;

var controller = F.sec('控制器', 'machine', [
  ['驱动', '<div class="row" style="gap:10px">' + F.inp('GcodeDriver', { select: true, w: 220 }) + '<span class="muted" style="font-size:11.5px">用 G 代码控制主板，走串口或网络</span></div>']
], { rt: '1 个驱动' });

var port = '<div class="row" style="gap:6px"><div class="inp edited" style="flex:0 0 300px;width:300px">COM5 · USB 串行设备' + ic('chevdown', 'sm caret') + '</div>' + F.btn('刷新', 'refresh') + '<span class="muted" style="font-size:11.5px">本机找到 2 个：COM3、COM5</span></div>';
var iface = F.sec('接口', 'power', [
  ['方式', F.seg(['串口 · USB', '网络 · TCP'], 0)],
  ['端口', port],
  [null, '<div class="fhint" style="grid-column:2">' + ic('alert') + 'ttyACM0 是 Linux 上的叫法，这台 Windows 电脑上叫 COMx。拔插一次机器的 USB 线，消失又出现的那个就是。</div>'],
  ['波特率', F.inp('115200', { select: true, mono: true, w: 160 })],
  ['流控', F.seg(['无', 'RTS/CTS', 'XON/XOFF'], 1)],
  ['测试', '<div class="row" style="gap:10px">' + F.btn('测试连接', 'activity') + '<div class="result">' + ic('check', 'sm') + '通了<span>COM5 · 115200 · 固件回应 Marlin bugfix-2.1.x，5 轴 · 38 ms</span></div></div>'],
  [null, '<div class="fhint info" style="grid-column:2">' + ic('info') + '测试只打开端口问一句固件版本（M115），机器不会动；测完关掉端口。</div>']
]);

var gcode = F.sec('G 代码', 'file', [
  ['固件', '<div class="row" style="gap:10px"><span class="status ok">Marlin bugfix-2.1.x · 5 轴</span><span class="muted" style="font-size:11.5px">测试连接时识别出来的</span></div>'],
  ['命令', '<div class="row" style="gap:10px"><span class="t2">按 Marlin 生成 · 你改过 2 条</span>' + F.btn('按固件重新生成', 'refresh') + '<span class="link" style="font-size:12px">查看全部命令（高级）›</span></div>'],
  [null, '<div class="fhint info" style="grid-column:2">' + ic('info') + '重新生成前会先列出你改过的命令，确认后才覆盖。</div>']
]);

var start = F.sec('连接之后', 'play', [
  ['启用', F.toggle(true, '连上后自动启用机器')],
  ['回零', F.toggle(false, '启用后自动回零')],
  ['超时', F.inp('5000', { mono: true, u: 'ms', w: 140 })]
]);

var body = controller + iface + gcode + start;

var guide = '<h4>端口怎么找</h4><ol>'
  + '<li>打开 Windows 的「设备管理器」，展开「端口（COM 和 LPT）」。</li>'
  + '<li>拔掉机器的 USB 线再插上，消失又出现的那一项就是，记下它的 COM 号。</li>'
  + '<li>一直不出现：换一根 USB 线或换个口，再装主板厂家的 USB 驱动。</li></ol>'
  + '<h4>波特率和流控</h4><ul>'
  + '<li>照固件里的设置填；LumenPnP 是 115200 和 RTS/CTS。</li>'
  + '<li>端口打开了但固件一直没回应，多半是波特率或流控不对。</li></ul>'
  + '<h4>G 代码命令</h4>'
  + '<p>Pono 按识别出的固件生成移动、归位、开关气路这些命令，一般不用改。确实要改，在「查看全部命令」里改，改过的会标出来。</p>';

MS.app({
  topic: 'connection', body: body, guide: guide,
  foot: '1 项改动未应用：端口 ttyACM0 → COM5',
  status: { chip: '<span class="status err" style="height:18px">已断开</span>', text: '机器设置 · 连接', right: ['配置已保存 · 20:05'] }
});
</script>
</body>
</html>
